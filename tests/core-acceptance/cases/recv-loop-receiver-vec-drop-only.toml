[[case]]
id = "recv-loop-receiver-vec-drop-only"
intent = "Per-iteration recv-result drop on the loop back-edge. Shape `receiver_vec_drop_only_low` (receiver vec drop only has zero leak endpoints and no double close) runs to its exact outcome with no leak, double free or use after free under ASan/LSan."
source = "cases/recv-loop-receiver-vec-drop-only.hew"
