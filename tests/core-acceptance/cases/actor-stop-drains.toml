[[case]]
id = "actor-stop-drains"
intent = "A graceful request returns before release, then handles accepted messages before the stop hook and wait completion."
source = "cases/actor-stop-drains.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 15

[case.env]
HEW_WORKERS = "1"

[case.expected]
stdout = "after stop\ndead\n1\n2\n3\nhook\nafter stopped\ncomputing hook drained\nterminal state released\nforced hook stopped\n"
exit = 0
