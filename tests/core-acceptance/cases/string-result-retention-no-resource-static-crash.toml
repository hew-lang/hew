[[case]]
id = "string-result-retention-no-resource-static-crash"
intent = "Caller-side release oracle for fresh strings returned through shipped Hew standard-library wrappers. Shape `no_resource_static_crash` (suspending closures complete and clean up after crashes) runs to its exact outcome with no leak, double free or use after free under ASan/LSan."
source = "cases/string-result-retention-no-resource-static-crash.hew"
