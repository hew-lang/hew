[[case]]
id = "actor-restarted-role-cancel"
intent = "Cancelling a parked role restart observer releases its wake target and supervisor pin before shutdown."
source = "cases/actor-restarted-role-cancel.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 20
env = { HEW_WORKERS = "1" }

[case.expected]
stdout = "waiting\nreleased\n"
exit = 0
