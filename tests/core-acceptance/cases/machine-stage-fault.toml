[[case]]
id = "machine-stage-fault"
intent = "A fault after collecting owning outputs leaves the caller's machine unchanged and releases partially constructed candidate and output values."
source = "cases/machine-stage-fault.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 15

[case.expected]
stdout = "rollback:ORIGINAL\n"
stderr = "hew: failure: DivideByZero (202)\n"
exit = 202
