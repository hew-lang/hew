[[case]]
id = "resource-close-fault-map-insert"
intent = "A map replacement attributes the displaced close failure to its caller and still releases the newly stored value and surrounding resource."
source = "cases/resource-close-fault-map-insert.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.expected]
stdout = "close 1\nclose 2\nclose 99\n"
stderr = "hew: failure: UserPanic (212): close 1 failed\nhew: secondary failure: UserPanic (212): close 2 failed\nhew: secondary failure: UserPanic (212): close 99 failed\n"
exit = 1
