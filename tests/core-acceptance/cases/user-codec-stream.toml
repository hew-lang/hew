[[case]]
id = "user-codec-stream"
intent = "An ordinary affine Codec handles split chunks, terminal typed errors, early close and cancellation; cloned senders preserve frames and close the codec once."
source = "cases/user-codec-stream.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "1"

[case.expected]
stdout = "user codec frames\n"
exit = 0
