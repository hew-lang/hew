[[case]]
id = "actor_state_closure_field"
intent = "Actor state initializes and replaces a closure, then drains its captured resource through a peer actor before closing."
source = "cases/actor_state_closure_field.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 20

[case.env]
HEW_WORKERS = "1"

[case.expected]
stdout = "1\n42\nclosed 5\nbarrier\n"
stderr = ""
exit = 0
