[[case]]
id = "resource-handle-field-read-refused"
intent = "Reading a resource's opaque handle by value outside close is refused, as a direct field, in a plain record below the resource and inside an Option, from consuming and borrowing methods."
source = "cases/resource-handle-field-read-refused.hew"
kind = "check"
suites = ["acceptance"]
timeout_seconds = 30

