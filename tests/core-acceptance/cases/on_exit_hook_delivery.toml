[[case]]
id = "on_exit_hook_delivery"
intent = "A linked peer really crashes, so Watcher's #[on(link)] hook must be invoked through the sys-dispatch ABI."
source = "../vertical-slice/accept/on_exit_hook_delivery.hew"
