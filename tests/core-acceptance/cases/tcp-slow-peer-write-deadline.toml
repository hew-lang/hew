[[case]]
id = "tcp-slow-peer-write-deadline"
intent = "A send to a peer that never reads is cancelled by a scope deadline; the borrowed payload and the connection are released exactly once."
source = "cases/tcp-slow-peer-write-deadline.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "1"
HEW_IO_LEAK_CHECK = "1"

[case.expected]
stdout = "deadline\nreleased\n"
exit = 0
