[[case]]
id = "shutdown-signal-parked-waits"
intent = "A default SIGTERM delivered while main waits for a child does not interrupt the wait; main then sees its actor calls refused."
source = "cases/shutdown-signal-parked-waits.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.expected]
stdout = "signaller Exited(4)\ncall refused\n"
exit = 0
