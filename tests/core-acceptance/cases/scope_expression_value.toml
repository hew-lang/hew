[[case]]
id = "scope_expression_value"
intent = "`scope { .. }` in value position yields its tail after joining every forked child, awaited or not."
source = "../vertical-slice/accept/scope_expression_value.hew"
suites = ["acceptance"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "4"

[case.expected]
stdout = "total=25\nslow done\nafter scope\nunawaited=1\n"
exit = 0
