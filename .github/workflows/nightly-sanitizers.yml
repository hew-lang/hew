name: Nightly Sanitizers

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_VERSION: "22"
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Rust runtime ASan — memory safety for the actor runtime
  # ─────────────────────────────────────────────────────────────────────────
  rust-runtime-asan:
    name: Rust runtime ASan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install llvm-symbolizer (${{ env.LLVM_VERSION }})
        run: |
          sudo mkdir -p /etc/apt/keyrings
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/keyrings/llvm.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/llvm.asc] http://apt.llvm.org/noble/ llvm-toolchain-noble-${{ env.LLVM_VERSION }} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-${{ env.LLVM_VERSION }}

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: nightly

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/sanitizer-runtime-asan/
          key: runtime-asan-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: runtime-asan-${{ runner.os }}-

      - name: Run hew-runtime ASan tests
        # Make owns the sanitizer flags, target directory, suppressions,
        # symbolizer selection, and serial test execution used by release CI.
        run: make asan SANITIZER_RUST_TARGET=x86_64-unknown-linux-gnu

  # ─────────────────────────────────────────────────────────────────────────
  # Generated-code and runtime ownership cases share the instrumented build.
  # The explicit safety integrations below exercise the C and host-client edges.
  # ─────────────────────────────────────────────────────────────────────────
  core-safety:
    name: Core safety (generated code and runtime)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install llvm-${{ env.LLVM_VERSION }} (symbolizer + clang for link step)
        run: |
          sudo mkdir -p /etc/apt/keyrings
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/keyrings/llvm.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/llvm.asc] http://apt.llvm.org/noble/ llvm-toolchain-noble-${{ env.LLVM_VERSION }} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update -qq
          # libpolly-N-dev supplies libLLVMPolly.a: llvm-config-N --link-static
          # lists Polly, so llvm-sys requests it at link time.
          sudo apt-get install -y -qq llvm-${{ env.LLVM_VERSION }} clang-${{ env.LLVM_VERSION }} libpolly-${{ env.LLVM_VERSION }}-dev
          # Make clang-N available as `clang` (hew's link step calls `clang`).
          sudo update-alternatives --install /usr/bin/clang clang \
            /usr/bin/clang-${{ env.LLVM_VERSION }} 100

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: nightly

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/core-safety/
          key: core-safety-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: core-safety-${{ runner.os }}-

      - name: Run native ownership safety cases
        env:
          SANITIZER_RUST_TARGET: x86_64-unknown-linux-gnu
        run: make core-safety

  # ─────────────────────────────────────────────────────────────────────────
  # C extern byte ownership and compiled Hew host-client ownership are
  # independent safety gates. Every matrix leg blocks the nightly result.
  safety-integrations:
    name: Safety integration (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        target: [test-host-safety, test-extern-bytes-safety]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install LLVM and Clang ${{ env.LLVM_VERSION }}
        run: |
          sudo mkdir -p /etc/apt/keyrings
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/keyrings/llvm.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/llvm.asc] http://apt.llvm.org/noble/ llvm-toolchain-noble-${{ env.LLVM_VERSION }} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-${{ env.LLVM_VERSION }} clang-${{ env.LLVM_VERSION }} \
            libpolly-${{ env.LLVM_VERSION }}-dev libssl-dev pkg-config
          sudo update-alternatives --install /usr/bin/clang clang \
            /usr/bin/clang-${{ env.LLVM_VERSION }} 100
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: nightly
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/core-safety/
          key: safety-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: safety-${{ matrix.target }}-${{ runner.os }}-
      - name: Run instrumented integration
        env:
          SANITIZER_RUST_TARGET: x86_64-unknown-linux-gnu
        run: make ${{ matrix.target }}

  # Bounded parser fuzzing remains an independent blocking job.
  parser-fuzz-smoke:
    name: Parser fuzz smoke (libFuzzer, bounded)
    runs-on: ubuntu-24.04
    # 3 targets x (cold-cache libFuzzer-instrumented build + 120s run) plus
    # checkout/toolchain/cache overhead. A local timing probe at a 5s fuzz
    # budget put per-target build+run around 3-3.5min on warm local caches;
    # at the real 120s budget and a cold CI cache that is ~5-6min/target,
    # ~15-18min total before setup — 40min leaves real margin for the first
    # run of the week (cold sccache-equivalent) rather than sitting at the
    # ceiling with none.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: nightly

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            ~/.cargo/bin/cargo-fuzz
            hew-parser/fuzz/target/
          key: parser-fuzz-smoke-${{ runner.os }}-${{ hashFiles('hew-parser/fuzz/Cargo.lock') }}
          restore-keys: parser-fuzz-smoke-${{ runner.os }}-

      - name: Run bounded parser fuzz smoke
        # scripts/fuzz/run-smoke.sh — 120s per target, fails on a non-zero
        # cargo-fuzz exit OR a new file under fuzz/artifacts/<target>/.
        run: make fuzz-smoke
