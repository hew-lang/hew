[[case]]
id = "entry-result-err"
intent = "A Result entry returning Err preserves the authored Display data and exits 1 without leaking the error, the rendered text or the entry's locals."
source = "cases/entry-result-err.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 15

[case.expected]
stdout = "held:err\nfailed: too large\n"
exit = 1
