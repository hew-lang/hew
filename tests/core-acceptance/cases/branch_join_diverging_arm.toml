[[case]]
id = "branch_join_diverging_arm"
intent = "A diverging branch arm leaves no consume behind for the fall-through path: each handle closes exactly once and a detached handle never closes."
source = "../vertical-slice/accept/branch_join_diverging_arm.hew"
suites = ["acceptance"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "4"

[case.expected]
stdout = "10\n10\n11 closed\n1\n11 closed\n0\n12 closed\n7\n12 closed\n-1\n13\n13 closed\n100\n13\n"
exit = 0
