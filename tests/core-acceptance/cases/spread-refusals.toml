[[case]]
id = "spread-refusals"
intent = "A spread operand is a `Vec` of the literal's element type, a spread copies each element into the new vector so an element with no copy has no spread, a fixed-size array's length is part of its type so a run-time length cannot fill it, and every record field is initialized exactly once."
source = "cases/spread-refusals.hew"
suites = ["acceptance"]
timeout_seconds = 30
kind = "check"

[[case.expected.diagnostics]]
