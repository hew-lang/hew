[[case]]
id = "resource-close-task-results"
intent = "Unclaimed scope results, unused await results and a race winner finish authored close through peer calls before their enclosing continuation resumes."
source = "cases/resource-close-task-results.hew"
suites = ["acceptance", "safety"]
