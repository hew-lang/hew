[[case]]
id = "concrete-from-selection-ambiguous"
intent = "`Target.from(value)` is refused when the argument fits more than one `From` impl or none, and accepted when it fits exactly one; an argument that already failed adds no ambiguity."
source = "cases/concrete-from-selection-ambiguous.hew"
suites = ["acceptance"]
timeout_seconds = 30
kind = "check"

