[[case]]
id = "actor-rc-survivors"
intent = "Actor-owned strong Rc cycles close exactly once after state cleanup, including allocations made by a suspending survivor close. Dying backedge access fails without stranding later payloads; failed construction drains its own cycles and an external creator's owners stay live."
source = "cases/actor-rc-survivors.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 120

[case.expected]
stdout = "argument\ninit\nplain 3\nclose 1\nclose 2\nclose 4\nstopped\ncopied dead backedge\nclose 5\nbackedge refused\nclose 6\nclose 7\nconstruction refused\nplain 10\n"
stderr = "hew: failure: UserPanic (212): Rc payload is being released\n"
exit = 0
