[[case]]
id = "receive_gen_fn_fault_trap"
intent = "A `receive gen fn` producer that crashes mid-stream faults the pipe: the consumer traps on its next resume instead of reading a clean EOF, so the marker after the loop never prints."
source = "../vertical-slice/accept/receive_gen_fn_fault_trap.hew"
suites = ["acceptance"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "4"

[case.expected]
stdout = "1\n"
stderr = "hew: failure: DivideByZero (202)\nhew: actor crash in Emitter.ticks (actor 1): DivideByZero\nhew: failure: UserPanic (212): pipe faulted: producer actor 1 crashed while holding a sink; no more items will arrive\n"
exit = 1
