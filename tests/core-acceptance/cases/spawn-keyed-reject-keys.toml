column = 45
message = "actor `Pair` has no field `c`"

[[case.expected.diagnostics]]
severity = "error"
code = "E_SPAWN_ARG_UNKNOWN"
line = 24
column = 34
message = "actor `Pair` has no field `x`"

[[case.expected.diagnostics]]
severity = "error"
code = "E_SPAWN_ARG_UNKNOWN"
line = 24
column = 37
message = "actor `Pair` has no field `y`"

[[case.expected.diagnostics]]
severity = "error"
code = "MissingActorSpawnArgument"
line = 24
column = 21
message = "missing field `a` in spawn of actor `Pair`"

[[case.expected.diagnostics]]
severity = "error"
code = "MissingActorSpawnArgument"
line = 24
column = 21
message = "missing field `b` in spawn of actor `Pair`"

[[case.expected.diagnostics]]
severity = "error"
code = "E_SPAWN_ARG_DUPLICATE"
