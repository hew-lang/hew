[[case]]
id = "mailbox_declared_drop_old"
intent = "A declared `overflow drop_old` admits the arriving submission over the queued one it evicts, so both are accepted and only the newer is delivered."
source = "../vertical-slice/accept/mailbox_declared_drop_old.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "1"

[case.expected]
stdout = "accepted\n2\n"
exit = 0
