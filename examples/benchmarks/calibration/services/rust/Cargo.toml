[package]
name = "calibration-service-rust"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
http-body-util = "=0.1.3"
hyper = { version = "=1.11.1", features = ["client", "http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
tokio = { version = "=1.53.1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
