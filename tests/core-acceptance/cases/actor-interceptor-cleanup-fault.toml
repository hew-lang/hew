[[case]]
id = "actor-interceptor-cleanup-fault"
intent = "A refused request whose resource close fails traps the actor and preserves the actual cleanup fault."
source = "cases/actor-interceptor-cleanup-fault.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "1"

[case.expected]
stdout = "refusal cleanup fault is preserved\n"
exit = 0
