[[case]]
id = "supervisor_stop"
intent = "Historical supervisor-stop fixture; its executable spelling needs migration. The decided public lifecycle forms are close(sup) and closed(sup), including waiting for child cleanup. Their implementation is still pending."
source = "cases/supervisor_stop.hew"
suites = ["acceptance"]
kind = "run"
timeout_seconds = 60
# The retired checked-mir harness ran every fixture with the actor-box
# balance check armed; keep it here so a leaked actor lands as exit 93.
env = { HEW_ACTOR_LEAK_CHECK = "1" }

[case.expected]
stdout = ""
exit = 0
