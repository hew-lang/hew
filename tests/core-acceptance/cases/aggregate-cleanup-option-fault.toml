[[case]]
id = "aggregate-cleanup-option-fault"
intent = "A bounds fault unwinds the live option resource owner exactly once."
source = "cases/aggregate-cleanup-option-fault.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.expected]
stdout = "before trap\nclose 1\n"
stderr = "hew: failure: IndexOutOfBounds (205)\n"
exit = 1
