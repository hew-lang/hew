[[case]]
id = "process-environment"
intent = "Per-child inheritance, replacement, empty environments and cwd use the owned Child lifecycle without changing parent state; concurrent bindings, validation, failed launches, piped stdio and bounded capture remain isolated."
source = "cases/process-environment.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "2"
HEW_PROCESS_AMBIENT = "ambient"

[case.expected]
stdout = "default inheritance retained\nclear bindings and empty environment isolated\nper-child working directory retained\nconcurrent environments leave parent unchanged\ninvalid options and failed launches refused\nowned child pipes, cached wait and bounded capture retained\n"
stderr = ""
exit = 0
