name: FreeBSD actor timeout diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-ubuntu-dns
      - name: Record host capacity
        run: |
          getconf _NPROCESSORS_ONLN
          awk '/^(MemTotal|MemAvailable|SwapTotal|SwapFree):/' /proc/meminfo
      - name: Measure actor ownership fixture on FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc
        with:
          release: '15.1'
          mem: 8192
          prepare: |
            mkdir -p /usr/local/etc/pkg/repos
            printf 'FreeBSD: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest", mirror_type: "srv", enabled: yes }\n' > /usr/local/etc/pkg/repos/FreeBSD.conf
            /usr/sbin/pkg bootstrap -fy -r FreeBSD
            pkg update -f -r FreeBSD
            pkg install -y -r FreeBSD llvm22 gdb rustup-init python312 cmake ninja git gmake bash pkgconf libffi libxml2
            pw useradd -n hew-ci -m -s /bin/sh
          run: |
            set -eux
            chown -R hew-ci:hew-ci "$GITHUB_WORKSPACE"
            su -m hew-ci -c 'sh -s' <<'HEW_DIAGNOSTIC'
            set -eux
            export HOME=/home/hew-ci
            export LLVM_SYS_221_PREFIX=/usr/local/llvm22
            /usr/local/bin/rustup-init -y --no-modify-path --profile minimal --default-toolchain 1.96.0 --target wasm32-wasip1
            export PATH="$HOME/.cargo/bin:/usr/local/llvm22/bin:/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin"
            export CARGO="$HOME/.cargo/bin/cargo"
            export PYTHON=/usr/local/bin/python3.12
            git config --global --add safe.directory "$(pwd)"
            git rev-parse HEAD
            sha256 tests/core-acceptance/fixtures/ownership-balance/actor_state_vec_seat.hew
            git diff --exit-code 730d34b77114cd8876f4c806705eb7c47f5240ba -- tests/core-acceptance/fixtures/ownership-balance/actor_state_vec_seat.hew
            rustc --version
            /usr/local/llvm22/bin/llvm-config --version
            gmake hew-native
            target/debug/hew --version
            python3.12 -u .github/diagnostics/freebsd_actor_timeout.py
            HEW_DIAGNOSTIC
