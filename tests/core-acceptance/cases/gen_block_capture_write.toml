[[case]]
id = "gen_block_capture_write"
intent = "A gen block owns a snapshot of its captures, so an assignment or mutating call on a captured binding is refused at check time instead of failing in lowering; a local copy inside the block stays mutable."
source = "../vertical-slice/reject/gen_block_capture_write.hew"
suites = ["acceptance"]
timeout_seconds = 30
kind = "reject"

[[case.expected.diagnostics]]
code = "MutabilityError"
line = 9
column = 9
message = "capture `count` is a snapshot inside a `gen` block"

[[case.expected.diagnostics]]
code = "MutabilityError"
line = 10
column = 9
message = "capture `seen` is a snapshot inside a `gen` block"
