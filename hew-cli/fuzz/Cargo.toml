[package]
name = "hew-cli-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# The text renderer is a Hew component that hew-cli's build script compiles
# through LLVM, so these targets link the whole driver. They live apart from
# hew-parser/fuzz, whose targets build on a small host.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
hew-cli = { path = "..", features = ["fuzzing"] }
hew-compile = { path = "../../hew-compile" }
hew-codegen-rs = { path = "../../hew-codegen-rs" }
hew-mir = { path = "../../hew-mir" }
hew-parser = { path = "../../hew-parser" }
hew-types = { path = "../../hew-types" }
serde_json = "1"

[[bin]]
name = "fuzz_diagnostics"
path = "fuzz_targets/fuzz_diagnostics.rs"
test = false
doc = false

[[bin]]
name = "fuzz_codegen"
path = "fuzz_targets/fuzz_codegen.rs"
test = false
doc = false

[[bin]]
name = "fuzz_encoding_codegen"
path = "fuzz_targets/fuzz_encoding_codegen.rs"
test = false
doc = false

[patch.crates-io]
pulldown-cmark = { path = "../../vendor/pulldown-cmark" }
