id: no-leaf-name-join
language: rust
severity: error
message: >-
  A name/path-shaped receiver is split, stripped or joined as a spelling
  instead of going through the resolver.
note: >-
  Resolved type-fact services, HIR expression consumers and lower IRs consume checker
  identities. Source scopes, declaration registration, diagnostics and external
  ABI spelling tables remain lexical inputs outside this boundary.
files:
  - "hew-sir/src/**"
  - "hew-mir/src/**"
  - "hew-types/src/type_facts.rs"
  - "hew-types/src/value_class.rs"
  - "hew-types/src/traits.rs"
  - "hew-hir/src/lower/types.rs"
  - "hew-hir/src/lower/expr.rs"
  - "hew-hir/src/lower/identifiers.rs"
  - "hew-hir/src/lower/private_refs.rs"
  - "hew-hir/src/lower/calls.rs"
  - "hew-hir/src/lower/collections.rs"
ignores:
  - "**/tests/**"
  - "**/test/**"
  - "**/*_test.rs"
  - "**/*_tests.rs"
  - "**/tests.rs"
  - "**/dump.rs"
  - "hew-types/src/check/diagnostics.rs"
  - "hew-parser/src/fmt.rs"
rule:
  any:
    - kind: call_expression
      has:
        field: function
        regex: "^(short_name|strip_module_qualifier|strip_module_prefix|names_match_qualified)$"
    - kind: call_expression
      has:
        field: function
        kind: field_expression
        all:
          - has:
              field: field
              regex: "^(rsplit_once|rsplit|split_once|split|join)$"
          - has:
              field: value
              regex: "(?i)(name|ident|key|path|spelling|leaf|owner|symbol|trait|module|binding|callee|target|segments)"
  not:
    inside:
      kind: mod_item
      stopBy: end
      follows:
        kind: attribute_item
        regex: 'cfg\(.*\btest\b'
