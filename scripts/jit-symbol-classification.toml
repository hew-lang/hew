  # DOWN or supervisor events are still queued destroys them; picking the
  # index is picking which actor that happens to. The previous audit argued
  # supervisor ownership made this a scoped lifecycle capability rather than a
  # raw destruction, but ownership does not change what the call reaches, and
  # the transitive rule in docs/internal/jit-host-abi.md is not conditioned on
  # who owns the object. Nothing is stranded: no codegen path emits it, no
  # `.hew` source names it, and `hew_supervisor_stop`, `hew_actor_group_destroy`
  # and `hew_runtime_cleanup` still reclaim supervised children.
  "hew_supervisor_remove_child",
  # Test-introspection probe: arms a one-shot pause on the calling thread's
  # current task scope's next spawned task, so the forced-cancellation
  # fixture (#2437) can prove a task observes cancellation before any of its
  # generated code runs. Gated behind cfg(test) or the forced-cancel-test
  # Cargo feature — absent from a default build. Not user-callable; not
  # JIT-reachable.
  "hew_test_pause_next_task_spawn_until_scope_cancel",
  "hew_test_pause_next_task_result_until_scope_cancel",
  "hew_trace_clear",
  "hew_trace_drain",
  "hew_trace_reset",
]

# ---------------------------------------------------------------------------
# System-lane closure
# ---------------------------------------------------------------------------
#
# `docs/internal/jit-host-abi.md` states the invariant: no `stable` symbol may
# produce, install, mutate, observe, or destroy system-lane state. That is a
# property of the whole TRANSITIVE CALL GRAPH, not of a symbol's own body -- a
# symbol that reaches a lane operation one call away still violates it.
#
# `scripts/sys-lane-closure.py` computes it mechanically: it finds the ROOTS
# (functions whose own body names `sys_queue`, `sys_count`, `sys_dispatch`,
# `HewSysMsg` or `Origin::Sys`), walks the call graph in reverse to the closure
# of everything that can reach a root, and fails if any `stable` symbol is in
# it. Run `python3 scripts/sys-lane-closure.py --list-roots` to see the roots
# and `--explain SYM` for a witness path.
#
# The two tables below are the ONLY escape hatches, and each needs a written
# reason. Both are checked for staleness: an edge that is no longer a call, or
# a non-root that no longer names the lane, fails the gate.

# Edges the closure must not traverse. An entry deletes exactly ONE caller ->
# callee edge; a *different* caller of the same callee still trips the gate, so
# these do not blanket-exempt the callee. The caller must not be
# user-declarable: a caller user code can name in an `extern` rt block composes
# the call's arguments, so it picks the destination and the reason, and no
# reason paragraph makes that authenticated. The gate enforces that directly.
[sys-lane-closure.authenticated-edges]

"worker_loop -> activate_queued_actor" = """
The native scheduler worker is the system lane's one legitimate consumer: \
draining sys_queue ahead of the user queue and routing each HewSysMsg to the \
actor's sys_dispatch is what the lane exists for. Every stable symbol that \
merely runs or waits on the scheduler reaches this edge, so treating it as a \
violation would disqualify the entire blocking API without describing any \
capability the caller actually gains."""

"step_one_actor -> activate_actor_wasm" = """
The wasm mirror of `worker_loop -> activate_actor`, reached by every stable \
symbol that turns the wasm scheduler (hew_reply_wait, hew_actor_await, \
hew_exit, hew_select_first, ...). Same reasoning."""

"hew_actor_link -> send_exit_signal" = """
Authenticated producer. hew_actor_link only reaches send_exit_signal on the \
already-dead-peer race: the caller asked to be linked to an actor that has \
since gone terminal, so the runtime synthesises the EXIT the link would have \
produced had the ordering been the other way. The reason code is read from \
the runtime's own death record, never from the caller. The DESTINATION is \
arg0, which is why this symbol is no longer user-declarable: the only surface \
that can reach it is the compiler's link(target) lowering, and \
hew-mir/src/lower/actor.rs synthesises hew_actor_self() as arg0 for every \
call it emits. The signal therefore lands on the linking actor itself and \
cannot be addressed at a third party. Asserted by \
link_monitor_subject_is_always_the_self_handle."""

"deliver_cross_node_link_exit -> send_exit_signal" = """
Authenticated producer. The transport observed the remote side go away \
(connection lost, node stop, member transition) and turns that observation \
into the local EXIT the link contract promises. The 13 cluster/node/connmgr \
stable symbols reach it only by driving the transport; none of them supplies \
the reason or the destination."""

"hew_actor_monitor -> deliver_down_message" = """
Authenticated producer, same shape as hew_actor_link and closed the same way: \
the monitored actor was already terminal when the monitor was installed, so \
the runtime synthesises the DOWN that the monitor contract owes, carrying the \
runtime's own recorded reason. The watcher is arg0, so the symbol is \
codegen-stable and the only surface that reaches it is monitor(target), whose \
lowering synthesises hew_actor_self() as arg0. Asserted by \
link_monitor_subject_is_always_the_self_handle."""

"hew_actor_trap_inner -> hew_supervisor_notify_child_actor_event" = """
Authenticated producer. hew_actor_trap_inner is NOT user-declarable (private, \
and reached through hew_actor_trap, whose internal tier is \
asserted by extern_rt_system_lane_symbols_rejected), which is what makes the \
rest of this reason true: it was demoted precisely because its `actor` and \
`error_code` arguments let a caller choose both the subject and the reason of \
the event. Every remaining caller is a runtime crash path that reports a crash \
the runtime detected in the trapping actor; the notification goes to that \
actor's registered parent supervisor, whose identity is runtime state, and the \
payload is the crash record. Reached transitively by hew_actor_stop / \
hew_actor_close / hew_actor_group_stop_all via call_terminate_fn -> \
handle_crash_recovery when a terminate hook panics — those callers name the \
actor they already own and supply no code at all."""

"hew_actor_trap_inner -> propagate_exit_to_links" = """
Authenticated producer, and see the edge above for why hew_actor_trap_inner \
is no longer user-declarable. The trapping actor has died; \
propagate_exit_to_links fans the EXIT out to the link set the runtime recorded \
for it. No remaining caller supplies the recipients (they are whoever linked \
to this actor) or the reason (it is the crash record). Refusing this edge \
would mean links cannot fire, which is the whole contract of link()."""

"hew_actor_trap_inner -> notify_monitors_on_death" = """
The third and last of hew_actor_trap_inner's death fan-outs (links, monitors, \
parent supervisor). Same authentication: the actor is already dead, the \
watcher set is runtime state, and the reason is the recorded crash. Listed as \
its own edge rather than folded into the other two so that a fourth fan-out \
target would trip the gate."""

"mailbox_reclaim_queued_terminal -> detach_queued_terminal_locked" = """
Authenticated terminal consumer. Both functions are crate-private and the \
caller enters only after an actor has become terminal, while holding the \
terminal-reclaim serialization that gives it exclusive consumer ownership. \
The caller supplies no system message, destination, or reason: it detaches \
the runtime-owned system queue together with the user queue so terminal \
actors cannot strand lifecycle signals or their owned payloads."""

"mailbox_reclaim_queued_terminal_if -> detach_queued_terminal_locked" = """
Authenticated quiescent terminal consumer. This is the predicate-gated mirror \
of mailbox_reclaim_queued_terminal: both functions are crate-private, the \
terminal-reclaim lock serializes the decision with activation ownership, and \
detachment occurs only after the runtime proves there is no active queue \
consumer. The caller cannot produce or address a system message; it only \
retires runtime-owned nodes that a terminal actor can no longer dispatch."""

"enqueue_down -> deliver_down_message" = """
Authenticated producer: the monitored actor died and the runtime owes its \
watchers the DOWN the monitor contract promised. Recipients come from the \
monitor registry, the reason from the death record."""

"enqueue_lost -> deliver_down_message" = """
Authenticated producer, transport variant: a node, session or identity the \
runtime was watching went away, so every monitor riding that connection is \
resolved as lost. Reached by the 13 cluster/node/connmgr stable symbols only \
by driving the transport."""

"enqueue_shutdown -> deliver_down_message" = """
Authenticated producer, shutdown variant: runtime teardown resolves every \
outstanding remote observation rather than leaving watchers blocked forever. \
The DOWN reason is the fixed shutdown code."""

"free_spawn_mailbox -> hew_mailbox_free" = """
Spawn rollback. cleanup_failed_spawn runs when spawn_actor_internal could not \
finish building the actor, and frees the mailbox that same call had just \
created. The mailbox was never published -- no actor handle, no registry \
entry, no pid -- so nothing could have enqueued a signal into its lane and the \
retirement count is necessarily zero."""

"hew_supervisor_start -> hew_actor_set_sys_dispatch" = """
Installs the runtime's own supervisor_sys_dispatch trampoline, a compile-time \
constant code address, on a self_actor hew_supervisor_start has not yet \
published. No caller-supplied function pointer reaches the slot and there is \
no window in which another thread can observe the actor without one. \
hew_supervisor_start is codegen-stable, not stable: the gate refuses to waive \
an edge from a user-declarable caller at all, rather than distinguish by hand \
between a caller whose arguments reach the system queue and one whose do \
not."""

"free_actor_resources -> hew_mailbox_free" = """
Accounted teardown, native. This is the edge every actor-lifecycle route \
reaches system-queue destruction through. The user-declarable raw destructor \
is NOT one of those routes any more: `hew_actor_free` moved to `internal` \
precisely because an edge waiver cannot make a caller-chosen destruction of \
caller-chosen actor state authenticated. What the waiver covers is the set \
that remains -- spawn rollback, `hew_exit`/runtime cleanup, supervisor and \
group teardown -- where the runtime, not the caller, decides that this actor \
is being reclaimed. Two things make those safe rather than merely tolerated. \
Ordering: teardown reaches queue destruction only after the actor is latched \
terminal and untracked, so no signal that could still have been dispatched is \
discarded. Non-silence: hew_mailbox_free retires through \
mailbox::retire_pending_sys_lane, which names every discarded signal via \
HewSysMsg::name() and counts it into sys_lane_signals_retired() -- a teardown \
can no longer happen without leaving a countable trace. Both properties are \
tests, not prose: \
actor::tests::teardown_reaches_queue_destruction_only_after_terminal_and_untracked \
observes both at the instruction before the queue is freed, and \
actor::tests::actor_teardown_of_a_pending_signal_moves_the_retirement_counter \
tears down an actor holding an undispatched signal and requires the counter to \
move. No \
user-declarable caller reaches this edge at all any more -- \
hew_supervisor_remove_child was the last one and is now internal."""

"free_actor_resources_wasm -> hew_mailbox_free" = """
The wasm mirror of the edge above, retiring through \
mailbox_wasm::retire_pending_sys_lane with the same ordering and the same \
per-signal accounting."""

"spawn_actor_internal -> build_spawned_actor" = """
build_spawned_actor writes `sys_dispatch: config.sys_dispatch`, so it installs \
whatever the internal SpawnConfig carries -- but no stable spawn entry point \
can put anything there. hew_actor_spawn, hew_actor_spawn_bounded, \
hew_actor_spawn_opts and hew_actor_spawn_opts_adopt each build the config with \
`sys_dispatch: None`; the slot has no parameter in any spawn arg list. That \
is asserted over all four by \
actor::tests::no_spawn_entry_point_installs_a_system_dispatch, not left to \
this paragraph. The only ways to install a real consumer are \
hew_actor_set_sys_dispatch and hew_supervisor_start, both codegen-stable."""

"current_thread_owns_supervisor_tree -> current_actor_supervisor" = """
Role identity, not lane observation. current_actor_supervisor reads \
`(*current).sys_dispatch` for the sole purpose of fn_addr_eq-ing it against \
the runtime's own supervisor_sys_dispatch trampoline, answering `is the \
current actor a supervisor?`. It never dereferences the pointer, never calls \
it, and never reveals it. Reached by hew_supervisor_stop and \
hew_local_pid_supervisor_stop to refuse a cross-tree stop."""

# Functions removed from the ROOT set only. They stay ordinary graph nodes, so
# anything they call is still traversed -- this says `this body's mention of
# the lane is not an operation on it`, not `stop looking here`.
[sys-lane-closure.non-roots]

"hew_supervisor_start" = """
Its own body's only mention of the lane is the text of the call \
`hew_actor_set_sys_dispatch(self_actor, Some(supervisor_sys_dispatch))`. The \
substantive justification is on that edge in the table above; this entry only \
stops the call site from being read as an independent lane operation."""

