[[case]]
id = "process-supervised-reap"
intent = "A panicking supervised owner kills and reaps its child process, leaving no zombie, and the restarted owner launches a replacement that stop also reaps."
source = "cases/process-supervised-reap.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.expected]
stdout = "first alive: true\nfirst reaped: true\nreplacement alive: true\nreplacement reaped: true\n"
exit = 0
