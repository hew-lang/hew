name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base. Restricting this to `main` meant a
  # stacked PR (based on another branch) received no checks at all, so its
  # merge gate could report READY with nothing having run. A stacked branch
  # is exactly where a break is easiest to miss.
  pull_request:
  workflow_dispatch:

# A push to a branch makes any run still going for that same ref obsolete:
# its verdict can no longer gate anything, because a newer commit exists.
# Those runs were still holding runners, so 15 open pull requests could
# starve the queue and nothing scheduled at all. Never cancel on main —
# a push there must complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  pull-requests: read
  security-events: write

env:
  # Pinned LLVM upstream release tag, used by hew-codegen-rs (inkwell ->
  # llvm-sys-221) build script. Bumps must be reflected in
  # .github/actions/setup-llvm/action.yml (asset SHA256 pins) too.
  LLVM_VERSION: "22.1.5"
  # Pinned wasmtime release tag. Every job that provisions a WASI runner
  # downloads its per-platform asset from THIS tag. It is pinned, and pinned in
  # one place, for two reasons: resolving "latest" per job (as the Linux job
  # did) or taking whatever a package manager ships (as macOS did with brew)
  # let the three platforms straddle different wasmtime releases inside a
  # single run, so a WASI behaviour difference could be read as a platform
  # difference; and an unpinned runtime changes the tested surface without a
  # commit. Assets used: x86_64-linux.tar.xz, aarch64-macos.tar.xz,
  # x86_64-windows.zip.
  WASMTIME_VERSION: "v47.0.2"
  CARGO_TERM_COLOR: always
  # The pull request's own base commit, written once and read by every job
  # that routes a preflight. Empty on push and workflow_dispatch, which is
  # correct: those tiers take no diff at all (scripts/ci-preflight-route.sh).
  PREFLIGHT_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Path change detection — gates Windows/macOS and playground jobs
  # ─────────────────────────────────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # ONE platform authority. `platform_tier` is `none | smoke | full`,
      # monotone by construction, computed by
      # scripts/lib/gate_inputs.py platform-tier and fail-closed on an
      # unclassified path.
      #
      # It replaces two NON-NESTED dorny filters, `platform_smoke` and
      # `platform_full`. Because they were independent sets, a change touching
      # only `.github/actions/setup-llvm/action.yml` -- where the LLVM asset
      # SHA256 pins live -- computed platform_full=true with
      # platform_smoke=false; both platform jobs gate every step on
      # platform_smoke, so both required checks reported green having built
      # nothing, at exactly the moment the routing policy said a full
      # workspace run was required.
      #
      # dorny survives for `playground` and `docs`, which are ordinary path
      # questions with no nesting relationship to answer wrongly.
      platform_tier: ${{ steps.selector.outputs.platform_tier }}
      playground: ${{ steps.filter.outputs.playground }}
      docs: ${{ steps.filter.outputs.docs }}
      scripts: ${{ steps.filter.outputs.scripts }}
      selected_compile: ${{ steps.selector.outputs.requires_compile }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        id: filter
        with:
          filters: |
            playground:
              - 'hew-wasm/**'
              - 'hew-analysis/**'
              - 'hew-parser/**'
              - 'hew-types/**'
              - 'hew-lexer/**'
              - 'hew-lsp/tests/fixtures/**'
              - 'examples/playground/**'
              - 'scripts/gen-playground-manifest.py'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Makefile'
              - '.github/actions/setup-wasm-pack/**'
              - '.github/scripts/download-verify-binaryen.sh'
              - '.github/scripts/retry-download.sh'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - '*.md'
            scripts:
              - 'scripts/**'
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/workflows/release.yml'

      - name: Classify the change with the local selector
        id: selector
        # One derivation for the whole workflow: a pull request diffs against
        # its own base SHA, a push or dispatch takes no diff at all. The
        # hardcoded `HEAD^` this replaces answered a different question from
        # the Linux job's hardcoded `origin/main`, and neither answered the
        # one the author asked.
        run: |
          scripts/ci-preflight-route.sh --dry-run \
            --github-output "${GITHUB_OUTPUT}"

  # ─────────────────────────────────────────────────────────────────────────
  # ast-grep toolchain — built once, read by every job that structural-lints;
  # cost and history in docs/dev/ci-tiers-and-routing.md.
  # A tarball rather than the directory: `upload-artifact` preserves neither
  # executable bits nor dotfiles, and consumers need
  # `.ast-grep/tool/bin/ast-grep` to be a dotfile that runs. There is
  # deliberately NO job-level `if:`: a skipped job is not a satisfied
  # dependency, so gating it would strand three required contexts on docs-only
  # changes. The gate is on the steps, published as an output.
  # ─────────────────────────────────────────────────────────────────────────
  ast-grep-toolchain:
    name: Build ast-grep toolchain
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      available: ${{ steps.publish.outputs.available }}
    env:
      # The two routes reaching a structural-lint gate; a docs-only run
      # reaches only `lint`, one install either way, so nothing is shared.
      NEEDED: ${{ needs.changes.outputs.selected_compile == 'true' || needs.changes.outputs.scripts == 'true' }}
    steps:
      - name: No-op when no job shares this toolchain
        if: env.NEEDED != 'true'
        run: echo "No compiled or script changes; the ast-grep toolchain is not shared this run."

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        if: env.NEEDED == 'true'

      - name: Provision pinned ast-grep toolchain
        if: env.NEEDED == 'true'
        uses: ./.github/actions/setup-ast-grep

      - name: Pack the toolchain
        if: env.NEEDED == 'true'
        run: |
          set -euo pipefail
          test -x .ast-grep/tool/bin/ast-grep
          test -f .ast-grep/hew-lang.so
          # Rooted INSIDE .ast-grep so a consumer unpacks into that one
          # ignored directory, not over its checkout.
          tar --zstd -cf "$RUNNER_TEMP/ast-grep-toolchain.tar.zst" -C .ast-grep .
          {
            echo "### ast-grep toolchain (producer)"
            echo ""
            echo "- version: \`$(.ast-grep/tool/bin/ast-grep --version)\`"
            echo "- packed size: \`$(du -h "$RUNNER_TEMP/ast-grep-toolchain.tar.zst" | cut -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the toolchain
        if: env.NEEDED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ast-grep-toolchain-${{ github.sha }}
          path: ${{ runner.temp }}/ast-grep-toolchain.tar.zst
          # Already a Zstandard tarball; re-deflating grows the upload.
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Publish whether the toolchain was shared
        id: publish
        # No `if:` -- a consumer reads this to choose between downloading and
        # provisioning, so it must exist on both paths. After the upload, so
        # `true` means the artifact is really there.
        run: echo "available=$NEEDED" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────
  # Lightweight docs/scripts coverage — required signal for narrow PRs.
  # ─────────────────────────────────────────────────────────────────────────
  docs-and-scripts:
    name: Docs & scripts gates
    needs: [changes, ast-grep-toolchain]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: No-op when docs and scripts are unchanged
        if: needs.changes.outputs.selected_compile == 'true' || (needs.changes.outputs.docs != 'true' && needs.changes.outputs.scripts != 'true')
        run: echo "No docs or scripts changes detected; lightweight gates are not needed."

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        if: needs.changes.outputs.selected_compile != 'true' && (needs.changes.outputs.docs == 'true' || needs.changes.outputs.scripts == 'true')
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-rust-build
        if: needs.changes.outputs.selected_compile != 'true' && (needs.changes.outputs.docs == 'true' || needs.changes.outputs.scripts == 'true')
        with:
          components: rustfmt
          cache-shared-key: linux

      - name: Provision pinned ast-grep toolchain
        if: needs.changes.outputs.selected_compile != 'true' && needs.changes.outputs.scripts == 'true'
        uses: ./.github/actions/setup-ast-grep
        with:
          source: artifact
          artifact-name: ast-grep-toolchain-${{ github.sha }}

      - name: Run change-scoped checks
        if: needs.changes.outputs.selected_compile != 'true' && (needs.changes.outputs.docs == 'true' || needs.changes.outputs.scripts == 'true')
        env:
          # `lint` runs alongside this job on exactly the changes it handles,
          # and runs its authority gates unconditionally. Same reason as the
          # Linux shards: one gate, one home, per pull request.
          LINT_GATE_OWNER: lint
        run: scripts/ci-preflight-route.sh

  # ─────────────────────────────────────────────────────────────────────────
  # Lint — code quality plus 1,778-file formatter preservation
  # (always runs; cold runners can take 15–25 min)
  # Produces SARIF output for GitHub Code Scanning inline annotations.
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: Clippy & format
    needs: [changes, ast-grep-toolchain]
    runs-on: ubuntu-24.04
    env:
      RUN_CODE_PATH: ${{ needs.changes.outputs.selected_compile }}
    # Job 93290474020 reached the final authority-graph step at 25m17s after
    # 308s of toolchain setup, 252s of structural lint, 131s of .hew format,
    # 492s of formatter preservation, 167s of Clippy, and about 90s elsewhere.
    # The graph did not complete, so 45 min leaves cold-runner headroom while
    # retaining a finite ceiling for a stuck job.
    timeout-minutes: 45
    steps:
      - name: No-op for non-code changes
        if: env.RUN_CODE_PATH != 'true'
        run: echo "No Rust or Hew code changed; compiled lint checks are not needed."

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # fetch-depth: 0 required so origin/main is available for the
          # orchestration-token commit-message scan (--scan-commits range
          # origin/main..HEAD) that runs in the leak-scan step below.
          fetch-depth: 0

      - uses: ./.github/actions/setup-rust-build
        with:
          components: 'clippy, rustfmt'
          targets: wasm32-wasip1
          cache-shared-key: linux

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Build shared Rust test artifact
        run: make stdlib

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Structural-lints on every route, including the docs-only one where
      # the producer no-opped -- hence the fall back, keyed on the producer's
      # own output rather than a re-derived route.
      - name: Provision pinned ast-grep toolchain
        uses: ./.github/actions/setup-ast-grep
        with:
          source: ${{ needs.ast-grep-toolchain.outputs.available == 'true' && 'artifact' || 'install' }}
          artifact-name: ast-grep-toolchain-${{ github.sha }}

      # Keep the bootstrap counterfactuals on the required job after moving
      # provisioning into the shared action.
      - name: Verify structural lint bootstrap contract
        run: make test-ast-grep-contract test-structural-lint-bootstrap

      # >>> CI-PARITY-STEPS
      # This job is an active required status check on main. Keep the workflow
      # contract here unconditionally so nightly/release-gate drift cannot merge
      # even when the lightweight docs/scripts job is skipped or not required.
      - name: Verify FreeBSD workflow contract
        run: make freebsd-workflow-contract-check

      - name: Verify tool pin contract
        run: make tool-pin-contract-check

      - name: Verify sanitizer gate wiring
        run: make check-sanitizer-gate

      - name: Verify gate reachability and documented make targets
        run: make check-gate-reachability

      - name: Run structural authority lint
        run: make structural-lint

      - name: Check shell scripts
        run: make shell-script-lint
      # <<< CI-PARITY-STEPS

      - name: Check .hew formatting
        run: make hew-fmt-check

      - name: Install SARIF tools
        # Downloaded into RUNNER_TEMP rather than the checkout. These two land
        # in /usr/local/bin a moment later, so the window is short — but a
        # download that touches the working tree at all is a router input that
        # nobody declared, and the class is what this fixes, not the window.
        run: |
          set -euo pipefail
          .github/scripts/retry-download.sh \
            gh release download clippy-sarif-latest --repo psastras/sarif-rs \
            --pattern "clippy-sarif-x86_64-unknown-linux-gnu" \
            --output "$RUNNER_TEMP/clippy-sarif" --clobber
          .github/scripts/retry-download.sh \
            gh release download sarif-fmt-latest --repo psastras/sarif-rs \
            --pattern "sarif-fmt-x86_64-unknown-linux-gnu" \
            --output "$RUNNER_TEMP/sarif-fmt" --clobber
          chmod +x "$RUNNER_TEMP/clippy-sarif" "$RUNNER_TEMP/sarif-fmt"
          mv "$RUNNER_TEMP/clippy-sarif" "$RUNNER_TEMP/sarif-fmt" /usr/local/bin/
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --tests --message-format=json -- -D warnings \
            | clippy-sarif \
            | tee clippy-results.sarif \
            | sarif-fmt

      - name: Require documented runtime unsafe blocks
        run: make runtime-unsafe-clippy

      - name: Audit new high-risk unsafe operations
        run: make unsafe-pattern-audit

      - name: Verify C ABI surface and JIT host ABI classification
        run: make cabi-surface-check test-cabi-surface verify-ffi test-verify-ffi test-python310-toml-compat

      - name: Legacy path syntax lint
        run: make legacy-path-syntax-lint

      - name: Upload Clippy SARIF
        if: always() && hashFiles('clippy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@c35d1b164463ee62a100735382aaaa525c5d3496  # codeql-bundle-v2.25.6 (v4)
        with:
          sarif_file: clippy-results.sarif
          category: clippy
          wait-for-processing: true

      - name: Runtime poison-safe lint
        run: make runtime-poison-safe-lint

      - name: WASM-TODO backlog-authority lint
        # Parse the offline manifest authority, exercise the synthetic teeth,
        # then validate every actionable source marker against a stable backlog
        # id. No GitHub/API state is needed.
        run: make lint-wasm-todo

      - name: Codegen carried-identity gate
        # Assert the codegen carried-identity invariants with a focused step.
        run: make codegen-carried-identity-gate

      - name: Check codegen trap inventory
        run: make codegen-trap-inventory-check

      - name: Verify system-call closure
        run: make verify-sys-lane-closure

      - name: Orchestration-token leak scan
        # Scan tracked source files and commit-message bodies of all PR commits
        # for orchestration tokens (lane IDs, Q-tags, .tmp/ paths).  Placed outside
        # CI-PARITY-STEPS so the preflight↔CI parity assertion is unaffected.
        # origin/main is available because the checkout above uses fetch-depth: 0.
        run: make leak-scan

      - name: Verify build artifact, cache, and shard contracts
        run: |
          python3 scripts/tests/test_compiled_hew_artifact.py
          python3 scripts/tests/test_rust_dependency_cache_contract.py
          python3 scripts/tests/test_compiled_hew_shards.py
      - name: ll-byte-identity normaliser self-test
        # Prove the ll-diff oracle's normaliser still catches real IR changes
        # (string-content edits, numeric-const NAME changes) while staying
        # transparent to pool-id reorderings.  No compiler build required —
        # exercises scripts/ll-byte-identity.sh against synthetic .ll snippets.
        # Guards the ll-diff gate itself from silently degrading into a no-op.
        run: make ll-identity-selftest

      - name: Sandbox parity coverage check
        # Assert every VM-dependent hew-sandbox-wasm test binary (one
        # containing a function that spawns the hew-sandbox-vm Node runner)
        # is excluded WHOLE from the generic nextest default-filter AND has
        # every one of its tests run by the provisioned `make sandbox-parity`
        # gate. Catches a new VM-dependent binary landing in only one of
        # those two states -- failing unprovisioned generic runs on every
        # platform, or silently never running on a provisioned one.
        # Classification is binary-level, not per-test (a same-file call
        # graph cannot safely attribute VM-dependence to individual tests).
        # Runs the checker's own self-test first
        # (test-sandbox-parity-coverage-check).
        run: make sandbox-parity-coverage-check


  # ─────────────────────────────────────────────────────────────────────────
  # License gate — enforce the deny.toml allow-list so no copyleft or unknown
  # dep silently enters the shipping graph, and assert THIRD-PARTY-LICENSES is
  # current relative to Cargo.lock. Runs on every push/PR; fast (~30 s).
  # ─────────────────────────────────────────────────────────────────────────
  license-check:
    name: License policy (cargo deny + THIRD-PARTY-LICENSES freshness)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: ./.github/actions/setup-rust-build
        with:
          cache-shared-key: linux

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.6

      - name: Check license policy
        run: cargo deny check licenses

      - name: Check bans and sources
        run: cargo deny check bans sources

      - name: Check security advisories
        run: cargo deny check advisories

      - name: Install cargo-about
        run: cargo install cargo-about --locked --version 0.9.0 --features cli

      - name: Verify THIRD-PARTY-LICENSES is current
        run: make licenses-check

  # ─────────────────────────────────────────────────────────────────────────
  # Browser/playground smoke — repo-local browser tooling coverage only.
  # Runs full hew-wasm suite (lib + fixture-coverage integration), checks
  # manifest freshness, and builds the browser WASM artifact.
  # ─────────────────────────────────────────────────────────────────────────
  playground-wasm-build:
    name: Playground WASM build
    needs: changes
    if: needs.changes.outputs.playground == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: ./.github/actions/setup-rust-build
        with:
          targets: wasm32-unknown-unknown
          cache-shared-key: linux

      - name: Install wasm-pack v0.13.1 and Binaryen 117
        uses: ./.github/actions/setup-wasm-pack

      - name: Check sandbox fixtures are current
        # The committed sandbox fixtures are generated from in-tree sources; a
        # stale fixture makes the parity gate assert against the wrong baseline.
        run: make sandbox-fixtures-check

      - name: Check repo-local playground browser/tooling smoke
        run: make playground-check

  # ─────────────────────────────────────────────────────────────────────────
  # Compiled-Hew artifact — packaged from the one Linux build, not a second one
  # ─────────────────────────────────────────────────────────────────────────
  #
  # This job used to build the debug compiler, libhew.a, AND the release-lib
  # compiler, at a measured 12.8 minutes: 4.9 of them asserting the developer
  # compiler profile and 3.8 building and certifying the bundle. Every one of
  # those artefacts is now produced once by `linux-nextest-archive` and carried
  # in its archive, so this job compiles nothing at all -- it downloads,
  # certifies, and repackages the two binaries the compiled-Hew suites need
  # into the compact revision-bound bundle those five consumers already verify.
  #
  # `make hew-profile-check` is not run here any more either: it is a selected
  # gate in the Linux shards, so asserting the same profile twice per run was
  # 4.9 minutes spent re-proving something already proved. The producer builds
  # the release-lib launcher the assertion needs; the shard asserts it.
  #
  # No apt, no LLVM: nothing here links or codegens. cargo-nextest is present
  # only because it owns the archive's extraction format.
  compiled-hew-linux:
    name: Package compiled Hew bundle (Linux)
    needs: [changes, linux-nextest-archive]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUN_CODE_PATH: ${{ needs.changes.outputs.selected_compile }}
    steps:
      - name: No-op for docs-only changes
        if: env.RUN_CODE_PATH != 'true'
        run: echo "No code changes detected; no compiled Hew artifact is needed."

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        if: env.RUN_CODE_PATH == 'true'

      - uses: ./.github/actions/setup-rust-build
        if: env.RUN_CODE_PATH == 'true'
        with:
          tools: nextest@0.9.120
          # `linux`, not `linux-mold`: this job links nothing, so it declares
          # no mold rustflag, and a key naming a fingerprint the job does not
          # compile under could never hit. cargo-nextest is here only as the
          # archive's extractor -- reuse mode never invokes a compiler.
          cache-shared-key: linux

      - name: Download the Linux test archive
        if: env.RUN_CODE_PATH == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ci-linux-nextest-${{ github.sha }}
          path: ${{ runner.temp }}/ci-linux-nextest-download
          digest-mismatch: error

      - name: Certify and package the compiled Hew bundle
        if: env.RUN_CODE_PATH == 'true'
        # The freshness certificate travels in the archive, so this certifies
        # the archive's own bytes rather than issuing a second certificate for
        # a rebuild that happened to agree. `pack` verifies that certificate
        # before it copies anything, which is why no separate
        # check-libhew-fresh.sh call stands in front of it: one verification,
        # in the tool that depends on the answer.
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ci-linux-nextest"
          mkdir -p "$root"
          cargo nextest list \
            --archive-file "$RUNNER_TEMP/ci-linux-nextest-download/ci-linux-nextest.tar.zst" \
            --extract-to "$root" \
            --extract-overwrite \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --profile ci \
            --list-type binaries-only \
            > /dev/null
          python3 scripts/compiled-hew-artifact.py pack \
            --source-debug-dir "$root/target/debug" \
            --source-revision "$GITHUB_SHA" \
            --output compiled-hew-linux.tar.gz

      - name: Upload compiled Hew bundle
        if: env.RUN_CODE_PATH == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: compiled-hew-linux-${{ github.sha }}
          path: compiled-hew-linux.tar.gz
          retention-days: 1
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Compiled-Hew suites — four stable O0/O2 hash partitions
  # ─────────────────────────────────────────────────────────────────────────
  compiled-hew-shards:
    name: Compiled Hew suites (shard ${{ matrix.shard }}/4)
    needs: [changes, compiled-hew-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      RUN_CODE_PATH: ${{ needs.changes.outputs.selected_compile }}
    steps:
      - name: No-op for docs-only changes
        if: env.RUN_CODE_PATH != 'true'
        run: echo "No code changes detected; compiled Hew suites are not needed."

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        if: env.RUN_CODE_PATH == 'true'

      - name: Install link prerequisites
        if: env.RUN_CODE_PATH == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev pkg-config zlib1g-dev libzstd-dev

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        if: env.RUN_CODE_PATH == 'true'
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Download compiled Hew bundle
        if: env.RUN_CODE_PATH == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: compiled-hew-linux-${{ github.sha }}
          path: ${{ runner.temp }}/compiled-hew-download

      - name: Verify compiled Hew bundle
        if: env.RUN_CODE_PATH == 'true'
        run: >-
          python3 scripts/compiled-hew-artifact.py unpack
          --input "${{ runner.temp }}/compiled-hew-download/compiled-hew-linux.tar.gz"
          --destination "${{ runner.temp }}/compiled-hew-artifact"
          --expected-revision "$GITHUB_SHA"

      - name: Run O0 and O2 shard
        if: env.RUN_CODE_PATH == 'true'
        run: >-
          python3 scripts/compiled-hew-shards.py run
          --compiler "${{ runner.temp }}/compiled-hew-artifact/compiled-hew/debug/hew"
          --partition "hash:${{ matrix.shard }}/4"
          --output-dir target/hew-shards

      - name: Upload shard reports
        if: always() && env.RUN_CODE_PATH == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: compiled-hew-shard-${{ matrix.shard }}-${{ github.sha }}
          path: target/hew-shards/
          retention-days: 1
          if-no-files-found: error

  compiled-hew-aggregate:
    name: Aggregate compiled Hew suites
    needs: [changes, compiled-hew-linux, compiled-hew-shards]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUN_CODE_PATH: ${{ needs.changes.outputs.selected_compile }}
    steps:
      - name: No-op for docs-only changes
        if: env.RUN_CODE_PATH != 'true'
        run: echo "No code changes detected; there are no compiled Hew shards to aggregate."

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        if: always() && env.RUN_CODE_PATH == 'true'

      - name: Download compiled Hew bundle
        if: >-
          always() && env.RUN_CODE_PATH == 'true' &&
          needs.compiled-hew-linux.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: compiled-hew-linux-${{ github.sha }}
          path: ${{ runner.temp }}/compiled-hew-download

      - name: Verify compiled Hew bundle
        if: >-
          always() && env.RUN_CODE_PATH == 'true' &&
          needs.compiled-hew-linux.result == 'success'
        run: >-
          python3 scripts/compiled-hew-artifact.py unpack
          --input "${{ runner.temp }}/compiled-hew-download/compiled-hew-linux.tar.gz"
          --destination "${{ runner.temp }}/compiled-hew-artifact"
          --expected-revision "$GITHUB_SHA"

      - name: Download every shard report
        if: always() && env.RUN_CODE_PATH == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: compiled-hew-shard-*-${{ github.sha }}
          path: ${{ runner.temp }}/compiled-hew-reports
          merge-multiple: true

      - name: Report compiled Hew shard failures
        if: always() && env.RUN_CODE_PATH == 'true'
        run: >-
          python3 scripts/compiled-hew-shards.py report
          --reports-dir "${{ runner.temp }}/compiled-hew-reports"
          --shard-count 4

      - name: Require every shard to complete
        if: always()
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.compiled-hew-linux.result }}
          SHARD_RESULT: ${{ needs.compiled-hew-shards.result }}
        run: |
          test "$CHANGE_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$SHARD_RESULT" = success

      - name: List the independent full suite inventory
        if: env.RUN_CODE_PATH == 'true'
        run: |
          for fixture in tests/hew/*.hew; do
            "${{ runner.temp }}/compiled-hew-artifact/compiled-hew/debug/hew" \
              test "$fixture" --list --allow-empty
          done | LC_ALL=C sort > "${{ runner.temp }}/compiled-hew-full.txt"

      # >>> CI-PARITY-STEPS
      - name: Assert shard union and Hew ratchet
        if: env.RUN_CODE_PATH == 'true'
        run: >-  # parity-cmd: make test-hew-ratchet
          make test-hew-ratchet
          HEW_SHARD_REPORT_DIR="${{ runner.temp }}/compiled-hew-reports"
          HEW_FULL_INVENTORY="${{ runner.temp }}/compiled-hew-full.txt"
          HEW_SHARD_COUNT=4

      - name: Assert shard union and O2 differential
        if: env.RUN_CODE_PATH == 'true'
        run: >-  # parity-cmd: make test-o2-differential
          make test-o2-differential
          HEW_SHARD_REPORT_DIR="${{ runner.temp }}/compiled-hew-reports"
          HEW_FULL_INVENTORY="${{ runner.temp }}/compiled-hew-full.txt"
          HEW_SHARD_COUNT=4
      # <<< CI-PARITY-STEPS

      - name: Upload compiled Hew test reports
        if: always() && env.RUN_CODE_PATH == 'true'
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d  # v6.4.1
        with:
          report_paths: "${{ runner.temp }}/compiled-hew-reports/hew-*-shard-*.xml"
          check_name: Compiled Hew Test Results

  # ─────────────────────────────────────────────────────────────────────────
  # Linux test archive — one build of the Rust test surface for four shards
  # ─────────────────────────────────────────────────────────────────────────
  #
  # Every Linux shard used to compile the test binaries it was about to run,
  # plus the shared Cargo outputs those binaries link against: a measured
  # 417/732/470/383 s of warm-up per run, four times over one tree, on top
  # of a 3.2-minute `make stdlib` in every one of them.
  #
  # This job builds that surface once and hands it to the shards as a
  # cargo-nextest archive. The archive carries the selected test binaries,
  # nextest's own binaries/cargo metadata, build-script output, linked paths,
  # and the shared Hew artefacts named explicitly in
  # `.config/nextest.toml [profile.ci] archive.include` -- and nothing else. It
  # is NOT a target-directory transfer: no `deps/`, no `.fingerprint/`, no
  # incremental state. Those are Cargo's build state, and shipping them would
  # make this a second, staler authority on what is built.
  #
  # Identity comes from the workflow, not from a manifest. The consumers are
  # DAG-gated on this job in the same run; `download-artifact` reads the
  # current run of the current repository; the artifact is immutable and its
  # digest is validated on download; producer and consumers pin the same
  # ubuntu-24.04 image, the same Rust toolchain, the same LLVM, the same mold
  # RUSTFLAGS, and the same checkout SHA. A manifest binding rustc, ref, lock
  # hash and feature set would restate those guarantees as a second identity
  # system with its own drift. The compiled-Hew bundle keeps its manifest for
  # the different problem it solves: a compact binary pair consumed by a step
  # that must know which revision produced it.
  #
  # hew-wasm is excluded because it needs a wasmtime runner; hew-cabi because
  # every workspace-wide nextest invocation in this repository excludes it (its
  # `#[cfg(test)]` stubs re-`#[no_mangle]` runtime symbols), and
  # `cargo nextest archive --workspace` is one of those. `make test-cabi`
  # therefore keeps its own build, in the shard that selects it.
  linux-nextest-archive:
    name: Build Linux test archive
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUN_CODE_PATH: ${{ needs.changes.outputs.selected_compile }}
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_INCREMENTAL: "0"
      # Identical to the shards': a different linker is a different rustc
      # fingerprint, and the shards must be able to link what this built.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - name: No-op for docs-only changes
        if: env.RUN_CODE_PATH != 'true'
        run: echo "No code changes detected; no Linux test archive is needed."

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        if: env.RUN_CODE_PATH == 'true'
        with:
          fetch-depth: 0

      - name: Free runner disk
        if: env.RUN_CODE_PATH == 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install build tools
        if: env.RUN_CODE_PATH == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev pkg-config mold zlib1g-dev libzstd-dev

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        if: env.RUN_CODE_PATH == 'true'
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}

      - uses: ./.github/actions/setup-rust-build
        if: env.RUN_CODE_PATH == 'true'
        with:
          targets: 'wasm32-unknown-unknown, wasm32-wasip1'
          tools: nextest@0.9.120
          cache-shared-key: linux-mold

      - name: Install WASI target
        if: env.RUN_CODE_PATH == 'true'
        run: rustup target add wasm32-wasip1

      - name: Build the shared test artefacts
        if: env.RUN_CODE_PATH == 'true'
        # `stdlib` is the table-derived shared artefact set (debug hew,
        # libhew.a and its freshness certificate, the native runtime archive,
        # the two wasm32-wasip1 archives). `hew-profile-check` additionally
        # builds and asserts the release-lib launcher, which the shard that
        # selects that gate can then verify instead of rebuilding.
        run: |
          set -euo pipefail
          start=$SECONDS
          make hew-profile-check stdlib
          echo "ARTEFACT_BUILD_SECONDS=$(( SECONDS - start ))" >> "$GITHUB_ENV"

      - name: Archive the Linux test binaries
        if: env.RUN_CODE_PATH == 'true'
        run: |
          set -euo pipefail
          start=$SECONDS
          cargo nextest archive \
            --workspace \
            --exclude hew-wasm \
            --exclude hew-cabi \
            --profile ci \
            --archive-file "$RUNNER_TEMP/ci-linux-nextest.tar.zst"
          echo "ARCHIVE_SECONDS=$(( SECONDS - start ))" >> "$GITHUB_ENV"

      - name: Report the archive cost
        if: always() && env.RUN_CODE_PATH == 'true'
        # Cost telemetry, asserted by nothing. The acceptance question this
        # feeds is whether producer build + archive + the worst consumer's
        # download and extract beats the four-shard warm-up it replaced; that
        # is a measurement, not a number to guess in a comment.
        run: |
          archive="$RUNNER_TEMP/ci-linux-nextest.tar.zst"
          {
            echo "### Linux test archive (producer)"
            echo ""
            echo "- shared artefact build: \`${ARTEFACT_BUILD_SECONDS:-unknown}s\`"
            echo "- archive creation: \`${ARCHIVE_SECONDS:-unknown}s\`"
            if [ -f "$archive" ]; then
              echo "- archive size: \`$(du -h "$archive" | cut -f1)\`"
            else
              echo "- archive size: not produced"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Linux test archive
        if: env.RUN_CODE_PATH == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ci-linux-nextest-${{ github.sha }}
          path: ${{ runner.temp }}/ci-linux-nextest.tar.zst
          # The payload is already a Zstandard tarball. v7 transports artifacts
          # as a Zip; asking Zlib to compress an incompressible file again is
          # runner minutes spent to grow the upload. This is the action's own
          # documented input for that case -- no wrapper, no second transport.
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Build & test — Rust workspace
  # Produces JUnit XML for GitHub Actions test reporting.
  # ─────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: Linux gates (shard ${{ matrix.shard }}/4)
    # `linux-nextest-archive` is a hard dependency, deliberately. If the
    # producer fails, these shards do not run, `linux-required` sees a
    # non-success matrix result, and the required context is RED. There is no
    # per-shard rebuild fallback: a fallback would turn a producer defect into
    # four slow green runs and nobody would find it. `ast-grep-toolchain` is a
    # hard dependency for the same reason: a fallback would quietly restore the
    # four duplicate installs it exists to remove.
    needs: [changes, ast-grep-toolchain, linux-nextest-archive]
    runs-on: ubuntu-24.04
    # Four shards of the selected preflight profile. The dispatcher partitions
    # the profile's command list into four duration-balanced groups and each
    # job runs `--shard N/4`; the partition is exhaustive and disjoint by
    # construction, and ordering-dependent commands stay in the same shard, so
    # the union of the four shards is the same gate set the single serial job
    # ran. Warm-up is derived per shard, so a shard only builds the artifacts
    # its own commands need.
    #
    # The shard count here and the `/4` denominator below MUST agree — a
    # mismatch would leave a shard's commands unrun behind green checks.
    # scripts/tests/test_ci_preflight_dispatcher.py asserts they do.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # The serial job needed 180 min for about 138 min of expected work. The
    # heaviest of the four shards is about 31 min of gate work on top of
    # roughly 15 min of provisioning and warm-up; 90 min leaves generous
    # cold-runner headroom while retaining a finite hung-job limit.
    timeout-minutes: 90
    env:
      # mold is installed by the "Install build tools" step below.
      # Use gcc's -fuse-ld=mold flag (no clang-as-driver dependency) to
      # activate mold for all Rust compilations in this job.  Scoped here
      # rather than .cargo/config.toml so other workflows (release-gate,
      # coverage-nightly, sanitizers) that run on runners without mold are
      # unaffected.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      # The router's own compile selection gates this job's work: a
      # docs/comment-only pull request selects no compiling gate and skips
      # ~51-90 min. STEP-LEVEL gating, not a job-level `if:` — a job whose
      # `if:` is false reports skipped/missing, not a satisfied required
      # context (LESSONS.md ci-required-gate-sequencing), so every step below
      # carries its own `if: env.RUN_CODE_PATH == 'true'` and the no-op step
      # below still reports a green required check on skip.
      RUN_CODE_PATH: ${{ needs.changes.outputs.selected_compile }}
    steps:
      - name: No-op for docs-only changes
        if: env.RUN_CODE_PATH != 'true'
        run: echo "No code changes detected; skipping heavy Linux CI while satisfying the required check."

      - name: Give Cargo its own output directory
        if: env.RUN_CODE_PATH == 'true'
        # FIRST step, before the checkout and before any action consumes
        # Cargo's default: this job materializes the archive at the checkout's
        # own `target/`. Swatinem/rust-cache resolves what it caches as
        # `<workspace>/target` and never reads CARGO_TARGET_DIR, hence
        # `cache-targets: 'false'` below.
        run: |
          set -euo pipefail
          cargo_target="$RUNNER_TEMP/ci-cargo-target"
          mkdir -p "$cargo_target"
          echo "CARGO_TARGET_DIR=$cargo_target" >> "$GITHUB_ENV"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        if: env.RUN_CODE_PATH == 'true'
        with:
          fetch-depth: 0

      - name: Free runner disk
        if: env.RUN_CODE_PATH == 'true'
        # This job installs LLVM 22.1.5 (~1.5 GB), builds the release hew-runtime
        # + hew-lsp binaries, the wasm32-wasip1 runtime, and runs the full debug
        # workspace nextest suite — all on one ubuntu-24.04 runner (~14 GB free).
        # The runner died of ENOSPC twice before this step was added (PR #1994).
        # Code coverage moved to the nightly workflow (c24721fa) so target/llvm-cov-target/
        # no longer accumulates here; the preinstalled-toolchain purge below still
        # recovers the headroom the LLVM download + workspace nextest target/ needs.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install build tools
        if: env.RUN_CODE_PATH == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb libssl-dev pkg-config mold zlib1g-dev libzstd-dev

      - name: Install MQTT E2E clients
        if: env.RUN_CODE_PATH == 'true'
        # mqtt-broker-e2e drives the Hew broker with real MQTT 3.1.1 clients;
        # do not let an absent client turn that behavioural oracle into an
        # implicit local-only target.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto-clients
          command -v mosquitto_pub
          command -v mosquitto_sub

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        if: env.RUN_CODE_PATH == 'true'
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}

      - uses: ./.github/actions/setup-rust-build
        if: env.RUN_CODE_PATH == 'true'
        with:
          targets: 'wasm32-unknown-unknown, wasm32-wasip1'
          tools: nextest@0.9.120
          cache-shared-key: linux-mold
          # `<workspace>/target` belongs to the archive here and is the only
          # directory rust-cache can cache: restoring would populate the path
          # the archive must occupy, and saving on main would store 2.03 GiB
          # of archive as the shared `linux-mold` dependency layer.
          cache-targets: 'false'

      - name: Install WASI target
        if: env.RUN_CODE_PATH == 'true'
        run: rustup target add wasm32-wasip1

      - name: Install wasmtime
        if: env.RUN_CODE_PATH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Downloaded under RUNNER_TEMP, never the checkout. An archive
        # extracted into $PWD is four untracked paths that no gate declares as
        # an input, so the router fails closed to comprehensive on every run
        # and the change-aware selection it exists for never happens
        # (LESSONS.md preflight-perf-discipline). The runner's temp directory
        # is outside the repository, so the working tree stays clean and the
        # diff the router reads is the diff the author wrote.
        run: |
          set -euo pipefail
          WASMTIME_DIR="wasmtime-${WASMTIME_VERSION}-x86_64-linux"
          .github/scripts/retry-download.sh \
            gh release download "$WASMTIME_VERSION" --repo bytecodealliance/wasmtime \
            --pattern "${WASMTIME_DIR}.tar.xz" --dir "$RUNNER_TEMP" --clobber
          tar -xJf "$RUNNER_TEMP/${WASMTIME_DIR}.tar.xz" -C "$RUNNER_TEMP"
          rm -f "$RUNNER_TEMP/${WASMTIME_DIR}.tar.xz"
          echo "$RUNNER_TEMP/${WASMTIME_DIR}" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/${WASMTIME_DIR}/wasmtime" --version

      - name: Install wasm-pack v0.13.1 and Binaryen 117
        if: env.RUN_CODE_PATH == 'true'
        uses: ./.github/actions/setup-wasm-pack

      - name: Setup Node.js for selected browser checks
        if: env.RUN_CODE_PATH == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hew-sandbox-vm/package-lock.json

      - name: Provision pinned ast-grep toolchain
        if: env.RUN_CODE_PATH == 'true'
        uses: ./.github/actions/setup-ast-grep
        with:
          source: artifact
          artifact-name: ast-grep-toolchain-${{ github.sha }}

      - name: Mark the archive transfer start
        if: env.RUN_CODE_PATH == 'true'
        # The download is an action, so it cannot time itself. This marker plus
        # the materialize step's own clock give the transfer cost the
        # acceptance question needs: producer build + archive + the worst
        # consumer's download and extract, against the four-shard warm-up this
        # replaced.
        run: echo "ARCHIVE_TRANSFER_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Download the Linux test archive
        if: env.RUN_CODE_PATH == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ci-linux-nextest-${{ github.sha }}
          path: ${{ runner.temp }}/ci-linux-nextest-download
          # This is the action's default. It is spelled anyway because a
          # transport that silently accepted a corrupted archive would surface
          # as an inexplicable link failure inside a timed gate, hours from
          # the download that caused it.
          digest-mismatch: error

      - name: Materialize the Linux test archive
        if: env.RUN_CODE_PATH == 'true'
        # Materialized AT `$GITHUB_WORKSPACE/target`, the exact path the
        # producer compiled under, because an archived test binary carries
        # absolute paths no remap reaches: a baked `env!("CARGO_BIN_EXE_hew")`
        # and a `current_exe()`-relative walk up `<target>/<profile>/deps/`.
        #
        #
        # Every check below is an interface assertion, not a second identity
        # system: what a consumer must find, never which commit produced it.
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ci-linux-nextest-download/ci-linux-nextest.tar.zst"
          target="$GITHUB_WORKSPACE/target"
          test -s "$archive"
          # Asserted, not assumed: without the first step Cargo's default IS
          # this target, and the freeze would break every compiling gate.
          test "${CARGO_TARGET_DIR:-}" = "$RUNNER_TEMP/ci-cargo-target"
          if [ -n "${ARCHIVE_TRANSFER_START:-}" ]; then
            download_seconds="$(( $(date +%s) - ARCHIVE_TRANSFER_START ))s"
          else
            download_seconds="unknown"
          fi

          if [ -e "$target" ] && [ -n "$(ls -A "$target")" ]; then
            echo "::error::$target is already populated; the Linux test archive cannot be materialized over it"
            ls -A "$target"
            exit 1
          fi
          rm -rf "$target"

          # `--extract-to` and `--workspace-remap` name the SAME root. A
          # staging directory plus a `mv "$staging/target" "$target"` was
          # tried and rejected: `cargo nextest list` itself recreates
          # `$GITHUB_WORKSPACE/target` while it resolves the workspace before
          # the `mv` ever runs, so POSIX `mv` finds a directory already at the
          # destination and nests one level down (`target/target/...`)
          # instead of replacing it. Every path under `$target` in the checks
          # below then reads nothing and every `test` exits silently, four
          # shards at once. Extracting straight into `$GITHUB_WORKSPACE` is
          # the one shape with no second path for the tree to land at.
          #
          # `--extract-overwrite` is required for that same reason, not for a
          # rerun: the `rm -rf` above leaves `$target` empty, but this one
          # `cargo nextest list` invocation recreates it itself while
          # resolving the workspace remap, before its own archive extraction
          # runs. Without the flag it refuses to extract onto the directory
          # it just repopulated.
          start=$SECONDS
          cargo nextest list \
            --archive-file "$archive" \
            --extract-to "$GITHUB_WORKSPACE" \
            --extract-overwrite \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --profile ci \
            --list-type binaries-only \
            --message-format json \
            > "$RUNNER_TEMP/ci-linux-nextest-binaries.json"
          extract_seconds=$(( SECONDS - start ))

          if [ ! -s "$RUNNER_TEMP/ci-linux-nextest-binaries.json" ]; then
            echo "::error::cargo nextest list produced no JSON listing at $RUNNER_TEMP/ci-linux-nextest-binaries.json"
            exit 1
          fi

          # One diagnostic per required archive member, not one bare `test`
          # per line: a bare `test -x "$target/debug/hew"` under `set -e`
          # names nothing when it exits, which is exactly how the nested
          # `target/target/...` defect above went silent. `mode` is `f` for a
          # non-empty regular file, `x` for one that must also be executable.
          for entry in \
            "$target/nextest/binaries-metadata.json:f" \
            "$target/nextest/cargo-metadata.json:f" \
            "$target/debug/hew:x" \
            "$target/debug/libhew.a:f" \
            "$target/debug/libhew_runtime.a:f" \
            "$target/debug/.hew-libhew-freshness-v1:f" \
            "$target/release-lib/hew:x" \
            "$target/release-lib/libhew.a:f" \
            "$target/wasm32-wasip1/debug/libhew_runtime.a:f" \
            "$target/wasm32-wasip1/debug/libhew_std.a:f"
          do
            path="${entry%:*}"
            mode="${entry##*:}"
            if [ "$mode" = x ] && [ -x "$path" ]; then
              continue
            fi
            if [ "$mode" = f ] && [ -s "$path" ]; then
              continue
            fi
            kind="a non-empty file"
            [ "$mode" = x ] && kind="an executable file"
            echo "::error::the Linux test archive is missing $kind at $path"
            parent="$(dirname "$path")"
            echo "contents of $parent:"
            ls -la "$parent" 2>&1 || echo "$parent does not exist"
            exit 1
          done

          # Precreated so the freeze can be total: a read-only `$target` lets
          # no gate unlink or rename a certified tree. The third leaf is
          # forced-cancel's own target dir, which it hardcodes.
          mkdir -p "$target/nextest/ci" "$target/nextest/ci-cabi" "$target/forced-cancel-gate"
          chmod -R a-w "$target"
          chmod u+w "$target/nextest/ci" "$target/nextest/ci-cabi" "$target/forced-cancel-gate"
          touch "$target/nextest/ci/.probe" "$target/nextest/ci-cabi/.probe" "$target/forced-cancel-gate/.probe"
          rm "$target/nextest/ci/.probe" "$target/nextest/ci-cabi/.probe" "$target/forced-cancel-gate/.probe"

          {
            echo "HEW_CI_PREBUILT_TEST_ARTIFACTS=1"
            echo "HEW_CI_NEXTEST_BINARIES_METADATA=$target/nextest/binaries-metadata.json"
            echo "HEW_CI_NEXTEST_CARGO_METADATA=$target/nextest/cargo-metadata.json"
            echo "HEW_CI_NEXTEST_TARGET_DIR=$target"
          } >> "$GITHUB_ENV"
          {
            echo "### Linux test archive (shard ${{ matrix.shard }}/4)"
            echo ""
            echo "- archive size: \`$(du -h "$archive" | cut -f1)\`"
            echo "- download: \`${download_seconds}\`"
            echo "- extract: \`${extract_seconds}s\`"
            echo "- artefact target (read, frozen): \`$target\`"
            echo "- Cargo target (write): \`$CARGO_TARGET_DIR\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the shared Rust test artefacts
        if: env.RUN_CODE_PATH == 'true'
        # The same target that BUILT this set locally; under
        # HEW_CI_PREBUILT_TEST_ARTIFACTS it verifies the archive supplied every
        # member instead. First use of the prebuilt mode in the job, so a bad
        # archive fails here rather than inside a timed gate's hang budget.
        run: |
          set -euo pipefail
          start=$SECONDS
          make stdlib
          echo "- shared artefact verify: \`$(( SECONDS - start ))s\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Run change-scoped tests
        if: env.RUN_CODE_PATH == 'true'
        env:
          COMPILED_HEW_GATE_OWNER: aggregate
          # `playground-wasm-build` owns these two gates when the playground
          # filter fires -- it already has the browser tooling provisioned.
          # Empty when that job does not run, so a change the filter misses
          # still runs both here.
          PLAYGROUND_GATE_OWNER: ${{ needs.changes.outputs.playground == 'true' && 'playground' || '' }}
          # The `lint` job runs its authority gates unconditionally on every
          # pull request, so selecting them here as well runs each of them
          # twice for one change. Declaring the owner removes the duplicate
          # without removing the gate; a local preflight sets no owner and
          # still runs everything.
          LINT_GATE_OWNER: lint
          HEW_O0_OUTCOMES_FILE: ${{ runner.temp }}/hew-o0-outcomes.txt
          # Newly-passing expected-failure entries annotate on a pull request
          # and BLOCK on the default branch, where the list must be current.
          # An unexpected FAILURE is red on both.
          RATCHET_STRICT: ${{ github.event_name == 'push' && '1' || '' }}
        # The route is derived from the event, once, by
        # scripts/ci-preflight-route.sh. The `--base origin/main` this
        # replaces was wrong in both directions: on a pull request it diffed
        # against a moving trunk rather than the branch's own base, and on a
        # push TO main it diffed main against itself and produced an empty
        # change set.
        #
        # A push to main broadcasts failures to every branch, so the route
        # adds --fail-fast there. Sharding keeps that from narrowing the
        # report -- strategy.fail-fast is false, so the other three shards run
        # to completion and a broken change still surfaces up to four
        # independent first failures.
        #
        # The dispatcher writes a per-command result table (command, elapsed,
        # result, first failure line) to $GITHUB_STEP_SUMMARY and emits an
        # ::error annotation per failed command, so a red shard reports the
        # failing line at the top of the job instead of only "exit 1".
        run: scripts/ci-preflight-route.sh --shard ${{ matrix.shard }}/4

      - name: Upload test reports
        if: always() && env.RUN_CODE_PATH == 'true'
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d  # v6.4.1
        with:
          report_paths: "target/nextest/ci/junit.xml,target/nextest/ci-cabi/junit.xml"
          check_name: Test Results (Linux shard ${{ matrix.shard }})

  # ─────────────────────────────────────────────────────────────────────────
  # Nightly freshness — the scheduled tier is only a tier while it reports
  # ─────────────────────────────────────────────────────────────────────────
  nightly-freshness:
    name: Nightly freshness
    # ADVISORY TODAY, REQUIRED AFTER ONE GREEN NIGHTLY. Read this before
    # changing either half.
    #
    # The check itself is complete and fails closed: a scheduled workflow past
    # its window, an unowned scheduled workflow, an empty enumeration, or an
    # unanswerable API is RED. What is deliberately not yet done is aggregating
    # it into the required `Build & test (Linux)` context.
    #
    # Why: the last successful SCHEDULED coverage-nightly run is ~740h old,
    # because that job was missing gdb — fixed in this same branch, in
    # coverage-nightly.yml, but the fix cannot have taken effect until a
    # scheduled run executes it. Requiring the check now would turn
    # `Build & test (Linux)` red on every open pull request for a reason no
    # author can fix or influence, which is a repository-wide deadlock rather
    # than a gate.
    #
    # The check still RUNS on every pull request and its script still exits
    # nonzero for a stale nightly, an auth/scope defect, or a malformed
    # response — the script's fail-closed semantics are untouched. What is
    # tolerated is the JOB'S conclusion: the one assertion step below carries
    # `continue-on-error: true` so this advisory check cannot itself turn a
    # PR's check suite red for a nightly no author can fix. The step still
    # posts its own red annotation (`::error::`) and the assertion step keeps
    # its failure outcome and logs, while the job and check conclusion are
    # success and the pull request's check suite stays green. Visible, not
    # silent, and not a bypass of the script. `continue-on-error` is scoped to
    # this one step,
    # not the job, so a future step added to this job is never tolerated by
    # accident.
    #
    # ACTIVATION, exactly — four edits, one commit, no other change:
    #   1. Confirm a green scheduled run exists:
    #        gh api "repos/:owner/:repo/actions/workflows/coverage-nightly.yml/runs?event=schedule&status=success&per_page=1" \
    #          --jq '.workflow_runs[0].run_started_at'
    #      and that `python3 scripts/check-nightly-freshness.py` exits 0.
    #   2. Remove `continue-on-error: true` from the assertion step below —
    #      required checks are never tolerated.
    #   3. Add `nightly-freshness` to `linux-required`'s `needs:` list.
    #   4. Add `NIGHTLY_FRESHNESS_RESULT: ${{ needs.nightly-freshness.result }}`
    #      to that job's env and `test "$NIGHTLY_FRESHNESS_RESULT" = success`
    #      to its assertion.
    # scripts/tests/test_ci_workflow_contract.py holds the job to the advisory
    # (tolerated) shape until then, and to the required (untolerated) shape
    # afterwards — the tolerance and the required wiring must land together.
    #
    # Deliberately NO `needs:`. Every other job in this workflow hangs off
    # `changes`; a failed or stranded `changes` run would skip this one too,
    # and the whole point is that nightly rot cannot hide behind another
    # job's verdict.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Workflow-run history lives under the `actions` scope. `contents: read`
      # does not cover it, and an unauthorised read 404s on a private
      # repository -- indistinguishable from "never ran on schedule", which
      # would report an auth defect as nightly rot. The script separates the
      # two, and this grant is what makes the separation meaningful.
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          sparse-checkout: |
            .github/workflows
            .github/nightly-owners.yml
            scripts/check-nightly-freshness.py
            scripts/scheduled-failure-report.py
            scripts/check-gate-reachability.py
            scripts/lib/gate_inputs.py
          sparse-checkout-cone-mode: false

      - name: Assert the scheduled tier is fresh
        # ADVISORY TOLERANCE — see the job-level comment above. Remove this
        # line, and only this line, at activation; the script itself keeps
        # failing closed regardless (no flag, no bypass, no grace window).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check-nightly-freshness.py

  # Keep the established required-check name while allowing the Rust and
  # compiled-Hew suites to execute in parallel.
  #
  # `needs.build-and-test.result` is the AGGREGATE of the four Linux gate
  # shards: GitHub reports `success` only when every matrix leg succeeded, and
  # a cancelled, skipped or failed leg leaves it non-success. That is what lets
  # the shards multiply without touching branch protection — this job's name,
  # "Build & test (Linux)", remains the single required context.
  linux-required:
    name: Build & test (Linux)
    # `nightly-freshness` is deliberately absent until one green scheduled
    # coverage-nightly run exists on main — see that job's ACTIVATION note.
    needs: [changes, build-and-test, compiled-hew-aggregate]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # The router's compile selection, not a platform output: this job
      # aggregates LINUX gates. It read `platform_smoke` before, which is a
      # different question and, once that output was deleted, would have
      # evaluated to the empty string and silently taken the no-op branch
      # forever.
      RUN_CODE_PATH: ${{ needs.changes.outputs.selected_compile }}
    steps:
      - name: No-op for docs-only changes
        if: env.RUN_CODE_PATH != 'true'
        run: echo "No code changes detected; the required Linux check is satisfied."

      - name: Require every Linux gate
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          RUST_GATES_RESULT: ${{ needs.build-and-test.result }}
          COMPILED_HEW_RESULT: ${{ needs.compiled-hew-aggregate.result }}
        # When the scheduled tier is activated (see `nightly-freshness`), this
        # aggregator is its home rather than `lint`: `lint` is on a slimming
        # path, while this is a five-minute `if: always()` job whose whole
        # purpose is asserting needs.*.result, so one more entry is the
        # cheapest durable place in the topology and it needs no ruleset edit
        # to become required.
        run: |
          test "$CHANGE_RESULT" = success
          test "$RUST_GATES_RESULT" = success
          test "$COMPILED_HEW_RESULT" = success

  # Code coverage moved off the per-PR path: it was the flakiest required check
  # (cargo-llvm-cov instrumentation + the duplicated target/llvm-cov-target/
  # tree on top of LLVM install exited 100 / ENOSPC on sound PRs). The real
  # correctness tests run in "Build & test (Linux)"; coverage now runs nightly
  # in .github/workflows/coverage-nightly.yml (same llvm-cov command + report).

  # ─────────────────────────────────────────────────────────────────────────
  # Build & test — Windows
  # ─────────────────────────────────────────────────────────────────────────
  build-and-test-windows:
    name: Build & test (Windows)
    needs: changes
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      # ONE tier, three monotone values: none | smoke | full. Linux owns full
      # correctness on every code change; Windows proves what only a
      # windows-msvc runner can (linking, path separators, process spawning,
      # calling convention, CodeView), and escalates to the whole workspace
      # when the change can move the linked surface.
      #
      # RUN_CODE_PATH and RUN_FULL_NEXTEST previously came from two
      # INDEPENDENT dorny filters that were not nested, so a change to
      # `.github/actions/setup-llvm/action.yml` set full=true and smoke=false
      # -- and because every step gated on smoke, this required check reported
      # green having built nothing.
      PLATFORM_TIER: ${{ needs.changes.outputs.platform_tier }}
      # aws-lc-sys (rustls under hew-runtime, jsonwebtoken under hew-lib) wants
      # NASM on windows-msvc; the documented escape consumes the crate's
      # pregenerated assembly objects, so the test-time hew-lib bootstrap links
      # without a NASM toolchain. (Parity with release-gate.yml / release.yml.)
      AWS_LC_SYS_PREBUILT_NASM: "1"
      # Cap concurrent rustc invocations on the Windows runner to avoid OOM.
      # hew-codegen-rs/llvm.rs (~33k lines) consumes ~2-3 GB of RSS per rustc
      # process under the LLVM backend; with the default job count equal to the
      # runner's CPU count (4), peak concurrent RSS exceeds the runner's 16 GB
      # and the kernel kills rustc (STATUS_STACK_BUFFER_OVERRUN / 0xc0000409).
      # Two concurrent jobs fit comfortably (2 × 3 GB = 6 GB peak for codegen,
      # leaving headroom for the OS, LLVM headers, and the linker pass).
      # Linux and macOS runners have more headroom at their default parallelism
      # and are unaffected. Revisit when hew-codegen-rs/llvm.rs is split into
      # smaller modules, or when the Windows runner gains more memory.
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: No-op for docs-only changes
        if: env.PLATFORM_TIER == 'none'
        run: echo "No code changes detected; skipping heavy Windows CI while satisfying the required check."
        shell: pwsh

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        if: env.PLATFORM_TIER != 'none'

      - name: Setup MSVC environment
        # lld-link needs the MSVC and UCRT library paths exported by vcvarsall;
        # the LLVM prefix is configured in the following setup-llvm step.
        if: env.PLATFORM_TIER != 'none'
        uses: ./.github/actions/setup-msvc

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        if: env.PLATFORM_TIER != 'none'
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}

      - uses: ./.github/actions/setup-rust-build
        if: env.PLATFORM_TIER != 'none'
        with:
          targets: wasm32-wasip1
          tools: nextest@0.9.120
          cache-shared-key: windows

      - name: Build Rust crates
        if: env.PLATFORM_TIER != 'none'
        # hew-codegen-rs (inkwell -> llvm-sys-221) compiles end-to-end
        # because the upstream LLVM tarball is provisioned above.
        run: cargo build -p hew-pkg -p hew-runtime -p hew-lsp -p hew-cli --release

      - name: Build Hew runtime library for PDB e2e
        if: env.PLATFORM_TIER != 'none'
        run: cargo build -p hew-lib --release

      - name: Build shared Rust test artifact
        if: env.PLATFORM_TIER != 'none'
        run: make stdlib

      - name: Verify Windows CodeView PDB emission
        if: env.PLATFORM_TIER != 'none'
        shell: pwsh
        run: |
          $pdbutil = Get-Command llvm-pdbutil -ErrorAction SilentlyContinue
          if (-not $pdbutil) {
            throw "llvm-pdbutil not found on PATH; the LLVM toolchain must provide the PDB inspection tool"
          }
          & $pdbutil.Source --version
          if ($LASTEXITCODE -ne 0) { throw "llvm-pdbutil --version failed with exit code $LASTEXITCODE" }

          $dir = Join-Path $env:RUNNER_TEMP "hew-pdb-e2e"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $source = Join-Path $dir "pdb-e2e.hew"
          $binary = Join-Path $dir "pdb-e2e.exe"
          @"
          fn main() {
              println(2235)
          }
          "@ | Set-Content -Path $source -Encoding utf8

          & .\target\release\hew.exe build -g $source -o $binary
          if ($LASTEXITCODE -ne 0) { throw "hew build -g failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $binary)) { throw "hew build -g did not produce $binary" }

          $pdb = Join-Path $dir "pdb-e2e.pdb"
          if (-not (Test-Path -LiteralPath $pdb)) { throw "hew build -g did not produce the expected PDB at $pdb" }

          $dump = & $pdbutil.Source dump -summary -modules -symbols -l $pdb 2>&1
          if ($LASTEXITCODE -ne 0) { throw "llvm-pdbutil could not inspect $pdb`n$dump" }
          $dumpText = $dump -join "`n"
          if ($dumpText -notmatch "pdb-e2e\.hew") { throw "PDB dump has no source module record for pdb-e2e.hew`n$dumpText" }
          if ($dumpText -notmatch "(?i)main") { throw "PDB dump has no main symbol`n$dumpText" }
          if ($dumpText -notmatch "(?i)line") { throw "PDB dump has no line information`n$dumpText" }

      - name: Install WASI runner prerequisites
        # Windows had no equivalent of the Linux tarball / macOS brew install,
        # so `wasmtime` was absent here and every WASI-dependent hew-cli test
        # either failed with "`wasmtime` not found" or — via the deleted
        # try_require_wasi_runner — passed having asserted nothing. Provision
        # the runner from the same pinned WASMTIME_VERSION the other two jobs
        # use, and prove it runs inside this step: a broken install must fail
        # the job here, not resurface as "not found" inside a test.
        if: env.PLATFORM_TIER != 'none'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rustup target add wasm32-wasip1
          if ($LASTEXITCODE -ne 0) { throw "rustup target add wasm32-wasip1 failed" }

          $dir = "wasmtime-${env:WASMTIME_VERSION}-x86_64-windows"
          $archive = Join-Path $env:RUNNER_TEMP "$dir.zip"
          gh release download "${env:WASMTIME_VERSION}" --repo bytecodealliance/wasmtime --pattern "$dir.zip" --dir $env:RUNNER_TEMP --clobber
          if ($LASTEXITCODE -ne 0) { throw "downloading $dir.zip from bytecodealliance/wasmtime failed" }

          # Extracted under RUNNER_TEMP, not the checkout: an archive unpacked
          # into $PWD is untracked paths no gate declares, which makes the
          # change router fail closed to comprehensive on every run.
          Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP -Force
          Remove-Item -LiteralPath $archive -Force
          $wasmtimeBin = Join-Path $env:RUNNER_TEMP $dir
          $wasmtimeExe = Join-Path $wasmtimeBin "wasmtime.exe"
          if (-not (Test-Path -LiteralPath $wasmtimeExe)) {
            throw "wasmtime.exe not found at $wasmtimeExe after extracting $dir.zip"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $wasmtimeBin

          & $wasmtimeExe --version
          if ($LASTEXITCODE -ne 0) { throw "wasmtime installed but 'wasmtime --version' exited $LASTEXITCODE" }

          # wasm-ld comes from the LLVM install provisioned above; hew's WASM
          # link step shells out to it, so an unreachable wasm-ld is the same
          # class of silent gap as a missing runtime.
          $wasmLd = Get-Command wasm-ld -ErrorAction SilentlyContinue
          if (-not $wasmLd) { throw "wasm-ld not found on PATH (expected from the LLVM ${env:LLVM_VERSION} install)" }
          & $wasmLd.Source --version
          if ($LASTEXITCODE -ne 0) { throw "wasm-ld found at $($wasmLd.Source) but 'wasm-ld --version' exited $LASTEXITCODE" }

      - name: Build hew-runtime for wasm32-wasip1 (debug)
        # Mirrors the macOS job. The WASI tests run as debug binaries and only
        # verify this archive, so it must exist before nextest starts.
        if: env.PLATFORM_TIER != 'none'
        run: cargo build -p hew-runtime --target wasm32-wasip1 --no-default-features

      - name: Build hew-std for wasm32-wasip1 (debug)
        # bootstrap_wasi_runner verifies this archive too.
        if: env.PLATFORM_TIER != 'none'
        run: cargo build -p hew-std --target wasm32-wasip1

      - name: Assert the platform behaviour suite is not empty
        # LESSONS.md enumeration-gate-floors -- see the macOS job for why this
        # is a floor and never an asserted count. `python` rather than
        # `python3`: the Windows image ships the former on PATH.
        if: env.PLATFORM_TIER == 'smoke'
        shell: pwsh
        env:
          HEW_TEST_NO_BUILD: "1"
        run: |
          $listing = Join-Path $env:RUNNER_TEMP "platform-selection.json"
          cargo nextest list --workspace --exclude hew-wasm --exclude hew-cabi --profile platform --message-format json --list-type full > $listing
          if ($LASTEXITCODE -ne 0) { throw "cargo nextest list failed with exit code $LASTEXITCODE" }
          python scripts/platform-suite-floor.py $listing
          if ($LASTEXITCODE -ne 0) { throw "platform behaviour suite floor rejected the selection" }

      - name: Run the platform behaviour suite
        # NARROWED from the five-crate smoke set (hew-runtime, hew-codegen-rs,
        # hew-compile, hew-cli, hew-lib -- 6,046 tests), not deleted. The
        # `platform` nextest profile selects the surfaces where a windows-msvc
        # runner can observe something Linux cannot: linker driver, cross-target
        # selection, process spawn and exit codes, trap-to-crash abort paths,
        # MSVC-vs-SysV calling convention and dispatch, CodeView/DWARF debug
        # info, and the concurrent link + shared-artifact-path contract. 732
        # tests, and it ADDS hew-testutil's link-race and shared-artifact
        # binaries, which the old smoke set did not run on either platform.
        #
        # What stopped running here is the ordinary in-process logic those same
        # crates also contain. It runs on Linux, once.
        #
        # The floor step above proves the selection is non-empty. This step
        # never asserts a count: a filterset selecting nothing is a green job
        # proving nothing, while an exact count is a change-detector that fires
        # on every new test.
        if: env.PLATFORM_TIER == 'smoke'
        env:
          HEW_TEST_NO_BUILD: "1"
        run: >-
          cargo nextest run
          --workspace
          --exclude hew-wasm
          --exclude hew-cabi
          --profile platform

      - name: Run full Rust workspace tests
        # Platform/toolchain/ABI change: run the full workspace nextest on
        # Windows so a native-linking or cross-platform regression is caught
        # per-PR, not only by the nightly matrix.
        # hew-wasm is excluded on every platform (profile.ci's default-filter
        # does the same) — the browser/tooling WASM surface has its own
        # playground-wasm-build job. hew-cabi has #[no_mangle] symbols that
        # conflict with hew-runtime when both link into a test binary; the
        # C-ABI step below is its coverage.
        # Default features include "full" (encryption + profiler + quic),
        # so all QUIC transport tests run without an explicit flag.
        if: env.PLATFORM_TIER == 'full'
        env:
          HEW_TEST_NO_BUILD: "1"
        run: >-
          cargo nextest run --workspace
          --exclude hew-wasm
          --exclude hew-cabi
          --profile ci
          --no-fail-fast

      - name: Run C-ABI crate tests
        # Standalone because the workspace run above must exclude hew-cabi.
        # Unconditional on the code path: the crate is 82 fast tests and it is
        # the only place the C-ABI ownership contract is exercised on Windows.
        if: env.PLATFORM_TIER != 'none'
        run: make test-cabi

      - name: Upload test reports
        if: always() && env.PLATFORM_TIER != 'none'
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d  # v6.4.1
        with:
          report_paths: "target/nextest/ci/junit.xml,target/nextest/ci-cabi/junit.xml,target/nextest/platform/junit.xml"
          check_name: Test Results (Windows)

  # ─────────────────────────────────────────────────────────────────────────
  # Build & test — macOS (Apple Silicon)
  # ─────────────────────────────────────────────────────────────────────────
  build-and-test-macos:
    name: Build & test (macOS arm64)
    needs: changes
    runs-on: macos-14
    timeout-minutes: 60
    env:
      # Same single tier authority as the Windows job. Linux owns full
      # correctness; macOS proves the Apple Silicon linker, the release-binary
      # ABI path, and the platform behaviour surface, and escalates to the
      # whole workspace when the change can move the linked surface.
      PLATFORM_TIER: ${{ needs.changes.outputs.platform_tier }}
    steps:
      - name: No-op for docs-only changes
        if: env.PLATFORM_TIER == 'none'
        run: echo "No code changes detected; skipping heavy macOS arm64 CI while satisfying the required check."

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        if: env.PLATFORM_TIER != 'none'

      - uses: ./.github/actions/setup-rust-build
        if: env.PLATFORM_TIER != 'none'
        with:
          targets: 'aarch64-apple-darwin, x86_64-apple-darwin, wasm32-wasip1'
          tools: nextest@0.9.120
          cache-shared-key: macos

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        if: env.PLATFORM_TIER != 'none'
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Set macOS deployment target
        if: env.PLATFORM_TIER != 'none'
        run: echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"

      - name: Build release libhew.a (runtime + stdlib)
        if: env.PLATFORM_TIER != 'none'
        run: cargo build -p hew-lib --release

      - name: Build shared Rust test artifact
        if: env.PLATFORM_TIER != 'none'
        run: make stdlib

      - name: Build frontend (release)
        if: env.PLATFORM_TIER != 'none'
        run: cargo build -p hew-cli --release

      - name: Smoke test the release binary
        if: env.PLATFORM_TIER != 'none'
        # Drives a trivial program through `hew compile` with the RELEASE
        # binary. Guards the ABI-mismatch abort class (#1606): a release build
        # that crashes at process exit while every debug test passes, because
        # the two use different C++ runtime linkage.
        run: make test-release-binary

      - name: Install WASI runner prerequisites
        if: env.PLATFORM_TIER != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        # Extracted under RUNNER_TEMP, not the checkout: see the Linux job's
        # "Install wasmtime" step for why a polluted working tree defeats the
        # router.
        run: |
          set -euo pipefail
          rustup target add wasm32-wasip1
          WASMTIME_DIR="wasmtime-${WASMTIME_VERSION}-aarch64-macos"
          .github/scripts/retry-download.sh \
            gh release download "$WASMTIME_VERSION" --repo bytecodealliance/wasmtime \
            --pattern "${WASMTIME_DIR}.tar.xz" --dir "$RUNNER_TEMP" --clobber
          tar -xJf "$RUNNER_TEMP/${WASMTIME_DIR}.tar.xz" -C "$RUNNER_TEMP"
          rm -f "$RUNNER_TEMP/${WASMTIME_DIR}.tar.xz"
          echo "$RUNNER_TEMP/${WASMTIME_DIR}" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/${WASMTIME_DIR}/wasmtime" --version
          command -v wasm-ld
          wasm-ld --version

      - name: Build hew-runtime for wasm32-wasip1 (release)
        if: env.PLATFORM_TIER != 'none'
        run: cargo build -p hew-runtime --target wasm32-wasip1 --no-default-features --release

      - name: Build hew-runtime for wasm32-wasip1 (debug)
        # The platform smoke tests run as debug binaries (cargo nextest run, no
        # --release). bootstrap_wasi_runner derives the build profile from the
        # test binary path and verifies that profile's libhew_runtime.a.
        if: env.PLATFORM_TIER != 'none'
        run: cargo build -p hew-runtime --target wasm32-wasip1 --no-default-features

      - name: Build hew-std for wasm32-wasip1 (debug)
        # Pre-build the stdlib WASI archive for the same verify-only contract.
        if: env.PLATFORM_TIER != 'none'
        run: cargo build -p hew-std --target wasm32-wasip1

      - name: Assert the platform behaviour suite is not empty
        # LESSONS.md enumeration-gate-floors. A `default-filter` that selects
        # nothing produces a green nextest run, a green job, and a green
        # required check, having executed no test at all -- the exact vacuity
        # this whole program exists to remove. The floor is NON-EMPTY, never an
        # exact count: a count is a change-detector that fires on every added
        # test and tells a reviewer nothing.
        if: env.PLATFORM_TIER == 'smoke'
        env:
          HEW_TEST_NO_BUILD: "1"
        run: |
          set -euo pipefail
          # Machine format, and the count comes from the JSON test records
          # rather than from non-blank lines of human output: progress lines,
          # warnings, colour codes and a `--list-type` change all move a line
          # count, and any of them would turn "no tests selected" into a
          # number greater than zero.
          #
          # The listing is written out first and read second: a cargo command
          # inside a command substitution is unreadable to the
          # gate-reachability tokeniser, and a command it cannot read is a
          # command whose test filters it cannot check.
          cargo nextest list \
            --workspace --exclude hew-wasm --exclude hew-cabi \
            --profile platform --message-format json --list-type full \
            > "$RUNNER_TEMP/platform-selection.json"
          python3 scripts/platform-suite-floor.py \
            "$RUNNER_TEMP/platform-selection.json"

      - name: Run the platform behaviour suite
        # Same narrowed selection as the Windows job: see that job's step for
        # what the `platform` profile covers and what moved to Linux-once.
        #
        # The macOS leak oracles stay OFF hosted CI. The old step spelled that
        # as `-E 'not binary(~oracle)'`; the profile makes it structural
        # instead -- no oracle binary is in its selection at all, and
        # scripts/tests/test_ci_workflow_contract.py asserts that, so the
        # policy cannot be undone by a filter edit nobody reads. Those oracles
        # remain an explicit local-macOS authority before release; this program
        # does not restore them and does not claim their coverage.
        if: env.PLATFORM_TIER == 'smoke'
        env:
          HEW_TEST_NO_BUILD: "1"
        run: >-
          cargo nextest run
          --workspace
          --exclude hew-wasm
          --exclude hew-cabi
          --profile platform

      - name: Run full Rust workspace tests
        # Platform/toolchain/ABI change: run the full workspace nextest on
        # macOS so a native-linking or cross-platform regression is caught
        # per-PR, not only by the nightly matrix.
        # hew-cabi has #[no_mangle] symbols that conflict with hew-runtime
        # when both link into a test binary.
        #
        # Oracle integration binaries are intentionally excluded from ordinary
        # hosted jobs, including release-gate, for runner cost/reliability.
        # The macOS leak-oracle authority is explicit local macOS validation
        # before release; Linux supplies structural/ASan coverage where applicable.
        if: env.PLATFORM_TIER == 'full'
        env:
          HEW_TEST_NO_BUILD: "1"
        run: >-
          cargo nextest run --workspace
          --exclude hew-wasm
          --exclude hew-cabi
          --profile ci
          --no-fail-fast
          -E 'not binary(~oracle)'

      - name: Run C-ABI crate tests
        # Standalone because the workspace run above must exclude hew-cabi.
        # Unconditional on the code path so Apple Silicon keeps C-ABI coverage
        # even when the full workspace nextest is deduped off this job.
        if: env.PLATFORM_TIER != 'none'
        run: make test-cabi

      - name: Upload test reports
        # The Linux and Windows jobs already publish the same two reports
        # as inline PR annotations; this job produces them too but never
        # surfaced them — a macOS-only failure was readable only by
        # scrolling raw step logs.
        if: always() && env.PLATFORM_TIER != 'none'
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d  # v6.4.1
        with:
          report_paths: "target/nextest/ci/junit.xml,target/nextest/ci-cabi/junit.xml,target/nextest/platform/junit.xml"
          check_name: Test Results (macOS)

  # ─────────────────────────────────────────────────────────────────────────
  # Platform gates — ONE always-reporting required context for both platforms
  # ─────────────────────────────────────────────────────────────────────────
  #
  # `Build & test (Windows)` and `Build & test (macOS arm64)` are directly
  # required today, and that is what makes the platform wrong-green possible:
  # a job whose steps all skip still reports its context as satisfied. An
  # aggregate that runs `if: always()` and ASSERTS `needs.*.result` cannot be
  # satisfied by a skip -- a stranded upstream is a RED here, not a pending or
  # a quiet pass (this is the R4 trap `linux-required` must not inherit).
  #
  # `skipped` is accepted only where it is the deliberate answer: platform tier
  # `none` means every changed path is classified prose, so neither platform
  # job needed to run and the aggregator says so. Any other skip is a defect.
  platform-required:
    name: Platform gates
    needs: [changes, build-and-test-windows, build-and-test-macos]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both platform gates
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          WINDOWS_RESULT: ${{ needs.build-and-test-windows.result }}
          MACOS_RESULT: ${{ needs.build-and-test-macos.result }}
          PLATFORM_TIER: ${{ needs.changes.outputs.platform_tier }}
        run: |
          set -euo pipefail

          # The routing job itself must have produced an answer. Without this,
          # a failed `changes` leaves PLATFORM_TIER empty and every branch
          # below would be reasoning about a value nobody computed.
          if [ "$CHANGE_RESULT" != success ]; then
            echo "::error::change detection did not succeed (${CHANGE_RESULT}); the platform tier is unknown"
            exit 1
          fi

          case "$PLATFORM_TIER" in
            none | smoke | full) ;;
            *)
              echo "::error::platform tier is '${PLATFORM_TIER}', which is not one of none|smoke|full"
              exit 1
              ;;
          esac

          echo "Platform tier: ${PLATFORM_TIER}"
          echo "Windows: ${WINDOWS_RESULT}; macOS: ${MACOS_RESULT}"
          echo "Platform tier \`${PLATFORM_TIER}\` — Windows ${WINDOWS_RESULT}, macOS ${MACOS_RESULT}" \
            >> "$GITHUB_STEP_SUMMARY"

          status=0
          for platform in Windows:"$WINDOWS_RESULT" macOS:"$MACOS_RESULT"; do
            name="${platform%%:*}"
            result="${platform#*:}"
            case "$result" in
              success) ;;
              skipped)
                # A job-level skip is only legitimate when the tier says the
                # platform had nothing to prove. Note both platform jobs use
                # STEP-level no-ops, so at tier `none` they still report
                # success; a job-level `skipped` here means something upstream
                # stranded them.
                if [ "$PLATFORM_TIER" = none ]; then
                  echo "${name}: skipped, and the platform tier is none — that is the correct answer"
                else
                  echo "::error::${name} was skipped at platform tier ${PLATFORM_TIER}; a skip is not a pass"
                  status=1
                fi
                ;;
              *)
                echo "::error::${name} reported '${result}'"
                status=1
                ;;
            esac
          done
          exit "$status"

  # ─────────────────────────────────────────────────────────────────────────
  # Budget — the numbers, on the run you are already looking at
  # ─────────────────────────────────────────────────────────────────────────
  #
  # No stored trailing window, no metrics service, no dashboard, and NO
  # ADVISORY FAILING JOB. It reads this run's own job timings and writes them
  # into this run's summary. The p95 budgets this program set are checked on
  # demand with `gh run list` / `gh api .../jobs`; a dashboard nobody reads is
  # theatre, while a summary line on the page you already opened is not.
  #
  # `if: always()` because the interesting runs are the slow ones and the red
  # ones. It asserts nothing, so it cannot make a run red for being slow --
  # a budget is a signal, not a gate.
  ci-budget:
    name: CI budget
    needs: [changes, lint, build-and-test, linux-required, platform-required]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Report this run's wall time, shard makespan, and route
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_PROFILE: ${{ needs.changes.outputs.selected_compile }}
          PLATFORM_TIER: ${{ needs.changes.outputs.platform_tier }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
            --paginate --jq '.jobs[]|[.name,.started_at,.completed_at]|@tsv' \
            > jobs.tsv || {
              echo "::notice::could not read this run's job timings; the budget line is informational and does not gate."
              exit 0
            }
          python3 - jobs.tsv >> "$GITHUB_STEP_SUMMARY" <<'REPORT'
          import datetime as dt, sys

          def parse(value):
              return dt.datetime.fromisoformat(value.replace("Z", "+00:00"))

          rows = []
          for line in open(sys.argv[1], encoding="utf-8"):
              parts = line.rstrip("\n").split("\t")
              if len(parts) != 3 or not parts[1] or not parts[2]:
                  continue
              rows.append((parts[0], parse(parts[1]), parse(parts[2])))

          print("### CI budget")
          if not rows:
              print("No completed job timings were available for this run.")
              raise SystemExit(0)

          wall = (max(end for _, _, end in rows) - min(s for _, s, _ in rows))
          minutes = lambda d: d.total_seconds() / 60.0
          job_minutes = sum(minutes(end - start) for _, start, end in rows)
          shards = [
              (name, minutes(end - start))
              for name, start, end in rows
              if name.startswith("Linux gates")
          ]
          print(f"- Wall time: **{minutes(wall):.1f} min** over {len(rows)} job(s)")
          print(f"- Job-minutes: **{job_minutes:.0f}**")
          if shards:
              longest = max(cost for _, cost in shards)
              shortest = min(cost for _, cost in shards)
              spread = 0.0 if longest == 0 else (longest - shortest) / longest * 100.0
              print(
                  f"- Linux shard makespan: **{longest:.1f} min**, "
                  f"spread **{spread:.0f}%** ({shortest:.1f}-{longest:.1f})"
              )
          print("")
          print("| Job | Minutes |")
          print("| --- | ---: |")
          for name, start, end in sorted(
              rows, key=lambda row: row[2] - row[1], reverse=True
          )[:12]:
              print(f"| {name} | {minutes(end - start):.1f} |")
          REPORT
          {
            echo ""
            echo "Route: compile=\`${SELECTED_PROFILE:-unknown}\`, platform tier=\`${PLATFORM_TIER:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"
