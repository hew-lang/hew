[[case]]
id = "select-timer-arm"
intent = "An idle pipe loses to the `after 20ms` arm, and the disarmed selection leaves the read half usable: the next send arrives and the sink's close ends the drain."
source = "cases/select-timer-arm.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.expected]
stdout = "timeout\nreceived late\nclosed\n"
exit = 0
