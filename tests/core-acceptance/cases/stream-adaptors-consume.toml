[[case]]
id = "stream-adaptors-consume"
intent = "Source collection drains a consumed Stream through checked iteration. Closing or forwarding consumes its endpoints, while sending borrows the sink and item; repeated calls preserve results and release each endpoint exactly once."
source = "cases/stream-adaptors-consume.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.expected]
stdout = "round-0|\nforwarded 9\nabandoned 0\nround-1|\nforwarded 9\nabandoned 1\nround-2|\nforwarded 9\nabandoned 2\nround-3|\nforwarded 9\nabandoned 3\n"
exit = 0
