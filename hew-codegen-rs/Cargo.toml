[package]
name = "hew-codegen-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "LLVM object emitter for verified Hew physical MIR"
repository = "https://github.com/hew-lang/hew"
readme = "../README.md"
keywords = ["hew", "compiler", "llvm", "codegen", "wasm"]
categories = ["compilers"]

[dependencies]
hew-mir = { path = "../hew-mir" }
hew-types = { path = "../hew-types" }
hew-parser = { path = "../hew-parser" }
# Trap discriminants remain shared with the runtime.
hew-runtime = { path = "../hew-runtime", default-features = false }
inkwell = { version = "=0.9.0", default-features = false, features = [
  "llvm22-1",
  "target-x86",
  "target-aarch64",
  "target-webassembly",
] }
# Provides the exact LLVM toolchain path to the sanitizer test build setup.
llvm-sys = "221"

[dev-dependencies]
hew-hir = { path = "../hew-hir" }
hew-sir = { path = "../hew-sir" }
hew-types = { path = "../hew-types", features = ["test"] }
tempfile.workspace = true
