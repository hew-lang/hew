# cargo-deny license and dependency policy for Hew.
#
# Enforced before publication by `make release-checks`; also available as
# `make dependency-policy` during development. This checks licences, security
# advisories and permitted sources. Every warning fails the check.
# Multiple versions of a dependency are allowed and are not scanned as a ban.
#
# Only licences on the allow list may appear in the release dependency graph.
#
# License allow-list derived from:
#   cargo about generate --workspace --format json (2026-06-17 audit).
# See also NOTICE and THIRD-PARTY-LICENSES for attribution details.

[licenses]
# Allow these SPDX identifiers. Everything else is an error.
allow = [
  # Core permissive
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception", # LLVM/inkwell ecosystem — static link
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "Zlib",

  # Unicode data files — unicode-ident, unicode-normalization, etc.
  "Unicode-3.0",
  # Unicode License Agreement for Data Files and Software (2016 version) —
  # same permissive Unicode-data family as Unicode-3.0.  Required by
  # finl_unicode v1.4.0, which ships a read-only General_Category table.
  "Unicode-DFS-2016",

  # Public domain / permissive data
  "CC0-1.0",             # notify crate (ships in hew-cli)
  "CDLA-Permissive-2.0", # webpki-roots / webpki-root-certs cert bundle
  "Unlicense",

  # Weak file-level copyleft — binary distribution is allowed; MPL-2.0 only
  # requires MPL-2.0 files to remain MPL-2.0 if redistributed as source
  # (Hew does not redistribute option-ext's source). Pulled by dirs-sys → dirs.
  "MPL-2.0",

  # BSL-1.0 — confirmed NOT in any shipping binary (clipboard-win, error-code
  # are Windows clipboard helpers reachable only from dev/test code paths).
  # Included so the gate does not fire on their Cargo.lock presence.
  "BSL-1.0",
]

# Confidence threshold for matching license text to SPDX identifier.
confidence-threshold = 0.8

# Ignore license fields of workspace crates marked publish = false.
[licenses.private]
ignore = true

# ─── Advisories ──────────────────────────────────────────────────────────────
[advisories]
version = 2
# Check unmaintained direct workspace dependencies; warning escalation makes
# each finding require a dependency update or an explicit advisory exception.
unmaintained = "workspace"
# Do not publish a newly assembled release with a yanked locked dependency.
yanked = "deny"
ignore = []

# ─── Sources ─────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
