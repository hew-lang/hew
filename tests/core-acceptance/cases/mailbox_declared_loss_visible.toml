[[case]]
id = "mailbox_declared_loss_visible"
intent = "Same-key coalescing accepts the incoming submission, while the drop_new fallback reports Discarded."
source = "cases/mailbox_declared_loss_visible.hew"
suites = ["acceptance", "safety"]
