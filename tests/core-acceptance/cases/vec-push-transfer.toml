[[case]]
id = "vec-push-transfer"
intent = "A runtime operation that adopts its operand transfers a fresh temporary and a dead-after local instead of cloning them, a local the caller reads afterwards keeps its own independent value, a replaced element releases the old one, and a map adopts an owned value beside a cloned key."
