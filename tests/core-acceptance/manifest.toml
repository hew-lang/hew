# Each case is a supported native program with an exact observable outcome.
# The runner executes every selected case at both optimization levels; matching
# failures are failures, not a differential pass.

[[case]]
id = "utf8-error-value"
intent = "The canonical UTF-8 error is an ordinary reusable record whose Display distinguishes invalid from incomplete byte sequences."
source = "cases/utf8-error-value.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 15

[case.expected]
stdout = "invalid UTF-8 at byte 2 (1-byte sequence)\nincomplete UTF-8 sequence at byte 4\ninvalid UTF-8 at byte 2 (1-byte sequence)\n"
exit = 0

[[case]]
id = "fallible-tuple-return"
intent = "Fallible declarations return ordinary tuples on success and typed owning errors through local recovery."
source = "cases/fallible-tuple-return.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 15

[case.expected]
stdout = "10:HELLO\nMISSING\n"
exit = 0

[[case]]
id = "fallible-result-success"
intent = "A Result declared as the success type remains an inner value, including Err, and is never implicitly forwarded as the outer failure."
source = "cases/fallible-result-success.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 15

[case.expected]
stdout = "success:INNER\nfailure:OUTER\n"
exit = 0

[[case]]
id = "propagation-handler-boundary"
intent = "Propagation while evaluating a handler operand bypasses that handler; only the resulting inner error is recovered locally."
source = "cases/propagation-handler-boundary.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 15

[case.expected]
stdout = "OUTER\nINNER\nRECOVERED\nVALUE\n"
exit = 0

[[case]]
id = "scalar-variant-patterns"
intent = "Float and character payloads survive repeated calls and select ordered exact or wildcard patterns independently."
source = "cases/scalar-variant-patterns.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 15

[case.expected]
stdout = "1:1:2:3:4:5\n"
exit = 0

[[case]]
id = "lazy-optional-default"
intent = "Present owning options skip fallback side effects and survive repeated calls; absence evaluates the fallback once."
source = "cases/lazy-optional-default.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 15

[case.expected]
stdout = "KEPT\nKEPT\nfallback\nDEFAULT\n"
exit = 0

[[case]]
id = "local-error-recovery"
intent = "Local recovery binds only errors, preserves caller values and supports a divergent return from the handler."
source = "cases/local-error-recovery.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 15

[case.expected]
stdout = "KEPT\nKEPT\nBROKEN\nFALLBACK\nBROKEN\nSUCCESS\n"
exit = 0

[[case]]
