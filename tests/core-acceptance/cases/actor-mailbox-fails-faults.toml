[[case]]
id = "actor-mailbox-fails-faults"
intent = "A `fails` handler submitted one way through a mailbox view has no caller for its declared error, so the error becomes the actor's own fault with its own text in the diagnostic — from the error itself for `fails string` and from the `Display` body for a declared error type — and the supervisor restarts each child once."
source = "cases/actor-mailbox-fails-faults.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.expected]
stdout = "open\nvault\n60\nopen\n100\nvault\n50\n"
stderr = "hew: failure: ActorUnhandledFailure (213): cannot withdraw 500 from 60\nhew: actor crash in Actor (actor 1): ActorUnhandledFailure\nhew: failure: ActorUnhandledFailure (213): short by 30\nhew: actor crash in Actor (actor 2): ActorUnhandledFailure\n"
exit = 0
