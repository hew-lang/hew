[[case]]
id = "raii1-record-resource-field-overwrite-assign"
intent = "RAII-1 oracle: an authored `#[resource] #[opaque]` handle is released by its own `close` exactly once on every exit path, alone and inside a record (spec §3.7.3 / §10(d)). Shape `overwrite_assign` (raii1 record resource field overwrite releases both) runs to its exact outcome with no leak, double free or use after free under ASan/LSan."
source = "cases/raii1-record-resource-field-overwrite-assign.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 60

[case.expected]
stdout = "closed\nreassigned\nclosed\n"
exit = 0
