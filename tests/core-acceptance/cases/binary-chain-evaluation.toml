stdout = "a1\na2\nall=false\no1\no2\nany=true\nm1\nm3\nm4\nm5\nmixed=true\nn1\nn2\nn3\nn4\nn5\nsum=14\n10 7 8 true 1\nasbsc\nt1\nt2\n"
exit = 1
