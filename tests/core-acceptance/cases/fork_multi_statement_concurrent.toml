[[case]]
id = "fork_multi_statement_concurrent"
intent = "Two anonymous children run multi-statement bodies that overlap: the parent reads both children's ready before releasing either, and sequences every printed marker."
source = "../vertical-slice/accept/fork_multi_statement_concurrent.hew"
suites = ["acceptance"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "4"

[case.expected]
stdout = "both-started\nfirst-end\nsecond-end\ncomplete\n"
exit = 0
