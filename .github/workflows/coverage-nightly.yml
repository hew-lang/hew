name: Coverage nightly

# Nightly Rust and runtime coverage through the project's Make targets.

on:
  schedule:
    # Run daily at 07:00 UTC (offset from nightly-sanitizers at 06:00 to avoid
    # both heavy LLVM-install jobs contending for the same runner pool start).
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  # Pinned LLVM upstream release tag, used by hew-codegen-rs (inkwell ->
  # llvm-sys-221) build script. Must match ci.yml / setup-llvm action pins.
  LLVM_VERSION: "22.1.5"
  # Pinned wasmtime release tag for full-windows's WASI provisioning step,
  # matching ci.yml's single pin (see ci.yml's WASMTIME_VERSION comment for
  # why it is pinned rather than resolved as "latest").
  WASMTIME_VERSION: "v47.0.2"
  CARGO_TERM_COLOR: always

jobs:
  # Runtime FFI coverage is produced only by real compiled Hew programs. Keep
  # it separate from cargo-llvm-cov: their covmaps are not merge-compatible,
  # and fail if any curated program fails to build, run, or emit profile data.
  runtime-e2e-coverage:
    name: Runtime E2E coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-rust-build
        with:
          components: llvm-tools
          cache-shared-key: runtime-e2e-coverage

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          sudo rm -rf /usr/lib/jvm || true
          sudo rm -rf /usr/local/julia* || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Compile, run, and measure the runtime corpus
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
        # `-k`: compiled Hew programs install a SIGTERM handler, so a plain
        # `timeout` waits forever on a wedged one instead of failing the step.
        run: timeout -k 60 2400 make coverage-runtime

      - name: Publish runtime coverage summary
        if: always()
        run: |
          if [[ -f coverage-out/runtime-e2e/runtime-summary.txt ]]; then
            cat coverage-out/runtime-e2e/runtime-summary.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload runtime coverage summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-e2e-coverage
          path: coverage-out/runtime-e2e/runtime-summary.txt
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────
  # Rust workspace coverage, separate from compiled-program runtime coverage.
  # ─────────────────────────────────────────────────────────────────────────
  coverage:
    name: Code coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # cargo-llvm-cov builds into target/llvm-cov-target/, so the `hew`
      # binary the e2e tests spawn sits one directory deeper than the normal
      # target/debug/ — its exe-relative std discovery (../../std) then misses
      # the repo std/. Pin std explicitly for the instrumented run; the normal
      # test job finds it relative to target/debug/ and needs no override.
      HEW_STD: ${{ github.workspace }}/std
      # Keep the compiler and the coverage run in one target directory.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/llvm-cov-target
      CARGO_LLVM_COV_TARGET_DIR: ${{ github.workspace }}/target/llvm-cov-target
      CARGO_LLVM_COV_BUILD_DIR: ${{ github.workspace }}/target/llvm-cov-target
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-rust-build
        with:
          components: llvm-tools
          tools: cargo-llvm-cov@0.8.7
          cache-shared-key: coverage

      - name: Free runner disk
        # cargo-llvm-cov instruments the full workspace and writes a separate
        # target/llvm-cov-target/ tree on top of the normal target/. That
        # combination — LLVM 22.1.5 download/install plus the instrumented
        # build — has exhausted the runner disk at the LLVM install step
        # (System.IO.IOException: No space left on device). Mirror the same
        # preinstalled-toolchain purge the Linux build job carries (PR #1995).
        # jvm (~1.5 GB) and julia (~0.5 GB) are present on ubuntu-24.04 but were
        # missing from this step; adding them recovers ~2 GB before LLVM install.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          sudo rm -rf /usr/lib/jvm || true
          sudo rm -rf /usr/local/julia* || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h /

      # hew-codegen-rs depends on inkwell -> llvm-sys-221, whose build
      # script requires LLVM_SYS_221_PREFIX.
      - name: Install LLVM ${{ env.LLVM_VERSION }}
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Disk space before coverage build
        # Baseline snapshot before the instrumented build writes
        # target/llvm-cov-target/. Confirms whether disk was already marginal
        # entering the build, independently of the build itself.
        run: df -h /

      - name: Install WASI runner prerequisites
        # The instrumented run includes hew-cli's wasmtime-backed e2e tests
        # (e.g. sort_merge_authority_runs_under_wasmtime), whose support
        # bootstrap builds the wasm32-wasip1 runtime + stdlib archives at test
        # time and runs the output under wasmtime.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rustup target add wasm32-wasip1
          WASMTIME_TAG="${WASMTIME_VERSION}"
          WASMTIME_DIR="wasmtime-${WASMTIME_TAG}-x86_64-linux"
          .github/scripts/retry-download.sh \
            gh release download "$WASMTIME_TAG" --repo bytecodealliance/wasmtime \
            --pattern "${WASMTIME_DIR}.tar.xz" --clobber
          tar -xJf "${WASMTIME_DIR}.tar.xz"
          echo "$PWD/${WASMTIME_DIR}" >> "$GITHUB_PATH"
          "./${WASMTIME_DIR}/wasmtime" --version

      - name: Run tests with coverage
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
        run: |
          make stdlib
          timeout -k 60 1800 make coverage

      - name: Upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: coverage-out/lcov.info
          if-no-files-found: error

      - name: Upload coverage (HTML)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: coverage-out/html/
          if-no-files-found: error
