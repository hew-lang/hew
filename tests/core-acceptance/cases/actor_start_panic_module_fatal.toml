[[case]]
id = "actor_start_panic_module_fatal"
intent = "The panic is reported as Hew's own typed failure and the process exits 1."
source = "../vertical-slice/accept/actor_start_panic_module_fatal.hew"
suites = ["acceptance"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "4"

[case.expected]
stdout = ""
stderr = "hew: failure: UserPanic (212): intentional on(start) panic\n"
exit = 1
