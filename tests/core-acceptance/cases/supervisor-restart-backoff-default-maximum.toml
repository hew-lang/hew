[[case]]
id = "supervisor-restart-backoff-default-maximum"
intent = "The backoff maximum defaults to 30 seconds and the delay never drops below its initial value, so a longer initial delay or a smaller written maximum gives a constant delay; zero and negative durations are refused."
source = "cases/supervisor-restart-backoff-default-maximum.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 10

[case.env]
HEW_DETERMINISTIC = ""

[case.expected]
stdout = "true\n20000\n30000\n30000\n60000\n60000\n60000\n60000\n"
exit = 0
