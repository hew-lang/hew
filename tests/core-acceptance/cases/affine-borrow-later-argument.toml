[[case]]
id = "affine-borrow-later-argument"
intent = "Borrowing a resource before evaluating a later call preserves the resource and its nested fields for subsequent reads and exactly-once release."
source = "cases/affine-borrow-later-argument.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 15

