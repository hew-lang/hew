[[case]]
id = "offload-exit-leaves-abandoned-call"
intent = "Exit does not wait for an #[offload] call whose caller gave up: the sleep stays blocked in the OS and the program still ends."
source = "cases/offload-exit-leaves-abandoned-call.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.expected]
stdout = "deadline\n"
exit = 0
