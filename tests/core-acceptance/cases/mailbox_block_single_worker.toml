[[case]]
id = "mailbox_block_single_worker"
intent = "A bounded send suspends its actor so the sole scheduler worker can drain the receiver's mailbox."
source = "../vertical-slice/accept/mailbox_block_single_worker.hew"
suites = ["acceptance"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "1"

[case.expected]
stdout = "BLOCK_WORK_DELIVERED\n"
exit = 42
