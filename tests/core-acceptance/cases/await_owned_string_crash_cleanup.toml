[[case]]
id = "await_owned_string_crash_cleanup"
intent = "A fresh owned reply becomes live only after the await resumes."
source = "../vertical-slice/accept/await_owned_string_crash_cleanup.hew"
suites = ["acceptance"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "4"

[case.expected]
stdout = "used=fresh-value\nhandled-crash\n"
exit = 1
