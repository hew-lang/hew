[[case]]
id = "wire-member-not-serializable"
intent = "A #[wire] declaration whose member is a resource or a nested Option is refused at that member, while plain records, tuples and recursion are data and accepted."
source = "cases/wire-member-not-serializable.hew"
suites = ["acceptance"]
timeout_seconds = 30
kind = "check"

[[case.expected.diagnostics]]
severity = "error"
code = "BoundsNotSatisfied"
line = 17
column = 8
message = "E_NOT_SERIALIZABLE: field `h` of `#[wire]` type `HasHandle` reaches `Handle`, a resource, linear or opaque type"

[[case.expected.diagnostics]]
severity = "error"
code = "BoundsNotSatisfied"
line = 22
column = 8
message = "E_NOT_SERIALIZABLE: field `n` of `#[wire]` type `HasNested` reaches `Option<Option<i64>>`, a nested `Option`, which null cannot represent"
