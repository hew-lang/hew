[[case]]
id = "supervisor-restart-backoff-default-maximum"
intent = "An omitted backoff maximum caps the doubling delay at 30 seconds, or holds it at an initial delay longer than that."
source = "cases/supervisor-restart-backoff-default-maximum.hew"
suites = ["acceptance", "safety"]
