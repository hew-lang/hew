[[case]]
id = "supervisor-dead-role-send"
intent = "A send through a supervised role whose restart budget is spent is refused as `SendError.Dead` rather than reported as delivered."
source = "cases/supervisor-dead-role-send.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 20

[case.expected]
stdout = "start\naccepted\nstart\ndead\n"
exit = 1
