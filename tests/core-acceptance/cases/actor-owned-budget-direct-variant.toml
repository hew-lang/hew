[[case]]
id = "actor-owned-budget-direct-variant"
intent = "Direct variants charge nothing at the heap limit, moved payloads charge once, and indirect variants still refuse."
source = "cases/actor-owned-budget-direct-variant.hew"
suites = ["acceptance", "safety"]
