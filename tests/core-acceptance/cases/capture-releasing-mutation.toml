[[case]]
id = "capture-releasing-mutation"
intent = "A repeatedly called closure inserts resources into its captured map in place: a key callback fault would leave the map with the capture, so no copy of the map is needed, and the map releases each resource once."
source = "cases/capture-releasing-mutation.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.expected]
stdout = "1\n2\nclose conn 2\nclose conn 1\n"
exit = 0
