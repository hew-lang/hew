[[case]]
id = "resource-close-fault-map-hash"
intent = "A hash callback fault stays primary while a failed map insertion leaves the map with its binding; unwinding releases the untransferred replacement, then the map, then the outer owner, even when every close fails."
source = "cases/resource-close-fault-map-hash.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.expected]
stdout = "close 2\nclose 1\nclose 99\n"
exit = 1
