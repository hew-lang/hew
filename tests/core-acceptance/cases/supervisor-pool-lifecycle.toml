[[case]]
id = "supervisor-pool-lifecycle"
intent = "A construction-time count expression reads owned config once to construct four fungible members, reports the extent even after shutdown, refuses an out-of-range `get`, and restarts one crashed member on its own slot: the replacement re-runs its init template including owned state, `await_restart` on that member resolves it Live, and the other three keep the mutation they were given."
source = "cases/supervisor-pool-lifecycle.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.expected]
stdout = "pool-member\n4\nno member 4\n4\n4\n4\n4\n1\n3\n11\n4\n4\n4\nstopped\n4\n"
exit = 0
