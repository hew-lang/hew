id: no-new-copy-predicate-legacy
language: rust
severity: error
message: >-
  New copy/heap predicate beside the legacy ones. Whether a type is bit-copyable, and
  whether it owns heap, are decided once by the §1.1 class table
  (hew_types::ValueClass::of_ty) and published as TypeFacts.
note: >-
  Read hew_types::ValueClass::of_ty through a ClassContext, or read the decided
  fact from TypeCheckOutput.type_facts. A second predicate is how
  `(i64, i64)` came to be Copy under one authority and CowValue under another
  (docs/internal/ir-ladder.md §1.1). If a genuinely new authority is needed, it
  belongs in hew-types beside the class table.
# The three files that carry the predicates which existed when the class table
# landed. Each of those is a reader of the legacy lowering path, which is the
# parity harness's second leg, and each is on the §9 deletion ledger with phase
# P5. The exemption is by symbol, not by file, so a new predicate added beside
# them is still refused; the list is closed and shrinks with the legacy route.
# Every other path is scanned by `no-new-copy-predicate`, which exempts nothing.
files:
  - "hew-mir/src/model.rs"
  - "hew-mir/src/ownership.rs"
  - "hew-codegen-rs/src/llvm.rs"
ignores:
  - "**/tests/**"
  - "**/test/**"
  - "**/*_test.rs"
  - "**/*_tests.rs"
  - "**/tests.rs"
rule:
  all:
    - kind: function_item
    - has:
        field: name
        regex: "(^|_)(is_copy|owns_heap)"
    - has:
        field: return_type
        regex: "^bool$"
    - not:
        has:
          field: name
          regex: "^(ty_owns_heap|ty_owns_heap_mir|container_ingress_is_copy_in|owns_heap|resolved_ty_element_owns_heap_for_owned_vec)$"
