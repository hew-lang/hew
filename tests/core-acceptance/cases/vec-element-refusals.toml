[[case]]
id = "vec-element-refusals"
intent = "The refusals a collection keeps come from the element's value class and name it: an affine resource and a trait object have no copy operation, so array repeat, range slice and the map value projections refuse them at the element site rather than through a shape allowlist."
source = "cases/vec-element-refusals.hew"
suites = ["acceptance"]
timeout_seconds = 30
kind = "check"

[[case.expected.diagnostics]]
code = "InvalidOperation"
line = 21
column = 19
message = "array repeat copies the element into every slot, but `Conn` (an affine resource) has no copy operation"

[[case.expected.diagnostics]]
code = "InvalidOperation"
line = 25
column = 17
message = "`Vec<Conn>` cannot be range-sliced: a slice copies each element into an independent `Vec`, but `Conn` (an affine resource) has no copy operation"

[[case.expected.diagnostics]]
code = "InvalidOperation"
line = 29
column = 19
message = "array repeat copies the element into every slot, but `dyn Speaker` (a shared value whose descriptor carries no copy slot) has no copy operation"

[[case.expected.diagnostics]]
code = "InvalidOperation"
line = 33
column = 19
message = "`HashMap.values()` copies each value out of the map, but the value type `Conn` (an affine resource) has no copy operation"
