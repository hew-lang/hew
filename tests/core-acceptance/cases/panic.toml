[[case]]
id = "panic"
intent = "The panic is reported as Hew's own typed failure and the process exits 1."
source = "../vertical-slice/accept/panic.hew"
suites = ["acceptance"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "4"

[case.expected]
stdout = ""
stderr = "hew: failure: UserPanic (212): panic fixture\n"
exit = 1
