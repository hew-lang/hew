[[case]]
id = "example-basics-higher_order_functions"
intent = "The published example compiles, runs and prints exactly what it advertises."
source = "../../examples/playground/basics/higher_order_functions.hew"
suites = ["acceptance"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "4"

[case.expected]
stdout = "double(5)          = 10\nsquare(5)          = 25\nnegate(7)          = -7\ndouble then square = 36\n"
exit = 0
