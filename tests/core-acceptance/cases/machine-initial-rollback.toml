[[case]]
id = "machine-initial-rollback"
intent = "A fault in an initial constructor discards staged outputs and preserves the original owning machine value."
source = "cases/machine-initial-rollback.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 15

[case.expected]
stdout = "rollback:ORIGINAL\n"
stderr = "hew: failure: DivideByZero (202)\n"
exit = 1
