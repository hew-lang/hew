[[case]]
id = "whole-owner-map-callback-fault"
intent = "A key hash fault while inserting into a map held by a resource leaves the map with its opened owner: the untransferred connection closes, then the owner closes whole with the connection it already held."
source = "cases/whole-owner-map-callback-fault.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 15

[case.expected]
stdout = "1\nclose conn 2\nclose registry 1\nclose conn 1\n"
exit = 1
