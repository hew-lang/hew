name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base. Restricting this to `main` meant a
  # stacked PR (based on another branch) received no checks at all, so its
  # merge gate could report READY with nothing having run. A stacked branch
  # is exactly where a break is easiest to miss.
  pull_request:
  workflow_dispatch:

# A push to a branch makes any run still going for that same ref obsolete:
# its verdict can no longer gate anything, because a newer commit exists.
# Those runs were still holding runners, so 15 open pull requests could
# starve the queue and nothing scheduled at all. Never cancel on main —
# a push there must complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  pull-requests: read
  security-events: write

env:
  # Pinned LLVM upstream release tag, used by hew-codegen-rs (inkwell ->
  # llvm-sys-221) build script. Bumps must be reflected in
  # .github/actions/setup-llvm/action.yml (asset SHA256 pins) too.
  LLVM_VERSION: "22.1.5"
  # Pinned wasmtime release tag. Every job that provisions a WASI runner
  # downloads its per-platform asset from THIS tag. It is pinned, and pinned in
  # one place, for two reasons: resolving "latest" per job (as the Linux job
  # did) or taking whatever a package manager ships (as macOS did with brew)
  # let the three platforms straddle different wasmtime releases inside a
  # single run, so a WASI behaviour difference could be read as a platform
  # difference; and an unpinned runtime changes the tested surface without a
  # commit. Assets used: x86_64-linux.tar.xz, aarch64-macos.tar.xz,
  # x86_64-windows.zip.
  WASMTIME_VERSION: "v47.0.2"
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Trunk health — report a red main without suppressing branch gates
  # ─────────────────────────────────────────────────────────────────────────
  main-health:
    name: main is green
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # On 2026-08-20 a warm-up defect landed on main and the same failure was
      # reported by eleven branch runs over four hours. Keep the trunk-health
      # signal visible, but do not make gate scheduling depend on it: a failed
      # prerequisite makes GitHub skip dependent jobs before their steps run,
      # which would let a red main suppress every independent branch result.
      #
      # The escape is deliberate and visible: label the pull request `fix-main`
      # to let this signal pass while repairing trunk. Without the label, the
      # signal stays red but the independent branch gates still run.
      - name: Report a confirmed red main
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -uo pipefail
          # This signal fails OPEN on anything that is not a confirmed red main.
          # An API error, a token problem, an empty
          # response: none of those are evidence about main, and treating them
          # as evidence would take the whole repository down on a 404.
          if ! gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&per_page=1" > main-run.json; then
            echo "::warning::could not read main's CI status; running branch gates anyway."
            exit 0
          fi
          conclusion=$(jq -r '.workflow_runs[0].conclusion // "unknown"' main-run.json 2>/dev/null || echo unknown)
          head_sha=$(jq -r '.workflow_runs[0].head_sha // "unknown"' main-run.json 2>/dev/null || echo unknown)
          run_url=$(jq -r '.workflow_runs[0].html_url // ""' main-run.json 2>/dev/null || echo "")
          echo "Last completed CI run on main: ${conclusion} at ${head_sha}"
          # Only a run that FAILED is evidence that main is broken. A cancelled
          # run is what the concurrency group does when a newer commit lands,
          # and a repository that blocked every branch on one of those would
          # deadlock on routine traffic rather than on a defect.
          case "${conclusion}" in
            failure|timed_out) ;;
            *) exit 0 ;;
          esac
          if printf '%s' "${PR_LABELS}" | jq -e 'index("fix-main")' > /dev/null 2>&1; then
            echo "::notice::main is ${conclusion} at ${head_sha}; running anyway because this pull request is labelled fix-main."
            exit 0
          fi
          echo "::error::main is red at ${head_sha}; fix main first (${run_url}). Label this pull request fix-main if it is the fix."
          exit 1

  # ─────────────────────────────────────────────────────────────────────────
  # Lint — code quality plus 1,778-file formatter preservation
  # (always runs; cold runners can take 15–25 min)
  # Produces SARIF output for GitHub Code Scanning inline annotations.
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: Clippy & format
    runs-on: ubuntu-24.04
    # Job 93290474020 reached the final authority-graph step at 25m17s after
    # 308s of toolchain setup, 252s of structural lint, 131s of .hew format,
    # 492s of formatter preservation, 167s of Clippy, and about 90s elsewhere.
    # The graph did not complete, so 45 min leaves cold-runner headroom while
    # retaining a finite ceiling for a stuck job.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # fetch-depth: 0 required so origin/main is available for the
          # orchestration-token commit-message scan (--scan-commits range
          # origin/main..HEAD) that runs in the leak-scan step below.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-rust-build
        with:
          components: 'clippy, rustfmt'
          targets: wasm32-wasip1
          cache-shared-key: lint

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Build shared Rust test artifact
        run: make stdlib

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Keep this consumer on the shared cache-backed provisioning action.
      # The structural-lint target still verifies the pinned toolchain before
      # it scans, so local and CI entry points retain the same safety checks.
      - name: Provision pinned ast-grep toolchain
        uses: ./.github/actions/setup-ast-grep

      # Keep the bootstrap counterfactuals on the required job after moving
      # provisioning into the shared action.
      - name: Verify structural lint bootstrap contract
        run: make test-ast-grep-contract test-structural-lint-bootstrap

      # Keep the stub-driven build-harness counterfactuals on a required job.
      # They use temporary trees only and need no compiler build.
      - name: Verify build harness contracts
        run: make test-build-harness

      # >>> CI-PARITY-STEPS
      # This job is an active required status check on main. Keep the workflow
      # contract here unconditionally so nightly/release-gate drift cannot merge.
      - name: Verify FreeBSD workflow contract
        run: make freebsd-workflow-contract-check

      - name: Verify tool pin contract
        run: make tool-pin-contract-check

      - name: Verify sanitizer gate wiring
        run: make check-sanitizer-gate

      - name: Verify gate reachability and documented make targets
        run: make check-gate-reachability

      - name: Run structural authority lint
        run: make structural-lint

      - name: Check shell scripts
        run: make shell-script-lint
      # <<< CI-PARITY-STEPS

      - name: Check .hew formatting
        run: make hew-fmt-check

      - name: Install SARIF tools
        run: |
          .github/scripts/retry-download.sh \
            gh release download clippy-sarif-latest --repo psastras/sarif-rs \
            --pattern "clippy-sarif-x86_64-unknown-linux-gnu" --output clippy-sarif --clobber
          .github/scripts/retry-download.sh \
            gh release download sarif-fmt-latest --repo psastras/sarif-rs \
            --pattern "sarif-fmt-x86_64-unknown-linux-gnu" --output sarif-fmt --clobber
          chmod +x clippy-sarif sarif-fmt
          mv clippy-sarif sarif-fmt /usr/local/bin/
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --tests --message-format=json -- -D warnings \
            | clippy-sarif \
            | tee clippy-results.sarif \
            | sarif-fmt

      - name: Require documented runtime unsafe blocks
        run: make runtime-unsafe-clippy

      - name: Install cargo-geiger
        run: cargo install cargo-geiger --locked

      - name: Reject unreviewed runtime unsafe growth
        run: make runtime-unsafe-geiger

      - name: Audit new high-risk unsafe operations
        run: make unsafe-pattern-audit

      - name: Verify C ABI surface and JIT host ABI classification
        run: make cabi-surface-check test-cabi-surface verify-ffi test-verify-ffi

      - name: Legacy path syntax lint
        run: make legacy-path-syntax-lint

      - name: Upload Clippy SARIF
        if: always() && hashFiles('clippy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@c35d1b164463ee62a100735382aaaa525c5d3496  # codeql-bundle-v2.25.6 (v4)
        with:
          sarif_file: clippy-results.sarif
          category: clippy
          wait-for-processing: true

      - name: Runtime poison-safe lint
        run: make runtime-poison-safe-lint

      - name: WASM-TODO backlog-authority lint
        # Parse the offline manifest authority, exercise the synthetic teeth,
        # then validate every actionable source marker against a stable backlog
        # id. No GitHub/API state is needed.
        run: make lint-wasm-todo

      - name: Codegen carried-identity gate
        # Assert the codegen carried-identity invariants with a focused step.
        run: make codegen-carried-identity-gate

      - name: Check codegen trap inventory
        run: make codegen-trap-inventory-check

      - name: Verify system-call closure
        run: make verify-sys-lane-closure

      - name: Orchestration-token leak scan
        # Scan tracked source files and commit-message bodies of all PR commits
        # for orchestration tokens (lane IDs, Q-tags, .tmp/ paths).  Placed outside
        # CI-PARITY-STEPS so the preflight↔CI parity assertion is unaffected.
        # origin/main is available because the checkout above uses fetch-depth: 0.
        run: make leak-scan

      - name: Verify build artifact, cache, and shard contracts
        run: |
          python3 scripts/tests/test_compiled_hew_artifact.py
          python3 scripts/tests/test_rust_dependency_cache_contract.py
          python3 scripts/tests/test_compiled_hew_shards.py
      - name: ll-byte-identity normaliser self-test
        # Prove the ll-diff oracle's normaliser still catches real IR changes
        # (string-content edits, numeric-const NAME changes) while staying
        # transparent to pool-id reorderings.  No compiler build required —
        # exercises scripts/ll-byte-identity.sh against synthetic .ll snippets.
        # Guards the ll-diff gate itself from silently degrading into a no-op.
        run: make ll-identity-selftest

      - name: Sandbox parity coverage check
        # Assert every VM-dependent hew-sandbox-wasm test binary (one
        # containing a function that spawns the hew-sandbox-vm Node runner)
        # is excluded WHOLE from the generic nextest default-filter AND has
        # every one of its tests run by the provisioned `make sandbox-parity`
        # gate. Catches a new VM-dependent binary landing in only one of
        # those two states -- failing unprovisioned generic runs on every
        # platform, or silently never running on a provisioned one.
        # Classification is binary-level, not per-test (a same-file call
        # graph cannot safely attribute VM-dependence to individual tests).
        # Runs the checker's own self-test first
        # (test-sandbox-parity-coverage-check).
        run: make sandbox-parity-coverage-check

      - name: Measure dogfood compiler IR
        run: make dogfood-compile-measure

  # ─────────────────────────────────────────────────────────────────────────
  # License gate — enforce the deny.toml allow-list so no copyleft or unknown
  # dep silently enters the shipping graph, and assert THIRD-PARTY-LICENSES is
  # current relative to Cargo.lock. Runs on every push/PR; fast (~30 s).
  # ─────────────────────────────────────────────────────────────────────────
  license-check:
    name: License policy (cargo deny + THIRD-PARTY-LICENSES freshness)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-rust-build
        with:
          cache-shared-key: deny

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.6

      - name: Check license policy
        run: cargo deny check licenses

      - name: Check bans and sources
        run: cargo deny check bans sources

      - name: Check security advisories
        run: cargo deny check advisories

      - name: Install cargo-about
        run: cargo install cargo-about --locked --version 0.9.0 --features cli

      - name: Verify THIRD-PARTY-LICENSES is current
        run: make licenses-check

  # ─────────────────────────────────────────────────────────────────────────
  # Browser/playground smoke — repo-local browser tooling coverage only.
  # Runs full hew-wasm suite (lib + fixture-coverage integration), checks
  # manifest freshness, and builds the browser WASM artifact.
  # ─────────────────────────────────────────────────────────────────────────
  playground-wasm-build:
    name: Playground WASM build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-rust-build
        with:
          targets: wasm32-unknown-unknown
          cache-shared-key: playground-wasm

      - name: Install wasm-pack v0.13.1 and Binaryen 117
        uses: ./.github/actions/setup-wasm-pack

      - name: Check sandbox fixtures are current
        # The committed sandbox fixtures are generated from in-tree sources; a
        # stale fixture makes the parity gate assert against the wrong baseline.
        run: make sandbox-fixtures-check

      - name: Check repo-local playground browser/tooling smoke
        run: make playground-check

  # ─────────────────────────────────────────────────────────────────────────
  # Compiled-Hew artifact — one Linux build for the language-suite consumers
  # ─────────────────────────────────────────────────────────────────────────
  compiled-hew-linux:
    name: Build compiled Hew artifact (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev pkg-config mold zlib1g-dev libzstd-dev

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}

      - uses: ./.github/actions/setup-rust-build
        with:
          cache-shared-key: compiled-hew-linux

      - name: Assert the developer compiler profile
        run: make hew-profile-check

      - name: Build and certify the compiled Hew bundle
        run: |
          make hew-native libhew-debug
          scripts/check-libhew-fresh.sh
          python3 scripts/compiled-hew-artifact.py pack \
            --source-debug-dir target/debug \
            --source-revision "$GITHUB_SHA" \
            --output compiled-hew-linux.tar.gz

      - name: Upload compiled Hew bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: compiled-hew-linux-${{ github.sha }}
          path: compiled-hew-linux.tar.gz
          retention-days: 1
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Compiled-Hew suites — four stable O0/O2 hash partitions
  # ─────────────────────────────────────────────────────────────────────────
  compiled-hew-shards:
    name: Compiled Hew suites (shard ${{ matrix.shard }}/4)
    needs: compiled-hew-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install link prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev pkg-config zlib1g-dev libzstd-dev

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Download compiled Hew bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: compiled-hew-linux-${{ github.sha }}
          path: ${{ runner.temp }}/compiled-hew-download

      - name: Verify compiled Hew bundle
        run: >-
          python3 scripts/compiled-hew-artifact.py unpack
          --input "${{ runner.temp }}/compiled-hew-download/compiled-hew-linux.tar.gz"
          --destination "${{ runner.temp }}/compiled-hew-artifact"
          --expected-revision "$GITHUB_SHA"

      - name: Run O0 and O2 shard
        run: >-
          python3 scripts/compiled-hew-shards.py run
          --compiler "${{ runner.temp }}/compiled-hew-artifact/compiled-hew/debug/hew"
          --partition "hash:${{ matrix.shard }}/4"
          --output-dir target/hew-shards

      - name: Upload shard reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: compiled-hew-shard-${{ matrix.shard }}-${{ github.sha }}
          path: target/hew-shards/
          retention-days: 1
          if-no-files-found: error

  compiled-hew-aggregate:
    name: Aggregate compiled Hew suites
    needs: [compiled-hew-linux, compiled-hew-shards]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
        if: always()

      - name: Download compiled Hew bundle
        if: >-
          always() &&
          needs.compiled-hew-linux.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: compiled-hew-linux-${{ github.sha }}
          path: ${{ runner.temp }}/compiled-hew-download

      - name: Verify compiled Hew bundle
        if: >-
          always() &&
          needs.compiled-hew-linux.result == 'success'
        run: >-
          python3 scripts/compiled-hew-artifact.py unpack
          --input "${{ runner.temp }}/compiled-hew-download/compiled-hew-linux.tar.gz"
          --destination "${{ runner.temp }}/compiled-hew-artifact"
          --expected-revision "$GITHUB_SHA"

      - name: Download every shard report
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: compiled-hew-shard-*-${{ github.sha }}
          path: ${{ runner.temp }}/compiled-hew-reports
          merge-multiple: true

      - name: Report compiled Hew shard failures
        if: always()
        run: >-
          python3 scripts/compiled-hew-shards.py report
          --reports-dir "${{ runner.temp }}/compiled-hew-reports"
          --shard-count 4

      - name: Require every shard to complete
        if: always()
        env:
          BUILD_RESULT: ${{ needs.compiled-hew-linux.result }}
          SHARD_RESULT: ${{ needs.compiled-hew-shards.result }}
        run: |
          set -euo pipefail
          for leg in BUILD_RESULT SHARD_RESULT; do
            result="${!leg}"
            if [ "$result" = success ]; then
              continue
            fi
            echo "::error::$leg is '$result' (expected success)"
            exit 1
          done

      - name: List the independent full suite inventory
        run: |
          for fixture in tests/hew/*.hew; do
            "${{ runner.temp }}/compiled-hew-artifact/compiled-hew/debug/hew" \
              test "$fixture" --list --allow-empty
          done | LC_ALL=C sort > "${{ runner.temp }}/compiled-hew-full.txt"

      # >>> CI-PARITY-STEPS
      - name: Assert shard union and Hew ratchet
        run: >-  # parity-cmd: make test-hew-ratchet
          make test-hew-ratchet
          HEW_SHARD_REPORT_DIR="${{ runner.temp }}/compiled-hew-reports"
          HEW_FULL_INVENTORY="${{ runner.temp }}/compiled-hew-full.txt"
          HEW_SHARD_COUNT=4

      - name: Assert shard union and O2 differential
        run: >-  # parity-cmd: make test-o2-differential
          make test-o2-differential
          HEW_SHARD_REPORT_DIR="${{ runner.temp }}/compiled-hew-reports"
          HEW_FULL_INVENTORY="${{ runner.temp }}/compiled-hew-full.txt"
          HEW_SHARD_COUNT=4
      # <<< CI-PARITY-STEPS

      - name: Upload compiled Hew test reports
        if: always()
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d  # v6.4.1
        with:
          report_paths: "${{ runner.temp }}/compiled-hew-reports/hew-*-shard-*.xml"
          check_name: Compiled Hew Test Results

  # ─────────────────────────────────────────────────────────────────────────
  # Build & test — Rust workspace
  # Produces JUnit XML for GitHub Actions test reporting.
  # ─────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: Linux gates (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    # Four static shards run on every event. scripts/ci-gate-shards.py checks
    # that every participating Make gate appears exactly once in the checked-in
    # assignment before it executes the selected shard.
    #
    # The shard count here and the `/4` denominator below MUST agree — a
    # mismatch would leave a shard's commands unrun behind green checks. The
    # workflow contract test asserts they do.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # The serial job needed 180 min for about 138 min of expected work. The
    # heaviest of the four shards is about 31 min of gate work on top of
    # roughly 15 min of provisioning and warm-up; 90 min leaves generous
    # cold-runner headroom while retaining a finite hung-job limit.
    timeout-minutes: 90
    env:
      # mold is installed by the "Install build tools" step below.
      # Use gcc's -fuse-ld=mold flag (no clang-as-driver dependency) to
      # activate mold for all Rust compilations in this job.  Scoped here
      # rather than .cargo/config.toml so other workflows (release-gate,
      # coverage-nightly, sanitizers) that run on runners without mold are
      # unaffected.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Free runner disk
        # This job installs LLVM 22.1.5 (~1.5 GB), builds the release hew-runtime
        # + hew-lsp binaries, the wasm32-wasip1 runtime, and runs the full debug
        # workspace nextest suite — all on one ubuntu-24.04 runner (~14 GB free).
        # The runner died of ENOSPC twice before this step was added (PR #1994).
        # Code coverage moved to the nightly workflow (c24721fa) so target/llvm-cov-target/
        # no longer accumulates here; the preinstalled-toolchain purge below still
        # recovers the headroom the LLVM download + workspace nextest target/ needs.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb libssl-dev pkg-config mold zlib1g-dev libzstd-dev

      - name: Install MQTT E2E clients
        # mqtt-broker-e2e drives the Hew broker with real MQTT 3.1.1 clients;
        # do not let an absent client turn that behavioural oracle into an
        # implicit local-only target.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto-clients
          command -v mosquitto_pub
          command -v mosquitto_sub

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}

      - uses: ./.github/actions/setup-rust-build
        with:
          targets: 'wasm32-unknown-unknown, wasm32-wasip1'
          tools: nextest@0.9.120
          cache-shared-key: build-test-linux

      - name: Install WASI target
        run: rustup target add wasm32-wasip1

      - name: Install wasmtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WASMTIME_DIR="wasmtime-${WASMTIME_VERSION}-x86_64-linux"
          WASMTIME_ROOT="${RUNNER_TEMP}/wasmtime"
          mkdir -p "${WASMTIME_ROOT}"
          .github/scripts/retry-download.sh \
            gh release download "$WASMTIME_VERSION" --repo bytecodealliance/wasmtime \
            --pattern "${WASMTIME_DIR}.tar.xz" --dir "${RUNNER_TEMP}" --clobber
          tar -xJf "${RUNNER_TEMP}/${WASMTIME_DIR}.tar.xz" -C "${WASMTIME_ROOT}"
          echo "${WASMTIME_ROOT}/${WASMTIME_DIR}" >> "$GITHUB_PATH"
          "${WASMTIME_ROOT}/${WASMTIME_DIR}/wasmtime" --version

      - name: Install wasm-pack v0.13.1 and Binaryen 117
        uses: ./.github/actions/setup-wasm-pack

      - name: Setup Node.js for browser checks
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hew-sandbox-vm/package-lock.json

      - name: Provision pinned ast-grep toolchain
        uses: ./.github/actions/setup-ast-grep

      - name: Build shared Rust test artifact
        run: make stdlib

      - name: Run unconditional gate shard
        env:
          COMPILED_HEW_GATE_OWNER: aggregate
          HEW_O0_OUTCOMES_FILE: ${{ runner.temp }}/hew-o0-outcomes.txt
        run: python3 scripts/ci-gate-shards.py run ${{ matrix.shard }}

      - name: Upload test reports
        if: always()
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d  # v6.4.1
        with:
          report_paths: "target/nextest/ci/junit.xml,target/nextest/ci-cabi/junit.xml"
          check_name: Test Results (Linux shard ${{ matrix.shard }})

  # Keep the established required-check name while allowing the Rust and
  # compiled-Hew suites to execute in parallel.
  #
  # `needs.build-and-test.result` is the AGGREGATE of the four Linux gate
  # shards: GitHub reports `success` only when every matrix leg succeeded, and
  # a cancelled, skipped or failed leg leaves it non-success. That is what lets
  # the shards multiply without touching branch protection — this job's name,
  # "Build & test (Linux)", remains the single required context.
  linux-required:
    name: Build & test (Linux)
    needs: [build-and-test, compiled-hew-aggregate]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every Linux gate
        env:
          RUST_GATES_RESULT: ${{ needs.build-and-test.result }}
          COMPILED_HEW_RESULT: ${{ needs.compiled-hew-aggregate.result }}
        run: |
          set -euo pipefail
          for leg in RUST_GATES_RESULT COMPILED_HEW_RESULT; do
            result="${!leg}"
            if [ "$result" = success ]; then
              continue
            fi
            echo "::error::$leg is '$result' (expected success)"
            exit 1
          done

  # Code coverage moved off the per-PR path: it was the flakiest required check
  # (cargo-llvm-cov instrumentation + the duplicated target/llvm-cov-target/
  # tree on top of LLVM install exited 100 / ENOSPC on sound PRs). The real
  # correctness tests run in "Build & test (Linux)"; coverage now runs nightly
  # in .github/workflows/coverage-nightly.yml (same llvm-cov command + report).

  # ─────────────────────────────────────────────────────────────────────────
  # Build & test — Windows
  # ─────────────────────────────────────────────────────────────────────────
  build-and-test-windows:
    name: Build & test (Windows)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      # aws-lc-sys (rustls under hew-runtime, jsonwebtoken under hew-lib) wants
      # NASM on windows-msvc; the documented escape consumes the crate's
      # pregenerated assembly objects, so the test-time hew-lib bootstrap links
      # without a NASM toolchain. (Parity with release-gate.yml / release.yml.)
      AWS_LC_SYS_PREBUILT_NASM: "1"
      # Cap concurrent rustc invocations on the Windows runner to avoid OOM.
      # hew-codegen-rs/llvm.rs (~33k lines) consumes ~2-3 GB of RSS per rustc
      # process under the LLVM backend; with the default job count equal to the
      # runner's CPU count (4), peak concurrent RSS exceeds the runner's 16 GB
      # and the kernel kills rustc (STATUS_STACK_BUFFER_OVERRUN / 0xc0000409).
      # Two concurrent jobs fit comfortably (2 × 3 GB = 6 GB peak for codegen,
      # leaving headroom for the OS, LLVM headers, and the linker pass).
      # Linux and macOS runners have more headroom at their default parallelism
      # and are unaffected. Revisit when hew-codegen-rs/llvm.rs is split into
      # smaller modules, or when the Windows runner gains more memory.
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Setup MSVC environment
        # lld-link needs the MSVC and UCRT library paths exported by vcvarsall;
        # the LLVM prefix is configured in the following setup-llvm step.
        uses: ./.github/actions/setup-msvc

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}

      - uses: ./.github/actions/setup-rust-build
        with:
          targets: wasm32-wasip1
          tools: nextest@0.9.120
          cache-shared-key: build-test-windows

      - name: Build Rust crates
        # hew-codegen-rs (inkwell -> llvm-sys-221) compiles end-to-end
        # because the upstream LLVM tarball is provisioned above.
        run: cargo build -p hew-pkg -p hew-runtime -p hew-lsp -p hew-cli --release

      - name: Build Hew runtime library for PDB e2e
        run: cargo build -p hew-lib --release

      - name: Build shared Rust test artifact
        run: make stdlib

      - name: Verify Windows CodeView PDB emission
        shell: pwsh
        run: |
          $pdbutil = Get-Command llvm-pdbutil -ErrorAction SilentlyContinue
          if (-not $pdbutil) {
            throw "llvm-pdbutil not found on PATH; the LLVM toolchain must provide the PDB inspection tool"
          }
          & $pdbutil.Source --version
          if ($LASTEXITCODE -ne 0) { throw "llvm-pdbutil --version failed with exit code $LASTEXITCODE" }

          $dir = Join-Path $env:RUNNER_TEMP "hew-pdb-e2e"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $source = Join-Path $dir "pdb-e2e.hew"
          $binary = Join-Path $dir "pdb-e2e.exe"
          @"
          fn main() {
              println(2235)
          }
          "@ | Set-Content -Path $source -Encoding utf8

          & .\target\release\hew.exe build -g $source -o $binary
          if ($LASTEXITCODE -ne 0) { throw "hew build -g failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $binary)) { throw "hew build -g did not produce $binary" }

          $pdb = Join-Path $dir "pdb-e2e.pdb"
          if (-not (Test-Path -LiteralPath $pdb)) { throw "hew build -g did not produce the expected PDB at $pdb" }

          $dump = & $pdbutil.Source dump -summary -modules -symbols -l $pdb 2>&1
          if ($LASTEXITCODE -ne 0) { throw "llvm-pdbutil could not inspect $pdb`n$dump" }
          $dumpText = $dump -join "`n"
          if ($dumpText -notmatch "pdb-e2e\.hew") { throw "PDB dump has no source module record for pdb-e2e.hew`n$dumpText" }
          if ($dumpText -notmatch "(?i)main") { throw "PDB dump has no main symbol`n$dumpText" }
          if ($dumpText -notmatch "(?i)line") { throw "PDB dump has no line information`n$dumpText" }

      - name: Install WASI runner prerequisites
        # Windows had no equivalent of the Linux tarball / macOS brew install,
        # so `wasmtime` was absent here and every WASI-dependent hew-cli test
        # either failed with "`wasmtime` not found" or — via the deleted
        # try_require_wasi_runner — passed having asserted nothing. Provision
        # the runner from the same pinned WASMTIME_VERSION the other two jobs
        # use, and prove it runs inside this step: a broken install must fail
        # the job here, not resurface as "not found" inside a test.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rustup target add wasm32-wasip1
          if ($LASTEXITCODE -ne 0) { throw "rustup target add wasm32-wasip1 failed" }

          $dir = "wasmtime-${env:WASMTIME_VERSION}-x86_64-windows"
          $archive = Join-Path $env:RUNNER_TEMP "$dir.zip"
          $root = Join-Path $env:RUNNER_TEMP "wasmtime"
          gh release download "${env:WASMTIME_VERSION}" --repo bytecodealliance/wasmtime --pattern "$dir.zip" --dir $env:RUNNER_TEMP --clobber
          if ($LASTEXITCODE -ne 0) { throw "downloading $dir.zip from bytecodealliance/wasmtime failed" }

          Expand-Archive -Path $archive -DestinationPath $root -Force
          $wasmtimeBin = Join-Path $root $dir
          $wasmtimeExe = Join-Path $wasmtimeBin "wasmtime.exe"
          if (-not (Test-Path -LiteralPath $wasmtimeExe)) {
            throw "wasmtime.exe not found at $wasmtimeExe after extracting $dir.zip"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $wasmtimeBin

          & $wasmtimeExe --version
          if ($LASTEXITCODE -ne 0) { throw "wasmtime installed but 'wasmtime --version' exited $LASTEXITCODE" }

          # wasm-ld comes from the LLVM install provisioned above; hew's WASM
          # link step shells out to it, so an unreachable wasm-ld is the same
          # class of silent gap as a missing runtime.
          $wasmLd = Get-Command wasm-ld -ErrorAction SilentlyContinue
          if (-not $wasmLd) { throw "wasm-ld not found on PATH (expected from the LLVM ${env:LLVM_VERSION} install)" }
          & $wasmLd.Source --version
          if ($LASTEXITCODE -ne 0) { throw "wasm-ld found at $($wasmLd.Source) but 'wasm-ld --version' exited $LASTEXITCODE" }

      - name: Build hew-runtime for wasm32-wasip1 (debug)
        # Mirrors the macOS job. The WASI tests run as debug binaries and only
        # verify this archive, so it must exist before nextest starts.
        run: cargo build -p hew-runtime --target wasm32-wasip1 --no-default-features

      - name: Build hew-std for wasm32-wasip1 (debug)
        # bootstrap_wasi_runner verifies this archive too.
        run: cargo build -p hew-std --target wasm32-wasip1

      - name: Run full Rust workspace tests
        # Run the full workspace nextest on every event so a native-linking or
        # cross-platform regression is always caught before merge.
        # hew-wasm is excluded on every platform (profile.ci's default-filter
        # does the same) — the browser/tooling WASM surface has its own
        # playground-wasm-build job. hew-cabi has #[no_mangle] symbols that
        # conflict with hew-runtime when both link into a test binary; the
        # C-ABI step below is its coverage.
        # Default features include "full" (encryption + profiler + quic),
        # so all QUIC transport tests run without an explicit flag.
        env:
          HEW_TEST_NO_BUILD: "1"
        run: >-
          cargo nextest run --workspace
          --exclude hew-wasm
          --exclude hew-cabi
          --profile ci
          --no-fail-fast

      - name: Run C-ABI crate tests
        # Standalone because the workspace run above must exclude hew-cabi.
        # The crate is 82 fast tests and is the only place the C-ABI ownership
        # contract is exercised on Windows.
        run: make test-cabi

      - name: Upload test reports
        if: always()
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d  # v6.4.1
        with:
          report_paths: "target/nextest/ci/junit.xml,target/nextest/ci-cabi/junit.xml"
          check_name: Test Results (Windows)

  # ─────────────────────────────────────────────────────────────────────────
  # Build & test — macOS (Apple Silicon)
  # ─────────────────────────────────────────────────────────────────────────
  build-and-test-macos:
    name: Build & test (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-rust-build
        with:
          targets: 'aarch64-apple-darwin, x86_64-apple-darwin, wasm32-wasip1'
          tools: nextest@0.9.120
          cache-shared-key: build-test-macos

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Set macOS deployment target
        run: echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"

      - name: Build release libhew.a (runtime + stdlib)
        run: cargo build -p hew-lib --release

      - name: Build shared Rust test artifact
        run: make stdlib

      - name: Build frontend (release)
        run: cargo build -p hew-cli --release

      - name: Smoke test the release binary
        # Drives a trivial program through `hew compile` with the RELEASE
        # binary. Guards the ABI-mismatch abort class (#1606): a release build
        # that crashes at process exit while every debug test passes, because
        # the two use different C++ runtime linkage.
        run: make test-release-binary

      - name: Install WASI runner prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rustup target add wasm32-wasip1
          WASMTIME_DIR="wasmtime-${WASMTIME_VERSION}-aarch64-macos"
          WASMTIME_ROOT="${RUNNER_TEMP}/wasmtime"
          mkdir -p "${WASMTIME_ROOT}"
          .github/scripts/retry-download.sh \
            gh release download "$WASMTIME_VERSION" --repo bytecodealliance/wasmtime \
            --pattern "${WASMTIME_DIR}.tar.xz" --dir "${RUNNER_TEMP}" --clobber
          tar -xJf "${RUNNER_TEMP}/${WASMTIME_DIR}.tar.xz" -C "${WASMTIME_ROOT}"
          echo "${WASMTIME_ROOT}/${WASMTIME_DIR}" >> "$GITHUB_PATH"
          "${WASMTIME_ROOT}/${WASMTIME_DIR}/wasmtime" --version
          command -v wasm-ld
          wasm-ld --version

      - name: Build hew-runtime for wasm32-wasip1 (release)
        run: cargo build -p hew-runtime --target wasm32-wasip1 --no-default-features --release

      - name: Build hew-runtime for wasm32-wasip1 (debug)
        # The workspace tests run as debug binaries. bootstrap_wasi_runner
        # derives the build profile from the test binary path and verifies that
        # profile's libhew_runtime.a.
        run: cargo build -p hew-runtime --target wasm32-wasip1 --no-default-features

      - name: Build hew-std for wasm32-wasip1 (debug)
        # Pre-build the stdlib WASI archive for the same verify-only contract.
        run: cargo build -p hew-std --target wasm32-wasip1

      - name: Run full Rust workspace tests
        # Run the full workspace nextest on every event so a native-linking or
        # cross-platform regression is always caught before merge.
        # hew-cabi has #[no_mangle] symbols that conflict with hew-runtime
        # when both link into a test binary.
        #
        # Oracle integration binaries are intentionally excluded from ordinary
        # hosted jobs, including release-gate, for runner cost/reliability.
        # The macOS leak-oracle authority is explicit local macOS validation
        # before release; Linux supplies structural/ASan coverage where applicable.
        env:
          HEW_TEST_NO_BUILD: "1"
        run: >-
          cargo nextest run --workspace
          --exclude hew-wasm
          --exclude hew-cabi
          --profile ci
          --no-fail-fast
          -E 'not binary(~oracle)'

      - name: Run C-ABI crate tests
        # Standalone because the workspace run above must exclude hew-cabi.
        # Apple Silicon keeps C-ABI coverage alongside the full workspace run.
        run: make test-cabi

      - name: Upload test reports
        # The Linux and Windows jobs already publish the same two reports
        # as inline PR annotations; this job produces them too but never
        # surfaced them — a macOS-only failure was readable only by
        # scrolling raw step logs.
        if: always()
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d  # v6.4.1
        with:
          report_paths: "target/nextest/ci/junit.xml,target/nextest/ci-cabi/junit.xml"
          check_name: Test Results (macOS)
