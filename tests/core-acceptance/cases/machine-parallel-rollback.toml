[[case]]
id = "machine-parallel-rollback"
intent = "A fault in the last regional entry discards staged regions and owning outputs and preserves the original machine."
source = "cases/machine-parallel-rollback.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 15

[case.expected]
stdout = "rollback:ORIGINAL:0\n"
stderr = "hew: failure: DivideByZero (202)\n"
exit = 1
