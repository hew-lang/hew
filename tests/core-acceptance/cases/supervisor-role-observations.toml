[[case]]
id = "supervisor-role-observations"
intent = "A watcher that monitors or links an occupied supervised role observes that incarnation; a vacant role reports its stable identity with a clean terminal notification."
source = "cases/supervisor-role-observations.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.expected]
stdout = "monitor: Ok(pong)\nmonitored role crashed\nlink: Ok(pong)\nlinked role exited\nreplacement: Ok(pong)\nvacant monitor: Ok(vacant monitor registered)\nvacant link: Ok(vacant role linked)\nvacant role down\nvacant role exit\npool monitor: Ok(pong)\nmonitored role crashed\n"
stderr = "hew: failure: UserPanic (212): backend failed\nhew: actor crash in Backend.fail (actor 1): UserPanic\nhew: failure: UserPanic (212): backend failed\nhew: actor crash in Backend.fail (actor 2): UserPanic\nhew: failure: UserPanic (212): backend failed\nhew: actor crash in Backend.fail (actor 9): UserPanic\n"
exit = 0
