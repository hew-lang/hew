[[case]]
id = "socket-send-deadline"
intent = "A socket sink reports a nonnegative current-item byte count at its write deadline, excluding an earlier try_send item's retained prefix, while the writer and sibling remain usable; a reset peer is SendError.Closed."
source = "cases/socket-send-deadline.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 60

[case.expected]
stdout = "timed out, committed in range: true\nsibling alive: true\nclosed\n"
exit = 0
