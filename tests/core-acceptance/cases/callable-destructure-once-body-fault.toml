[[case]]
id = "callable-destructure-once-body-fault"
intent = "A fault in the body after destructuring a once callable releases heap captures, the uncalled sibling and any retained original field."
source = "cases/callable-destructure-once-body-fault.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.expected]
stdout = "callback entered\n"
stderr = "hew: failure: DivideByZero (202)\n"
exit = 1
