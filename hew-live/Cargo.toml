[package]
name = "hew-live"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Experimental prepared native generations for Hew hosts"
publish = false
readme = "README.md"
repository = "https://github.com/hew-lang/hew"
keywords = ["hew", "embedding", "compiler"]
categories = ["compilers", "api-bindings"]

[dependencies]
clap.workspace = true
hew-cabi = { path = "../hew-cabi" }
hew-observe-protocol = { path = "../hew-observe-protocol" }
libloading = "0.9"
object = "0.40"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { version = "1", optional = true, features = [
  "macros",
  "rt",
  "sync",
  "time",
] }
wasmtime = { version = "=49.0.4", optional = true, default-features = false, features = [
  "async",
  "component-model",
  "component-model-async",
  "cranelift",
  "runtime",
  "std",
] }
wit-bindgen-c = { version = "0.62.0", optional = true }
wit-bindgen-core = { version = "0.62.0", optional = true }
wit-component = { version = "0.260.0", optional = true }
wasmtime-wasi = { version = "=49.0.4", optional = true, default-features = false, features = [
  "p2",
] }
wasi-preview1-component-adapter-provider = { version = "=49.0.4", optional = true }

[features]
component = [
  "dep:tokio",
  "dep:wasmtime",
  "dep:wit-bindgen-c",
  "dep:wit-bindgen-core",
  "dep:wit-component",
  "dep:wasmtime-wasi",
  "dep:wasi-preview1-component-adapter-provider",
]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }

[[example]]
name = "component_bindings"
required-features = ["component"]

[[example]]
name = "live_loop"
required-features = ["component"]

[[bin]]
name = "hew-live-node"
required-features = ["component"]

[lints]
workspace = true
