[[case]]
id = "vec-push-transfer"
intent = "A runtime operation that adopts its operand transfers a fresh temporary and a dead-after local instead of cloning them, so wrapping and pushing 30000 levels stays linear, while a local the caller reads afterwards keeps its own independent value."
source = "cases/vec-push-transfer.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 60

[case.expected]
stdout = "depth=30000 root=1\nkept=2 stored=1\nmap=1 parts=2 name=entry\n"
exit = 0
