[[case]]
id = "wire-callback-actor"
intent = "Nested CBOR, JSON and YAML decoders suspend custom Hash and Eq while rebuilding collections on one actor worker and still reject duplicate semantic keys."
source = "cases/wire-callback-actor.hew"
suites = ["acceptance", "safety"]
