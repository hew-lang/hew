[[case]]
id = "actor-timer-construction-overdue"
intent = "An overdue timer cancels a computing start, cancels pending timers, drains queued payloads through suspending cleanup, and then releases actor state without dispatching unpublished messages."
source = "cases/actor-timer-construction-overdue.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "1"

[case.expected]
stdout = "closed pending\nclosed overdue\nclosed queued\nclosed state\n"
stderr = "hew: failure: ActorTimerOverdue (214)\n"
exit = 1
