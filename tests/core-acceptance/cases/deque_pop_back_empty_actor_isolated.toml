[[case]]
id = "deque_pop_back_empty_actor_isolated"
intent = "A resumed actor turn releases its deque before reporting the checked empty-pop fault."
source = "../vertical-slice/accept/deque_pop_back_empty_actor_isolated.hew"
suites = ["acceptance"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "4"

[case.expected]
stdout = ""
stderr = "hew: failure: IndexOutOfBounds (205)\nhew: actor crash in DequePopBackCrasher.boom (actor 1): IndexOutOfBounds\n"
exit = 1
