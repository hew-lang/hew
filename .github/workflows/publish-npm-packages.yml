# Publish Hew browser/sandbox npm packages to npmjs (primary) and GitHub
# Packages (mirror).
#
# Primary:  https://registry.npmjs.org, npm trusted publishing (GitHub Actions
#           OIDC) with provenance. No npm token exists anywhere. The trusted
#           publisher on each package must name this repo, this workflow file
#           (publish-npm-packages.yml) and the `npm` environment; the registry
#           refuses any other caller. See docs/release-runbook.md.
# Mirror:   https://npm.pkg.github.com  (@hew-lang scope = hew-lang org),
#           authenticated with GITHUB_TOKEN. The two publish jobs are
#           independent: a mirror failure never blocks npmjs, and vice versa.
#
# Trigger: the release workflow dispatches this workflow for the release tag
# once the GitHub Release exists. workflow_dispatch stays available for
# recovery and manual runs. Every run must name the immutable release tag it
# publishes; the workflow checks out and verifies that tag rather than
# trusting the dispatch-page ref. Dispatch from the tag ref so the `npm`
# environment's tag policy admits the run.
#
# Release candidates (any SemVer prerelease) publish on dist-tag `next`; only
# final versions take `latest`. A version already on a registry is skipped.
#
# dry_run defaults to true so accidental runs are safe: it builds, executes
# and packs, and never enters the `npm` environment or publishes.
#
# Packages:
#   @hew-lang/wasm          <- hew-wasm crate
#   @hew-lang/sandbox-vm    <- hew-sandbox-vm TypeScript interpreter

name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Inspect the registry, resolve a consumer, or build/publish a release"
        type: choice
        options: [release, inspect, resolve]
        default: release
      release_tag:
        description: "Immutable release tag to publish (for example v0.6.0-rc1)"
        type: string
      consumer:
        description: "Consumer whose committed dependencies should be resolved"
        type: choice
        options: [sdk, website, playground]
        default: sdk
      source_commit:
        description: "Exact consumer commit for dependency resolution"
        type: string
      dry_run:
        description: "Dry run only (build + execute + pack, skip publish)"
        type: boolean
        default: true

concurrency:
  group: npm-${{ inputs.operation }}-${{ inputs.consumer }}-${{ inputs.release_tag || inputs.source_commit }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inspect:
    if: inputs.operation == 'inspect'
    name: Inspect published package versions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@hew-lang"
      - name: Read registry versions
        run: node scripts/resolve-browser-dependencies.mjs inspect
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HEW_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
          HEW_DEPENDENCY_ARTIFACT_DIR: ${{ runner.temp }}/browser-packages
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-package-versions
          path: ${{ runner.temp }}/browser-packages
          if-no-files-found: error

  resolve:
    if: inputs.operation == 'resolve'
    name: Resolve and validate consumer dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Select immutable consumer source
        id: source
        env:
          CONSUMER: ${{ inputs.consumer }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_COMMIT}" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::source_commit must be a full commit SHA"; exit 1; }
          case "${CONSUMER}" in
            sdk) repository=hew-lang/playground-sandbox ;;
            website) repository=hew-lang/hew.sh ;;
            playground) repository=hew-lang/hew.run ;;
            *) exit 1 ;;
          esac
          echo "repository=${repository}" >> "${GITHUB_OUTPUT}"
      - name: Checkout release tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: release-machinery
      - name: Checkout consumer
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ inputs.source_commit }}
          path: consumer
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@hew-lang"
      - name: Resolve authentic registry lockfile and archives
        working-directory: consumer
        run: node ../release-machinery/scripts/resolve-browser-dependencies.mjs resolve
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HEW_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
          HEW_CONSUMER_REPOSITORY: ${{ steps.source.outputs.repository }}
          HEW_CONSUMER_COMMIT: ${{ inputs.source_commit }}
          HEW_DEPENDENCY_ARTIFACT_DIR: ${{ runner.temp }}/browser-packages
      - name: Validate installed consumer
        working-directory: consumer
        env:
          CONSUMER: ${{ inputs.consumer }}
        run: |
          set -euo pipefail
          case "${CONSUMER}" in
            sdk) npm run test:sdk ;;
            website) npm run test -- --run ;;
            playground) npm run check && npm run build ;;
          esac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-dependencies-${{ inputs.consumer }}-${{ inputs.source_commit }}
          path: ${{ runner.temp }}/browser-packages
          if-no-files-found: error

  build:
    if: inputs.operation == 'release'
    name: Build and pack
    outputs:
      dist_tag: ${{ steps.identity.outputs.dist_tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Checkout release machinery
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          path: release-machinery

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: stable

      - name: Add wasm32-unknown-unknown target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
          key: publish-npm-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: publish-npm-${{ runner.os }}-

      - name: Install wasm-pack v0.13.1 and Binaryen 117
        uses: ./release-machinery/.github/actions/setup-wasm-pack

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Verify immutable release identity and package versions
        id: identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release_tag must be a SemVer tag beginning with v (got ${RELEASE_TAG})"
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "::error::release_tag ${RELEASE_TAG} is not an immutable repository tag"
            exit 1
          fi
          TAG_COMMIT=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [ "${TAG_COMMIT}" != "${HEAD_COMMIT}" ]; then
            echo "::error::checked-out commit ${HEAD_COMMIT} does not match ${RELEASE_TAG} (${TAG_COMMIT})"
            exit 1
          fi
          EXPECTED_VERSION="${RELEASE_TAG#v}"
          WORKSPACE_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          SANDBOX_VM_VERSION=$(node -p "require('./hew-sandbox-vm/package.json').version")
          if [ "${WORKSPACE_VERSION}" != "${EXPECTED_VERSION}" ]; then
            echo "::error::Cargo.toml version ${WORKSPACE_VERSION} does not match ${RELEASE_TAG}"
            exit 1
          fi
          if [ "${SANDBOX_VM_VERSION}" != "${EXPECTED_VERSION}" ]; then
            echo "::error::hew-sandbox-vm version ${SANDBOX_VM_VERSION} does not match ${RELEASE_TAG}"
            exit 1
          fi
          if [[ "${EXPECTED_VERSION}" == *-* ]]; then
            NPM_DIST_TAG=next
          else
            NPM_DIST_TAG=latest
          fi
          echo "dist_tag=${NPM_DIST_TAG}" >> "${GITHUB_OUTPUT}"
          echo "Publishing ${RELEASE_TAG} on npm dist-tag ${NPM_DIST_TAG}"

      - name: Build and execute all npm packages
        run: make -C release-machinery npm-packages
        env:
          HEW_SOURCE_ROOT: ${{ github.workspace }}
          # Release profile in CI — wasm-opt enabled per Cargo.toml metadata.
          NPM_WASM_PROFILE: release

      - name: Verify packaged source revision
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          for (const name of ['wasm', 'sandbox-vm']) {
            const pkg = JSON.parse(readFileSync(`target/npm/@hew-lang/${name}/package.json`, 'utf8'));
            assert.deepEqual(pkg.hewSource, { commit, tag: process.env.RELEASE_TAG, dirty: false });
          }
          JS

      - name: Dry-run pack (verify staging)
        run: |
          for pkg in wasm sandbox-vm; do
            echo "=== @hew-lang/${pkg} ==="
            npm pack --dry-run "target/npm/@hew-lang/${pkg}"
            echo ""
          done

      - name: Upload staged packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: target/npm/@hew-lang
          if-no-files-found: error

  publish-npmjs:
    needs: build
    if: ${{ !inputs.dry_run }}
    name: Publish to npmjs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    steps:
      - name: Download staged packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: packages

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require an npm that supports trusted publishing
        run: |
          set -euo pipefail
          have=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$have" | sort -V | head -n 1)" != 11.5.1 ]; then
            echo "::error::npm $have is older than 11.5.1 and cannot use trusted publishing"
            exit 1
          fi

      - name: Publish packages
        shell: bash
        env:
          REGISTRY: https://registry.npmjs.org
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: |
          set -uo pipefail
          status=0
          for pkg in wasm sandbox-vm; do
            name="@hew-lang/${pkg}"
            dir="packages/${pkg}"
            version="$(node -p "require('./${dir}/package.json').version")"
            if [ -n "$(npm view "${name}@${version}" version --registry "${REGISTRY}" 2>/dev/null)" ]; then
              echo "::notice::${name}@${version} already on ${REGISTRY} — skipping"
              continue
            fi
            if ! npm publish "${dir}" --ignore-scripts --access public --provenance --tag "${DIST_TAG}" --registry "${REGISTRY}"; then
              echo "::error::publishing ${name}@${version} to ${REGISTRY} failed"
              status=1
            fi
          done
          exit "${status}"

  publish-github-packages:
    needs: build
    if: ${{ !inputs.dry_run }}
    name: Mirror to GitHub Packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download staged packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: packages

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@hew-lang"
          package-manager-cache: false

      - name: Publish packages
        shell: bash
        env:
          REGISTRY: https://npm.pkg.github.com
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          status=0
          for pkg in wasm sandbox-vm; do
            name="@hew-lang/${pkg}"
            dir="packages/${pkg}"
            version="$(node -p "require('./${dir}/package.json').version")"
            if [ -n "$(npm view "${name}@${version}" version --registry "${REGISTRY}" 2>/dev/null)" ]; then
              echo "::notice::${name}@${version} already on ${REGISTRY} — skipping"
              continue
            fi
            if ! npm publish "${dir}" --ignore-scripts --access public --tag "${DIST_TAG}" --registry "${REGISTRY}"; then
              echo "::error::publishing ${name}@${version} to ${REGISTRY} failed"
              status=1
            fi
          done
          exit "${status}"
