[[case]]
id = "actor-stopped-after-crash"
intent = "`stopped` on a crashed actor reports a secondary state-close fault to its caller while preserving the original crash's failing exit status and later Dead result."
source = "cases/actor-stopped-after-crash.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 20

[case.expected]
stdout = "Err(Trapped: the handler faulted before replying)\nafter crash-only stopped\nErr(Trapped: the handler faulted before replying)\ncaught close fault\nafter cleanup stopped\nErr(Dead: the destination actor is gone and will not come back)\n"
stderr = "hew: failure: UserPanic (212): bad frame\nhew: actor crash in Reader.feed (actor 1): UserPanic\nhew: failure: UserPanic (212): bad frame\nhew: actor crash in ClosingReader.feed (actor 2): UserPanic\nhew: secondary failure: UserPanic (212): reader state close failed\n"
exit = 1
