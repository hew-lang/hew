[[case]]
id = "race-unobserved-result-cleanup"
intent = "FIFO notifications let both tasks complete before their handles enter a race; the earliest completion wins and the unobserved owned result is released exactly once."
source = "cases/race-unobserved-result-cleanup.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30
env = { HEW_DETERMINISTIC = "schedule=fifo", HEW_ACTOR_LEAK_CHECK = "1" }

[case.expected]
stdout = "fast done\nslow done\nclosed slow\npicked fast\nclosed fast\n"
stderr = ""
exit = 0
