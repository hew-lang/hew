[package]
name = "hew-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Hew programming language compiler"
readme = "README.md"
repository = "https://github.com/hew-lang/hew"
keywords = ["hew", "compiler", "programming-language"]
categories = ["compilers", "command-line-utilities"]

[lib]
name = "hew_cli"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "hew"
path = "src/main.rs"

[features]
# In-process entry points for the cargo-fuzz targets in `fuzz/`.
fuzzing = []

[dependencies]
hew-runtime = { path = "../hew-runtime", default-features = false, features = [
  "quic",
] }
hew-cabi = { path = "../hew-cabi" }
hew-lsp = { path = "../hew-lsp" }
hew-observe = { path = "../hew-observe" }
hew-analysis = { path = "../hew-analysis" }
hew-codec = { path = "../hew-codec" }
hew-compile = { path = "../hew-compile" }
hew-wasm = { path = "../hew-wasm" }
hew-hir = { path = "../hew-hir" }
hew-live = { path = "../hew-live" }
hew-sir = { path = "../hew-sir" }
hew-lexer = { path = "../hew-lexer" }
hew-mir = { path = "../hew-mir" }
hew-codegen-rs = { path = "../hew-codegen-rs" }
hew-parser = { path = "../hew-parser" }
hew-types = { path = "../hew-types" }
hew-pkg = { path = "../hew-pkg" }
clap.workspace = true
clap_complete.workspace = true
pulldown-cmark = "0.13.5"
rustyline = "18"
tempfile.workspace = true
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
notify = "8"
dirs.workspace = true
wasmparser = "0.259.0"
object = "0.40"
proptest = { version = "1", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }

[dev-dependencies]
url = "2"
filetime = "0.2"
hew-testutil = { path = "../hew-testutil" }
finl_unicode = { version = "=1.5.0", default-features = false, features = [
  "categories",
] }

[build-dependencies]
hew-compile = { path = "../hew-compile" }
hew-hir = { path = "../hew-hir" }
hew-mir = { path = "../hew-mir" }
hew-types = { path = "../hew-types" }
hew-codegen-rs = { path = "../hew-codegen-rs" }
cc = "1"

[lints]
workspace = true
