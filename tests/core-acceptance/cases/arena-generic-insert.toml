[[case]]
id = "arena-generic-insert"
intent = "`Arena<T>::insert` is a generic direct callee that takes ownership of its value: a `#[resource]` carrier inserted into the arena is closed exactly once, by the arena's own cleanup at scope end, in insertion order."
