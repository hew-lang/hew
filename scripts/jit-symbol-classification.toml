  "hew_actor_await_send_by_id",
  "hew_actor_cooperate",
  "hew_actor_detach_await_send_by_id",
  # SYSTEM-LANE PROVENANCE BOUNDARY (this entry and `hew_actor_monitor`).
  # Installing a link or a monitor on an ALREADY-TERMINAL peer synthesizes the
  # `Exit` / `Down` the contract owes on the spot, straight onto a system
  # queue (`link.rs` send_exit_signal, `monitor.rs` deliver_down_message).
  # The reason comes from the runtime's own death record, but the DESTINATION
  # is the first argument — so while the raw 2-arg symbols were `stable`, a
  # program holding a terminal handle and any live handle could put an EXIT or
  # a DOWN on a third party's system queue at a moment of its choosing.
