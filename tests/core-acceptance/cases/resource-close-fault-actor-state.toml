[[case]]
id = "resource-close-fault-actor-state"
intent = "An actor's terminal sequence releases every owned state field in reverse declaration order even when a close fails partway through, with the first failure primary and the later one secondary."
source = "cases/resource-close-fault-actor-state.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.expected]
stdout = "close 2\nclose 1\n"
stderr = "hew: failure: UserPanic (212): close 2 failed\nhew: secondary failure: UserPanic (212): close 1 failed\n"
exit = 1
