[[case]]
id = "actor-restarted-role-cancel"
intent = "Cancelling a role restart observer parked on a declared backoff releases its wake target and supervisor pin before shutdown."
source = "cases/actor-restarted-role-cancel.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 20
env = { HEW_WORKERS = "1", HEW_DETERMINISTIC = "" }

[case.expected]
stdout = "waiting\nreleased\n"
exit = 0
