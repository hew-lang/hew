[[case]]
id = "result_unwrap_err_aborts"
intent = "`expect` on an `Err` reports Hew's own typed UserPanic and the process exits 1 under the one exit rule."
source = "../vertical-slice/accept/result_unwrap_err_aborts.hew"
suites = ["acceptance"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "4"

[case.expected]
stdout = ""
stderr = "hew: failure: UserPanic (212): expect failed: r is present\n"
exit = 1
