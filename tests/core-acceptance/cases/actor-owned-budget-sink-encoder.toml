[[case]]
id = "actor-owned-budget-sink-encoder"
intent = "Framed sinks retain typed fields once across aliases and refund them after final cleanup."
source = "cases/actor-owned-budget-sink-encoder.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "2"

[case.expected]
stdout = "encoder ready\nencoder limit\n"
stderr = "hew: failure: HeapExceeded (200)\nhew: actor crash in Small.ready (actor 2): HeapExceeded\n"
exit = 1
