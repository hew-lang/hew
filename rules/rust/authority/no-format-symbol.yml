id: no-format-symbol
language: rust
severity: error
message: >-
  A `Symbol` or semantic map key is minted from a `format!`-built string
  instead of the resolver's interned/minted identity.
note: >-
  Resolved type-fact services, HIR expression consumers and lower IRs consume checker
  identities. Source scopes, declaration registration, diagnostics and external
  ABI spelling tables remain lexical inputs outside this boundary.
files:
  - "hew-sir/src/**"
  - "hew-mir/src/**"
  - "hew-types/src/type_facts.rs"
  - "hew-types/src/value_class.rs"
  - "hew-types/src/traits.rs"
  - "hew-hir/src/lower/types.rs"
  - "hew-hir/src/lower/expr.rs"
  - "hew-hir/src/lower/identifiers.rs"
  - "hew-hir/src/lower/private_refs.rs"
  - "hew-hir/src/lower/calls.rs"
  - "hew-hir/src/lower/collections.rs"
ignores:
  - "**/tests/**"
  - "**/test/**"
  - "**/*_test.rs"
  - "**/*_tests.rs"
  - "**/tests.rs"
rule:
  all:
    - kind: call_expression
      regex: '^(Symbol::intern\(&?format!|\w*(map|table|registry|cache|index|defs|scope)\w*\.(get|contains_key|insert|entry|remove)\(&?format!)'
    - not:
        inside:
          kind: function_item
          stopBy: end
          has:
            field: name
            regex: "^machine_event_spelling$"
    - not:
        inside:
          kind: mod_item
          stopBy: end
          follows:
            kind: attribute_item
            regex: 'cfg\(.*\btest\b'
