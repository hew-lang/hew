[[case]]
id = "actor-interceptor-fault"
intent = "Faults before and after proceed release the owned request or reply, report Trapped and restart the child with fresh state."
source = "cases/actor-interceptor-fault.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "1"

[case.expected]
stdout = "0\n1\ninterceptor faults restart the child\n"
stderr = "hew: failure: UserPanic (212): before interceptor\nhew: actor crash in Worker.before (actor 1): UserPanic\nhew: failure: UserPanic (212): after interceptor\nhew: actor crash in Worker.after (actor 3): UserPanic\n"
exit = 0
