[[case]]
id = "aggregate-cleanup-vec-fault"
intent = "A bounds fault unwinds the live vec resource owner exactly once."
source = "cases/aggregate-cleanup-vec-fault.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.expected]
stdout = "before trap\nclose 1\n"
stderr = "hew: failure: IndexOutOfBounds (205): vector index 3 out of bounds for length 0\n"
exit = 1
