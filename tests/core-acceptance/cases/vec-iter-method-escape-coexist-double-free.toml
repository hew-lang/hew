[[case]]
id = "vec-iter-method-escape-coexist-double-free"
intent = "`Vec<T>::iter()` cursor drop-safety oracles: the `iter()` cursor must own an INDEPENDENT snapshot of its backing buffer, so it can coexist with — or outlive — the source vec without a double-free or use-after-free. Shape `coexist_double_free` (iter coexist no double free under malloc scribble) runs to its exact outcome with no leak, double free or use after free under ASan/LSan."
source = "cases/vec-iter-method-escape-coexist-double-free.hew"
