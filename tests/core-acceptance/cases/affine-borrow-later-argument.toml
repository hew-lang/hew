stdout = "read FRESH 5\nclose FRESH\nlater ROOT\nread ROOT 4\nlater ROOT\nread ROOT 4\nforward ROOT\nafter ROOT\nlater FIELD\nread FIELD 5\nafter FIELD\nclose FIELD\nclose ROOT\n"
stderr = ""
exit = 0
