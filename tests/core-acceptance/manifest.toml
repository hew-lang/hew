# Each case is a supported native program with an exact observable outcome.
# The runner executes every selected case at both optimization levels; matching
# failures are failures, not a differential pass.

[[case]]
id = "machine-wildcard-hooks"
intent = "Wildcard targets always execute exit, body and entry for both same-tag and changed-tag results."
source = "cases/machine-wildcard-hooks.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 15

[case.expected]
stdout = "exit:closed\nbody\nenter:closed\nClosed\nexit:closed\nbody\nenter:opened\nOpened\n"
exit = 0

