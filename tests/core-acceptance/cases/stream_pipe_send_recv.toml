[[case]]
id = "stream_pipe_send_recv"
intent = "Typed byte stream pipe — ordinary send/recv + close."
source = "cases/stream_pipe_send_recv.hew"
suites = ["acceptance"]
kind = "run"
timeout_seconds = 60
# The retired checked-mir harness ran every fixture with the actor-box
# balance check armed; keep it here so a leaked actor lands as exit 93.
env = { HEW_ACTOR_LEAK_CHECK = "1" }

[case.expected]
stdout = "x0\nx1\n"
exit = 0
