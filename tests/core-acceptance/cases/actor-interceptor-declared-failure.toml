[[case]]
id = "actor-interceptor-declared-failure"
intent = "Outcome.failed identifies a declared handler failure while leaving an ordinary Result-valued reply unchanged."
source = "cases/actor-interceptor-declared-failure.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "1"

[case.expected]
stdout = "declared failures remain distinct\n"
exit = 0
