# Release — the single path from a `v*` tag to everything Hew ships.
#
# One DAG, built once and published many times:
#
#   validate ─► build (portable WASI libs, cross libs, Linux, macOS, Windows,
#   │            FreeBSD x86_64/aarch64, npm packages)
#   │         ─► package and prove (Linux distro packages, Docker image with
#   │            its clean-room test, docs site)
#   └────────► release-assets (required set + checksums)
#                ─► github-release (draft, upload, provenance, publish)
#                     ─► publish-npm, publish-github-packages, publish-ghcr,
#                        publish-homebrew, publish-docs   [environment release]
#
# Every publish job consumes the artefacts built earlier in the same run and
# skips a destination that already holds this version, so "Re-run failed
# jobs" is the recovery path. The GitHub Release goes out on the signed tag;
# every external destination waits on the one `release` environment, so a
# single approval releases them all.
#
# Triggers:
#   push v* tag         build and publish.
#   push release/**     dry run: build and prove everything, publish nothing.
#   workflow_dispatch   dry run by default. With dry_run=false it publishes
#                       only when dispatched from a v* tag ref (re-running a
#                       tag); from a branch it refuses.
#
# Publishing requires all of: a tag ref, a tag that points at the run's
# commit and matches every committed version identity, and an environment
# whose deployment policy admits only v* tags.
#
# npm trusted publishing names THIS file (release.yml) and environment `release`
# for @hew-lang/wasm and @hew-lang/sandbox-vm; publish-npm must stay in this
# file. The GitHub Packages mirror authenticates with GITHUB_TOKEN.
#
# Secrets: APPLE_CERTIFICATE_P12, APPLE_CERTIFICATE_PASSWORD, APPLE_API_KEY_P8,
# APPLE_API_KEY_ID, APPLE_API_ISSUER_ID (macOS signing and notarization; a tag
# run fails without them), HOMEBREW_TAP_TOKEN (actions:write on
# hew-lang/homebrew-hew), CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# (docs.hew.sh).
# docs/release-runbook.md describes the environments and approvals.

name: Release

on:
  push:
    tags: ["v*"]
    branches: ["release/**", "release-*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and prove only. Publishing also requires dispatching from a v* tag."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  LLVM_VERSION: "22"
  LLVM_FULL_VERSION: "22.1.5"

jobs:
  validate:
    name: Validate release identity and dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
      npm_dist_tag: ${{ steps.identity.outputs.npm_dist_tag }}
      publish: ${{ steps.identity.outputs.publish }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Resolve release identity and publish decision
        id: identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "${REF_TYPE}" == tag ]]; then
            tag="$(scripts/release-identity.sh "${REF_NAME}")"
            tag_commit="$(git rev-parse "refs/tags/${REF_NAME}^{commit}")"
            if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
              echo "::error::tag ${REF_NAME} points at ${tag_commit}, not the run's commit ${GITHUB_SHA}"
              exit 1
            fi
            if [[ "${EVENT_NAME}" == push || "${DRY_RUN}" == false ]]; then
              publish=true
            else
              publish=false
            fi
          else
            if [[ "${DRY_RUN}" == false ]]; then
              echo "::error::publishing requires dispatching this workflow from a v* tag, not ${REF_NAME}"
              exit 1
            fi
            # Release branches must be complete; any other branch is a
            # machinery dry run and may lack its release notes.
            if [[ "${REF_NAME}" == release/* || "${REF_NAME}" == release-* ]]; then
              tag="$(scripts/release-identity.sh)"
            else
              tag="$(RELEASE_NOTES_OPTIONAL=1 scripts/release-identity.sh)"
            fi
            publish=false
          fi
          version="${tag#v}"
          if [[ "${version}" == *-* ]]; then
            prerelease=true
            npm_dist_tag=next
          else
            prerelease=false
            npm_dist_tag=latest
          fi
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "npm_dist_tag=${npm_dist_tag}"
            echo "publish=${publish}"
          } >> "${GITHUB_OUTPUT}"
          echo "Release ${tag} (prerelease=${prerelease}, publish=${publish})" >> "${GITHUB_STEP_SUMMARY}"

      - uses: ./.github/actions/setup-release-checks

      - name: Validate release dependencies, notices and installer
        run: make release-checks

  # WASI libraries are platform-independent. Build them once and place the
  # same proved artifacts in every published toolchain archive.
  build-portable-release-libs:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: rust-toolchain
        name: Read repository Rust toolchain
        run: |
          channel=$(awk -F'"' '/^[[:space:]]*channel[[:space:]]*=/ { print $2; exit }' rust-toolchain.toml)
          test -n "${channel}"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
      - name: Install Rust WASI target
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: wasm32-wasip1
      - name: Build and stage portable libraries
        run: make stage-portable-release-libs
      - name: Upload portable libraries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-release-libs
          path: build/portable-release-libs/
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Cross-built release libraries — proved by their target-native consumers
  # ─────────────────────────────────────────────────────────────────────────
  build-cross-release-libs:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: x86_64-unknown-freebsd
            builder: zig
            archive: libhew.a
            build_std: false
          - rust_target: x86_64-pc-windows-msvc
            builder: xwin
            archive: hew.lib
            build_std: false
          - rust_target: aarch64-unknown-freebsd
            builder: zig
            archive: libhew.a
            build_std: true
            zig_target: aarch64-freebsd

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install archive inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm

      - name: Install Rust target
        if: ${{ !matrix.build_std }}
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.rust_target }}

      - name: Install Rust sources
        if: matrix.build_std
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: "1.96.0"
          components: rust-src

      - name: Install Zig
        if: matrix.builder == 'zig'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild
        if: matrix.builder == 'zig'
        run: cargo install cargo-zigbuild --locked --version 0.22.3

      - name: Install cargo-xwin
        if: matrix.builder == 'xwin'
        run: cargo install cargo-xwin --locked --version 0.23.0

      - name: Build FreeBSD release library
        if: matrix.builder == 'zig' && !matrix.build_std
        run: cargo zigbuild -p hew-lib --profile release-lib --target ${{ matrix.rust_target }}

      - name: Build FreeBSD release library with standard library
        if: matrix.build_std
        env:
          RUSTC_BOOTSTRAP: "1"
        run: cargo zigbuild -Zbuild-std=std,panic_abort -p hew-lib --profile release-lib --target ${{ matrix.rust_target }}

      - name: Build aarch64 FreeBSD release consumer
        if: matrix.build_std
        env:
          CARGO_TARGET_DIR: cross-release-consumer-target
          RUSTC_BOOTSTRAP: "1"
        run: >-
          cargo zigbuild -Zbuild-std=std,panic_abort
          --manifest-path scripts/fixtures/release-lib-link/Cargo.toml
          --release --target ${{ matrix.rust_target }}

      - name: Build Windows release library
        if: matrix.builder == 'xwin'
        env:
          AWS_LC_SYS_PREBUILT_NASM: "1"
        run: cargo xwin build -p hew-lib --profile release-lib --target ${{ matrix.rust_target }}

      - name: Record FreeBSD ABI baseline
        if: matrix.build_std
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'int main(void) { return 0; }' > freebsd-abi-probe.c
          zig cc -target "${{ matrix.zig_target }}" freebsd-abi-probe.c -o freebsd-abi-probe
          abi=$(file freebsd-abi-probe)
          echo "${abi}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "${abi}" | grep -q 'for FreeBSD 14.0 (1400500)'

      - name: Verify and stage cross-built archive
        shell: bash
        run: |
          set -euo pipefail
          archive="target/${{ matrix.rust_target }}/release-lib/${{ matrix.archive }}"
          scripts/verify-cross-release-lib.sh "${{ matrix.rust_target }}" "${archive}"

          destination="cross-release-libs/${{ matrix.rust_target }}"
          mkdir -p "${destination}"
          cp "${archive}" "${destination}/${{ matrix.archive }}"

          if [[ "${{ matrix.build_std }}" == "true" ]]; then
            cp "cross-release-consumer-target/${{ matrix.rust_target }}/release/libhew_release_link_probe.a" \
              "${destination}/libhew_release_link_probe.a"
          fi

      - name: Upload cross-built archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libhew-${{ matrix.rust_target }}
          path: cross-release-libs/${{ matrix.rust_target }}/
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Build — macOS and Windows release artifacts
  # ─────────────────────────────────────────────────────────────────────────
  build:
    needs: [validate, build-cross-release-libs, build-portable-release-libs]
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-aarch64
            os: macos-15
            rust_target: aarch64-apple-darwin
          - target: darwin-x86_64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
          - target: windows-x86_64
            os: windows-2022
            rust_target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    # Windows release artifacts are part of the published v0.4.0 asset set.
    # Timeouts, cancellations, or build failures must block the release.
    # Windows consumes a pre-built toolchain artifact; no source LLVM build here.
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download cross-built release library (Windows)
        if: startsWith(matrix.target, 'windows')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libhew-${{ matrix.rust_target }}
          path: cross-release-libs/${{ matrix.rust_target }}

      - name: Download portable release libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portable-release-libs
          path: portable-release-libs

      # ── LLVM toolchain installation ─────────────────────────────────────

      - name: Install LLVM (macOS)
        if: startsWith(matrix.target, 'darwin')
        run: |
          brew install llvm@${{ env.LLVM_VERSION }} ninja zstd
          # Expose the brew LLVM prefix and binaries for later steps
          LLVM_PREFIX="$(brew --prefix llvm@${{ env.LLVM_VERSION }})"
          echo "LLVM_PREFIX=${LLVM_PREFIX}" >> "$GITHUB_ENV"
          echo "${LLVM_PREFIX}/bin" >> "$GITHUB_PATH"

      - name: Configure LLVM toolchain (macOS)
        if: startsWith(matrix.target, 'darwin')
        run: |
          {
            echo "CC=${LLVM_PREFIX}/bin/clang"
            echo "CXX=${LLVM_PREFIX}/bin/clang++"
            echo "MACOSX_DEPLOYMENT_TARGET=13.0"
          } >> "$GITHUB_ENV"
          # The brew llvm bottle links libz3.dylib into its static libraries'
          # dependency set; hew never calls z3 (clang static-analyzer only).
          # dead_strip_dylibs drops load commands with no referenced symbols,
          # keeping the shipped binaries on system dylibs only (the
          # verify-macos-binary.sh gate enforces this).
          echo "RUSTFLAGS=-C link-arg=-Wl,-dead_strip_dylibs" >> "$GITHUB_ENV"

      - name: Use prebuilt aws-lc assembly (Windows)
        if: startsWith(matrix.target, 'windows')
        # aws-lc-sys wants NASM on windows-msvc; the documented CI escape uses
        # the crate's pregenerated assembly objects — no toolchain dependency.
        shell: bash
        run: echo "AWS_LC_SYS_PREBUILT_NASM=1" >> "$GITHUB_ENV"

      - name: Install build tools (Windows)
        if: startsWith(matrix.target, 'windows')
        run: choco install ninja cmake -y
        shell: pwsh

      - name: Setup MSVC environment (Windows)
        if: startsWith(matrix.target, 'windows')
        uses: ./.github/actions/setup-msvc

      - name: Download Hew LLVM toolchain (Windows)
        if: startsWith(matrix.target, 'windows')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $toolchainRepo = "hew-lang/llvm-toolchain"
          $toolchainTag  = "llvm-22.1.0-windows-msvc-v1"
          $asset         = "hew-llvm-22.1.0-windows-msvc-v1.tar.gz"

          # Fail fast if the toolchain release is not published yet.
          # Run prebuild-llvm.yml in hew-lang/llvm-toolchain to publish it
          # before retrying the release.
          $info = gh release view $toolchainTag `
            --repo $toolchainRepo --json assets 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Toolchain release $toolchainTag not found in $toolchainRepo. Dispatch prebuild-llvm.yml there to publish it first."
            exit 1
          }
          $names = ($info | ConvertFrom-Json).assets.name
          $required = @($asset, "$asset.sha256")
          $missing = $required | Where-Object { $names -notcontains $_ }
          if ($missing) {
            Write-Host "::error::Missing asset(s) from toolchain release ${toolchainTag}: $($missing -join ', '). Dispatch prebuild-llvm.yml in $toolchainRepo to publish them first."
            exit 1
          }

          gh release download $toolchainTag `
            --repo $toolchainRepo `
            --pattern $asset `
            --pattern "$asset.sha256" `
            --dir .

          # Verify SHA-256 checksum before extraction.
          $expected = ((Get-Content "$asset.sha256") -split '\s+')[0].ToLower()
          $actual   = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) {
            Write-Host "::error::SHA-256 mismatch for ${asset}: expected $expected, got $actual"
            exit 1
          }
          Write-Host "Checksum verified: $actual"

      - name: Verify toolchain provenance (Windows)
        if: startsWith(matrix.target, 'windows')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $toolchainRepo = "hew-lang/llvm-toolchain"
          $asset         = "hew-llvm-22.1.0-windows-msvc-v1.tar.gz"
          gh attestation verify $asset --repo $toolchainRepo
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Provenance attestation verification failed for $asset"
            exit 1
          }
          Write-Host "Provenance verified for $asset"

      - name: Extract and validate LLVM toolchain (Windows)
        if: startsWith(matrix.target, 'windows')
        shell: pwsh
        run: |
          $asset = "hew-llvm-22.1.0-windows-msvc-v1.tar.gz"
          # Archive root is llvm-22/; extracting to C:\ gives C:\llvm-22.
          tar -xzf $asset -C C:\
          Remove-Item -Force $asset, "$asset.sha256"

          $required = @(
            "C:\llvm-22\bin\clang.exe",
            "C:\llvm-22\lib\cmake\llvm\LLVMConfig.cmake"
          )
          foreach ($path in $required) {
            if (!(Test-Path $path)) {
              Write-Host "::error::Required LLVM path missing after extraction: $path"
              exit 1
            }
          }

          $linker = @(
            "C:\llvm-22\bin\lld-link.exe",
            "C:\llvm-22\bin\lld.exe",
            "C:\llvm-22\bin\ld.lld.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$linker) {
            Write-Host "::error::No LLVM linker tool (lld-link.exe / lld.exe / ld.lld.exe) found under C:\llvm-22\bin"
            exit 1
          }
          Write-Host "LLVM toolchain ready at C:\llvm-22. Linker: $linker"

      - name: Configure LLVM toolchain (Windows)
        if: startsWith(matrix.target, 'windows')
        run: |
          echo "LLVM_PREFIX=C:\llvm-22" >> $env:GITHUB_ENV
          echo "C:\llvm-22\bin" >> $env:GITHUB_PATH
          echo "CC=cl" >> $env:GITHUB_ENV
          echo "CXX=cl" >> $env:GITHUB_ENV
        shell: pwsh

      # ── Rust toolchain ──────────────────────────────────────────────────

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust artifacts (Darwin)
        if: startsWith(matrix.target, 'darwin')
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: release-${{ matrix.target }}-cargo-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-${{ matrix.target }}-cargo-${{ matrix.os }}-

      - name: Cache Rust artifacts
        if: ${{ !startsWith(matrix.target, 'darwin') }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: release-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-${{ matrix.target }}-cargo-

      # ── Rust builds ─────────────────────────────────────────────────────

      - name: Build hew, hew-lsp, and hew-observe
        run: cargo build -p hew-cli -p hew-lsp -p hew-observe --release --target ${{ matrix.rust_target }}

      - name: Build libhew.a (runtime + stdlib)
        if: startsWith(matrix.target, 'darwin')
        # The shipped archive builds under the non-LTO release-lib profile:
        # external Rust staticlibs (--link-lib packages) cannot dedupe their
        # verbatim libstd members against a fat-LTO archive.
        run: cargo build -p hew-lib --profile release-lib --target ${{ matrix.rust_target }}

      - name: Prove release library consumer linking (Unix)
        if: "!startsWith(matrix.target, 'windows')"
        run: |
          scripts/test-release-lib-link.sh \
            --hew "target/${{ matrix.rust_target }}/release/hew" \
            --archive "target/${{ matrix.rust_target }}/release-lib/libhew.a"

      - name: Prove release library consumer linking (Windows)
        if: startsWith(matrix.target, 'windows')
        shell: pwsh
        run: |
          ./scripts/test-release-lib-link.ps1 `
            -Hew "target/${{ matrix.rust_target }}/release/hew.exe" `
            -Archive "cross-release-libs/${{ matrix.rust_target }}/hew.lib"

      - name: Smoke test hew-lsp and hew-observe (Unix)
        if: "!startsWith(matrix.target, 'windows')"
        run: |
          ./target/${{ matrix.rust_target }}/release/hew-lsp --version
          ./target/${{ matrix.rust_target }}/release/hew-observe --version

      - name: Smoke test hew-lsp and hew-observe (Windows)
        if: startsWith(matrix.target, 'windows')
        run: |
          ./target/${{ matrix.rust_target }}/release/hew-lsp.exe --version
          ./target/${{ matrix.rust_target }}/release/hew-observe.exe --version

      # ── Package archive ─────────────────────────────────────────────────

      - name: Stage release package (Unix)
        if: "!startsWith(matrix.target, 'windows')"
        run: |
          VERSION="${RELEASE_TAG#v}"
          ARCHIVE_NAME="hew-v${VERSION}-${{ matrix.target }}"

          sh scripts/stage-release-package.sh \
            --source-dir "$PWD" \
            --bin-dir "target/${{ matrix.rust_target }}/release" \
            --native-lib "target/${{ matrix.rust_target }}/release-lib/libhew.a" \
            --native-triple "${{ matrix.rust_target }}" \
            --native-lib-name "libhew.a" \
            --wasi-lib-dir "portable-release-libs/wasm32-wasip1" \
            --destination "${ARCHIVE_NAME}" \
            --completion-shells "bash zsh fish"

          # macOS release binaries embed static LLVM support and rely on
          # Mach-O weak/coalesced definitions that `strip` can break. Keep the
          # packaged binaries unstripped so the published archive matches the
          # already-validated release build.
          echo "Skipping strip on macOS release binaries."

          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Verify macOS binaries have no non-system dynamic dependencies
        if: startsWith(matrix.target, 'darwin')
        run: |
          for bin in "${ARCHIVE_NAME}"/bin/*; do
            scripts/verify-macos-binary.sh "${bin}"
          done

      - name: Smoke test packaged hew before macOS signing
        if: startsWith(matrix.target, 'darwin')
        run: |
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "${smoke_root}"' EXIT

          cat > "${smoke_root}/pkg-presign-smoke.hew" <<'HEWEOF'
          fn main() {
              println("pkg-presign-smoke-ok")
          }
          HEWEOF

          output=$("${ARCHIVE_NAME}/bin/hew" run "${smoke_root}/pkg-presign-smoke.hew")
          echo "${output}"
          echo "${output}" | grep -q "pkg-presign-smoke-ok"

      - name: Stage release package (Windows)
        if: startsWith(matrix.target, 'windows')
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          ARCHIVE_NAME="hew-v${VERSION}-${{ matrix.target }}"

          # GitHub's Windows Bash is Git Bash, so this uses the same POSIX
          # staging implementation as Unix while executing native .exe tools.
          sh scripts/stage-release-package.sh \
            --source-dir "$PWD" \
            --bin-dir "target/${{ matrix.rust_target }}/release" \
            --bin-suffix ".exe" \
            --native-lib "cross-release-libs/${{ matrix.rust_target }}/hew.lib" \
            --native-triple "${{ matrix.rust_target }}" \
            --native-lib-name "hew.lib" \
            --wasi-lib-dir "portable-release-libs/wasm32-wasip1" \
            --destination "${ARCHIVE_NAME}" \
            --completion-shells "bash zsh fish powershell"

          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      # ── macOS code signing & notarization ───────────────────────────────

      - name: Validate macOS signing secrets (tag releases)
        if: startsWith(matrix.target, 'darwin') && github.ref_type == 'tag'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          missing=0
          for secret_name in \
            APPLE_CERTIFICATE_P12 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_API_KEY_P8 \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER_ID; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::${secret_name} secret is required for macOS tag releases"
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Code sign binaries (macOS)
        if: startsWith(matrix.target, 'darwin') && env.APPLE_CERTIFICATE_P12 != ''
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Import signing certificate into a temporary keychain
          echo "${APPLE_CERTIFICATE_P12}" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "" build.keychain

          # Find the Developer ID Application identity from the imported cert
          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
            | grep "Developer ID Application" \
            | head -1 \
            | sed 's/.*"\(.*\)".*/\1/')

          if [ -z "${IDENTITY}" ]; then
            echo "::error::No Developer ID Application certificate found in keychain"
            exit 1
          fi
          echo "Signing with identity: ${IDENTITY}"

          # Sign each binary with hardened runtime and secure timestamp
          for bin in hew hew-lsp hew-observe; do
            codesign --force --options runtime --timestamp \
              --sign "${IDENTITY}" "${ARCHIVE_NAME}/bin/${bin}"
          done

          # Verify signatures
          for bin in hew hew-lsp hew-observe; do
            codesign --verify --verbose "${ARCHIVE_NAME}/bin/${bin}"
          done

          rm -f certificate.p12

      - name: Notarize archive (macOS)
        if: startsWith(matrix.target, 'darwin') && env.APPLE_CERTIFICATE_P12 != '' && env.APPLE_CERTIFICATE_PASSWORD != '' && env.APPLE_API_KEY_P8 != '' && env.APPLE_API_KEY_ID != '' && env.APPLE_API_ISSUER_ID != ''
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          # Write the API key (base64-encoded in secret) to disk
          KEY_PATH="${HOME}/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          mkdir -p "${HOME}/private_keys"
          echo "${APPLE_API_KEY_P8}" | base64 --decode > "${KEY_PATH}"

          ditto -c -k --keepParent "${ARCHIVE_NAME}" "${ARCHIVE_NAME}-notarize.zip"
          xcrun notarytool submit "${ARCHIVE_NAME}-notarize.zip" \
            --key "${KEY_PATH}" \
            --key-id "${APPLE_API_KEY_ID}" \
            --issuer "${APPLE_API_ISSUER_ID}" \
            --wait
          rm -f "${ARCHIVE_NAME}-notarize.zip"
          rm -rf "${HOME}/private_keys"

      # ── Create final archive ────────────────────────────────────────────

      - name: Create tar.gz (Unix)
        if: "!startsWith(matrix.target, 'windows')"
        run: tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"

      - name: Smoke test packaged archive (Unix)
        if: "!startsWith(matrix.target, 'windows')"
        run: |
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "${smoke_root}"' EXIT

          cat > "${smoke_root}/pkg-smoke.hew" <<'HEWEOF'
          fn main() {
              println("pkg-smoke-ok")
          }
          HEWEOF

          staging="${smoke_root}/staging"
          mkdir -p "${staging}"
          tar -xf "${ARCHIVE_NAME}.tar.gz" -C "${staging}" --strip-components=1

          output=$("${staging}/bin/hew" run "${smoke_root}/pkg-smoke.hew")
          echo "${output}"
          echo "${output}" | grep -q "pkg-smoke-ok"

      - name: Create zip (Windows)
        if: startsWith(matrix.target, 'windows')
        run: Compress-Archive -Path "${env:ARCHIVE_NAME}" -DestinationPath "${env:ARCHIVE_NAME}.zip"
        shell: pwsh

      - name: Smoke test packaged archive (Windows)
        if: startsWith(matrix.target, 'windows')
        run: |
          $SmokeRoot = Join-Path $PWD "pkg-smoke"
          Remove-Item -Recurse -Force $SmokeRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $SmokeRoot | Out-Null

          $SmokeFile = Join-Path $SmokeRoot "pkg-smoke.hew"
          Set-Content -Path $SmokeFile -Encoding utf8NoBOM -Value @'
          fn main() {
              println("pkg-smoke-ok")
          }
          '@

          Expand-Archive -Path "${env:ARCHIVE_NAME}.zip" -DestinationPath $SmokeRoot -Force
          $Staging = Join-Path $SmokeRoot "${env:ARCHIVE_NAME}"

          $Output = & (Join-Path $Staging "bin/hew.exe") run $SmokeFile | Out-String
          $Output = $Output.Trim()
          Write-Host $Output
          if ($Output -notmatch "pkg-smoke-ok") {
            throw "Packaged archive smoke output did not contain pkg-smoke-ok"
          }
        shell: pwsh

      # ── Upload artifact ─────────────────────────────────────────────────

      - name: Upload artifact (Unix)
        if: "!startsWith(matrix.target, 'windows')"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}.tar.gz

      - name: Upload artifact (Windows)
        if: startsWith(matrix.target, 'windows')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}.zip

  # ─────────────────────────────────────────────────────────────────────────
  # Linux build — glibc baseline artifacts built inside Ubuntu 22.04
  # ─────────────────────────────────────────────────────────────────────────
  build-linux:
    needs: [validate, build-portable-release-libs]
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - target: linux-aarch64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    container: ubuntu:22.04
    timeout-minutes: 180

    steps:
      - name: Install baseline build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git gnupg lsb-release \
            ninja-build pkg-config wget xz-utils \
            libssl-dev zlib1g-dev libzstd-dev libffi-dev libxml2-dev

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download portable release libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portable-release-libs
          path: portable-release-libs

      - name: Trust the workspace checkout
        # The container user differs from the checkout owner; without this
        # the hew-cli build script cannot read git metadata and the shipped
        # binary reports `unknown` for its commit hash.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install LLVM ${{ env.LLVM_FULL_VERSION }}
        # Official upstream tarball via the pinned setup-llvm action — the
        # same toolchain the release gate proved. The apt.llvm.org packages
        # do not ship libPolly.a, which llvm-sys links statically. The
        # official binaries run on the ubuntu:22.04 (glibc 2.35) build
        # container, preserving the 22.04+ artifact baseline.
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_FULL_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: release-${{ matrix.target }}-jammy-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-${{ matrix.target }}-jammy-cargo-

      - name: Build hew, hew-lsp, and hew-observe
        run: cargo build -p hew-cli -p hew-lsp -p hew-observe --release --target ${{ matrix.rust_target }}

      - name: Build libhew.a (runtime + stdlib)
        # Non-LTO release-lib profile: the shipped archive must keep verbatim
        # libstd members so external Rust staticlibs (--link-lib) can dedupe.
        run: cargo build -p hew-lib --profile release-lib --target ${{ matrix.rust_target }}

      - name: Prove release library consumer linking
        run: |
          scripts/test-release-lib-link.sh \
            --hew "target/${{ matrix.rust_target }}/release/hew" \
            --archive "target/${{ matrix.rust_target }}/release-lib/libhew.a"

      - name: Verify Linux binaries
        run: |
          ldd --version 2>&1 | sed -n "1p"
          "target/${{ matrix.rust_target }}/release/hew" --version
          "target/${{ matrix.rust_target }}/release/hew-lsp" --version
          "target/${{ matrix.rust_target }}/release/hew-observe" --version
          test -f "target/${{ matrix.rust_target }}/release-lib/libhew.a"

          if ldd "target/${{ matrix.rust_target }}/release/hew" | grep -Eqi 'llvm|mlir'; then
            echo "::error::Linux release binary dynamically links LLVM-family libraries"
            exit 1
          fi

      - name: Stage release package
        run: |
          VERSION="${RELEASE_TAG#v}"
          ARCHIVE_NAME="hew-v${VERSION}-${{ matrix.target }}"

          sh scripts/stage-release-package.sh \
            --source-dir "$PWD" \
            --bin-dir "target/${{ matrix.rust_target }}/release" \
            --native-lib "target/${{ matrix.rust_target }}/release-lib/libhew.a" \
            --native-triple "${{ matrix.rust_target }}" \
            --native-lib-name "libhew.a" \
            --wasi-lib-dir "portable-release-libs/wasm32-wasip1" \
            --destination "${ARCHIVE_NAME}" \
            --completion-shells "bash zsh fish"

          for b in hew hew-lsp hew-observe; do
            strip "${ARCHIVE_NAME}/bin/${b}"
          done

          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Create tar.gz
        run: tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"

      - name: Smoke test packaged archive
        run: |
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "${smoke_root}"' EXIT

          cat > "${smoke_root}/pkg-smoke.hew" <<'HEWEOF'
          fn main() {
              println("pkg-smoke-ok")
          }
          HEWEOF

          staging="${smoke_root}/staging"
          mkdir -p "${staging}"
          tar -xf "${ARCHIVE_NAME}.tar.gz" -C "${staging}" --strip-components=1

          output=$(env -i PATH=/usr/bin:/bin HOME="${HOME}" "${staging}/bin/hew" run "${smoke_root}/pkg-smoke.hew")
          echo "${output}"
          echo "${output}" | grep -q "pkg-smoke-ok"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}.tar.gz

  # ─────────────────────────────────────────────────────────────────────────
  # FreeBSD build — x86_64 via QEMU VM (tier-1, required release gate)
  # ─────────────────────────────────────────────────────────────────────────
  build-freebsd:
    needs: [validate, build-cross-release-libs, build-portable-release-libs]
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Compute archive name
        id: archive
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "name=hew-v${VERSION}-freebsd-x86_64" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download cross-built release library
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libhew-x86_64-unknown-freebsd
          path: cross-release-libs/x86_64-unknown-freebsd

      - name: Download portable release libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portable-release-libs
          path: portable-release-libs

      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "15.1"
          mem: 8192
          prepare: |
            mkdir -p /usr/local/etc/pkg/repos
            printf 'FreeBSD: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest", mirror_type: "srv", enabled: yes }\n' \
              > /usr/local/etc/pkg/repos/FreeBSD.conf
            # Bootstrap pkg through the base utility before reading package catalogues.
            # Without this, pkg self-upgrades mid-install and the new binary cannot
            # read the catalogue the old one wrote, so every package reports missing.
            /usr/sbin/pkg bootstrap -fy -r FreeBSD
            pkg update -f -r FreeBSD
            pkg install -y -r FreeBSD llvm22 rustup-init cmake ninja git bash pkgconf libffi libxml2

          run: |
            set -eux
            command -v bash && bash --version

            # The VM user differs from the synced checkout owner; without
            # this the build script cannot read git metadata and the shipped
            # binaries report `unknown` for their commit hash.
            git config --global --add safe.directory "$(pwd)"

            # Build with the repository-pinned Rust release instead of the
            # moving version published by the FreeBSD package repository.
            /usr/local/bin/rustup-init -y --no-modify-path --profile minimal \
              --default-toolchain 1.96.0
            export PATH="$HOME/.cargo/bin:$PATH"
            rustup run 1.96.0 rustc --version | grep -q '^rustc 1\.96\.0 '

            # ── LLVM ───────────────────────────────────────────────────────
            # LLVM 22 comes from pkg on FreeBSD 15.1 (latest branch).
            export LLVM_SYS_221_PREFIX=/usr/local/llvm22
            /usr/local/llvm22/bin/llvm-config --version

            # ── Rust builds (release) ──────────────────────────────────────
            cargo build -p hew-cli -p hew-lsp -p hew-observe --release
            bash scripts/test-release-lib-link.sh \
              --hew target/release/hew \
              --archive cross-release-libs/x86_64-unknown-freebsd/libhew.a

            # ── Package archive ────────────────────────────────────────────
            ARCHIVE_NAME="${{ steps.archive.outputs.name }}"

            sh scripts/stage-release-package.sh \
              --source-dir "$PWD" \
              --bin-dir "target/release" \
              --native-lib "cross-release-libs/x86_64-unknown-freebsd/libhew.a" \
              --native-triple "x86_64-unknown-freebsd" \
              --native-lib-name "libhew.a" \
              --wasi-lib-dir "portable-release-libs/wasm32-wasip1" \
              --destination "${ARCHIVE_NAME}" \
              --completion-shells "bash zsh fish"

            # Staging proves every binary exists; strip failures remain fatal.
            for b in hew hew-lsp hew-observe; do
              strip "${ARCHIVE_NAME}/bin/${b}"
            done

            tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"

            echo "==> Package-layout smoke test"
            smoke_root=$(mktemp -d)
            trap 'rm -rf "${smoke_root}"' EXIT

            cat > "${smoke_root}/pkg-smoke.hew" <<'HEWEOF'
            fn main() {
                println("pkg-smoke-ok")
            }
            HEWEOF

            mkdir -p "${smoke_root}/staging"
            tar -xf "${ARCHIVE_NAME}.tar.gz" -C "${smoke_root}/staging" --strip-components=1

            for tool in hew hew-lsp hew-observe; do
              "${smoke_root}/staging/bin/${tool}" --version
            done

            output=$("${smoke_root}/staging/bin/hew" run "${smoke_root}/pkg-smoke.hew")
            echo "${output}"
            echo "${output}" | grep -q "pkg-smoke-ok"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.archive.outputs.name }}
          path: ${{ steps.archive.outputs.name }}.tar.gz

  # ─────────────────────────────────────────────────────────────────────────
  # FreeBSD build — aarch64 via QEMU VM (tier-1, required release gate)
  # Runs inside a FreeBSD 15.1 aarch64 VM under QEMU emulation on a standard
  # x86_64 runner (vmactions/freebsd-vm with arch: aarch64). Emulation is slow
  # but needs no new host infra. The native aarch64 build is not reproducible
  # locally; CI is the proving gate for this toolchain asset.
  # ─────────────────────────────────────────────────────────────────────────
  # ─────────────────────────────────────────────────────────────────────────
  # npm packages — @hew-lang/wasm (hew-wasm) and @hew-lang/sandbox-vm, built,
  # executed and packed once; the publish jobs upload these exact tarballs.
  # ─────────────────────────────────────────────────────────────────────────
  build-npm-packages:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # build-npm-packages.mjs stamps the exact tag it finds on HEAD.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
          key: release-npm-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: release-npm-${{ runner.os }}-

      - name: Install wasm-pack v0.13.1 and Binaryen 117
        uses: ./.github/actions/setup-wasm-pack

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Build and execute both npm packages
        run: make npm-packages
        env:
          NPM_WASM_PROFILE: release

      - name: Verify packaged source revision
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          for (const name of ['wasm', 'sandbox-vm']) {
            const pkg = JSON.parse(readFileSync(`target/npm/@hew-lang/${name}/package.json`, 'utf8'));
            assert.equal(pkg.version, process.env.RELEASE_TAG.slice(1));
            assert.equal(pkg.hewSource.commit, process.env.GITHUB_SHA);
            assert.equal(pkg.hewSource.dirty, false);
            if (process.env.REF_TYPE === 'tag') assert.equal(pkg.hewSource.tag, process.env.RELEASE_TAG);
          }
          JS

      - name: Pack tarballs
        run: |
          mkdir -p dist/npm
          for pkg in wasm sandbox-vm; do
            npm pack "target/npm/@hew-lang/${pkg}" --pack-destination dist/npm
          done
          ls -l dist/npm

      - name: Check the tarballs publish
        run: |
          for pkg in wasm sandbox-vm; do
            npm publish "./dist/npm/hew-lang-${pkg}-${RELEASE_TAG#v}.tgz" --dry-run --ignore-scripts --access public --tag next
          done

      - name: Upload npm tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: dist/npm/*.tgz
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Linux packages — .deb, .rpm, .pkg.tar.zst from the glibc tarballs.
  # rpm Version and Arch pkgver forbid hyphens, so prerelease tags carry no
  # distro packages; the job still succeeds so the DAG keeps plain needs.
  # ─────────────────────────────────────────────────────────────────────────
  linux-packages:
    needs: [validate, build-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
            target: linux-x86_64
            # The Arch Linux Docker image only supports x86_64.
            formats: debian,rpm,arch
          - arch: aarch64
            os: ubuntu-24.04-arm
            target: linux-aarch64
            formats: debian,rpm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}
      FINAL: ${{ needs.validate.outputs.prerelease == 'false' }}

    steps:
      - name: Prerelease carries no distro packages
        if: env.FINAL != 'true'
        run: echo "::notice::${RELEASE_TAG} is a prerelease; distro packages ship with final releases"

      - name: Checkout code
        if: env.FINAL == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download Linux tarball
        if: env.FINAL == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hew-${{ needs.validate.outputs.tag }}-${{ matrix.target }}
          path: dist/

      - name: Build Linux packages
        if: env.FINAL == 'true'
        run: |
          installers/build-packages.sh \
            --version "${VERSION}" \
            --arch "${{ matrix.arch }}" \
            --skip-build \
            --only "${{ matrix.formats }}"

      - name: Smoke test Linux packages in Docker
        if: env.FINAL == 'true'
        run: |
          installers/docker/test-all-packages.sh \
            --version "${VERSION}" \
            --arch "${{ matrix.arch }}" \
            --skip-build \
            --only "${{ matrix.formats }}"

      - name: Upload Linux packages
        if: env.FINAL == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst

  # ─────────────────────────────────────────────────────────────────────────
  # Docker image — assembled from the Linux release tarball, proved by the
  # clean-room installation test in a pristine Ubuntu 24.04 container, then
  # exported as the OCI archive that publish-ghcr pushes unchanged.
  # ─────────────────────────────────────────────────────────────────────────
  docker-image:
    needs: [validate, build-linux]
    name: Docker image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            arch: amd64
            os: ubuntu-24.04
          - target: linux-aarch64
            arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download Linux release archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hew-${{ needs.validate.outputs.tag }}-${{ matrix.target }}
          path: artifacts

      - name: Extract release archive
        run: |
          mkdir -p dist/tarball
          tar -xzf "artifacts/hew-v${VERSION}-${{ matrix.target }}.tar.gz" -C dist/tarball --strip-components=1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Clean-room installation test
        run: |
          docker buildx build -f installers/docker/Dockerfile.release \
            --target clean-room-test \
            --build-context tarball=dist/tarball \
            --load -t hew-clean-room-test .
          docker run --rm hew-clean-room-test

      - name: Build and smoke-test the runtime image
        run: |
          build_args=(-f installers/docker/Dockerfile.release --target runtime
            --build-context tarball=dist/tarball
            --build-arg "VERSION=${VERSION}" --build-arg "REVISION=${GITHUB_SHA}"
            --provenance=false)
          docker buildx build "${build_args[@]}" --load -t hew-runtime .
          docker run --rm hew-runtime version | tee version.txt
          grep -q "${VERSION}" version.txt
          docker buildx build "${build_args[@]}" \
            --output "type=oci,dest=${RUNNER_TEMP}/hew-image-${{ matrix.arch }}.tar" .

      - name: Upload image archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/hew-image-${{ matrix.arch }}.tar
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Docs site — language and standard-library reference for docs.hew.sh,
  # generated by the packaged Linux compiler.
  # ─────────────────────────────────────────────────────────────────────────
  build-docs:
    needs: [validate, build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download Linux release archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hew-${{ needs.validate.outputs.tag }}-linux-x86_64
          path: artifacts

      - name: Generate language and standard-library docs
        run: |
          mkdir -p dist/hew
          tar -xzf "artifacts/hew-v${VERSION}-linux-x86_64.tar.gz" -C dist/hew --strip-components=1
          dist/hew/bin/hew doc std/ docs/language/ --output-dir dist/docs/

      - name: Validate generated docs
        run: |
          source_modules="$(find std -type f -name '*.hew' | wc -l | tr -d ' ')"
          generated_modules="$(find dist/docs -maxdepth 1 -type f -name 'std.*.html' | wc -l | tr -d ' ')"
          if [ "$source_modules" -eq 0 ] || [ "$generated_modules" -ne "$source_modules" ]; then
            echo "::error::Expected $source_modules generated module pages, found $generated_modules"
            exit 1
          fi
          if [ ! -s dist/docs/index.html ]; then
            echo "::error::Generated documentation index is missing or empty"
            exit 1
          fi
          for page in language.actors.html language.supervision.html language.machines.html language.concurrency.html language.resources.html 404.html; do
            if [ ! -s "dist/docs/$page" ]; then
              echo "::error::Generated documentation page is missing: $page"
              exit 1
            fi
          done
          empty_file="$(find dist/docs -type f -empty -print -quit)"
          if [ -n "$empty_file" ]; then
            echo "::error::Generated documentation contains an empty file: $empty_file"
            exit 1
          fi

      - name: Upload docs site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: dist/docs/
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Release assets — the complete, checksummed set every later job consumes.
  # Runs on dry runs too, so a missing asset fails before any tag is pushed.
  # ─────────────────────────────────────────────────────────────────────────
  release-assets:
    needs:
      [
        validate,
        build-portable-release-libs,
        build,
        build-linux,
        build-freebsd,
        build-npm-packages,
        linux-packages,
        docker-image,
        build-docs,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      FINAL: ${{ needs.validate.outputs.prerelease == 'false' }}
    steps:
      - name: Download platform archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "hew-v*"
          path: dist
          merge-multiple: true

      - name: Download Linux packages
        if: env.FINAL == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "linux-packages-*"
          path: dist
          merge-multiple: true

      - name: Download npm tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: dist

      - name: Download portable WASI libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portable-release-libs
          path: portable-release-libs

      - name: Assemble and checksum the release set
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "dist/hew-v${VERSION}-wasm32-wasip1-libs.tar.gz" -C portable-release-libs wasm32-wasip1
          cd dist
          required=(
            "hew-v${VERSION}-darwin-aarch64.tar.gz"
            "hew-v${VERSION}-darwin-x86_64.tar.gz"
            "hew-v${VERSION}-windows-x86_64.zip"
            "hew-v${VERSION}-linux-x86_64.tar.gz"
            "hew-v${VERSION}-linux-aarch64.tar.gz"
            "hew-v${VERSION}-freebsd-x86_64.tar.gz"
            "hew-v${VERSION}-wasm32-wasip1-libs.tar.gz"
            "hew-lang-wasm-${VERSION}.tgz"
            "hew-lang-sandbox-vm-${VERSION}.tgz"
          )
          for asset in "${required[@]}"; do
            if [ ! -s "${asset}" ]; then
              echo "::error::Missing required release asset: ${asset}"
              exit 1
            fi
          done
          if [[ "${FINAL}" == true ]]; then
            shopt -s nullglob
            packages=(hew_*.deb hew-*.rpm hew-bin-*.pkg.tar.zst)
            if [ "${#packages[@]}" -eq 0 ]; then
              echo "::error::Final release has no Linux package artifacts"
              exit 1
            fi
          fi
          sha256sum -- * | tee "../hew-v${VERSION}-checksums.txt"
          mv "../hew-v${VERSION}-checksums.txt" .
          ls -l

      - name: Upload release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # GitHub Release — draft, upload the release set, attest it, then publish.
  # A published release is never modified; a draft left by an interrupted run
  # is completed.
  # ─────────────────────────────────────────────────────────────────────────
  github-release:
    needs: [validate, release-assets]
    if: needs.validate.outputs.publish == 'true' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create and publish the release
      id-token: write # sign provenance attestations
      attestations: write # store provenance attestations
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout release notes
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          sparse-checkout: docs/releases

      - name: Download release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/hew-v${{ needs.validate.outputs.version }}-checksums.txt

      - name: Create or complete the release
        shell: bash
        run: |
          set -euo pipefail
          state="$(gh api "repos/${GH_REPO}/releases?per_page=100" \
            --jq "map(select(.tag_name == \"${RELEASE_TAG}\")) | if length == 0 then \"absent\" elif any(.draft | not) then \"published\" else \"draft\" end")"
          echo "Release ${RELEASE_TAG}: ${state}"
          case "${state}" in
            published)
              echo "::notice::${RELEASE_TAG} is already published; leaving it unchanged"
              exit 0
              ;;
            absent)
              prerelease_flag=()
              [[ "${PRERELEASE}" == true ]] && prerelease_flag=(--prerelease)
              gh release create "${RELEASE_TAG}" --verify-tag --draft \
                --title "${RELEASE_TAG}" --notes-file "docs/releases/${RELEASE_TAG}.md" \
                "${prerelease_flag[@]}" dist/*
              ;;
            draft)
              gh release upload "${RELEASE_TAG}" dist/* --clobber
              ;;
          esac
          if [[ "${PRERELEASE}" == true ]]; then
            gh release edit "${RELEASE_TAG}" --draft=false --prerelease
          else
            gh release edit "${RELEASE_TAG}" --draft=false --latest
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # npm — @hew-lang/wasm and @hew-lang/sandbox-vm. npmjs is the primary
  # registry (OIDC trusted publishing with provenance, bound to release.yml and
  # environment `release`); GitHub Packages is an independent mirror. Prereleases
  # take dist-tag `next`, finals `latest`. A version already present is skipped.
  # ─────────────────────────────────────────────────────────────────────────
  publish-npm:
    needs: [validate, github-release]
    if: needs.validate.outputs.publish == 'true' && github.ref_type == 'tag'
    name: Publish to npmjs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      DIST_TAG: ${{ needs.validate.outputs.npm_dist_tag }}
    steps:
      - name: Download npm tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: packages

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require an npm that supports trusted publishing
        run: |
          set -euo pipefail
          have=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$have" | sort -V | head -n 1)" != 11.5.1 ]; then
            echo "::error::npm $have is older than 11.5.1 and cannot use trusted publishing"
            exit 1
          fi

      - name: Publish packages
        shell: bash
        env:
          REGISTRY: https://registry.npmjs.org
        run: |
          set -uo pipefail
          status=0
          for pkg in wasm sandbox-vm; do
            name="@hew-lang/${pkg}"
            if [ -n "$(npm view "${name}@${VERSION}" version --registry "${REGISTRY}" 2>/dev/null)" ]; then
              echo "::notice::${name}@${VERSION} already on ${REGISTRY}; skipping"
              continue
            fi
            if ! npm publish "./packages/hew-lang-${pkg}-${VERSION}.tgz" --ignore-scripts --access public \
              --provenance --tag "${DIST_TAG}" --registry "${REGISTRY}"; then
              echo "::error::publishing ${name}@${VERSION} to ${REGISTRY} failed"
              status=1
            fi
          done
          exit "${status}"

  publish-github-packages:
    needs: [validate, github-release]
    if: needs.validate.outputs.publish == 'true' && github.ref_type == 'tag'
    name: Mirror npm packages to GitHub Packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      DIST_TAG: ${{ needs.validate.outputs.npm_dist_tag }}
    steps:
      - name: Download npm tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: packages

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@hew-lang"
          package-manager-cache: false

      - name: Publish packages
        shell: bash
        env:
          REGISTRY: https://npm.pkg.github.com
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          status=0
          for pkg in wasm sandbox-vm; do
            name="@hew-lang/${pkg}"
            if [ -n "$(npm view "${name}@${VERSION}" version --registry "${REGISTRY}" 2>/dev/null)" ]; then
              echo "::notice::${name}@${VERSION} already on ${REGISTRY}; skipping"
              continue
            fi
            if ! npm publish "./packages/hew-lang-${pkg}-${VERSION}.tgz" --ignore-scripts --access public \
              --tag "${DIST_TAG}" --registry "${REGISTRY}"; then
              echo "::error::publishing ${name}@${VERSION} to ${REGISTRY} failed"
              status=1
            fi
          done
          exit "${status}"

  # ─────────────────────────────────────────────────────────────────────────
  # GHCR — push the clean-room-proved image archives unchanged, join them in
  # one multi-arch tag (plus `latest` for final releases) and attest it.
  # ─────────────────────────────────────────────────────────────────────────
  publish-ghcr:
    needs: [validate, github-release]
    if: needs.validate.outputs.publish == 'true' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: write # push the image
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
    env:
      IMAGE: ghcr.io/hew-lang/hew
      VERSION: ${{ needs.validate.outputs.version }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Skip a version already published
        id: existing
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "::notice::${IMAGE}:${VERSION} already exists; skipping"
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Download image archives
        if: steps.existing.outputs.exists == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docker-image-*
          path: images
          merge-multiple: true

      - name: Push images and the multi-arch tag
        id: push
        if: steps.existing.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          sources=()
          for arch in amd64 arm64; do
            # skopeo reads the docker login above and keeps the archive's
            # digests, so GHCR serves the bytes the clean-room test proved.
            skopeo copy --preserve-digests \
              "oci-archive:images/hew-image-${arch}.tar" "docker://${IMAGE}:${VERSION}-${arch}"
            sources+=("${IMAGE}:${VERSION}-${arch}")
          done
          tags=(--tag "${IMAGE}:${VERSION}")
          # A prerelease is installable by its exact tag but never moves latest.
          [[ "${PRERELEASE}" == false ]] && tags+=(--tag "${IMAGE}:latest")
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -er .digest)"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Attest image provenance
        if: steps.existing.outputs.exists == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ─────────────────────────────────────────────────────────────────────────
  # Homebrew — hew-lang/homebrew-hew's update-formula.yml downloads the
  # published archives. Formula/hew.rb tracks every release (prereleases
  # included); Formula/hew@stable.rb tracks final releases only.
  # ─────────────────────────────────────────────────────────────────────────
  publish-homebrew:
    needs: [validate, github-release]
    if: needs.validate.outputs.publish == 'true' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    steps:
      - name: Dispatch the homebrew-hew formula update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set"
            exit 1
          fi
          gh workflow run update-formula.yml -R hew-lang/homebrew-hew -f version="${VERSION}"

  # ─────────────────────────────────────────────────────────────────────────
  # docs.hew.sh — deploy the site generated by build-docs to Cloudflare Pages.
  # ─────────────────────────────────────────────────────────────────────────
  publish-docs:
    needs: [validate, github-release]
    if: needs.validate.outputs.publish == 'true' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    steps:
      - name: Download docs site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-site
          path: site

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.147.0 pages deploy site/ --project-name hew-docs
