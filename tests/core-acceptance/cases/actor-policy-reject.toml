[[case]]
id = "actor-policy-reject"
intent = "A `policy(target, on_full: .Reject)` view completes like a bare-handle call but refuses a full mailbox with `Rejected(SendError.Full)` instead of parking, and the same call succeeds once the queue drains; `.Wait` matches the bare handle. The refusal reason and the accepted submission's `Delivery` are interpolated, so both carry a reachable `Display`."
source = "cases/actor-policy-reject.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.expected]
stdout = "submitted: accepted\nrejected: the destination mailbox is full\n2\n2\nclosed\n"
exit = 0
