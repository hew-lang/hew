# Diagnostic branch only: no push triggers or publication.
name: FreeBSD SDK memory diagnosis
"on":
  workflow_dispatch:
    inputs:
      guest_memory_mib:
        description: Guest memory (baseline first; larger only after measured evidence)
        required: true
        type: choice
        default: "8192"
        options:
          - "8192"
          - "12288"
permissions:
  contents: read
  actions: read
env:
  LLVM_VERSION: "22"
  LLVM_FULL_VERSION: 22.1.5
jobs:
  freebsd-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact qualification source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 4ed27ff35dd4c439abfce7c933e0039953968038
          persist-credentials: false
      - uses: ./.github/actions/setup-ubuntu-dns
      - name: Record host capacity and source
        run: |
          mkdir -p ci-diagnostics
          test "$(git rev-parse HEAD)" = 4ed27ff35dd4c439abfce7c933e0039953968038
          {
            date -u
            git rev-parse HEAD
            uname -a
            nproc
            free -h
            cat /proc/meminfo
            df -h
          } > ci-diagnostics/host-before.txt
          cat ci-diagnostics/host-before.txt
      - name: Reuse exact-source libhew-x86_64-unknown-freebsd
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: libhew-x86_64-unknown-freebsd
          path: cross-release-libs/x86_64-unknown-freebsd
          run-id: 43061233475
          github-token: ${{ github.token }}
      - name: Reuse exact-source portable-release-libs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: portable-release-libs
          path: portable-release-libs
          run-id: 43061233475
          github-token: ${{ github.token }}
      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc
        with:
          release: "15.1"
          mem: ${{ inputs.guest_memory_mib }}
          prepare: |
            mkdir -p /usr/local/etc/pkg/repos
            printf 'FreeBSD: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest", mirror_type: "srv", enabled: yes }\n' \
              > /usr/local/etc/pkg/repos/FreeBSD.conf
            # Bootstrap pkg through the base utility before reading package catalogues.
            # Without this, pkg self-upgrades mid-install and the new binary cannot
            # read the catalogue the old one wrote, so every package reports missing.
            /usr/sbin/pkg bootstrap -fy -r FreeBSD
            pkg update -f -r FreeBSD
            pkg install -y -r FreeBSD llvm22 rustup-init python312 cmake ninja git gmake bash pkgconf libffi libxml2
          run: |
            set -eu
            mkdir -p ci-diagnostics .ci-scratch
            export TMPDIR="$PWD/.ci-scratch"
            capture() {
              date -u
              uname -a
              sysctl hw.physmem hw.realmem hw.ncpu vm.swap_total
              swapinfo -h
              vmstat -s
              ulimit -a
              dmesg -a
            }
            capture > ci-diagnostics/guest-before.txt 2>&1
            vmstat -w 2 > ci-diagnostics/vmstat.txt 2>&1 &
            vmstat_pid=$!
            (
              while :; do
                date -u
                ps -axo pid,ppid,rss,vsz,comm,args | sort -nr -k3 | sed -n '1,16p'
                sleep 5
              done
            ) > ci-diagnostics/process-rss.txt 2>&1 &
            process_pid=$!
            finish() {
              result=$?
              trap - EXIT
              set +e
              kill "$vmstat_pid" "$process_pid"
              wait "$vmstat_pid" "$process_pid" 2>/dev/null
              capture > ci-diagnostics/guest-after.txt 2>&1
              cat ci-diagnostics/cargo-time.txt 2>/dev/null
              cat ci-diagnostics/guest-after.txt
              printf '%s\n' "$result" > ci-diagnostics/status
              # Avoid copying the build cache back; all consumers have finished using it.
              if [ -d target ]; then
                mv target "$HOME/hew-sdk-diagnostic-target" || exit 1
              fi
              # Transport diagnostics after failure; the host propagates status below.
              exit 0
            }
            trap finish EXIT
            cat > .ci-scratch/original-sdk-workload.sh <<'HEW_SDK_WORKLOAD'
            set -eux
            command -v bash && bash --version

            # The VM user differs from the synced checkout owner; without
            # this the build script cannot read git metadata and the shipped
            # binaries report `unknown` for their commit hash.
            git config --global --add safe.directory "$(pwd)"

            # Build with the repository-pinned Rust release instead of the
            # moving version published by the FreeBSD package repository.
            /usr/local/bin/rustup-init -y --no-modify-path --profile minimal \
              --default-toolchain 1.96.0
            export PATH="$HOME/.cargo/bin:$PATH"
            rustup run 1.96.0 rustc --version | grep -q '^rustc 1\.96\.0 '

            # ── LLVM ───────────────────────────────────────────────────────
            # LLVM 22 comes from pkg on FreeBSD 15.1 (latest branch).
            export LLVM_SYS_221_PREFIX=/usr/local/llvm22
            /usr/local/llvm22/bin/llvm-config --version

            # ── Rust builds (release) ──────────────────────────────────────
            # The split debug asset is keyed by the GNU build-id.
            export CARGO_TARGET_X86_64_UNKNOWN_FREEBSD_RUSTFLAGS=-Clink-arg=-Wl,--build-id
            /usr/bin/time -l -o ci-diagnostics/cargo-time.txt cargo build -p hew-cli --release
            bash scripts/test-release-lib-link.sh \
              --hew target/release/hew \
              --archive cross-release-libs/x86_64-unknown-freebsd/libhew.a

            # ── Package archive ────────────────────────────────────────────
            ARCHIVE_NAME="hew-v0.11.0-rc1-freebsd-x86_64"

            sh scripts/stage-release-package.sh \
              --source-dir "$PWD" \
              --bin-dir "target/release" \
              --native-lib "cross-release-libs/x86_64-unknown-freebsd/libhew.a" \
              --native-triple "x86_64-unknown-freebsd" \
              --native-lib-name "libhew.a" \
              --wasi-lib-dir "portable-release-libs/wasm32-wasip1" --optional-wasi \
              --destination "${ARCHIVE_NAME}" \
              --completion-shells "bash zsh fish" \
              --debug-symbols "${ARCHIVE_NAME}-debug"

            tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
            tar czf "${ARCHIVE_NAME}-debug.tar.gz" "${ARCHIVE_NAME}-debug"

            export PATH="/usr/local/llvm22/bin:$PATH"
            gmake test-packaged-sdk PYTHON=python3.12 PACKAGED_SDK_ARCHIVE="${ARCHIVE_NAME}.tar.gz"
            HEW_SDK_WORKLOAD
            sh .ci-scratch/original-sdk-workload.sh
          copyback: true
      - name: Propagate original SDK workload result
        if: always()
        run: |
          test -f ci-diagnostics/status
          status="$(cat ci-diagnostics/status)"
          case "$status" in
            0) echo 'Full original release SDK workload passed' ;;
            ''|*[!0-9]*) echo 'Invalid diagnostic workload status' >&2; exit 1 ;;
            *) echo "Original SDK workload failed with status $status" >&2; exit "$status" ;;
          esac
      - name: Retain diagnostics and SDK receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: freebsd-sdk-memory-${{ inputs.guest_memory_mib }}
          path: |
            ci-diagnostics/
            build/packaged-sdk-acceptance/
          if-no-files-found: error
