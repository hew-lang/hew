[[case]]
id = "actor-stop-hook-suspended-fault"
intent = "A stop hook that faults after suspending ends the hook sequence, still releases the resource field once and reaches the closing observer with its diagnostic."
source = "cases/actor-stop-hook-suspended-fault.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.expected]
stdout = "1\nstop resumed\nledger closed\n"
stderr = "hew: failure: UserPanic (212): goodbye failed after suspending\n"
exit = 1
