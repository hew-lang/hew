[[case]]
id = "fork-outlives-timed-select"
intent = "A release fence makes the timer win before a forked task can complete; the scope still joins it and the checker reports the missing explicit wait. Scope deadlines cancel and drain blocked readers, verified by Closed on a later send. A deadline-bounded fork and an explicit join after the timer are not reported."
source = "cases/fork-outlives-timed-select.hew"
suites = ["acceptance"]
timeout_seconds = 30

[case.expected]
stdout = "stranded timer won: true\nbounded deadline hit: true\ndeadline bounds the task: -1\njoined after the timer: 1\n"
exit = 0

[[case.expected.diagnostics]]
code = "fork_outlives_timed_select"
severity = "warning"
line = 17
column = 24
message = "this timed `select` is the only wait on task `job`"
