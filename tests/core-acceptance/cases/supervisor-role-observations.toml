[[case]]
id = "supervisor-role-observations"
intent = "A watcher that monitors or links a supervised role, including a pool member of a nested supervisor, subscribes to the incarnation the role holds, receives its crash notification, and keeps running while the supervisor restarts the role."
source = "cases/supervisor-role-observations.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.expected]
stdout = "monitor: Ok(pong)\nmonitored role crashed\nlink: Ok(pong)\nlinked role exited\nreplacement: Ok(pong)\npool monitor: Ok(pong)\nmonitored role crashed\n"
stderr = "hew: failure: UserPanic (212): backend failed\nhew: actor crash in Backend.fail (actor 1): UserPanic\nhew: failure: UserPanic (212): backend failed\nhew: actor crash in Backend.fail (actor 2): UserPanic\nhew: failure: UserPanic (212): backend failed\nhew: actor crash in Backend.fail (actor 8): UserPanic\n"
exit = 0
