[[case]]
id = "resource-close-fault-vec-set"
intent = "A failing close on the element a vector set displaces is the frame's failure, and the vector it still owns is released before the failure leaves."
source = "cases/resource-close-fault-vec-set.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.expected]
stdout = "working\nclose 1\nclose 2\n"
stderr = "hew: failure: UserPanic (212): close 1 failed\nhew: secondary failure: UserPanic (212): close 2 failed\n"
exit = 1
