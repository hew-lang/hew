[[case]]
id = "veciter-through-adaptors"
intent = "`Vec.into_iter()` drives the same `std.iter` adapter chains a generator does: a `for` walks an adapter directly, an early break releases the cursor and its source vector, and map over owned strings hands each projection to a collected vector released once."
source = "cases/veciter-through-adaptors.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.expected]
stdout = "2\n4\n6\n8\n10\n4\n6\n15\n3\n3\nBOLT\nbolt\nnut\n"
exit = 0
