[[case]]
id = "actor-owned-budget-scalar-request"
intent = "A scalar-only actor request charges its full slot width, and an empty request fits in the same budget."
source = "cases/actor-owned-budget-scalar-request.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "2"

[case.expected]
stdout = "scalar admission limit\n"
exit = 1
