[[case]]
id = "actor-start-fault-contained"
intent = "A child start fault after suspension releases unpublished owned state and reaches the caller's checked error edge without trapping the module."
source = "cases/actor-start-fault-contained.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 20

[case.expected]
stdout = "startup fault contained\ncaller survived startup rollback\n"
exit = 1
