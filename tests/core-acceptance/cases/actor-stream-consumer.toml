[[case]]
id = "actor-stream-consumer"
intent = "A receive gen fn feeds another actor's `for` from live state; a consumer that leaves early ends the producer turn, so a later ask observes the writes completed by both turns."
source = "cases/actor-stream-consumer.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 15

[case.expected]
stdout = "item:item\nitem:item\nitem:item\n3\nitem:item\nitem:item\n5\n12\nclosed\n"
exit = 0
