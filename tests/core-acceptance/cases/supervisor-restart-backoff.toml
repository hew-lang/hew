[[case]]
id = "supervisor-restart-backoff"
intent = "Selected backoff delays the first crash, doubles and caps per role, preserves stable roles and resets after the existing healthy restart window."
source = "cases/supervisor-restart-backoff.hew"
suites = ["acceptance", "safety"]
