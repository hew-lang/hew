[[case]]
id = "supervisor-group-restart-joins-second-crash"
intent = "A crash while a rest_for_one restart waits on a stopping sibling joins it: each role restarts once, after the stop hooks, and shutdown drains children in reverse declaration order."
source = "cases/supervisor-group-restart-joins-second-crash.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.expected]
stdout = "start a\nstart x\nstart b\nstart c\nstop x\nstop c\nstart a\nstart x\nstart b\nstart c\nrestarted\nstop c\nstop b\nstop x\nstop a\nstopped\n"
exit = 0
