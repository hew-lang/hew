[[case]]
id = "dyn-slot-fill-shapes"
intent = "Nominal, default, generic and structural implementations fill checked trait-object slots. Mutable plain and resource receivers return their updated state through erased dispatch on success and faults before or after mutation, and the resource closes exactly once."
source = "cases/dyn-slot-fill-shapes.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30
kind = "run"

[case.expected]
stdout = "trait\ntrait\nhi ann\nbox\nwidget 4\nwidget 5\nbw6\nbw7\nplain 12\nowned 22\nclose 23\n"
exit = 0
