[[case]]
id = "option_unwrap_none_aborts"
intent = "`expect` on a `None` reports Hew's own typed UserPanic and the process exits 1 under the one exit rule."
source = "../vertical-slice/accept/option_unwrap_none_aborts.hew"
suites = ["acceptance"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "4"

[case.expected]
stdout = ""
stderr = "hew: failure: UserPanic (212): expect failed: opt is present\n"
exit = 1
