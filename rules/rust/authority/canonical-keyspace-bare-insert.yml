id: canonical-keyspace-bare-insert
language: rust
severity: hint
message: >-
  Check whether this table publishes semantic facts or indexes source spellings.
note: >-
  Published semantic tables use resolver identities; no-string-keyed-semantic-map
  protects that boundary. Source scopes, diagnostic rendering and external ABI
  spelling tables may retain their lexical keys.
files:
  - "hew-types/src/**"
  - "hew-hir/src/**"
  - "hew-analysis/src/**"
  - "hew-mir/src/**"
  - "hew-codegen-rs/src/**"
ignores:
  - "**/tests/**"
  - "**/test/**"
  - "**/*_test.rs"
  - "**/*_tests.rs"
  - "**/tests.rs"
rule:
  pattern: $TABLE.insert($KEY, $$$REST)
constraints:
  TABLE:
    regex: ".*[A-Za-z_][A-Za-z0-9_]*_(names|defs|layouts|sigs|registry)$"
  KEY:
    kind: identifier
