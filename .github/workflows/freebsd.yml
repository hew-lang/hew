# FreeBSD CI — nightly regression testing on FreeBSD 15.0
#
# FreeBSD is a tier-1 platform. LLVM 22 is available via FreeBSD `pkg`
# (llvm22-22.1.2 on FreeBSD 15.0 latest), so no source build is needed.
# Uses vmactions/freebsd-vm@v1 to run FreeBSD in QEMU on an Ubuntu host.

name: FreeBSD CI

on:
  schedule:
    # Run daily at 07:00 UTC (after nightly-sanitizers at 06:00)
    - cron: "0 7 * * *"
  workflow_dispatch:

# A push to a branch makes any run still going for that same ref obsolete:
# its verdict can no longer gate anything, because a newer commit exists.
# Those runs were still holding runners, so 15 open pull requests could
# starve the queue and nothing scheduled at all. Never cancel on main —
# a push there must complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write

env:
  LLVM_VERSION: "22"
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & test (FreeBSD x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@a6de9343ef5747433d9c25784c90e84998b9d69a  # v1.4.6
        with:
          release: "15.0"
          mem: 8192
          prepare: |
            mkdir -p /usr/local/etc/pkg/repos
            printf 'FreeBSD: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest", mirror_type: "srv", enabled: yes }\n' \
              > /usr/local/etc/pkg/repos/FreeBSD.conf
            # Bootstrap pkg through the base utility before reading package catalogues.
            /usr/sbin/pkg bootstrap -fy -r FreeBSD
            pkg update -f -r FreeBSD
            # unpinned-by-design(wasmtime): the guest installs from pkg, which serves
            # one wasmtime per quarterly branch and takes no version selector. The
            # alternative is building wasmtime from source inside a VM step that
            # already runs near its time limit. Every other runner takes the pinned
            # release asset.
            pkg install -y -r FreeBSD llvm22 gdb rustup-init python3 cmake ninja git gmake bash pkgconf libffi libxml2 wasmtime
            pw useradd -n hew-ci -m -s /bin/sh

          run: |
            set -eux
            id
            test "$(id -u)" = 0

            # The VM action connects as root. Finish privileged setup before
            # handing the complete build and test workload to a normal user.
            ln -sf /usr/local/llvm22/bin/wasm-ld /usr/local/bin/wasm-ld
            chown -R hew-ci:hew-ci "$GITHUB_WORKSPACE"
            su -m hew-ci -c 'sh -s' <<'HEW_FREEBSD_CI'
            set -eux
            export HOME=/home/hew-ci
            id
            test "$(id -u)" -ne 0

            git config --global --add safe.directory "$(pwd)"
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

            export LLVM_SYS_221_PREFIX=/usr/local/llvm22
            # Install the repository-pinned toolchain and WASI standard
            # library through rustup, matching the other full-suite hosts.
            /usr/local/bin/rustup-init -y --no-modify-path --profile minimal \
              --default-toolchain 1.96.0 --target wasm32-wasip1
            # The debug libhew bootstrap starts the Python freshness helper,
            # which then starts Cargo. Give both child-process levels absolute
            # executables instead of depending on the SSH login environment.
            export PATH="$HOME/.cargo/bin:/usr/local/llvm22/bin:/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin"
            export CARGO="$HOME/.cargo/bin/cargo"
            export PYTHON=/usr/local/bin/python3
            test -x "$CARGO"
            test -x "$PYTHON"
            rustup run 1.96.0 rustc --version | grep -q '^rustc 1\.96\.0 '
            rustup target list --toolchain 1.96.0 --installed | grep -qx wasm32-wasip1
            export MAKE=gmake
            /usr/local/llvm22/bin/llvm-config --version
            command -v gdb || command -v lldb || {
              echo "No debugger found: install the FreeBSD gdb package or LLVM's lldb package" >&2
              exit 1
            }

            # The wasm codegen tests link with wasm-ld from the pkg LLVM tree.
            command -v wasmtime && wasmtime --version
            command -v wasm-ld && wasm-ld --version
            command -v bash && bash --version

            # ── Rust builds ────────────────────────────────────────────────
            # Build runtime (release + debug for E2E tests)
            cargo build -p hew-runtime --release
            cargo build -p hew-runtime

            # Build frontend and tools (release)
            cargo build -p hew-cli --release

            # Build frontend (debug — needed by some tests)
            cargo build -p hew-cli

            # Build the consolidated standard library
            cargo build --release -p hew-std

            # ── Tests ──────────────────────────────────────────────────────

            # Install cargo-nextest for slow-timeout envelope (FreeBSD's pkg
            # does not yet carry cargo-nextest, so install via cargo).
            cargo install cargo-nextest --locked --version 0.9.120

            gmake stdlib

            # Default features include "full" (encryption + profiler + quic),
            # so all QUIC transport tests run without an explicit flag.
            # The ci profile applies the same slow-timeout = 3x60 s envelope
            # as all other platforms, replacing the previous bare cargo test.
            cargo nextest run --workspace \
              --exclude hew-wasm --exclude hew-cabi \
              --profile ci --no-fail-fast

            # hew-cabi is excluded from the workspace run above because its
            # cfg(test) runtime stubs collide with hew-runtime's real symbols
            # at link time. Run it on its own so the C-ABI ownership contract
            # is actually proven on this platform rather than merely skipped.
            cargo nextest run --profile ci-cabi -p hew-cabi

            # The authenticated exact checkout must also prove compiled Hew,
            # including loopback network and resource surfaces. Workspace
            # nextest alone does not execute these language-level gates.
            gmake test-vertical-slice
            gmake test-hew-ratchet

            # The source-level DWARF debugger proof must execute on FreeBSD,
            # not merely compile as part of the workspace test build.
            # A dedicated profile keeps this narrow run's report from
            # overwriting the workspace run's junit.xml (same class of bug
            # profile.ci-cabi exists to prevent — see .config/nextest.toml).
            cargo nextest run -p hew-cli --test dwarf_debugger_locals_e2e --profile ci-focused
            HEW_FREEBSD_CI

      - name: Upload test reports
        # vmactions/freebsd-vm syncs the working directory back to this host
        # runner after the guest `run:` script exits (proven by release.yml's
        # build-freebsd-aarch64 job, which packages a tarball entirely inside
        # the VM's run block and then reads it from a host-side
        # actions/upload-artifact step) — so the reports written by the
        # guest's nextest and hew-suite-ratchet runs are present here.
        if: always()
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d  # v6.4.1
        with:
          report_paths: "target/nextest/ci/junit.xml,target/nextest/ci-cabi/junit.xml,target/nextest/ci-focused/junit.xml,target/hew-test-reports/hew-suite-ratchet.xml"
          check_name: Test Results (FreeBSD)

  # ── Ownership ───────────────────────────────────────────────────────────
  # A scheduled failure that reaches nobody is not a signal. `needs:` lists
  # EVERY other job in this workflow, so a job added later without being added
  # here is caught by the parsed-workflow contract in
  # scripts/tests/test_ci_workflow_contract.py rather than silently escaping
  # the report. `always()` keeps a red upstream from skipping the reporter at
  # exactly the moment it is needed, and the schedule/dispatch guard keeps a
  # branch run of this workflow from filing issues.
  #
  # `issues: write` is granted HERE, by the caller: GitHub intersects a called
  # workflow's permissions with the caller's token scope, so declaring it
  # inside the reusable workflow would grant nothing and every invocation
  # would 403.
  #
  # The reporter runs on green too, so the next successful scheduled run
  # closes the issue. A red-only reporter can only ever open one.
  report:
    needs: [build-and-test]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/scheduled-failure-report.yml
    with:
      workflow-file: freebsd.yml
      outcome: >-
        ${{ (contains(needs.*.result, 'failure')
        || contains(needs.*.result, 'cancelled')
        || contains(needs.*.result, 'timed_out')) && 'failure' || 'success' }}
      failed-jobs: ${{ toJSON(needs) }}
