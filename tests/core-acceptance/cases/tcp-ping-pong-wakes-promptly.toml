[[case]]
id = "tcp-ping-pong-wakes-promptly"
intent = "Loopback readiness resumes every exchange while the peer task and an independent actor make progress with one worker; every echoed payload is checked."
source = "cases/tcp-ping-pong-wakes-promptly.hew"
suites = ["acceptance"]
timeout_seconds = 60

[case.env]
HEW_IO_LEAK_CHECK = "1"
HEW_WORKERS = "1"

[case.expected]
stdout = "loopback readiness and actor progress\n"
exit = 0
