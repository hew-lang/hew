line = 19
column = 12
message = "expected `i64`, found `string`"

[[case.expected.diagnostics]]
code = "Mismatch"
line = 23
column = 8
message = "expected `Vec<i64>`, found `i64`"

[[case.expected.diagnostics]]
code = "InvalidOperation"
line = 27
column = 8
message = "spread `..` is not allowed in a `[i64; 3]` literal"

[[case.expected.diagnostics]]
code = "InvalidOperation"
