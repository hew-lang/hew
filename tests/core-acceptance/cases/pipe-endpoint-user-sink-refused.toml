[[case]]
id = "pipe-endpoint-user-sink-refused"
intent = "The pipe endpoint is the declaration `std.stream` owns, not the spelling `Sink`. A user `type Sink<T>` handed to an endpoint parameter is refused with both spellings named, while the real endpoint in the same program still satisfies that parameter and raises nothing."
source = "fixtures/pipe-endpoint-user-sink-refused/main.hew"
suites = ["acceptance"]
timeout_seconds = 30
kind = "check"

