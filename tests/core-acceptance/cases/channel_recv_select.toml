[[case]]
id = "channel_recv_select"
intent = "Bounded channel send/recv/try_recv/close + select."
source = "cases/channel_recv_select.hew"
suites = ["acceptance"]
kind = "run"
timeout_seconds = 60
# The retired checked-mir harness ran every fixture with the actor-box
# balance check armed; keep it here so a leaked actor lands as exit 93.
env = { HEW_ACTOR_LEAK_CHECK = "1" }

[case.expected]
stdout = "ready\nempty\nclosed\n"
exit = 0
