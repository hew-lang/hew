# Release sanitizer limitation ledger.
#
# ASan is never represented here: the release workflow executes it and fails
# closed unless it passes. TSan and Miri require one release-scoped row each
# until they can run as authoritative gates. Rows describe behavior rather
# than a Git commit so the evidence survives normal branch and merge movement.
#
# Required fields:
#   axis = "tsan" | "miri"
#   release = "<semantic release version>"
#   behavior = "<what the lane does or why its result is non-authoritative>"
#   reason = "<why this release cannot require a green execution>"
#   tracking = "<https issue or upstream report>"
#   owner = "<project role or GitHub team responsible for retirement>"
#   expires = "YYYY-MM-DD"

[[waiver]]
axis = "tsan"
release = "0.6.0-rc1"
behavior = "The Linux TSan configuration reports races in correctly synchronized std mutex/condvar handoffs when linked with the prebuilt uninstrumented standard library; a no-Hew minimal probe reproduces the false-positive class."
reason = "Upstream build-std/TSan linking is not usable for this runtime configuration, so TSan output cannot distinguish the reproduced toolchain false positives from Hew races. ASan remains mandatory and executed."
tracking = "https://github.com/hew-lang/hew/issues/1825"
owner = "Hew runtime maintainers"
expires = "2026-09-10"

[[waiver]]
axis = "miri"
release = "0.6.0-rc1"
behavior = "The FFI-heavy scheduler/runtime surface cannot execute under the current curated Miri lane; release behavior is covered by executed ASan, leak-oracle, C-ABI, and native runtime gates."
reason = "A representative Miri model for the runtime FFI boundary is not yet available and treating non-execution as a pass would be misleading."
tracking = "https://github.com/hew-lang/hew/issues/1826"
owner = "Hew runtime maintainers"
expires = "2026-09-10"
