[[case]]
id = "supervisor-process-construction"
intent = "Declared-child init captures a self-child process through the ordinary suspending process API on initial construction and restart, releasing owned process state and config."
source = "cases/supervisor-process-construction.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30
env = { HEW_WORKERS = "1" }

[case.expected]
stdout = "process-backed supervisor construction\n"
exit = 0
