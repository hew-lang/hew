[[case]]
id = "supervisor-restart-backoff-cancel"
intent = "Stopping a supervisor cancels a selected long backoff without advancing the deterministic clock or claiming recovery of its interrupted fault."
source = "cases/supervisor-restart-backoff-cancel.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 10

[case.env]
HEW_DETERMINISTIC = ""

[case.expected]
stdout = "pending restart cancelled\n"
exit = 1
