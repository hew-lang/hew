[[case]]
id = "spawn-keyed-reject-keys"
intent = "An unknown, misspelt, repeated or deferred spawn key and a missing supervisor parameter are checker errors at the key, never a lowering failure."
source = "cases/spawn-keyed-reject-keys.hew"
suites = ["acceptance"]
timeout_seconds = 30
kind = "check"

[[case.expected.diagnostics]]
severity = "error"
code = "E_SPAWN_ARG_UNKNOWN"
