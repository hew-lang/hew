[[case]]
id = "collection-callback-actor"
intent = "Hash and Eq ask a peer actor on one worker through collision-heavy map/set operations and vector equality, while pure callbacks remain usable in synchronous start hooks."
source = "cases/collection-callback-actor.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 20

[case.env]
HEW_WORKERS = "1"

[case.expected]
stdout = "collection callbacks complete\n"
stderr = ""
exit = 0
