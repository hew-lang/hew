# Publish a final release's .deb, .rpm and Arch packages to https://dist.hewpkg.com (apt, dnf, zypper, pacman).
#
# No secret and no package-repository install: GitHub's OIDC token is the credential (dist.hewpkg.com accepts it
# only from hew-lang/hew on a tag), and .github/scripts/apt-push is the client. Prereleases carry no distro
# packages, so they are skipped. To republish a release that contains this workflow, dispatch from its tag:
#   gh workflow run publish-dist.yml --ref v0.11.0 -f tag=v0.11.0
name: publish-dist

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v0.11.0)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: publish-dist-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to dist.hewpkg.com
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # apt-push requests the OIDC token
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout release tools
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          sparse-checkout: |
            .github/scripts
            .github/actions/setup-ubuntu-dns
            scripts

      - uses: ./.github/actions/setup-ubuntu-dns

      - name: Download and verify the qualified distro packages
        run: python3 scripts/release-channel.py distro

      - name: Install the Arch package reader
        if: env.SKIP != '1'
        run: sudo apt-get install -y -qq libarchive-tools # bsdtar reads .pkg.tar.zst

      - name: Publish to stable
        if: env.SKIP != '1'
        run: ./.github/scripts/apt-push --repo hewpkg --suite stable pkgs/*
