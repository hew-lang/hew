[[case]]
id = "supervisor-wired-group-init-refusal"
intent = "A group restart reconstructs its prerequisite first; a failing prerequisite init prevents dependent reconstruction and releases owned configuration and partial state."
source = "cases/supervisor-wired-group-init-refusal.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.expected]
stdout = "group refused dependent reconstruction\n"
exit = 1
