[[case]]
id = "vec_pop_empty_actor_isolated"
intent = "`Vec.pop()` on an empty vector traps inside the actor; the runtime names the failure and the actor it fired in, and the sibling actor keeps serving."
source = "../vertical-slice/accept/vec_pop_empty_actor_isolated.hew"
suites = ["acceptance"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "4"

[case.expected]
stdout = ""
stderr = "hew: failure: IndexOutOfBounds (205)\nhew: actor crash in VecPopCrasher.boom (actor 1): IndexOutOfBounds\n"
exit = 1
