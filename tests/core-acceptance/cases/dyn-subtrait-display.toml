[[case]]
id = "dyn-subtrait-display"
intent = "`dyn` over a user trait that extends `Display` reaches both its own method and `Display.fmt`, at a coercion and through a parameter."
source = "cases/dyn-subtrait-display.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 15

[case.expected]
stdout = "point at 1\n(1, 2)\npoint at 3 / (3, 4)\n"
exit = 0
