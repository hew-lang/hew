[[case]]
id = "actor-state-vec-seat"
intent = "A state Vec whose element has no copy is pushed, explicitly replaced before its contents are drained and refilled in its own seat; a turn that faults between the take and the publish leaves the seat intact for the crash hook, and the fault before the take is the control."
source = "cases/actor-state-vec-seat.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 60

[case.expected]
stdout = "U:m1 V:m1 \nafter drain 0\nafter refill 1\nW:m2 \nseat 3\nseat 2\ndone\n"
exit = 1
