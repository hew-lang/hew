[[case]]
id = "defer-checked-fault"
intent = "Failure-only defers share LIFO cleanup for fails propagation, checked faults and causally blocked child cancellation; success and ordinary Err/None values skip them, and secondary cleanup faults preserve the primary."
source = "cases/defer-checked-fault.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 15

[case.expected]
stdout = "always\nfailed\nalways\npropagated\ncleanup-failed\ncancelled\nfault\n"
exit = 1
