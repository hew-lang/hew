[[case]]
id = "pattern-let-chains"
intent = "A condition joins `let` operands and boolean tests with `&&`: each `let` binds for the operands to its right and for the then block, evaluation stops at the first operand that fails, and the owned payload the chain bound is released on both paths."
source = "cases/pattern-let-chains.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.expected]
stdout = "slot 0 40\nnone\nnone\nnone\nslot 0\nslot 1\nstopped 2\nslot 0\n"
exit = 0
