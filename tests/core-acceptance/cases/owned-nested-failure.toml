[[case]]
id = "owned-nested-failure"
intent = "A divide-by-zero fault releases callee string/bytes owners and propagates through caller cleanup before one report."
source = "cases/owned-nested-failure.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 15

[case.expected]
stdout = ""
stderr = "hew: failure: DivideByZero (202)\n"
exit = 1
