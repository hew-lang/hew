[[case]]
id = "whole-owner-releasing-mutation"
intent = "Inserting into a map of resources held by a resource opens the owner in place: a key callback fault would leave the map with the owner, so the owner stays whole and closes once."
source = "cases/whole-owner-releasing-mutation.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.expected]
stdout = "1\nclose registry 1\nclose conn 1\n"
exit = 0
