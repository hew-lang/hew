# Stable JIT host ABI classification for hew-runtime exports.
#
# The verifier treats every #[no_mangle] extern "C" fn in hew-runtime/src/
# as part of the candidate host ABI and requires it to appear exactly once
# in one of the three lists below. Keep entries sorted for stable diffs.
#
# Ownership contracts live in [[ownership.contracts]] entries at the end of
# this file. Every symbol in any ABI tier must either have one contract or be
# counted by scripts/ffi-ownership-ratchet.toml.
#
#   result = "fresh" | "retained" | "borrowed" | "none"
#   params = ["borrow" | "consume" | "retain", ...]
#   resource-result-type = "<qualified source nominal>" (optional)
#   release-symbol = "<hew_* release function or type-directed drop thunk>" | ""
#   discharge-depth = "shallow" | "deep" | "none"
#   result-retention = "transferred" | "shared-refcount" | "resource-transfer"
#                      (optional; owned results only)
#   result-retention-basis = "<runtime-body handoff evidence>"
#                            (required for resource-transfer)
#
# `fresh` transfers a newly owned allocation to the caller. `retained`
# transfers an additional reference to an existing ref-counted allocation.
# `borrowed` remains owned elsewhere and may be invalidated by mutation.
# `none` carries no owned result. Fresh and retained results must name their
# release symbol and whether that release recursively discharges children.
# Borrowed and none results use an empty release symbol and depth "none".
#
# `result-retention` is the RETENTION axis and answers a DIFFERENT question
# from `result`: does the callee keep a pointer into the allocation it just
# returned? `fresh` says the allocation is new; it does not say the callee
# stopped referring to it. A callee that allocates AND keeps the pointer — to
# free it later, to overwrite it on the next call, or to hand the same address
# back again — produces a value the caller must not release, and that
# difference is invisible on the `result` axis alone. It is a real difference
# inside this runtime: hew_process_last_error copies its thread-local message
# into a fresh header-aware allocation and keeps nothing, while hew_last_error
# hands back the interior of the CString the runtime stores and keeps
# everything.
#
# "transferred" therefore means: the callee provably keeps no pointer into the
# returned allocation, the caller holds the SOLE owner, and `release-symbol` is
# the balancing release. "shared-refcount" means a retained result aliases an
# existing allocation, but the callee incremented that allocation's refcount so
# one `release-symbol` call independently balances the returned share. Both are
# measured positive answers that license the compiler to mint a caller-side
# release for a pointer-bearing extern result
# (hew_mir::return_provenance::build_extern_contract_table).
# "resource-transfer" is the corresponding answer for an opaque resource: the
# runtime body creates a fresh allocation or table token, returns its only
# caller-controlled close authority, and keeps no second authority that can run
# the named release. Every such row records the inspected handoff in
# `result-retention-basis`; merely naming `resource-result-type` proves nothing.
#
# ABSENCE is the fail-closed default and means the question has not been
# answered for that symbol — no mint, which costs a leak rather than a double
# free. A row may claim either positive spelling only once an executable oracle
# has established it for that symbol. A transferred oracle requires distinct
# live addresses, refcount 1 at handoff, and surviving producer state. A
# shared-refcount oracle requires the same live address, an exact refcount bump,
# and validity in both release orders. Those oracles are
# hew-runtime/tests/{last_error_result_retention,string_result_retention,
# identity_format_result_retention,os_io_string_result_retention}.rs,
# hew-std/src/{last_error_retention,string_result_retention,
# os_io_string_retention,websocket_string_result_retention}.rs, and
# hew-std/src/http/string_result_retention.rs (hew-lang/hew#2828), and
# hew-runtime/tests/stream_sink_result_retention.rs for the file-backed sink
# handle, where the sole-owner reading is that releasing one result leaves a
# concurrently live one fully usable rather than a refcount header read.
#
# Those criteria do not catch one shape: a callee that allocates fresh, hands
# the caller a genuinely sole-owned buffer, and separately stashes a raw
# non-refcounted pointer to it that it frees at shutdown. Every probe passes
# and the caller's release is still correct at the call site, but the buffer is
# freed twice at process teardown. Nothing in the family does this today; the
# axis rows were corroborated against the implementation sites. But a reader
# adding a new symbol should know exactly what "measured" covers and what it
# does not, rather than inferring that a passing oracle is a proof of sole
# ownership for all time.
#
# What those oracles CANNOT see: they are black-box probes over live results,
# so they establish that two results occupy distinct addresses, that the
# caller's handle is the sole owner at handoff, and that the callee's own
# state survives the caller's release. Together those still miss one shape — a
# callee that allocates fresh, hands back a genuinely sole-owned buffer, and
# separately stashes a raw non-refcounted pointer to it that it frees at
# process teardown. Every probe passes, the caller's release is correct at the
# call site, and the buffer is freed twice at shutdown. No symbol in this file
# does that today; the rows below were corroborated against their
# implementation sites. But "measured" here means measured by those oracles,
# not proved sole-owned for all time: anyone adding a row must read the
# callee's teardown path as well as running the oracle.
#
# Three-tier model (rationale: Option A chosen over Option B for substrate
# clarity — the tier boundary is a compile-time contract, not just a doc claim):
#
#   stable         — handle-oriented, user-visible runtime surface that
#                    `extern "rt"` declarations in user code may name directly,
#                    and that JIT hosts must expose in their symbol map.
#
#   codegen-stable — symbols the compiler emits into generated IR for non-trivial
#                    actor programs (cooperate safepoints, task-scope wiring,
#                    actor-state locking, execution-context access, scheduler
#                    bootstrap). These are NOT user-callable via `extern "rt"`;
#                    the checker rejects any attempt. JIT hosts must provide
#                    them alongside the stable tier.
#
#   internal       — lifecycle, session/global-state, scheduler shutdown/reset/
#                    drain, and conservative runtime-control hooks. Never
#                    JIT-reachable. AOT-linkable only.

