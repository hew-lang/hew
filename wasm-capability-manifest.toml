[[feature]]
id = "timers-sleep"
enum_variant = "Timers"
label = "Timer operations"
prose_label = "`sleep_ms`, `sleep`"
reason = "timers are cooperative on wasm32: a sleep parks the coroutine and an #[every(duration)] handler fires when the process driver next ticks the shared timer wheel, so granularity follows the driver steps rather than a dedicated ticker"
checker = "warn"
runtime = "cooperative"
runtime_status = "Cooperative coroutine suspension, including within actor handlers"
categories = ["runtime", "scheduler"]
tracking_label = "Implemented"

[[feature]]
id = "timers-every"
enum_variant = "PeriodicTimers"
label = "Timer operations"
prose_label = "`#[every(duration)]` periodic handlers"
reason = "timers are cooperative on wasm32: a sleep parks the coroutine and an #[every(duration)] handler fires when the process driver next ticks the shared timer wheel, so granularity follows the driver steps rather than a dedicated ticker"
checker = "warn"
runtime = "cooperative"
runtime_status = "Cooperative periodic dispatch on WASI and checked periodic handlers in the browser VM"
categories = ["runtime", "scheduler"]
tracking_label = "Implemented"

[[feature]]
id = "streams"
label = "Pipe operations (`stream.pipe`, `Stream<T>.*`, `Sink<T>.*`)"
checker = "pass"
runtime = "implemented"
runtime_status = "Implemented on the wasm32 process driver: the same suspending queue core the native target runs, with a parked producer or consumer resumed from the driver's run queue instead of a worker thread. The file and socket backings of the same handle types are separately classified"
categories = ["runtime", "streams"]

