[[case]]
id = "bytes_index_oob_actor_isolated"
intent = "An out-of-bounds `bytes[i]` read traps inside the actor and the runtime names the failure and the actor it fired in."
source = "../vertical-slice/accept/bytes_index_oob_actor_isolated.hew"
suites = ["acceptance"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "4"

[case.expected]
stdout = ""
stderr = "hew: failure: IndexOutOfBounds (205): bytes index 99 out of bounds for length 1\nhew: actor crash in BytesIndexCrasher.boom (actor 1): IndexOutOfBounds\n"
exit = 1
