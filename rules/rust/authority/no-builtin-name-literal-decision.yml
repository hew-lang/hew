id: no-builtin-name-literal-decision
language: rust
severity: error
message: >-
  A semantic decision is made by comparing a name/spelling against a literal
  instead of a typed identity.
note: >-
  Resolved type-fact services and HIR expression consumers must consume checker
  identities. Source scopes, declaration registration, diagnostics and external
  ABI spelling tables remain lexical inputs outside this boundary.
files:
  - "hew-types/src/type_facts.rs"
  - "hew-types/src/value_class.rs"
  - "hew-types/src/traits.rs"
  - "hew-hir/src/lower/types.rs"
  - "hew-hir/src/lower/expr.rs"
  - "hew-hir/src/lower/identifiers.rs"
  - "hew-hir/src/lower/private_refs.rs"
  - "hew-hir/src/lower/calls.rs"
  - "hew-hir/src/lower/collections.rs"
ignores:
  - "**/tests/**"
  - "**/test/**"
  - "**/*_test.rs"
  - "**/*_tests.rs"
  - "**/tests.rs"
  - "hew-types/src/builtin_type.rs"
  - "hew-types/src/stdlib_catalog.rs"
  - "hew-types/src/stdlib_authority.rs"
  - "hew-types/src/check/scope.rs"
  - "hew-types/src/check/diagnostics.rs"
  - "hew-lexer/src/symbol.rs"
rule:
  any:
    - kind: binary_expression
      all:
        - regex: "(==|!=)"
        - not:
            regex: '\.name\.as_str\(\)'
        - has:
            kind: string_literal
            regex: '^"[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)*"$'
        - has:
            field: left
            regex: "(?i)(name|ident|key|path|spelling|leaf)"
    - kind: macro_invocation
      all:
        - has:
            field: macro
            regex: "^matches$"
        - regex: '"[A-Za-z][A-Za-z0-9_]*"\s*\|'
    - kind: binary_expression
      all:
        - regex: "(==|!=)"
        - has:
            kind: scoped_identifier
            regex: "^sym::"
  not:
    inside:
      kind: mod_item
      stopBy: end
      follows:
        kind: attribute_item
        regex: 'cfg\(.*\btest\b'
