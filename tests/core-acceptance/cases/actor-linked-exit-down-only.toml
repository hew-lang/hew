[[case]]
id = "actor-linked-exit-down-only"
intent = "A native actor with only a DOWN hook turns an unhandled linked EXIT into a checked actor failure, preserving the peer panic reason and releasing its owned state."
source = "cases/actor-linked-exit-down-only.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 15

[case.expected]
stdout = "unhandled EXIT terminated linked actor\n"
stderr = "hew: failure: UserPanic (212): linked peer failed\nhew: actor crash in Actor (actor 1): UserPanic\nhew: failure: UserPanic (212)\nhew: actor crash in Actor (actor 2): UserPanic\n"
exit = 1
