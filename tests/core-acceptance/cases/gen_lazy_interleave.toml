[[case]]
id = "gen_lazy_interleave"
intent = "The fixture runs to completion and prints exactly its recorded output."
source = "../vertical-slice/accept/gen_lazy_interleave.hew"
suites = ["acceptance"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "4"

[case.expected]
stdout = "gen:a\nmain:got\ngen:b\nmain:got\ngen:c\n"
exit = 0
