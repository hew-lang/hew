# FreeBSD CI — nightly regression testing on FreeBSD 15.0
#
# FreeBSD is a tier-1 platform. LLVM 22 is available via FreeBSD `pkg`
# (llvm22-22.1.2 on FreeBSD 15.0 latest), so no source build is needed.
# Uses vmactions/freebsd-vm@v1 to run FreeBSD in QEMU on an Ubuntu host.

name: FreeBSD CI

on:
  schedule:
    # Run daily at 07:00 UTC (after nightly-sanitizers at 06:00)
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_VERSION: "22"
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & test (FreeBSD x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@a6de9343ef5747433d9c25784c90e84998b9d69a  # v1.4.6
        with:
          release: "15.0"
          mem: 8192
          prepare: |
            mkdir -p /usr/local/etc/pkg/repos
            printf 'FreeBSD: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest", mirror_type: "srv", enabled: yes }\n' \
              > /usr/local/etc/pkg/repos/FreeBSD.conf
            # Bootstrap pkg through the base utility before reading package catalogues.
            /usr/sbin/pkg bootstrap -fy -r FreeBSD
            pkg update -f -r FreeBSD
            # `rust` is deliberately NOT installed from pkg: the pkg toolchain
            # is not rustup-managed, so it ignores rust-toolchain.toml and cannot
            # supply wasm32-wasip1 (#1960). `curl` fetches rustup below.
            pkg install -y -U -r FreeBSD llvm22 cmake ninja git gmake bash pkgconf libffi libxml2 wasmtime curl

          run: |
            set -eux

            git config --global --add safe.directory "$(pwd)"
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

            # Install a rustup-managed toolchain so rust-toolchain.toml governs
            # this job as it does the Linux/macOS/Windows ones. That file pins
            # the channel and lists wasm32-wasip1 under `targets`, so the WASI
            # runner target is provisioned automatically (no `rustup target add`).
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o rustup-init.sh
            sh rustup-init.sh -y --no-modify-path --default-toolchain none
            . "$HOME/.cargo/env"
            rm -f rustup-init.sh

            rustup show active-toolchain
            rustup target list --installed | grep -qx wasm32-wasip1
            rustc --version
            cargo --version

            export LLVM_SYS_221_PREFIX=/usr/local/llvm22
            export MAKE=gmake
            /usr/local/llvm22/bin/llvm-config --version

            # The wasm codegen tests link with wasm-ld from the pkg LLVM tree.
            ln -sf /usr/local/llvm22/bin/wasm-ld /usr/local/bin/wasm-ld
            command -v wasmtime && wasmtime --version
            command -v wasm-ld && wasm-ld --version
            command -v bash && bash --version

            # ── Rust builds ────────────────────────────────────────────────
            # Build runtime (release + debug for E2E tests)
            cargo build -p hew-runtime --release
            cargo build -p hew-runtime

            # Build frontend and tools (release)
            cargo build -p hew-cli --release

            # Build frontend (debug — needed by some tests)
            cargo build -p hew-cli

            # Build the consolidated standard library
            cargo build --release -p hew-std

            # ── Tests ──────────────────────────────────────────────────────

            # Install cargo-nextest for slow-timeout envelope (FreeBSD's pkg
            # does not yet carry cargo-nextest, so install via cargo).
            cargo install cargo-nextest --locked

            # Rust workspace tests, with no wasm-cross exclusions: the rustup
            # toolchain above supplies wasm32-wasip1, so the executable WASI
            # cases build the runner from source and run it under the pkg
            # wasmtime, matching the rustup platforms (#1960).
            # Default features include "full" (encryption + profiler + quic),
            # so all QUIC transport tests run without an explicit flag.
            # The ci profile applies the same slow-timeout = 3x60 s envelope
            # as all other platforms, replacing the previous bare cargo test.
            cargo nextest run --workspace \
              --exclude hew-wasm --exclude hew-cabi \
              --profile ci --no-fail-fast

            # hew-cabi is excluded from the workspace run above because its
            # cfg(test) runtime stubs collide with hew-runtime's real symbols
            # at link time. Run it on its own so the C-ABI ownership contract
            # is actually proven on this platform rather than merely skipped.
            cargo nextest run --profile ci -p hew-cabi

            # The authenticated exact checkout must also prove compiled Hew,
            # including loopback network and resource surfaces. Workspace
            # nextest alone does not execute these language-level gates.
            gmake test-vertical-slice
            gmake test-hew-ratchet
