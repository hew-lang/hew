[package]
name = "hew-codec"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Format-neutral serialization events and the CBOR, JSON, YAML, TOML and MessagePack formats for Hew"
keywords = ["hew", "serialization", "cbor", "json", "programming-language"]
categories = ["compilers", "encoding"]

readme = "README.md"
repository = "https://github.com/hew-lang/hew"

[features]
sandbox-schema = ["dep:schemars", "dep:ts-rs"]

[dependencies]
base64.workspace = true
ciborium = "0.2"
rmp-serde.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = { version = "1.2", optional = true }
ts-rs = { version = "12", features = ["no-serde-warnings"], optional = true }
serde_yaml = "0.9"
toml.workspace = true

[lints]
workspace = true
