[[case]]
id = "mailbox_declared_drop_new"
intent = "A declared `overflow drop_new` discards the arriving submission itself, so a view with no `on_full:` reports `Delivery.Discarded` rather than parking."
source = "../vertical-slice/accept/mailbox_declared_drop_new.hew"
suites = ["acceptance"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "1"

[case.expected]
stdout = "DECLARED_DROP_NEW\n"
exit = 43
