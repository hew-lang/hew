id: no-string-keyed-semantic-map
language: rust
severity: error
message: >-
  A semantic map or set is keyed by a rendered string instead of a
  resolver-minted identity (DefId, NominalId, TypeParamId, ModuleId, Symbol).
note: >-
  Declaration-wide facts must use minted identities. Lexical import bindings,
  source spellings, member selectors inside an already selected declaration,
  diagnostic labels and external ABI symbols are separate input namespaces.
files:
  - "hew-types/src/**"
  - "hew-hir/src/**"
  - "hew-sir/src/**"
  - "hew-mir/src/**"
  - "hew-analysis/src/**"
  - "hew-lsp/src/**"
  - "hew-wasm/src/sandbox/**"
  - "hew-compile/src/**"
ignores:
  - "**/tests/**"
  - "**/test/**"
  - "**/*_test.rs"
  - "**/*_tests.rs"
  - "**/tests.rs"
  - "**/dump.rs"
  - "hew-types/src/check/diagnostics.rs"
  - "hew-types/src/runtime_call.rs"
  - "hew-types/src/extern_table.rs"
  - "hew-types/src/extern_symbol.rs"
  - "hew-types/src/vec_authority.rs"
rule:
  kind: field_declaration
  all:
    - has:
        field: name
        regex: "^(type_defs|trait_defs|fn_sigs|declarations|type_declarations|method_ids|method_binders|resource_types|linear_types|handle_types|drop_types|opaque_type_ids|handle_bearing_structs|rendering_members|wire_types|aliases)$"
    - regex: '(HashMap|HashSet|BTreeMap|BTreeSet|IndexMap|IndexSet)\s*<\s*(&(\s*''\w+\s*)?str|String|Cow\s*<\s*str\s*>|Box\s*<\s*str\s*>|Rc\s*<\s*str\s*>|Arc\s*<\s*str\s*>)\s*[,>]'
    - inside:
        kind: struct_item
        stopBy: end
        has:
          field: name
          regex: "^(TypeCheckOutput|Checker|TypeFactContext|TraitRegistry|LowerCtx|ClassContext|HirModule|SemModule|PhysicalModule)$"
  not:
    inside:
      kind: mod_item
      stopBy: end
      follows:
        kind: attribute_item
        regex: 'cfg\(.*\btest\b'
