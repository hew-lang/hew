[[case]]
id = "vec_set_oob_actor_isolated"
intent = "An out-of-bounds `Vec.set()` traps inside a supervised actor; the supervisor restarts the child and the restarted child answers."
source = "../vertical-slice/accept/vec_set_oob_actor_isolated.hew"
suites = ["acceptance"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "4"

[case.expected]
stdout = ""
stderr = "hew: failure: IndexOutOfBounds (205)\nhew: actor crash in VecSetCrasher.boom (actor 1): IndexOutOfBounds\n"
exit = 0
