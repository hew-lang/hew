[[case]]
id = "actor-restarted-role"
intent = "With one scheduler worker, a role restart wait parks while another actor completes timed work, then resumes on the replacement."
source = "cases/actor-restarted-role.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 20
env = { HEW_WORKERS = "1" }

[case.expected]
stdout = "tick\nrestarted\n"
stderr = "hew: failure: UserPanic (212): restart me\nhew: actor crash in Worker.fail (actor 1): UserPanic\nhew: failure: UserPanic (212): restart me\nhew: actor crash in Worker.fail (actor 3): UserPanic\n"
exit = 0
