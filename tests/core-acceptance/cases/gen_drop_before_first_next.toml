[[case]]
id = "gen_drop_before_first_next"
intent = "A generator dropped before its first `.next()` never runs its body, and the drop releases the environment without leaking."
source = "../vertical-slice/accept/gen_drop_before_first_next.hew"
suites = ["acceptance"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "4"

[case.expected]
stdout = "done\n"
exit = 0
