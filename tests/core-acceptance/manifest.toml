# Each case is a supported native program with an exact observable outcome.
# The runner executes every selected case at both optimization levels; matching
# failures are failures, not a differential pass.

[[case]]
id = "vector-copy-values"
intent = "Vector copies mutate independently, and extracted Unicode/NUL strings survive releasing their containing vector."
source = "cases/vector-copy-values.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 15

[case.expected]
stdout = "2:3:4\n"
exit = 0

[[case]]
id = "vector-sibling-extraction"
intent = "Extracting a sibling string from a record with a nested vector preserves both cleanup obligations."
source = "cases/vector-sibling-extraction.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 15

[case.expected]
stdout = "self\n"
exit = 0

[[case]]
id = "vector-nested-result-extraction"
