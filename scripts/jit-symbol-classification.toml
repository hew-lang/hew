# jit: internal — lifecycle, session/global-state, scheduler shutdown/reset/
# drain, and conservative runtime-control hooks that must stay out of any JIT
# session dylib. AOT-linkable only; never JIT-reachable.
#
# Alias-send capability boundary:
#   `hew_actor_send_aliased` and `hew_mailbox_send_aliased` are listed
#   here, NOT in `stable`, because they are an internal runtime seam, not
#   part of the stable external FFI surface.  The native bodies now
#   deliver an aliased message via the envelope-mode enqueue (the
#   envelope's single refcount is released exactly once across every
#   exit; see `send_aliased_with_overflow`), but the codegen alias
#   lowering that drives them is still gated off in `ActorSendOpLowering`
#   until the codegen branch lands, and JIT-reachability / the WASM gate
#   are evaluated in their own slices.  Promote to `stable` (and wire JIT
#   linkage) only when the codegen alias path flips on and the WASM send
#   gate is in place.
internal = [
  "_start",
  "hew_actor_drain_outcome_free",
  # `hew_actor_free` is the actor-side twin of `hew_mailbox_free`: it destroys
  # the private system queue, four calls down, on an actor pointer the caller
  # chooses at a moment the caller chooses. `scripts/sys-lane-closure.py` names
  # it with a witness path the instant the teardown edge is not waived, and no
  # value of the waiver reason changes the fact that a user-declarable
  # destructor is a user-declarable destruction of system state. Unlike
  # `hew_mailbox_new*`, the constructors do NOT move with it: a spawned actor is
  # runtime-TRACKED (live-actor registry, scheduler, supervision tree) and is
  # reclaimed by `hew_runtime_cleanup`, `hew_actor_group_destroy` and supervisor
  # teardown, so withholding the raw destructor strands nothing. A raw mailbox
  # was untracked, which is why that constructor family was a leak factory and
  # this one is not.
  "hew_actor_free",
  "hew_actor_drain_set",
  "hew_actor_state_lock_poison_after_panic",
  "hew_actor_state_lock_release_after_panic",
  # `hew_actor_trap` is the runtime's crash entry point, and it took BOTH of a
  # system signal's inputs from its arguments: `actor` chooses which actor goes
  # terminal and whose links, monitors and parent supervisor are notified, and
  # `error_code` chooses the terminal state (`Crashed` when nonzero, `Stopped`
  # otherwise) and the reason the resulting `Exit` / `Down` / `ChildCrashed`
  # carries. A user program that could declare this symbol in an `extern` rt
  # block could therefore compose a lifecycle event for an actor it merely
  # holds a handle to, which is exactly the capability the three
  # `hew_actor_trap -> ...` authenticated edges below claim no caller has. The
  # edges are kept — the runtime's own crash paths still need them — but their
  # premise is now true of every remaining caller, because no remaining caller
  # is user-declarable.
  #
