name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base. Restricting this to `main` meant a
  # stacked PR (based on another branch) received no checks at all, so its
  # merge gate could report READY with nothing having run. A stacked branch
  # is exactly where a break is easiest to miss.
  pull_request:
  # The main merge queue. Branch protection requires `Clippy & format` and
  # `Build & test (Linux)`; GitHub waits for checks of exactly those names on
  # the queue's temporary merge commit, so this workflow must run there too or
  # every queued pull request stalls. The jobs read no pull-request context,
  # and the queue ref (gh-readonly-queue/main/...) is unique per entry, so the
  # concurrency group below never cancels a queued run.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# A push to a branch makes any run still going for that same ref obsolete:
# its verdict can no longer gate anything, because a newer commit exists.
# Those runs were still holding runners, so 15 open pull requests could
# starve the queue and nothing scheduled at all. Never cancel on main —
# a push there must complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  pull-requests: read

env:
  # Pinned wasmtime release tag. Every job that provisions a WASI runner
  # downloads its per-platform asset from THIS tag. It is pinned, and pinned in
  # one place, for two reasons: resolving "latest" per job (as the Linux job
  # did) or taking whatever a package manager ships (as macOS did with brew)
  # let the three platforms straddle different wasmtime releases inside a
  # single run, so a WASI behaviour difference could be read as a platform
  # difference; and an unpinned runtime changes the tested surface without a
  # commit. Assets used: x86_64-linux.tar.xz, aarch64-macos.tar.xz,
  # x86_64-windows.zip.
  WASMTIME_VERSION: "v47.0.2"
  SHELLCHECK_VERSION: "0.11.0"
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Source lint and formatting. Keep the established required-check name.
  # Behaviour tests and compiler measurements have separate results below.
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: Clippy & format
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-ubuntu-dns

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node.js for Observe protocol codecs
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install mold
        timeout-minutes: 5
        run: .github/scripts/install-ubuntu-packages.sh mold

      - uses: ./.github/actions/setup-rust-build
        with:
          components: "clippy, rustfmt"
          targets: wasm32-wasip1
          cache-shared-key: lint

      - name: Install LLVM
        uses: ./.github/actions/setup-llvm

      - name: Install ShellCheck
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: shellcheck@${{ env.SHELLCHECK_VERSION }}

      - name: Provision pinned ast-grep toolchain
        id: lint-tools
        uses: ./.github/actions/setup-ast-grep

      # Run each category even if another fails, once provisioning succeeds.
      # make lint combines these same targets for local use.
      - name: Rust lint and formatting
        if: ${{ !cancelled() && steps.lint-tools.outcome == 'success' }}
        run: make lint-rust

      - name: Source and ABI contracts
        if: ${{ !cancelled() && steps.lint-tools.outcome == 'success' }}
        run: make -k lint-source

      - name: Hew source formatting
        if: ${{ !cancelled() && steps.lint-tools.outcome == 'success' }}
        run: make hew-fmt-check

  tooling:
    name: Build tooling and checker tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-ubuntu-dns

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install ShellCheck
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: shellcheck@${{ env.SHELLCHECK_VERSION }}

      - name: Verify build tooling and checker behaviour
        # Noble ships the LLVM 18 tools in a versioned directory.
        run: PATH="$PATH:/usr/lib/llvm-18/bin" make -k test-tooling compile-determinism-selftest

  # ─────────────────────────────────────────────────────────────────────────
  # Browser/playground smoke — repo-local browser tooling coverage only.
  # Runs analysis and source-to-VM tests, checks manifest freshness and builds
  # the browser WASM artifact consumed by native parity in the sandbox-parity job.
  # ─────────────────────────────────────────────────────────────────────────
  playground-wasm-build:
    name: Playground WASM build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-ubuntu-dns

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install mold
        timeout-minutes: 5
        run: .github/scripts/install-ubuntu-packages.sh mold

      - uses: ./.github/actions/setup-rust-build
        with:
          targets: wasm32-unknown-unknown
          cache-shared-key: playground-wasm

      - name: Install wasm-pack v0.13.1 and Binaryen 117
        uses: ./.github/actions/setup-wasm-pack

      - name: Set up Node.js for browser execution
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hew-sandbox-vm/package-lock.json

      - name: Check sandbox fixtures are current
        # The committed sandbox fixtures are generated from in-tree sources; a
        # stale fixture makes the parity gate assert against the wrong baseline.
        run: make sandbox-fixtures-check

      - name: Check repo-local playground browser/tooling smoke
        run: make playground-check

      - name: Upload tested browser compiler
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playground-wasm-${{ github.sha }}
          path: hew-wasm/pkg/
          retention-days: 1
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Compiled-Hew artifact — one Linux build for the language-suite consumers
  # ─────────────────────────────────────────────────────────────────────────
  compiled-hew-linux:
    name: Build compiled Hew artifact (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-ubuntu-dns

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install mold
        timeout-minutes: 5
        run: .github/scripts/install-ubuntu-packages.sh mold

      - name: Install LLVM
        uses: ./.github/actions/setup-llvm

      - uses: ./.github/actions/setup-rust-build
        with:
          targets: wasm32-wasip1
          cache-shared-key: compiled-hew-linux

      - name: Build compiler, native archive, WASI runtime and xtask once
        run: |
          make hew-native wasm-runtime-debug xtask-debug
          mkdir -p compiled-hew/debug compiled-hew/wasm32-wasip1/debug
          cp target/debug/hew target/debug/xtask target/debug/libhew_native.a \
            target/debug/libhew_native.so target/debug/libhew_runtime.a compiled-hew/debug/
          # The versioned name the shared runtime records (a link to libhew_native.so).
          cp -P target/debug/libhew.so.* compiled-hew/debug/
          cp target/wasm32-wasip1/debug/libhew_runtime.a \
            target/wasm32-wasip1/debug/libhew_std.a compiled-hew/wasm32-wasip1/debug/
          # Relocated toolchain layout: the binary finds std at <exe_dir>/../std.
          cp -R std compiled-hew/std
          tar -czf compiled-hew-linux.tar.gz compiled-hew

      - name: Upload compiled Hew bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiled-hew-linux-${{ github.sha }}
          path: compiled-hew-linux.tar.gz
          retention-days: 1
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Compiled-Hew suites — four stable O0/O2 hash partitions
  # ─────────────────────────────────────────────────────────────────────────
  compiled-hew-shards:
    name: Compiled Hew suites (shard ${{ matrix.shard }}/4)
    needs: compiled-hew-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-ubuntu-dns

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install LLVM
        uses: ./.github/actions/setup-llvm

      - name: Download compiled Hew bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiled-hew-linux-${{ github.sha }}
          path: ${{ runner.temp }}/compiled-hew-download

      - name: Unpack compiled Hew bundle
        run: |
          mkdir -p "${{ runner.temp }}/compiled-hew-artifact"
          tar -xzf "${{ runner.temp }}/compiled-hew-download/compiled-hew-linux.tar.gz" \
            -C "${{ runner.temp }}/compiled-hew-artifact"

      - name: Run O0 and O2 shard
        run: >-
          python3 scripts/compiled-hew-shards.py run
          --compiler "${{ runner.temp }}/compiled-hew-artifact/compiled-hew/debug/hew"
          --partition "hash:${{ matrix.shard }}/4"
          --output-dir target/hew-shards

      - name: Upload shard reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiled-hew-shard-${{ matrix.shard }}-${{ github.sha }}
          path: target/hew-shards/
          retention-days: 1
          if-no-files-found: error

  compiled-hew-aggregate:
    # This aggregate retains the established required-check name while the
    # Rust and compiled-Hew suites execute in parallel. GitHub reports a matrix
    # dependency as successful only when every leg succeeds, so one assertion
    # here covers all Rust shards and tooling tests. Compiled-Hew reporting
    # remains independent of failures in those other gate groups.
    name: Build & test (Linux)
    needs:
      [
        compiled-hew-linux,
        compiled-hew-shards,
        acceptance,
        doc-examples,
        nextest,
        hew-corpus,
        sandbox-parity,
        tooling,
      ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_TARGET_DIR: target
      HOST_TRIPLE: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-ubuntu-dns

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v7.1.0
        with:
          python-version: "3.12"
        if: always()

      - name: Download compiled Hew bundle
        if: >-
          always() &&
          needs.compiled-hew-linux.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiled-hew-linux-${{ github.sha }}
          path: ${{ runner.temp }}/compiled-hew-download

      - name: Unpack compiled Hew bundle
        if: >-
          always() &&
          needs.compiled-hew-linux.result == 'success'
        run: |
          mkdir -p "${{ runner.temp }}/compiled-hew-artifact"
          tar -xzf "${{ runner.temp }}/compiled-hew-download/compiled-hew-linux.tar.gz" \
            -C "${{ runner.temp }}/compiled-hew-artifact"

      - name: Download every shard report
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: compiled-hew-shard-*-${{ github.sha }}
          path: ${{ runner.temp }}/compiled-hew-reports
          merge-multiple: true

      - name: Report compiled Hew shard failures
        if: always()
        run: >-
          python3 scripts/compiled-hew-shards.py report
          --reports-dir "${{ runner.temp }}/compiled-hew-reports"
          --shard-count 4

      - name: Require every shard to complete
        id: require-every-shard
        if: always()
        env:
          BUILD_RESULT: ${{ needs.compiled-hew-linux.result }}
          SHARD_RESULT: ${{ needs.compiled-hew-shards.result }}
        run: |
          set -euo pipefail
          for leg in BUILD_RESULT SHARD_RESULT; do
            result="${!leg}"
            if [ "$result" = success ]; then
              continue
            fi
            echo "::error::$leg is '$result' (expected success)"
            exit 1
          done

      - name: List the independent full suite inventory
        id: full-inventory
        if: >-
          always() &&
          needs.compiled-hew-linux.result == 'success'
        run: |
          "${{ runner.temp }}/compiled-hew-artifact/compiled-hew/debug/hew" \
            test tests/hew --list > "${{ runner.temp }}/compiled-hew-full.txt"

      - name: Assert shard union and Hew ratchet
        id: hew-ratchet
        if: >-
          always() &&
          steps.require-every-shard.outcome == 'success' &&
          steps.full-inventory.outcome == 'success'
        env:
          XTASK_BIN: ${{ runner.temp }}/compiled-hew-artifact/compiled-hew/debug/xtask
          HEW_XTASK_BIN: ${{ runner.temp }}/compiled-hew-artifact/compiled-hew/debug/xtask
        run: >-
          make test-hew-ratchet
          HEW_SHARD_REPORT_DIR="${{ runner.temp }}/compiled-hew-reports"
          HEW_FULL_INVENTORY="${{ runner.temp }}/compiled-hew-full.txt"
          HEW_SHARD_COUNT=4

      - name: Assert shard union and O2 differential
        id: o2-differential
        if: >-
          always() &&
          steps.require-every-shard.outcome == 'success' &&
          steps.full-inventory.outcome == 'success'
        env:
          XTASK_BIN: ${{ runner.temp }}/compiled-hew-artifact/compiled-hew/debug/xtask
          HEW_XTASK_BIN: ${{ runner.temp }}/compiled-hew-artifact/compiled-hew/debug/xtask
        run: >-
          make test-o2-differential
          HEW_SHARD_REPORT_DIR="${{ runner.temp }}/compiled-hew-reports"
          HEW_FULL_INVENTORY="${{ runner.temp }}/compiled-hew-full.txt"
          HEW_SHARD_COUNT=4

      - name: Finalize compiled Hew JUnit reports
        if: always()
        env:
          HEW_XTASK_BIN: ${{ runner.temp }}/compiled-hew-artifact/compiled-hew/debug/xtask
        run: >-
          python3 scripts/compiled-hew-shards.py finalize
          --reports-dir "${{ runner.temp }}/compiled-hew-reports"
          --output-dir "${{ runner.temp }}/compiled-hew-published"
          --full-inventory "${{ runner.temp }}/compiled-hew-full.txt"
          --prerequisites-succeeded "${{ steps.hew-ratchet.outcome == 'success' && steps.o2-differential.outcome == 'success' }}"

      - name: Upload compiled Hew test reports
        if: always()
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
        with:
          report_paths: "${{ runner.temp }}/compiled-hew-published/*.xml"
          check_name: Compiled Hew Test Results

      # Unrelated gate failures must block the required result without hiding
      # the compiled-Hew inventory, ratchet or differential diagnostics above.
      - name: Require Linux gates and tooling checks
        if: always()
        env:
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
          DOC_EXAMPLES_RESULT: ${{ needs.doc-examples.result }}
          NEXTEST_RESULT: ${{ needs.nextest.result }}
          HEW_CORPUS_RESULT: ${{ needs.hew-corpus.result }}
          SANDBOX_PARITY_RESULT: ${{ needs.sandbox-parity.result }}
          TOOLING_RESULT: ${{ needs.tooling.result }}
        run: |
          status=0
          for leg in ACCEPTANCE_RESULT DOC_EXAMPLES_RESULT NEXTEST_RESULT HEW_CORPUS_RESULT SANDBOX_PARITY_RESULT TOOLING_RESULT; do
            result="${!leg}"
            if [ "$result" != success ]; then
              echo "::error::$leg is '$result' (expected success)"
              status=1
            fi
          done
          exit "$status"

  # The remaining pull-request gates consume the same compiler, xtask and static
  # archives. Make's -o flag marks the already-installed artefacts as current;
  # each source gate still runs its normal recipe and checks actual behaviour.
  acceptance:
    name: Core acceptance and integrations (${{ matrix.shard }}/4)
    needs: compiled-hew-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      CARGO_TARGET_DIR: target
      HOST_TRIPLE: x86_64-unknown-linux-gnu
      XTASK_BIN: ${{ github.workspace }}/target/debug/xtask
      HEW_XTASK_BIN: ${{ github.workspace }}/target/debug/xtask
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Avoid implicit rustup bootstrap on non-Cargo shards
        if: matrix.shard != 0
        run: |
          echo "CARGO_TARGET_DIR=target" >> "$GITHUB_ENV"
          echo "HOST_TRIPLE=x86_64-unknown-linux-gnu" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-ubuntu-dns
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install MQTT clients
        if: matrix.shard == 3
        timeout-minutes: 5
        run: .github/scripts/install-ubuntu-packages.sh mosquitto-clients
      - uses: ./.github/actions/setup-llvm
      # Only package-import and package-install invoke Cargo/rustup directly.
      - uses: ./.github/actions/setup-rust-build
        if: matrix.shard == 0
        with:
          cache-shared-key: acceptance-pkg
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiled-hew-linux-${{ github.sha }}
          path: ${{ runner.temp }}/compiled-hew-download
      - name: Install compiled Hew artefacts
        id: native_bundle
        run: bash scripts/ci-install-compiled-hew.sh "${{ runner.temp }}/compiled-hew-download/compiled-hew-linux.tar.gz"
      - name: Run core acceptance partition
        run: make -o hew-native core-acceptance CORE_ACCEPTANCE_ARGS="--partition ${{ matrix.shard }}/4"
      - name: Run package integration
        if: ${{ !cancelled() && steps.native_bundle.outcome == 'success' && matrix.shard == 0 }}
        run: make -k -o hew-native test-pkg-import test-package-install
      - name: Run determinism and stdlib integrations
        if: ${{ !cancelled() && steps.native_bundle.outcome == 'success' && matrix.shard == 1 }}
        run: make -k -o hew-native compile-determinism-verify stdlib-user-build-clean stdlib-errno-gate
      # Workspace nextest owns host_export_e2e; run the C/C++ client oracle here.
      - name: Run C extern and host client integrations
        if: ${{ !cancelled() && steps.native_bundle.outcome == 'success' && matrix.shard == 2 }}
        run: make -k -o hew-native test-extern-bytes test-host-client-c
      - name: Run migration and MQTT integrations
        if: ${{ !cancelled() && steps.native_bundle.outcome == 'success' && matrix.shard == 3 }}
        run: make -k -o hew-native test-migrate-corpus mqtt-broker-e2e

  doc-examples:
    name: Documentation examples
    needs: compiled-hew-linux
    if: ${{ !cancelled() && needs.compiled-hew-linux.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: target
      HOST_TRIPLE: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/setup-ubuntu-dns
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v7.1.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-llvm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiled-hew-linux-${{ github.sha }}
          path: ${{ runner.temp }}/compiled-hew-download
      - name: Install compiled Hew artefacts
        id: native_bundle
        run: bash scripts/ci-install-compiled-hew.sh "${{ runner.temp }}/compiled-hew-download/compiled-hew-linux.tar.gz"
      - name: Run documentation examples
        if: ${{ !cancelled() && steps.native_bundle.outcome == 'success' }}
        run: make -o hew-native test-doc-examples

  nextest:
    name: Workspace nextest (${{ matrix.shard }}/4)
    needs: compiled-hew-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      XTASK_BIN: ${{ github.workspace }}/target/debug/xtask
      HEW_XTASK_BIN: ${{ github.workspace }}/target/debug/xtask
      NEXTEST_PARTITION_MODE: count
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-ubuntu-dns
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install mold and GDB
        timeout-minutes: 5
        run: .github/scripts/install-ubuntu-packages.sh mold gdb
      - uses: ./.github/actions/setup-llvm
      - uses: ./.github/actions/setup-rust-build
        with:
          targets: wasm32-wasip1
          tools: nextest@0.9.120
          cache-shared-key: nextest
      - name: Install wasmtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="wasmtime-${WASMTIME_VERSION}-x86_64-linux"
          .github/scripts/retry-download.sh \
            gh release download "$WASMTIME_VERSION" --repo bytecodealliance/wasmtime \
            --pattern "${dir}.tar.xz" --dir "${RUNNER_TEMP}" --clobber
          tar -xJf "${RUNNER_TEMP}/${dir}.tar.xz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/${dir}" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/${dir}/wasmtime" --version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiled-hew-linux-${{ github.sha }}
          path: ${{ runner.temp }}/compiled-hew-download
      - name: Install compiled Hew artefacts
        id: native_bundle
        run: bash scripts/ci-install-compiled-hew.sh "${{ runner.temp }}/compiled-hew-download/compiled-hew-linux.tar.gz"
      - name: Run workspace test partition with ratchet accounting
        run: make -o test-artifacts test NEXTEST_PARTITION="${{ matrix.shard }}/4"
      - name: Run C ABI crate tests
        if: ${{ !cancelled() && steps.native_bundle.outcome == 'success' && matrix.shard == 4 }}
        run: make test-cabi
      - name: Run functional observe harness
        if: ${{ !cancelled() && steps.native_bundle.outcome == 'success' && matrix.shard == 3 }}
        run: make -o hew-native observe-functional-test
      # Workspace nextest owns leak_harness_fail_closed; run the nextest-backed
      # and actor leak-balance counterfactual scripts where nextest is installed.
      - name: Run leak oracle counterfactual scripts
        if: ${{ !cancelled() && steps.native_bundle.outcome == 'success' && matrix.shard == 4 }}
        run: make -o hew-native test-leak-oracle-scripts
      - name: Upload test reports
        if: always()
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
        with:
          report_paths: "{target/nextest/ci/ratchet.xml,target/nextest/ci-cabi/junit.xml}"
          check_name: Test Results (Linux nextest ${{ matrix.shard }}/4)
          fail_on_failure: true
          fail_on_parse_error: true
          require_tests: true

  hew-corpus:
    name: Source corpus check
    needs: compiled-hew-linux
    if: ${{ !cancelled() && needs.compiled-hew-linux.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: target
      HOST_TRIPLE: x86_64-unknown-linux-gnu
      XTASK_BIN: ${{ github.workspace }}/target/debug/xtask
      HEW_XTASK_BIN: ${{ github.workspace }}/target/debug/xtask
      # Acceptance shard 1 checks every stdlib source more strictly, and
      # its result is required by the same Linux aggregate as this job.
      HEW_CORPUS_SKIP_STDLIB: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/setup-ubuntu-dns
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiled-hew-linux-${{ github.sha }}
          path: ${{ runner.temp }}/compiled-hew-download
      - name: Install compiled Hew artefacts
        id: native_bundle
        run: bash scripts/ci-install-compiled-hew.sh "${{ runner.temp }}/compiled-hew-download/compiled-hew-linux.tar.gz"
      - name: Run full source corpus check
        if: ${{ !cancelled() && steps.native_bundle.outcome == 'success' }}
        run: make -o hew-native hew-check-all

  sandbox-parity:
    name: Sandbox parity
    needs: [compiled-hew-linux, playground-wasm-build]
    if: ${{ !cancelled() && needs.compiled-hew-linux.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-ubuntu-dns
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install mold
        timeout-minutes: 5
        run: .github/scripts/install-ubuntu-packages.sh mold
      - uses: ./.github/actions/setup-llvm
      - uses: ./.github/actions/setup-rust-build
        with:
          cache-shared-key: sandbox-parity
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hew-sandbox-vm/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiled-hew-linux-${{ github.sha }}
          path: ${{ runner.temp }}/compiled-hew-download
      - name: Install compiled Hew artefacts
        id: native_bundle
        run: bash scripts/ci-install-compiled-hew.sh "${{ runner.temp }}/compiled-hew-download/compiled-hew-linux.tar.gz"
      - name: Download tested browser compiler
        id: browser_compiler
        if: ${{ needs.playground-wasm-build.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: playground-wasm-${{ github.sha }}
          path: hew-wasm/pkg
      - name: Check sandbox VM and parity suite
        if: ${{ !cancelled() && steps.native_bundle.outcome == 'success' }}
        env:
          HEW_WASM_MODULE: file://${{ github.workspace }}/hew-wasm/pkg/hew_wasm.js
          BROWSER_PACKAGE_RESULT: ${{ steps.browser_compiler.outcome }}
          # Playground WASM build already ran --lib and PLAYGROUND_CHECK_TESTS
          # under make playground-check; run all remaining tests plus --doc.
          SANDBOX_PARITY_SKIP_PLAYGROUND: "1"
        run: |
          if [[ "$BROWSER_PACKAGE_RESULT" != success ]]; then
            echo "::error::Sandbox parity requires the tested browser compiler artifact."
            make -k -o hew-native -o wasm-runtime sandbox-vm-test
            exit 1
          fi
          make -k -o hew-native -o wasm-runtime sandbox-vm-test sandbox-parity
