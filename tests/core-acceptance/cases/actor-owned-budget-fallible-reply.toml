[[case]]
id = "actor-owned-budget-fallible-reply"
intent = "Declared reply envelopes charge their actual Result payload rather than the outer ActorError carrier."
source = "cases/actor-owned-budget-fallible-reply.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "2"

[case.expected]
stdout = "9\ndeclared reply limit\n9\n"
stderr = "hew: failure: HeapExceeded (200)\nhew: actor crash in Small.run (actor 3): HeapExceeded\n"
exit = 1
