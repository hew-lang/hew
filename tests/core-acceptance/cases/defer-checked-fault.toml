[[case]]
id = "defer-checked-fault"
intent = "A checked arithmetic failure is materialized before deferred code can add a secondary panic."
source = "cases/defer-checked-fault.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 15

[case.expected]
stdout = ""
stderr = "hew: failure: DivideByZero (202)\nhew: secondary failure: UserPanic (212): cleanup\n"
exit = 1
