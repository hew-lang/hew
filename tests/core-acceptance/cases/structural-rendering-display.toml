[[case]]
id = "structural-rendering-display"
intent = "Render a report through generic functions, nested collections and enum fields while preserving declared variant forms and exact user Display specializations; all borrowed inputs remain usable."
source = "cases/structural-rendering-display.hew"
suites = ["acceptance", "safety"]
