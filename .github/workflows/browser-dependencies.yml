# Browser package dependencies — read-only helpers for the sites that consume
# @hew-lang/wasm, @hew-lang/sandbox-vm and @hew-lang/playground-sandbox from
# the GitHub Packages registry, which needs authentication to read.
#
#   inspect  record every published version of those packages
#   resolve  install a consumer commit (playground SDK, hew.sh or hew.run)
#            from the registry, validate it, and upload the authentic
#            package-lock.json and archives for that consumer to commit
#
# Nothing here publishes; release.yml owns publication.

name: Browser package dependencies

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Inspect registry versions or resolve a consumer"
        type: choice
        options: [inspect, resolve]
        default: inspect
      consumer:
        description: "Consumer whose committed dependencies should be resolved"
        type: choice
        options: [sdk, website, playground]
        default: sdk
      source_commit:
        description: "Exact consumer commit for dependency resolution"
        type: string

permissions:
  contents: read

jobs:
  inspect:
    if: inputs.operation == 'inspect'
    name: Inspect published package versions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@hew-lang"
      - name: Read registry versions
        run: node scripts/resolve-browser-dependencies.mjs inspect
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HEW_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
          HEW_DEPENDENCY_ARTIFACT_DIR: ${{ runner.temp }}/browser-packages
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-package-versions
          path: ${{ runner.temp }}/browser-packages
          if-no-files-found: error

  resolve:
    if: inputs.operation == 'resolve'
    name: Resolve and validate consumer dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Select immutable consumer source
        id: source
        env:
          CONSUMER: ${{ inputs.consumer }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_COMMIT}" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::source_commit must be a full commit SHA"; exit 1; }
          case "${CONSUMER}" in
            sdk) repository=hew-lang/playground-sandbox ;;
            website) repository=hew-lang/hew.sh ;;
            playground) repository=hew-lang/hew.run ;;
            *) exit 1 ;;
          esac
          echo "repository=${repository}" >> "${GITHUB_OUTPUT}"
      - name: Checkout Hew tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: hew
      - name: Checkout consumer
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ inputs.source_commit }}
          path: consumer
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@hew-lang"
      - name: Resolve authentic registry lockfile and archives
        working-directory: consumer
        run: node ../hew/scripts/resolve-browser-dependencies.mjs resolve
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HEW_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
          HEW_CONSUMER_REPOSITORY: ${{ steps.source.outputs.repository }}
          HEW_CONSUMER_COMMIT: ${{ inputs.source_commit }}
          HEW_DEPENDENCY_ARTIFACT_DIR: ${{ runner.temp }}/browser-packages
      - name: Validate installed consumer
        working-directory: consumer
        env:
          CONSUMER: ${{ inputs.consumer }}
        run: |
          set -euo pipefail
          case "${CONSUMER}" in
            sdk) npm run test:sdk ;;
            website) npm run test -- --run ;;
            playground) npm run check && npm run build ;;
          esac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-dependencies-${{ inputs.consumer }}-${{ inputs.source_commit }}
          path: ${{ runner.temp }}/browser-packages
          if-no-files-found: error
