[[case]]
id = "indexed-field-write-in-place"
intent = "A var self or local write through an element of a collection field updates the element in place, and a fault before it publishes leaves the seat whole for the crash hook."
source = "cases/indexed-field-write-in-place.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 60

[case.expected]
stdout = "[2 false][1 true][1 true][1 true]\n[1 false][1 true][1 false][0 true]\n[1 false][0 true]\nseat [1 false][0 true]\n[1 false][0 true]\nseat [1 false][0 true]\ndone\n"
stderr = "hew: failure: IndexOutOfBounds (205)\nhew: actor crash in Words.mark_missing (actor 1): IndexOutOfBounds\nhew: failure: IndexOutOfBounds (205)\nhew: actor crash in Words.link_missing (actor 2): IndexOutOfBounds\n"
exit = 1
