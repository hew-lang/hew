[[case]]
id = "hashset-iteration"
intent = "HashSet into_iter and for loops share an owned snapshot cursor: scalar and string elements survive source mutation, exhaustion and early break release managed elements, and field, tuple and temporary sources retain their type and evaluate once without depending on iteration order."
source = "cases/hashset-iteration.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 60

[case.expected]
stdout = "scalar 2 42 1 true\ncurrent 99 1\nowned 8 0\nbreak 1 2\nevaluated\nevaluated\nevaluated\nshapes 4 4 4 4 2\n"
exit = 0
stderr = ""
