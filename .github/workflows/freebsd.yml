# FreeBSD CI — nightly regression testing on FreeBSD 15.0
#
# FreeBSD is a tier-1 platform. LLVM 22 is available via FreeBSD `pkg`
# (llvm22-22.1.2 on FreeBSD 15.0 latest), so no source build is needed.
# Uses vmactions/freebsd-vm@v1 to run FreeBSD in QEMU on an Ubuntu host.

name: FreeBSD CI

on:
  schedule:
    # Run daily at 07:00 UTC (after nightly-sanitizers at 06:00)
    - cron: "0 7 * * *"
  workflow_dispatch:

# A push to a branch makes any run still going for that same ref obsolete:
# its verdict can no longer gate anything, because a newer commit exists.
# Those runs were still holding runners, so 15 open pull requests could
# starve the queue and nothing scheduled at all. Never cancel on main —
# a push there must complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write

env:
  LLVM_VERSION: "22"
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & test (FreeBSD x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Restore compiled Hew fixture verdicts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: target/hew-test-cache
          key: hew-suite-v3-freebsd-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: hew-suite-v3-freebsd-x86_64-

      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@a6de9343ef5747433d9c25784c90e84998b9d69a  # v1.4.6
        with:
          release: "15.0"
          mem: 8192
          prepare: |
            bash scripts/ci/freebsd-setup.sh prepare hew-ci

          run: |
            set -eux
            id
            test "$(id -u)" = 0

            chown -R hew-ci:hew-ci "$GITHUB_WORKSPACE"
            su -m hew-ci -c 'bash -s' <<'HEW_FREEBSD_CI'
            set -eux
            export HOME=/home/hew-ci
            id
            test "$(id -u)" -ne 0

            git config --global --add safe.directory "$(pwd)"
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            source scripts/ci/freebsd-setup.sh
            hew_freebsd_activate freebsd
            command -v gdb || command -v lldb || {
              echo "No debugger found: install the FreeBSD gdb package or LLVM's lldb package" >&2
              exit 1
            }
            cargo xtask build native --release
            cargo xtask gate freebsd
            HEW_FREEBSD_CI

      - name: Upload test reports
        # vmactions/freebsd-vm syncs the working directory back to this host
        # runner after the guest `run:` script exits (proven by release.yml's
        # build-freebsd-aarch64 job, which packages a tarball entirely inside
        # the VM's run block and then reads it from a host-side
        # actions/upload-artifact step) — so the reports written by the
        # guest's nextest and hew-suite-ratchet runs are present here.
        if: always()
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d  # v6.4.1
        with:
          report_paths: "target/nextest/ci/junit.xml,target/nextest/ci-cabi/junit.xml,target/nextest/ci-focused/junit.xml,target/hew-test-reports/hew-suite-ratchet.xml"
          check_name: Test Results (FreeBSD)
