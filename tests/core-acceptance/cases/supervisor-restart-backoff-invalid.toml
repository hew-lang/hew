[[case]]
id = "supervisor-restart-backoff-invalid"
intent = "Invalid ordinary backoff values, at supervisor or child level, are refused before any child starts: a zero initial with a positive maximum, a negative initial and inverted bounds. Both zero is restart.immediate() and is accepted."
source = "cases/supervisor-restart-backoff-invalid.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 10

[case.env]
HEW_DETERMINISTIC = ""

[case.expected]
stdout = "invalid policies refused before construction\n"
exit = 0
