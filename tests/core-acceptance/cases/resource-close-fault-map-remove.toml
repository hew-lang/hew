[[case]]
id = "resource-close-fault-map-remove"
intent = "A map removal that faults while releasing its key still owns and releases the returned value, the borrowed query and surrounding resource."
source = "cases/resource-close-fault-map-remove.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.expected]
stdout = "close 1\nclose 3\nclose 2\nclose 99\n"
stderr = "hew: failure: UserPanic (212): close 1 failed\nhew: secondary failure: UserPanic (212): close 3 failed\nhew: secondary failure: UserPanic (212): close 2 failed\nhew: secondary failure: UserPanic (212): close 99 failed\n"
exit = 1
