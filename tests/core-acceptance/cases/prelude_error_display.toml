[[case]]
id = "prelude_error_display"
intent = "The prelude error enums declared in `std/builtins.hew` print variant-first: the variant name, then the detail."
source = "../vertical-slice/accept/prelude_error_display.hew"
suites = ["acceptance"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "4"

[case.expected]
stdout = "Closed: the sink or connection is closed\nNotFound: no actor is registered under the requested name\nNodeNotRunning: the local node is not running\nDead: the target actor has already exited\n"
exit = 0
