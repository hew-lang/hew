name: Setup pinned ast-grep
description: >
  Provision the pinned ast-grep binary and the Hew tree-sitter grammar into
  .ast-grep/, either by building it (source: install) or by unpacking the
  toolchain artifact another job already built (source: artifact). Both paths
  end at the same verification, so a consumer cannot accept a tree the producer
  would have rejected.

inputs:
  source:
    description: "install (build, cache-backed) or artifact (unpack a built tree)"
    required: false
    default: install
  artifact-name:
    description: "Artifact to unpack when source is artifact"
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Keyed on every input the build consumes; the grammar is a native shared
    # object, so OS and arch are in the key. Restore everywhere, save only from
    # the default branch and only after a miss: a pull request writing
    # ref-scoped entries evicts the one every branch could read, and two jobs
    # saving one key race.
    - name: Restore pinned ast-grep toolchain
      id: cache
      if: inputs.source == 'install'
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
      with:
        path: .ast-grep
        key: ast-grep-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/ast-grep.lock', 'tools/tree-sitter-hew-consume-parameter.patch', 'scripts/ast-grep-lint.sh', 'scripts/build-ast-grep-lang.sh') }}

    # Re-checks --version against tools/ast-grep.lock and the grammar
    # archive's SHA-256 every time, so a stale cache is rebuilt not trusted.
    - name: Bootstrap pinned ast-grep toolchain
      if: inputs.source == 'install'
      shell: bash
      run: make structural-lint-bootstrap-install

    - name: Download the pinned ast-grep toolchain
      if: inputs.source == 'artifact'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/ast-grep-toolchain

    # The tarball is rooted inside .ast-grep, so nothing lands outside it.
    - name: Unpack the pinned ast-grep toolchain
      if: inputs.source == 'artifact'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p .ast-grep
        tar --zstd -xf "$RUNNER_TEMP/ast-grep-toolchain/ast-grep-toolchain.tar.zst" -C .ast-grep

    # Both paths land here. Consumers read this exact path, so prove it runs
    # where the diagnostic is still "provisioning failed".
    - name: Verify pinned ast-grep runs
      shell: bash
      run: |
        set -euo pipefail
        .ast-grep/tool/bin/ast-grep --version
        test -f .ast-grep/hew-lang.so

    # After the verification, never before it.
    - name: Save pinned ast-grep toolchain
      if: inputs.source == 'install' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
      with:
        path: .ast-grep
        key: ${{ steps.cache.outputs.cache-primary-key }}
