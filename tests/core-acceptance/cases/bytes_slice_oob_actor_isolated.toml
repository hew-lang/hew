[[case]]
id = "bytes_slice_oob_actor_isolated"
intent = "An out-of-bounds byte-slice range traps inside the actor and the runtime names the failure and the actor it fired in."
source = "../vertical-slice/accept/bytes_slice_oob_actor_isolated.hew"
suites = ["acceptance"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "4"

[case.expected]
stdout = ""
stderr = "hew: failure: IndexOutOfBounds (205)\nhew: actor crash in BytesSliceCrasher.boom (actor 1): IndexOutOfBounds\n"
exit = 1
