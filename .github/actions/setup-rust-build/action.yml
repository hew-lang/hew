name: Setup Rust build environment
description: >
  Install the stable Rust toolchain, optional cargo tools (via
  taiki-e/install-action), Swatinem/rust-cache for the registry/deps
  layer, and mozilla-actions/sccache-action for the workspace-crate
  compilation cache (GitHub Actions cache backend, content-addressed,
  disk-safe).  Extracts the repeated setup sequence that every Rust job
  in ci.yml and release-gate.yml otherwise duplicates.

inputs:
  components:
    description: >
      Comma-separated toolchain components to pass to dtolnay/rust-toolchain
      (e.g. 'clippy, rustfmt' for lint; 'llvm-tools' for coverage).
      Omit or leave empty to install no extra components.
    required: false
    default: ''
  targets:
    description: >
      Comma-separated target triples to pass to dtolnay/rust-toolchain
      (e.g. 'aarch64-apple-darwin, x86_64-apple-darwin' for macOS cross).
      Omit or leave empty to add no extra targets.
    required: false
    default: ''
  tools:
    description: >
      Comma-separated tool names for taiki-e/install-action
      (e.g. 'nextest', 'nextest,cargo-llvm-cov').
      The install-action step is SKIPPED entirely when this input is empty.
    required: false
    default: ''
  cache-shared-key:
    description: >
      Swatinem/rust-cache shared-key naming the RUSTC FINGERPRINT this job
      compiles under, not the job. Four values exist: `linux-mold` (x86_64
      Linux with `-C link-arg=-fuse-ld=mold`), `linux` (x86_64 Linux without
      it), `windows`, `macos`. Two jobs share a key when and only when their
      compilations are interchangeable; eight job-shaped keys split a 10 GB
      repo budget eight ways along a boundary that was not the fingerprint,
      so keys that should have been separate were shared and keys that could
      have been shared were separate.
    required: true
  cache-prefix-key:
    description: >
      Swatinem/rust-cache prefix-key.  Bump to invalidate on toolchain or
      LLVM version changes.
    required: false
    default: 'v2-deps-llvm22'
  cache-targets:
    description: >
      Whether Swatinem/rust-cache restores and saves `<workspace>/target`.
      The action resolves that directory from the workspace root and does NOT
      read CARGO_TARGET_DIR, so a job that owns `<workspace>/target` for
      something else -- the Linux shards materialize the nextest archive there
      -- must say 'false' here, or the restore collides with the archive and a
      save on main stores the archive as a dependency layer. The registry
      layer, sccache and every other behaviour are unaffected.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # master 2026-03-27
      with:
        toolchain: stable
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    # Retried up to 3x: 2026-08-08/2026-08-12 CI incidents showed
    # taiki-e/install-action's own binary fetch (cargo-nextest et al., from
    # GitHub release assets) failing with curl exit 52 "Empty reply from
    # server" while GitHub's status page reported operational. The action is
    # a third-party `uses:` step with no exposed retry-count input, so the
    # retry lives at this composite-action level rather than inside it.
    - id: install-tools-attempt-1
      uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912  # v2.81.10
      if: inputs.tools != ''
      continue-on-error: true
      with:
        tool: ${{ inputs.tools }}

    - name: Wait before retrying tool install
      if: inputs.tools != '' && steps.install-tools-attempt-1.outcome == 'failure'
      shell: bash
      run: sleep 15

    - id: install-tools-attempt-2
      uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912  # v2.81.10
      if: inputs.tools != '' && steps.install-tools-attempt-1.outcome == 'failure'
      continue-on-error: true
      with:
        tool: ${{ inputs.tools }}

    - name: Wait before final tool install attempt
      if: >-
        inputs.tools != '' &&
        steps.install-tools-attempt-1.outcome == 'failure' &&
        steps.install-tools-attempt-2.outcome == 'failure'
      shell: bash
      run: sleep 30

    - uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912  # v2.81.10
      if: >-
        inputs.tools != '' &&
        steps.install-tools-attempt-1.outcome == 'failure' &&
        steps.install-tools-attempt-2.outcome == 'failure'
      with:
        tool: ${{ inputs.tools }}

    # ── sccache: workspace-crate compilation cache ────────────────────────
    # Promotes the .cargo/config.toml opt-in annotation to CI reality.
    # Uses the GitHub Actions cache backend (content-addressed, no blob
    # expansion — the ENOSPC cause that led to dropping target/ caching in
    # e9f65f19 was blob size, not sccache).  Swatinem/rust-cache below
    # continues to handle the registry/deps layer; sccache handles workspace
    # crate compilation.  The two compose: sccache caches compiler
    # invocations; Swatinem caches the registry.  SCCACHE_CACHE_SIZE bounds
    # the on-disk buffer; the GHA cache has its own 10 GB/repo ceiling.
    #
    # READ_WRITE on main, READ_ONLY everywhere else. The repo cache budget is
    # 10 GB and a SINGLE open pull request had taken 10.47 GB of it, because
    # every PR job wrote per-object sccache entries scoped to that PR's own ref
    # -- readable by no other branch, and evicting main's. `refs/heads/main`
    # retained 0.01 GB, so every PR restored from a cold layer, which is the
    # mechanism behind the 26m-vs-76m spread between otherwise comparable runs.
    #
    # Restore-only on pull requests USED to be inexpressible: SCCACHE_GHA_ENABLED
    # is a boolean and, at the v0.10.0 this action installed, the GHA backend
    # had no read-only mode -- so the previous revision of this file disabled
    # sccache entirely off main, which fixed the eviction by giving pull
    # requests nothing. sccache 0.16.0 added SCCACHE_GHA_RW_MODE (READ_ONLY |
    # READ_WRITE, default READ_WRITE; docs/GHA.md), so the cache now runs
    # everywhere and only main writes to it. GHA cache entries saved on the
    # default branch are readable from every branch, so a pull request gets the
    # hits without creating the ref-scoped objects that caused the eviction.
    #
    # Pinned at 0.16.0 rather than the current 0.17.0 deliberately: 0.16.0 is
    # the first release carrying the read-only mode this file depends on, and
    # 0.17.0 ships a new client-side execution architecture. Take the
    # capability, not the architecture change, in the same commit.
    #
    # Retried up to 3x for the same reason as install-tools above: the
    # 2026-08-08/2026-08-12 incidents showed this action's own sccache
    # binary fetch failing with "socket hang up". The action already retries
    # twice internally before giving up; this outer loop covers an egress
    # blip that outlasts its built-in window. No exposed retry-count input
    # (node action, dist/setup/index.js), so the retry wraps the step.
    - id: sccache-attempt-1
      uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696  # v0.0.10
      continue-on-error: true
      with:
        version: "v0.16.0"

    - name: Wait before retrying sccache setup
      if: steps.sccache-attempt-1.outcome == 'failure'
      shell: bash
      run: sleep 15

    - id: sccache-attempt-2
      uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696  # v0.0.10
      if: steps.sccache-attempt-1.outcome == 'failure'
      continue-on-error: true
      with:
        version: "v0.16.0"

    - name: Wait before final sccache setup attempt
      if: >-
        steps.sccache-attempt-1.outcome == 'failure' &&
        steps.sccache-attempt-2.outcome == 'failure'
      shell: bash
      run: sleep 30

    - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696  # v0.0.10
      if: >-
        steps.sccache-attempt-1.outcome == 'failure' &&
        steps.sccache-attempt-2.outcome == 'failure'
      with:
        version: "v0.16.0"

    - name: Export sccache environment variables
      shell: bash
      env:
        # One expression, one place. A step that recomputed `github.ref ==
        # 'refs/heads/main'` for itself is a second policy authority, and the
        # two disagree the moment one of them is edited.
        SCCACHE_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "SCCACHE_GHA_RW_MODE=${SCCACHE_RW_MODE}" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        echo "SCCACHE_CACHE_SIZE=2G" >> "$GITHUB_ENV"
        # RUSTC_WRAPPER is exported job-wide, so every compile in the job --
        # including `cargo install` of a tool -- goes through sccache. Without
        # this, an unreachable Actions cache service is a hard rustc failure:
        # a DNS blip took out `Install cargo-deny` on 2026-08-21 before a single
        # check had run. A cache that cannot be reached must degrade to a cold
        # compile; it is a cache.
        echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1" >> "$GITHUB_ENV"
        echo "sccache mode: ${SCCACHE_RW_MODE} (ref ${GITHUB_REF})"

    # The cache is a cost input, so its behaviour is reported where the run's
    # other cost telemetry is read. It asserts nothing: a cold cache is a slow
    # run, never a wrong one. `--stats-format=json` because the human table has
    # no total-writes row, and a hand-summed table is a second parser.
    #
    # Reading the row off a pull request: `writes` must be 0 and `write errors`
    # equals the miss count, because READ_ONLY refuses each store and sccache
    # counts a refused store as a write error while still returning the
    # compiler's own successful output. That is the mode working, not a defect.
    - name: Report sccache cache behaviour
      if: always()
      shell: bash
      env:
        SCCACHE_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
      run: |
        # `set +e` on purpose, and it is the whole point of this step's
        # contract. GitHub runs `shell: bash` as `bash -e -o pipefail`, so
        # WITHOUT this an sccache that changed its JSON schema, or a stats call
        # that failed, would exit non-zero and turn a correctness job red for a
        # number nothing asserts. Telemetry may report that it has nothing to
        # say; it may not decide a verdict.
        set +e
        set -u
        {
          echo "### sccache — ${{ inputs.cache-shared-key }}"
          echo ""
          echo "- mode: \`${SCCACHE_RW_MODE}\` (ref \`${GITHUB_REF}\`)"
        } >> "$GITHUB_STEP_SUMMARY"
        if ! command -v sccache > /dev/null 2>&1; then
          echo "- sccache is not on PATH; this job compiled cold." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        stats_json="$(sccache --show-stats --stats-format=json 2>/dev/null)"
        if [ -z "$stats_json" ]; then
          echo "- statistics unavailable: sccache reported nothing." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        # Held in a variable, never a file: a scratch file written into the
        # checkout is an untracked path no gate declares, which makes the
        # change router fail closed to comprehensive on every run.
        #
        # The reader catches everything and prints a row either way, so a
        # renamed counter or a restructured document degrades to "unavailable"
        # with the reason attached, never to a traceback and a failed step.
        printf '%s' "$stats_json" | python3 -c '
        import json, sys

        counters = (
            "compile_requests",
            "cache_hits",
            "cache_misses",
            "cache_writes",
            "cache_write_errors",
        )


        def row(stats):
            def total(key):
                value = stats[key]
                if isinstance(value, dict):
                    return sum(value.get("counts", {}).values())
                return int(value)

            return (
                "- requests: `{}`  hits: `{}`  misses: `{}`"
                "  writes: `{}`  write errors: `{}`".format(
                    *[total(key) for key in counters]
                )
            )


        try:
            print(row(json.load(sys.stdin)["stats"]))
        except Exception as error:
            print(
                "- statistics unavailable: sccache reported a document this "
                "reader does not understand ({}: {}).".format(
                    type(error).__name__, error
                )
            )
        ' >> "$GITHUB_STEP_SUMMARY"
        exit 0

    - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      with:
        # Restore everywhere, save only from the default branch. The GHA cache
        # scope makes a main-saved entry readable from every branch, so a pull
        # request still gets a warm dependency layer -- it just stops evicting
        # the layer it is reading.
        save-if: ${{ github.ref == 'refs/heads/main' }}
        prefix-key: ${{ inputs.cache-prefix-key }}
        shared-key: ${{ inputs.cache-shared-key }}
        # Keep the dependency layer stable across ordinary source and
        # workspace-manifest edits. Cargo's fingerprints still reject an
        # incompatible restored artifact, while a lock/toolchain/config change
        # rotates the exact cache key. The action removes workspace crates
        # before saving, so this stores third-party compilation rather than a
        # second copy of the source-sensitive sccache layer above.
        add-rust-environment-hash-key: "false"
        key: deps-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
        cache-targets: ${{ inputs.cache-targets }}
        cache-all-crates: "false"
        cache-workspace-crates: "false"
        cache-bin: "false"
