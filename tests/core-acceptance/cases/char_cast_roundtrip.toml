[[case]]
id = "char_cast_roundtrip"
intent = "String indexing preserves scalar values at every UTF-8 width, and checked byte narrowing refuses a scalar outside the byte range."
source = "../vertical-slice/accept/char_cast_roundtrip.hew"
suites = ["acceptance"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "4"

[case.expected]
stdout = "1\n1\n1\n1\n8364\ntrue\n"
exit = 0
