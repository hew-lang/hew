[[case]]
id = "string-inclusive-range-fault"
intent = "An inclusive maximum endpoint is an index bounds fault, and the grown string, its snapshot and retained copies clean up on that edge."
source = "cases/string-inclusive-range-fault.hew"
suites = ["acceptance", "safety"]
