# Hew WASM capability manifest.
#
# The [[feature]] rows define checker reject/warn identity and native-only
# stdlib module classification. [[backlog]] ids identify unsupported
# capabilities referenced by source markers. [[playground_wasi]] records
# non-runnable curated-example decisions. `hew-capability-gen` validates this
# typed schema and generates the Rust checker carrier, playground decision input, and the full
# feature-policy and current WASI summary tables in
# docs/wasm-capability-matrix.md.
#
# Schema:
#
#   manifest_version = 1
#
#   [[tier]]            one per WASM compilation target tier.
#   [[feature]]         one per row of the "Feature disposition table".
#   [[backlog]]         one per unsupported capability identity used by source markers.
#     marker_disposition = "source" (default) requires at least one actionable
#       source marker. "non-source" requires a non_source_reason and rejects
#       actionable source markers for that row.
#   [[playground_wasi]] non-runnable curated-example decisions only; optional
#       capability must resolve to a reject/warn feature or backlog identity.
#
# Feature invariants (enforced by the generator binary):
#   checker = "pass" | "warn" | "reject" | "todo"
#   - reject / warn rows MUST have enum_variant, label, reason.
#   - pass rows MUST NOT have enum_variant.
#   - todo rows MAY have label, MUST have note and tracking.
#   - enum_variant values are unique and stable.
#   - native_only_modules/native_only_functions are unique and belong only to
#     reject rows. Function entries use canonical qualified `module.function`
#     identity (for example `std.fs.read`).
#   - deterministic = "admit" (default) | "refuse" is independent of WASM.
#     Refuse rows name exact checker declaration paths and/or trusted endpoint
#     symbols. They never classify a user declaration by its leaf spelling.
#   - generate uses the same explicit admit/refuse schema, with independent
#     generate_functions and generate_endpoints for build-time generators.

manifest_version = 1

# ---------------------------------------------------------------------------
# Target tiers
# ---------------------------------------------------------------------------

[[tier]]
id = "tier1"
name = "Tier 1"
crate = "hew-wasm"
target = "wasm32-unknown-unknown"
toolchain = "wasm-bindgen"
use_case = "Browser analysis and verified SIR compilation for the sandbox VM"
runnable = false
capability = "analysis-and-sandbox-compilation"

[[tier]]
id = "sandbox-vm"
name = "sandbox-vm"
crate = "hew-sandbox-vm"
target = "browser-worker"
toolchain = "typescript"
use_case = "Browser educational sandbox execution of verified SIR bytecode"
runnable = true
capability = "sandbox-vm"

[[tier]]
id = "tier2"
name = "Tier 2"
crate = "hew-runtime"
target = "wasm32-wasip1"
target_alias = "wasm32-wasi"
use_case = "WASI execution — `hew build --target=wasm32-wasi`"
runnable = true

# ---------------------------------------------------------------------------
# Feature disposition table (mirror of the markdown table).
# Row order matches docs/wasm-capability-matrix.md top-to-bottom.
# ---------------------------------------------------------------------------

[[feature]]
id = "basic-actors"
label = "Basic actors (`spawn`, `send`, `receive`, `ask/await`)"
checker = "pass"
runtime = "implemented"
runtime_status = "Implemented on the wasm32 process driver: the same actor core the native target runs, with the parked root draining the run queue in place of worker threads"
categories = ["runtime", "actors"]

[[feature]]
id = "exit-status-range"
label = "Process exit statuses above 125"
checker = "pass"
runtime = "host-dependent"
runtime_status = "WASI `proc_exit` refuses a status above 125, so `exit(n)` for n greater than 125 reaches the host as 1 rather than n. Every other status matches native, including the exit-1 rule an unrecovered fault follows (HEW-SPEC-2026 5.8), whose trap code is a diagnostic tag and never the status"
categories = ["runtime", "failure"]

[[feature]]
id = "actor-crash-containment"
label = "Actor-local panic/trap containment and restart"
checker = "pass"
runtime = "implemented"
runtime_status = "Checked handler, init and start faults release owned state and return through failure edges; supervised faults use the shared restart and settlement policy"
categories = ["runtime", "actors", "failure"]

[[feature]]
id = "generators"
label = "Generators (`gen fn`)"
checker = "pass"
runtime = "implemented"
runtime_status = "Scalar-parameter and `fn[clone]`-parameter `gen fn` forms execute through checked continuation frames on Tier 2; full consumption and early-break cleanup verified under wasmtime at O0 and O2"
categories = ["runtime", "generators"]
tracking_label = "Note below"
note = "`gen fn` uses explicit continuation frames emitted by `hew-codegen-rs/src/physical_coro.rs` and `physical_frames.rs`, with checked polling and cleanup through `hew-runtime/src/generator_checked.rs` and `cont.rs`. The emitter uses the target data layout, and these runtime modules are compiled for wasm32. WASI execution at O0 and O2 verifies scalar parameters and a named function supplied to a `fn[clone]` parameter through full consumption and early break, including producer defer cleanup. Generators that depend on stream I/O encounter the Streams reject at the point of the stream call."

