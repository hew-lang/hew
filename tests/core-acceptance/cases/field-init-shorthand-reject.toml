[[case]]
id = "field-init-shorthand-reject"
intent = "A shorthand field whose name has no binding reports the missing binding as a shorthand, not a parse cascade; naming a field twice, naming a non-field and misspelling a field are refused exactly as in the explicit form."
source = "cases/field-init-shorthand-reject.hew"
suites = ["acceptance"]
timeout_seconds = 30
kind = "check"

