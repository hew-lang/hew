# Release workflow — builds the Hew compiler for multiple platforms and creates
# a GitHub Release with signed/notarized binaries and checksums.
#
# Triggers on tag push matching `v*` (e.g. v0.1.0).
#
# Artifacts per platform:
#   bin/hew           — compiler driver (Rust + LLVM via inkwell)
#   bin/hew-lsp       — Language Server Protocol server
#   bin/hew-observe   — actor observer TUI
#   lib/libhew.a      — combined runtime + stdlib static library
#   std/              — standard library sources
#   completions/      — shell completions (plus PowerShell on Windows)
#
# Required secrets for macOS code signing/notarization on tag releases
# (workflow_dispatch can still be used for unsigned dry runs):
#   APPLE_CERTIFICATE_P12       — Base64-encoded .p12 signing certificate
#   APPLE_CERTIFICATE_PASSWORD  — Password for the .p12 file
#   APPLE_API_KEY_P8            — App Store Connect API private key (.p8 contents)
#   APPLE_API_KEY_ID            — App Store Connect API key ID
#   APPLE_API_ISSUER_ID         — App Store Connect API issuer ID
#
# Required variable for the prepublished playground release image:
#   vars.PLAYGROUND_RELEASE_IMAGE_LOCK — exact version-scoped immutable image
#     identity, e.g. `v0.6.0-rc2@sha256:<64 lowercase hex digits>`. The
#     maintainer records it only after the pre-tag candidate publish succeeds.
#
# Homebrew tap updates use a separate optional credential and run for every
# tag, prereleases included — hew.rb tracks the newest release (rc included),
# hew@stable.rb tracks final releases only:
#   HOMEBREW_TAP_TOKEN           — GitHub PAT with actions:write scope for hew-lang/homebrew-hew
#
# Required secrets for VS Code extension publishing (optional — skipped if absent):
#   VSCE_PAT                     — VS Code Marketplace Personal Access Token

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read # default minimum; release and docker jobs override below

env:
  LLVM_VERSION: "22"
  LLVM_FULL_VERSION: "22.1.5"
  # Resolve tag from push event or manual dispatch input
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  validate-release-version:
    name: Validate release tag version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Assert release tag matches Cargo version
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "::error::release tag is empty; refusing to build"
            exit 1
          fi
          cargo_version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [[ -z "${cargo_version}" ]]; then
            echo "::error::workspace Cargo version could not be read; refusing to build"
            exit 1
          fi
          expected_tag="v${cargo_version}"
          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "::error::release tag ${RELEASE_TAG} does not match Cargo version ${cargo_version} (expected ${expected_tag}); refusing to build"
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-rust-build
        with:
          cache-shared-key: release-license

      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli --version 0.9.0

      - name: Verify THIRD-PARTY-LICENSES is current
        run: make licenses-check

  # WASI libraries are platform-independent. Build them once and place the
  # same proved artifacts in every published toolchain archive.
  build-portable-release-libs:
    needs: validate-release-version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.RELEASE_TAG }}
      - id: rust-toolchain
        name: Read repository Rust toolchain
        run: |
          channel=$(awk -F'"' '/^[[:space:]]*channel[[:space:]]*=/ { print $2; exit }' rust-toolchain.toml)
          test -n "${channel}"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
      - name: Install Rust WASI target
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: wasm32-wasip1
      - name: Build and stage portable libraries
        run: make stage-portable-release-libs
      - name: Upload portable libraries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-release-libs
          path: build/portable-release-libs/
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Cross-built release libraries — proved by their target-native consumers
  # ─────────────────────────────────────────────────────────────────────────
  build-cross-release-libs:
    needs: validate-release-version
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: x86_64-unknown-freebsd
            builder: zig
            archive: libhew.a
            build_std: false
          - rust_target: x86_64-pc-windows-msvc
            builder: xwin
            archive: hew.lib
            build_std: false
          - rust_target: aarch64-unknown-freebsd
            builder: zig
            archive: libhew.a
            build_std: true
            zig_target: aarch64-freebsd

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Checkout release machinery
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          path: release-machinery

      - name: Install archive inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm

      - name: Install Rust target
        if: ${{ !matrix.build_std }}
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.rust_target }}

      - name: Install Rust sources
        if: matrix.build_std
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: "1.96.0"
          components: rust-src

      - name: Install Zig
        if: matrix.builder == 'zig'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild
        if: matrix.builder == 'zig'
        run: cargo install cargo-zigbuild --locked --version 0.22.3

      - name: Install cargo-xwin
        if: matrix.builder == 'xwin'
        run: cargo install cargo-xwin --locked --version 0.23.0

      - name: Build FreeBSD release library
        if: matrix.builder == 'zig' && !matrix.build_std
        run: cargo zigbuild -p hew-lib --profile release-lib --target ${{ matrix.rust_target }}

      - name: Build FreeBSD release library with standard library
        if: matrix.build_std
        env:
          RUSTC_BOOTSTRAP: "1"
        run: cargo zigbuild -Zbuild-std=std,panic_abort -p hew-lib --profile release-lib --target ${{ matrix.rust_target }}

      - name: Build aarch64 FreeBSD release consumer
        if: matrix.build_std
        env:
          CARGO_TARGET_DIR: cross-release-consumer-target
          RUSTC_BOOTSTRAP: "1"
        run: >-
          cargo zigbuild -Zbuild-std=std,panic_abort
          --manifest-path release-machinery/scripts/fixtures/release-lib-link/Cargo.toml
          --release --target ${{ matrix.rust_target }}

      - name: Build Windows release library
        if: matrix.builder == 'xwin'
        env:
          AWS_LC_SYS_PREBUILT_NASM: "1"
        run: cargo xwin build -p hew-lib --profile release-lib --target ${{ matrix.rust_target }}

      - name: Record FreeBSD ABI baseline
        if: matrix.build_std
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'int main(void) { return 0; }' > freebsd-abi-probe.c
          zig cc -target "${{ matrix.zig_target }}" freebsd-abi-probe.c -o freebsd-abi-probe
          abi=$(file freebsd-abi-probe)
          echo "${abi}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "${abi}" | grep -q 'for FreeBSD 14.0 (1400500)'

      - name: Verify and stage cross-built archive
        shell: bash
        run: |
          set -euo pipefail
          archive="target/${{ matrix.rust_target }}/release-lib/${{ matrix.archive }}"
          release-machinery/scripts/verify-cross-release-lib.sh "${{ matrix.rust_target }}" "${archive}"

          destination="cross-release-libs/${{ matrix.rust_target }}"
          mkdir -p "${destination}"
          cp "${archive}" "${destination}/${{ matrix.archive }}"

          if [[ "${{ matrix.build_std }}" == "true" ]]; then
            cp "cross-release-consumer-target/${{ matrix.rust_target }}/release/libhew_release_link_probe.a" \
              "${destination}/libhew_release_link_probe.a"
          fi

      - name: Upload cross-built archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libhew-${{ matrix.rust_target }}
          path: cross-release-libs/${{ matrix.rust_target }}/
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Build — macOS and Windows release artifacts
  # ─────────────────────────────────────────────────────────────────────────
  build:
    needs: [build-cross-release-libs, build-portable-release-libs]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-aarch64
            os: macos-15
            rust_target: aarch64-apple-darwin
          - target: darwin-x86_64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
          - target: windows-x86_64
            os: windows-2022
            rust_target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    # Windows release artifacts are part of the published v0.4.0 asset set.
    # Timeouts, cancellations, or build failures must block the release.
    # Windows consumes a pre-built toolchain artifact; no source LLVM build here.
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Checkout release machinery
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          path: release-machinery

      - name: Download cross-built release library (Windows)
        if: startsWith(matrix.target, 'windows')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libhew-${{ matrix.rust_target }}
          path: cross-release-libs/${{ matrix.rust_target }}

      - name: Download portable release libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portable-release-libs
          path: portable-release-libs

      # ── LLVM toolchain installation ─────────────────────────────────────

      - name: Install LLVM (macOS)
        if: startsWith(matrix.target, 'darwin')
        run: |
          brew install llvm@${{ env.LLVM_VERSION }} ninja zstd
          # Expose the brew LLVM prefix and binaries for later steps
          LLVM_PREFIX="$(brew --prefix llvm@${{ env.LLVM_VERSION }})"
          echo "LLVM_PREFIX=${LLVM_PREFIX}" >> "$GITHUB_ENV"
          echo "${LLVM_PREFIX}/bin" >> "$GITHUB_PATH"

      - name: Configure LLVM toolchain (macOS)
        if: startsWith(matrix.target, 'darwin')
        run: |
          {
            echo "CC=${LLVM_PREFIX}/bin/clang"
            echo "CXX=${LLVM_PREFIX}/bin/clang++"
            echo "MACOSX_DEPLOYMENT_TARGET=13.0"
          } >> "$GITHUB_ENV"
          # The brew llvm bottle links libz3.dylib into its static libraries'
          # dependency set; hew never calls z3 (clang static-analyzer only).
          # dead_strip_dylibs drops load commands with no referenced symbols,
          # keeping the shipped binaries on system dylibs only (the
          # verify-macos-binary.sh gate enforces this).
          echo "RUSTFLAGS=-C link-arg=-Wl,-dead_strip_dylibs" >> "$GITHUB_ENV"

      - name: Use prebuilt aws-lc assembly (Windows)
        if: startsWith(matrix.target, 'windows')
        # aws-lc-sys wants NASM on windows-msvc; the documented CI escape uses
        # the crate's pregenerated assembly objects — no toolchain dependency.
        shell: bash
        run: echo "AWS_LC_SYS_PREBUILT_NASM=1" >> "$GITHUB_ENV"

      - name: Install build tools (Windows)
        if: startsWith(matrix.target, 'windows')
        run: choco install ninja cmake -y
        shell: pwsh

      - name: Setup MSVC environment (Windows)
        if: startsWith(matrix.target, 'windows')
        uses: ./.github/actions/setup-msvc

      - name: Download Hew LLVM toolchain (Windows)
        if: startsWith(matrix.target, 'windows')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $toolchainRepo = "hew-lang/llvm-toolchain"
          $toolchainTag  = "llvm-22.1.0-windows-msvc-v1"
          $asset         = "hew-llvm-22.1.0-windows-msvc-v1.tar.gz"

          # Fail fast if the toolchain release is not published yet.
          # Run prebuild-llvm.yml in hew-lang/llvm-toolchain to publish it
          # before retrying the release.
          $info = gh release view $toolchainTag `
            --repo $toolchainRepo --json assets 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Toolchain release $toolchainTag not found in $toolchainRepo. Dispatch prebuild-llvm.yml there to publish it first."
            exit 1
          }
          $names = ($info | ConvertFrom-Json).assets.name
          $required = @($asset, "$asset.sha256")
          $missing = $required | Where-Object { $names -notcontains $_ }
          if ($missing) {
            Write-Host "::error::Missing asset(s) from toolchain release ${toolchainTag}: $($missing -join ', '). Dispatch prebuild-llvm.yml in $toolchainRepo to publish them first."
            exit 1
          }

          gh release download $toolchainTag `
            --repo $toolchainRepo `
            --pattern $asset `
            --pattern "$asset.sha256" `
            --dir .

          # Verify SHA-256 checksum before extraction.
          $expected = ((Get-Content "$asset.sha256") -split '\s+')[0].ToLower()
          $actual   = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) {
            Write-Host "::error::SHA-256 mismatch for ${asset}: expected $expected, got $actual"
            exit 1
          }
          Write-Host "Checksum verified: $actual"

      - name: Verify toolchain provenance (Windows)
        if: startsWith(matrix.target, 'windows')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $toolchainRepo = "hew-lang/llvm-toolchain"
          $asset         = "hew-llvm-22.1.0-windows-msvc-v1.tar.gz"
          gh attestation verify $asset --repo $toolchainRepo
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Provenance attestation verification failed for $asset"
            exit 1
          }
          Write-Host "Provenance verified for $asset"

      - name: Extract and validate LLVM toolchain (Windows)
        if: startsWith(matrix.target, 'windows')
        shell: pwsh
        run: |
          $asset = "hew-llvm-22.1.0-windows-msvc-v1.tar.gz"
          # Archive root is llvm-22/; extracting to C:\ gives C:\llvm-22.
          tar -xzf $asset -C C:\
          Remove-Item -Force $asset, "$asset.sha256"

          $required = @(
            "C:\llvm-22\bin\clang.exe",
            "C:\llvm-22\lib\cmake\llvm\LLVMConfig.cmake"
          )
          foreach ($path in $required) {
            if (!(Test-Path $path)) {
              Write-Host "::error::Required LLVM path missing after extraction: $path"
              exit 1
            }
          }

          $linker = @(
            "C:\llvm-22\bin\lld-link.exe",
            "C:\llvm-22\bin\lld.exe",
            "C:\llvm-22\bin\ld.lld.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$linker) {
            Write-Host "::error::No LLVM linker tool (lld-link.exe / lld.exe / ld.lld.exe) found under C:\llvm-22\bin"
            exit 1
          }
          Write-Host "LLVM toolchain ready at C:\llvm-22. Linker: $linker"

      - name: Configure LLVM toolchain (Windows)
        if: startsWith(matrix.target, 'windows')
        run: |
          echo "LLVM_PREFIX=C:\llvm-22" >> $env:GITHUB_ENV
          echo "C:\llvm-22\bin" >> $env:GITHUB_PATH
          echo "CC=cl" >> $env:GITHUB_ENV
          echo "CXX=cl" >> $env:GITHUB_ENV
        shell: pwsh

      # ── Rust toolchain ──────────────────────────────────────────────────

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust artifacts (Darwin)
        if: startsWith(matrix.target, 'darwin')
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: release-${{ matrix.target }}-cargo-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-${{ matrix.target }}-cargo-${{ matrix.os }}-

      - name: Cache Rust artifacts
        if: ${{ !startsWith(matrix.target, 'darwin') }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: release-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-${{ matrix.target }}-cargo-

      # ── Rust builds ─────────────────────────────────────────────────────

      - name: Build hew, hew-lsp, and hew-observe
        run: cargo build -p hew-cli -p hew-lsp -p hew-observe --release --target ${{ matrix.rust_target }}

      - name: Build libhew.a (runtime + stdlib)
        if: startsWith(matrix.target, 'darwin')
        # The shipped archive builds under the non-LTO release-lib profile:
        # external Rust staticlibs (--link-lib packages) cannot dedupe their
        # verbatim libstd members against a fat-LTO archive.
        run: cargo build -p hew-lib --profile release-lib --target ${{ matrix.rust_target }}

      - name: Prove release library consumer linking (Unix)
        if: "!startsWith(matrix.target, 'windows')"
        run: |
          release-machinery/scripts/test-release-lib-link.sh \
            --hew "target/${{ matrix.rust_target }}/release/hew" \
            --archive "target/${{ matrix.rust_target }}/release-lib/libhew.a"

      - name: Prove release library consumer linking (Windows)
        if: startsWith(matrix.target, 'windows')
        shell: pwsh
        run: |
          ./release-machinery/scripts/test-release-lib-link.ps1 `
            -Hew "target/${{ matrix.rust_target }}/release/hew.exe" `
            -Archive "cross-release-libs/${{ matrix.rust_target }}/hew.lib"

      - name: Smoke test hew-lsp and hew-observe (Unix)
        if: "!startsWith(matrix.target, 'windows')"
        run: |
          ./target/${{ matrix.rust_target }}/release/hew-lsp --version
          ./target/${{ matrix.rust_target }}/release/hew-observe --version

      - name: Smoke test hew-lsp and hew-observe (Windows)
        if: startsWith(matrix.target, 'windows')
        run: |
          ./target/${{ matrix.rust_target }}/release/hew-lsp.exe --version
          ./target/${{ matrix.rust_target }}/release/hew-observe.exe --version

      # ── Package archive ─────────────────────────────────────────────────

      - name: Stage release package (Unix)
        if: "!startsWith(matrix.target, 'windows')"
        run: |
          VERSION="${RELEASE_TAG#v}"
          ARCHIVE_NAME="hew-v${VERSION}-${{ matrix.target }}"

          sh release-machinery/scripts/stage-release-package.sh \
            --source-dir "$PWD" \
            --bin-dir "target/${{ matrix.rust_target }}/release" \
            --native-lib "target/${{ matrix.rust_target }}/release-lib/libhew.a" \
            --native-triple "${{ matrix.rust_target }}" \
            --native-lib-name "libhew.a" \
            --wasi-lib-dir "portable-release-libs/wasm32-wasip1" \
            --destination "${ARCHIVE_NAME}" \
            --completion-shells "bash zsh fish"

          # macOS release binaries embed static LLVM support and rely on
          # Mach-O weak/coalesced definitions that `strip` can break. Keep the
          # packaged binaries unstripped so the published archive matches the
          # already-validated release build.
          echo "Skipping strip on macOS release binaries."

          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Verify macOS binaries have no non-system dynamic dependencies
        if: startsWith(matrix.target, 'darwin')
        run: |
          for bin in "${ARCHIVE_NAME}"/bin/*; do
            release-machinery/scripts/verify-macos-binary.sh "${bin}"
          done

      - name: Smoke test packaged hew before macOS signing
        if: startsWith(matrix.target, 'darwin')
        run: |
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "${smoke_root}"' EXIT

          cat > "${smoke_root}/pkg-presign-smoke.hew" <<'HEWEOF'
          fn main() {
              println("pkg-presign-smoke-ok")
          }
          HEWEOF

          output=$(HEW_STD="${ARCHIVE_NAME}/std" "${ARCHIVE_NAME}/bin/hew" run "${smoke_root}/pkg-presign-smoke.hew")
          echo "${output}"
          echo "${output}" | grep -q "pkg-presign-smoke-ok"

      - name: Stage release package (Windows)
        if: startsWith(matrix.target, 'windows')
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          ARCHIVE_NAME="hew-v${VERSION}-${{ matrix.target }}"

          # GitHub's Windows Bash is Git Bash, so this uses the same POSIX
          # staging implementation as Unix while executing native .exe tools.
          sh release-machinery/scripts/stage-release-package.sh \
            --source-dir "$PWD" \
            --bin-dir "target/${{ matrix.rust_target }}/release" \
            --bin-suffix ".exe" \
            --native-lib "cross-release-libs/${{ matrix.rust_target }}/hew.lib" \
            --native-triple "${{ matrix.rust_target }}" \
            --native-lib-name "hew.lib" \
            --wasi-lib-dir "portable-release-libs/wasm32-wasip1" \
            --destination "${ARCHIVE_NAME}" \
            --completion-shells "bash zsh fish powershell"

          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      # ── macOS code signing & notarization ───────────────────────────────

      - name: Validate macOS signing secrets (tag releases)
        if: startsWith(matrix.target, 'darwin') && startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          missing=0
          for secret_name in \
            APPLE_CERTIFICATE_P12 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_API_KEY_P8 \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER_ID; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::${secret_name} secret is required for macOS tag releases"
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Code sign binaries (macOS)
        if: startsWith(matrix.target, 'darwin') && env.APPLE_CERTIFICATE_P12 != ''
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Import signing certificate into a temporary keychain
          echo "${APPLE_CERTIFICATE_P12}" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "" build.keychain

          # Find the Developer ID Application identity from the imported cert
          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
            | grep "Developer ID Application" \
            | head -1 \
            | sed 's/.*"\(.*\)".*/\1/')

          if [ -z "${IDENTITY}" ]; then
            echo "::error::No Developer ID Application certificate found in keychain"
            exit 1
          fi
          echo "Signing with identity: ${IDENTITY}"

          # Sign each binary with hardened runtime and secure timestamp
          for bin in hew hew-lsp hew-observe; do
            codesign --force --options runtime --timestamp \
              --sign "${IDENTITY}" "${ARCHIVE_NAME}/bin/${bin}"
          done

          # Verify signatures
          for bin in hew hew-lsp hew-observe; do
            codesign --verify --verbose "${ARCHIVE_NAME}/bin/${bin}"
          done

          rm -f certificate.p12

      - name: Notarize archive (macOS)
        if: startsWith(matrix.target, 'darwin') && env.APPLE_CERTIFICATE_P12 != '' && env.APPLE_CERTIFICATE_PASSWORD != '' && env.APPLE_API_KEY_P8 != '' && env.APPLE_API_KEY_ID != '' && env.APPLE_API_ISSUER_ID != ''
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          # Write the API key (base64-encoded in secret) to disk
          KEY_PATH="${HOME}/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          mkdir -p "${HOME}/private_keys"
          echo "${APPLE_API_KEY_P8}" | base64 --decode > "${KEY_PATH}"

          ditto -c -k --keepParent "${ARCHIVE_NAME}" "${ARCHIVE_NAME}-notarize.zip"
          xcrun notarytool submit "${ARCHIVE_NAME}-notarize.zip" \
            --key "${KEY_PATH}" \
            --key-id "${APPLE_API_KEY_ID}" \
            --issuer "${APPLE_API_ISSUER_ID}" \
            --wait
          rm -f "${ARCHIVE_NAME}-notarize.zip"
          rm -rf "${HOME}/private_keys"

      # ── Create final archive ────────────────────────────────────────────

      - name: Create tar.gz (Unix)
        if: "!startsWith(matrix.target, 'windows')"
        run: tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"

      - name: Smoke test packaged archive (Unix)
        if: "!startsWith(matrix.target, 'windows')"
        run: |
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "${smoke_root}"' EXIT

          cat > "${smoke_root}/pkg-smoke.hew" <<'HEWEOF'
          fn main() {
              println("pkg-smoke-ok")
          }
          HEWEOF

          staging="${smoke_root}/staging"
          mkdir -p "${staging}"
          tar -xf "${ARCHIVE_NAME}.tar.gz" -C "${staging}" --strip-components=1

          output=$(HEW_STD="${staging}/std" "${staging}/bin/hew" run "${smoke_root}/pkg-smoke.hew")
          echo "${output}"
          echo "${output}" | grep -q "pkg-smoke-ok"

      - name: Create zip (Windows)
        if: startsWith(matrix.target, 'windows')
        run: Compress-Archive -Path "${env:ARCHIVE_NAME}" -DestinationPath "${env:ARCHIVE_NAME}.zip"
        shell: pwsh

      - name: Smoke test packaged archive (Windows)
        if: startsWith(matrix.target, 'windows')
        run: |
          $SmokeRoot = Join-Path $PWD "pkg-smoke"
          Remove-Item -Recurse -Force $SmokeRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $SmokeRoot | Out-Null

          $SmokeFile = Join-Path $SmokeRoot "pkg-smoke.hew"
          Set-Content -Path $SmokeFile -Encoding utf8NoBOM -Value @'
          fn main() {
              println("pkg-smoke-ok")
          }
          '@

          Expand-Archive -Path "${env:ARCHIVE_NAME}.zip" -DestinationPath $SmokeRoot -Force
          $Staging = Join-Path $SmokeRoot "${env:ARCHIVE_NAME}"
          $env:HEW_STD = Join-Path $Staging "std"

          $Output = & (Join-Path $Staging "bin/hew.exe") run $SmokeFile | Out-String
          $Output = $Output.Trim()
          Write-Host $Output
          if ($Output -notmatch "pkg-smoke-ok") {
            throw "Packaged archive smoke output did not contain pkg-smoke-ok"
          }
        shell: pwsh

      # ── Upload artifact ─────────────────────────────────────────────────

      - name: Upload artifact (Unix)
        if: "!startsWith(matrix.target, 'windows')"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}.tar.gz

      - name: Upload artifact (Windows)
        if: startsWith(matrix.target, 'windows')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}.zip

      - name: Upload hew-lsp standalone (Unix)
        if: "!startsWith(matrix.target, 'windows')"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hew-lsp-${{ matrix.target }}
          path: target/${{ matrix.rust_target }}/release/hew-lsp

      - name: Upload hew-observe standalone (Unix)
        if: "!startsWith(matrix.target, 'windows')"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hew-observe-${{ matrix.target }}
          path: target/${{ matrix.rust_target }}/release/hew-observe

      - name: Upload hew-lsp standalone (Windows)
        if: startsWith(matrix.target, 'windows')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hew-lsp-${{ matrix.target }}
          path: target/${{ matrix.rust_target }}/release/hew-lsp.exe

      - name: Upload hew-observe standalone (Windows)
        if: startsWith(matrix.target, 'windows')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hew-observe-${{ matrix.target }}
          path: target/${{ matrix.rust_target }}/release/hew-observe.exe

  # ─────────────────────────────────────────────────────────────────────────
  # Linux build — glibc baseline artifacts built inside Ubuntu 22.04
  # ─────────────────────────────────────────────────────────────────────────
  build-linux:
    needs: [validate-release-version, build-portable-release-libs]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - target: linux-aarch64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    container: ubuntu:22.04
    timeout-minutes: 180

    steps:
      - name: Install baseline build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git gnupg lsb-release \
            ninja-build pkg-config wget xz-utils \
            libssl-dev zlib1g-dev libzstd-dev libffi-dev libxml2-dev

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Checkout release machinery
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          path: release-machinery

      - name: Download portable release libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portable-release-libs
          path: portable-release-libs

      - name: Trust the workspace checkout
        # The container user differs from the checkout owner; without this
        # the hew-cli build script cannot read git metadata and the shipped
        # binary reports `unknown` for its commit hash.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install LLVM ${{ env.LLVM_FULL_VERSION }}
        # Official upstream tarball via the pinned setup-llvm action — the
        # same toolchain the release gate proved. The apt.llvm.org packages
        # do not ship libPolly.a, which llvm-sys links statically. The
        # official binaries run on the ubuntu:22.04 (glibc 2.35) build
        # container, preserving the 22.04+ artifact baseline.
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_FULL_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: release-${{ matrix.target }}-jammy-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-${{ matrix.target }}-jammy-cargo-

      - name: Build hew, hew-lsp, and hew-observe
        run: cargo build -p hew-cli -p hew-lsp -p hew-observe --release --target ${{ matrix.rust_target }}

      - name: Build libhew.a (runtime + stdlib)
        # Non-LTO release-lib profile: the shipped archive must keep verbatim
        # libstd members so external Rust staticlibs (--link-lib) can dedupe.
        run: cargo build -p hew-lib --profile release-lib --target ${{ matrix.rust_target }}

      - name: Prove release library consumer linking
        run: |
          release-machinery/scripts/test-release-lib-link.sh \
            --hew "target/${{ matrix.rust_target }}/release/hew" \
            --archive "target/${{ matrix.rust_target }}/release-lib/libhew.a"

      - name: Verify Linux binaries
        run: |
          ldd --version 2>&1 | sed -n "1p"
          "target/${{ matrix.rust_target }}/release/hew" --version
          "target/${{ matrix.rust_target }}/release/hew-lsp" --version
          "target/${{ matrix.rust_target }}/release/hew-observe" --version
          test -f "target/${{ matrix.rust_target }}/release-lib/libhew.a"

          if ldd "target/${{ matrix.rust_target }}/release/hew" | grep -Eqi 'llvm|mlir'; then
            echo "::error::Linux release binary dynamically links LLVM-family libraries"
            exit 1
          fi

      - name: Stage release package
        run: |
          VERSION="${RELEASE_TAG#v}"
          ARCHIVE_NAME="hew-v${VERSION}-${{ matrix.target }}"

          sh release-machinery/scripts/stage-release-package.sh \
            --source-dir "$PWD" \
            --bin-dir "target/${{ matrix.rust_target }}/release" \
            --native-lib "target/${{ matrix.rust_target }}/release-lib/libhew.a" \
            --native-triple "${{ matrix.rust_target }}" \
            --native-lib-name "libhew.a" \
            --wasi-lib-dir "portable-release-libs/wasm32-wasip1" \
            --destination "${ARCHIVE_NAME}" \
            --completion-shells "bash zsh fish"

          for b in hew hew-lsp hew-observe; do
            strip "${ARCHIVE_NAME}/bin/${b}"
          done

          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Create tar.gz
        run: tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"

      - name: Smoke test packaged archive
        run: |
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "${smoke_root}"' EXIT

          cat > "${smoke_root}/pkg-smoke.hew" <<'HEWEOF'
          fn main() {
              println("pkg-smoke-ok")
          }
          HEWEOF

          staging="${smoke_root}/staging"
          mkdir -p "${staging}"
          tar -xf "${ARCHIVE_NAME}.tar.gz" -C "${staging}" --strip-components=1

          output=$(env -i PATH=/usr/bin:/bin HOME="${HOME}" HEW_STD="${staging}/std" "${staging}/bin/hew" run "${smoke_root}/pkg-smoke.hew")
          echo "${output}"
          echo "${output}" | grep -q "pkg-smoke-ok"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}.tar.gz

      - name: Upload hew-lsp standalone
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hew-lsp-${{ matrix.target }}
          path: target/${{ matrix.rust_target }}/release/hew-lsp

      - name: Upload hew-observe standalone
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hew-observe-${{ matrix.target }}
          path: target/${{ matrix.rust_target }}/release/hew-observe

  # ─────────────────────────────────────────────────────────────────────────
  # FreeBSD build — x86_64 via QEMU VM (tier-1, required release gate)
  # ─────────────────────────────────────────────────────────────────────────
  build-freebsd:
    needs: [build-cross-release-libs, build-portable-release-libs]
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Checkout release machinery
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          path: release-machinery

      - name: Compute archive name
        id: archive
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "name=hew-v${VERSION}-freebsd-x86_64" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download cross-built release library
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libhew-x86_64-unknown-freebsd
          path: cross-release-libs/x86_64-unknown-freebsd

      - name: Download portable release libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portable-release-libs
          path: portable-release-libs

      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@a6de9343ef5747433d9c25784c90e84998b9d69a # v1.4.6
        with:
          release: "15.0"
          mem: 8192
          prepare: |
            mkdir -p /usr/local/etc/pkg/repos
            printf 'FreeBSD: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest", mirror_type: "srv", enabled: yes }\n' \
              > /usr/local/etc/pkg/repos/FreeBSD.conf
            # Bootstrap pkg through the base utility before reading package catalogues.
            # Without this, pkg self-upgrades mid-install and the new binary cannot
            # read the catalogue the old one wrote, so every package reports missing.
            /usr/sbin/pkg bootstrap -fy -r FreeBSD
            pkg update -f -r FreeBSD
            pkg install -y -r FreeBSD llvm22 rustup-init cmake ninja git bash pkgconf libffi libxml2

          run: |
            set -eux
            command -v bash && bash --version

            # The VM user differs from the synced checkout owner; without
            # this the build script cannot read git metadata and the shipped
            # binaries report `unknown` for their commit hash.
            git config --global --add safe.directory "$(pwd)"

            # Build with the repository-pinned Rust release instead of the
            # moving version published by the FreeBSD package repository.
            /usr/local/bin/rustup-init -y --no-modify-path --profile minimal \
              --default-toolchain 1.96.0
            export PATH="$HOME/.cargo/bin:$PATH"
            rustup run 1.96.0 rustc --version | grep -q '^rustc 1\.96\.0 '

            # ── LLVM ───────────────────────────────────────────────────────
            # LLVM 22 comes from pkg on FreeBSD 15.0 (llvm22-22.1.2).
            export LLVM_SYS_221_PREFIX=/usr/local/llvm22
            /usr/local/llvm22/bin/llvm-config --version

            # ── Rust builds (release) ──────────────────────────────────────
            cargo build -p hew-cli -p hew-lsp -p hew-observe --release
            bash release-machinery/scripts/test-release-lib-link.sh \
              --hew target/release/hew \
              --archive cross-release-libs/x86_64-unknown-freebsd/libhew.a

            # ── Package archive ────────────────────────────────────────────
            ARCHIVE_NAME="${{ steps.archive.outputs.name }}"

            sh release-machinery/scripts/stage-release-package.sh \
              --source-dir "$PWD" \
              --bin-dir "target/release" \
              --native-lib "cross-release-libs/x86_64-unknown-freebsd/libhew.a" \
              --native-triple "x86_64-unknown-freebsd" \
              --native-lib-name "libhew.a" \
              --wasi-lib-dir "portable-release-libs/wasm32-wasip1" \
              --destination "${ARCHIVE_NAME}" \
              --completion-shells "bash zsh fish"

            # Staging proves every binary exists; strip failures remain fatal.
            for b in hew hew-lsp hew-observe; do
              strip "${ARCHIVE_NAME}/bin/${b}"
            done

            tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"

            echo "==> Package-layout smoke test"
            smoke_root=$(mktemp -d)
            trap 'rm -rf "${smoke_root}"' EXIT

            cat > "${smoke_root}/pkg-smoke.hew" <<'HEWEOF'
            fn main() {
                println("pkg-smoke-ok")
            }
            HEWEOF

            mkdir -p "${smoke_root}/staging"
            tar -xf "${ARCHIVE_NAME}.tar.gz" -C "${smoke_root}/staging" --strip-components=1

            output=$(HEW_STD="${smoke_root}/staging/std" "${smoke_root}/staging/bin/hew" run "${smoke_root}/pkg-smoke.hew")
            echo "${output}"
            echo "${output}" | grep -q "pkg-smoke-ok"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.archive.outputs.name }}
          path: ${{ steps.archive.outputs.name }}.tar.gz

  # ─────────────────────────────────────────────────────────────────────────
  # FreeBSD build — aarch64 via QEMU VM (tier-1, required release gate)
  # Runs inside a FreeBSD 15.0 aarch64 VM under QEMU emulation on a standard
  # x86_64 runner (vmactions/freebsd-vm with arch: aarch64). Emulation is slow
  # but needs no new host infra. The native aarch64 build is not reproducible
  # locally; CI is the proving gate for this toolchain asset.
  # ─────────────────────────────────────────────────────────────────────────
  build-freebsd-aarch64:
    needs: [build-cross-release-libs, build-portable-release-libs]
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Checkout release machinery
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          path: release-machinery

      - name: Compute archive name
        id: archive
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "name=hew-v${VERSION}-freebsd-aarch64" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download cross-built release library
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libhew-aarch64-unknown-freebsd
          path: cross-release-libs/aarch64-unknown-freebsd

      - name: Download portable release libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portable-release-libs
          path: portable-release-libs

      - name: Build on FreeBSD aarch64
        uses: vmactions/freebsd-vm@a6de9343ef5747433d9c25784c90e84998b9d69a # v1.4.6
        with:
          release: "15.0"
          arch: aarch64
          mem: 8192
          prepare: |
            mkdir -p /usr/local/etc/pkg/repos
            printf 'FreeBSD: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest", mirror_type: "srv", enabled: yes }\n' \
              > /usr/local/etc/pkg/repos/FreeBSD.conf
            # Bootstrap pkg through the base utility before reading package catalogues.
            # Without this, pkg self-upgrades mid-install and the new binary cannot
            # read the catalogue the old one wrote, so every package reports missing.
            /usr/sbin/pkg bootstrap -fy -r FreeBSD
            pkg update -f -r FreeBSD
            pkg install -y -r FreeBSD llvm22 rust cmake ninja git bash pkgconf libffi libxml2

          run: |
            set -eux
            command -v bash && bash --version

            # The VM user differs from the synced checkout owner; without
            # this the build script cannot read git metadata and the shipped
            # binaries report `unknown` for their commit hash.
            git config --global --add safe.directory "$(pwd)"

            # ── LLVM ───────────────────────────────────────────────────────
            # LLVM 22 comes from pkg on FreeBSD 15.0 (llvm22-22.1.2).
            export LLVM_SYS_221_PREFIX=/usr/local/llvm22
            /usr/local/llvm22/bin/llvm-config --version

            # ── Rust builds (release) ──────────────────────────────────────
            cargo build -p hew-cli -p hew-lsp -p hew-observe --release
            # Rustup does not publish an aarch64 FreeBSD host toolchain. The
            # consumer archive was cross-built with the pinned release
            # toolchain and build-std settings; this VM links and runs it on
            # the target hardware while pkg Rust builds only the Hew binaries.
            bash release-machinery/scripts/test-release-lib-link.sh \
              --hew target/release/hew \
              --archive cross-release-libs/aarch64-unknown-freebsd/libhew.a \
              --consumer-archive cross-release-libs/aarch64-unknown-freebsd/libhew_release_link_probe.a

            # ── Package archive ────────────────────────────────────────────
            ARCHIVE_NAME="${{ steps.archive.outputs.name }}"

            sh release-machinery/scripts/stage-release-package.sh \
              --source-dir "$PWD" \
              --bin-dir "target/release" \
              --native-lib "cross-release-libs/aarch64-unknown-freebsd/libhew.a" \
              --native-triple "aarch64-unknown-freebsd" \
              --native-lib-name "libhew.a" \
              --wasi-lib-dir "portable-release-libs/wasm32-wasip1" \
              --destination "${ARCHIVE_NAME}" \
              --completion-shells "bash zsh fish"

            # Staging proves every binary exists; strip failures remain fatal.
            for b in hew hew-lsp hew-observe; do
              strip "${ARCHIVE_NAME}/bin/${b}"
            done

            tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"

            echo "==> Package-layout smoke test"
            smoke_root=$(mktemp -d)
            trap 'rm -rf "${smoke_root}"' EXIT

            cat > "${smoke_root}/pkg-smoke.hew" <<'HEWEOF'
            fn main() {
                println("pkg-smoke-ok")
            }
            HEWEOF

            mkdir -p "${smoke_root}/staging"
            tar -xf "${ARCHIVE_NAME}.tar.gz" -C "${smoke_root}/staging" --strip-components=1

            output=$(HEW_STD="${smoke_root}/staging/std" "${smoke_root}/staging/bin/hew" run "${smoke_root}/pkg-smoke.hew")
            echo "${output}"
            echo "${output}" | grep -q "pkg-smoke-ok"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.archive.outputs.name }}
          path: ${{ steps.archive.outputs.name }}.tar.gz

  # ─────────────────────────────────────────────────────────────────────────
  # Linux packages — build .deb, .rpm, .pkg.tar.zst from glibc tarballs
  # ─────────────────────────────────────────────────────────────────────────
  linux-packages:
    needs: build-linux
    # rpm Version and Arch pkgver forbid hyphens, so a -rcN tag cannot build
    # distro packages; release candidates validate via the tarballs instead
    # and packages ship with the final tag.
    # `workflow_dispatch` runs on the selected branch, so github.ref_name is
    # not the release identity there. Keep prerelease policy tied to the tag
    # that every build and publication step actually uses.
    if: ${{ !cancelled() && needs.build-linux.result != 'failure' && !contains(github.event.inputs.tag || github.ref_name, '-rc') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
            artifact_pattern: "hew-v*-linux-x86_64"
          - arch: aarch64
            os: ubuntu-24.04-arm
            artifact_pattern: "hew-v*-linux-aarch64"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download Linux tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ matrix.artifact_pattern }}
          path: dist/
          merge-multiple: true

      - name: Build Linux packages
        run: |
          VERSION="${RELEASE_TAG#v}"
          # Arch Linux Docker image only supports x86_64
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            FORMATS="debian,rpm"
          else
            FORMATS="debian,rpm,arch"
          fi
          installers/build-packages.sh \
            --version "${VERSION}" \
            --arch "${{ matrix.arch }}" \
            --skip-build \
            --only "${FORMATS}"

      - name: Smoke test Linux packages in Docker
        run: |
          VERSION="${RELEASE_TAG#v}"
          # Arch Linux Docker image only supports x86_64
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            FORMATS="debian,rpm"
          else
            FORMATS="debian,rpm,arch"
          fi
          installers/docker/test-all-packages.sh \
            --version "${VERSION}" \
            --arch "${{ matrix.arch }}" \
            --skip-build \
            --only "${FORMATS}"

      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst

  # ─────────────────────────────────────────────────────────────────────────
  # Alpine/musl release assets are deferred for v0.4.0 until the
  # ghcr.io/hew-lang/llvm-alpine:22 toolchain is repaired. The failed v0.4.0
  # rerun showed aarch64 mlir-tblgen loader failures and x86_64 llvm-config
  # wiring failures, so this workflow does not claim or publish Alpine assets.

  # ─────────────────────────────────────────────────────────────────────────
  # Docker clean-room test — verifies the Linux release tarball installs and
  # runs correctly inside a pristine Ubuntu 24.04 container for each native
  # Linux release target. Reuses the already-built release artifacts so no LLVM
  # rebuild is needed; typical runtime is 5–10 min per target.
  # Gates the release job so we never publish a broken installer.
  # ─────────────────────────────────────────────────────────────────────────
  docker-clean-room-test:
    needs: build-linux
    name: Docker clean-room test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-24.04
          - target: linux-aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    if: ${{ !cancelled() && needs.build-linux.result != 'failure' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download Linux release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: hew-v*-${{ matrix.target }}
          path: artifacts
          merge-multiple: true

      - name: Stage release tarball for Docker build
        run: |
          mkdir -p dist/test-tarball
          TARBALL=$(find artifacts -name "hew-v*-${{ matrix.target }}.tar.gz" | head -1)
          tar -xf "${TARBALL}" -C dist/test-tarball --strip-components=1

      - name: Build Ubuntu 24.04 test image
        run: |
          docker build \
            -f installers/docker/Dockerfile.ubuntu-test \
            --build-context tarball=dist/test-tarball \
            -t hew-ubuntu-test-${{ matrix.target }} \
            .

      - name: Run stdlib smoke test in container
        run: docker run --rm hew-ubuntu-test-${{ matrix.target }}

  # ─────────────────────────────────────────────────────────────────────────
  # Release — download all artifacts, generate checksums, publish
  # ─────────────────────────────────────────────────────────────────────────
  release:
    needs:
      [
        build,
        build-linux,
        build-freebsd,
        build-freebsd-aarch64,
        linux-packages,
        docker-clean-room-test,
      ]
    runs-on: ubuntu-24.04
    # Requires successful macOS, Windows, Linux, FreeBSD x86_64, FreeBSD
    # aarch64, package, and clean-room validation jobs. Alpine/musl assets are
    # deferred until the llvm-alpine:22 toolchain is repaired.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build-linux.result == 'success' && needs.build-freebsd.result == 'success' && needs.build-freebsd-aarch64.result == 'success' && (needs.linux-packages.result == 'success' || needs.linux-packages.result == 'skipped') && needs.docker-clean-room-test.result == 'success' }}
    permissions:
      contents: write # create/update the GitHub Release and upload release assets
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "hew-v*"
          path: artifacts
          merge-multiple: true

      - name: Download linux package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "linux-packages-*"
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          VERSION="${RELEASE_TAG#v}"
          if compgen -G "hew-vmain-*" > /dev/null; then
            echo "::error::Release artifacts used workflow branch name instead of release tag:"
            ls -1 hew-vmain-*
            exit 1
          fi
          required_assets=(
            "hew-v${VERSION}-darwin-aarch64.tar.gz"
            "hew-v${VERSION}-darwin-x86_64.tar.gz"
            "hew-v${VERSION}-windows-x86_64.zip"
            "hew-v${VERSION}-linux-x86_64.tar.gz"
            "hew-v${VERSION}-linux-aarch64.tar.gz"
            "hew-v${VERSION}-freebsd-x86_64.tar.gz"
            "hew-v${VERSION}-freebsd-aarch64.tar.gz"
          )
          for asset in "${required_assets[@]}"; do
            if [ ! -f "${asset}" ]; then
              echo "::error::Missing required release archive: ${asset}"
              exit 1
            fi
          done

          assets=("${required_assets[@]}")
          if [[ "${RELEASE_TAG}" != *-* ]]; then
            shopt -s nullglob
            package_assets=(hew_*.deb hew-*.rpm hew-bin-*.pkg.tar.zst)
            if [ "${#package_assets[@]}" -eq 0 ]; then
              echo "::error::Final release has no Linux package artifacts"
              exit 1
            fi
            assets+=("${package_assets[@]}")
          fi
          sha256sum "${assets[@]}" | tee checksums.txt
          mv checksums.txt "hew-v${VERSION}-checksums.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: docs/releases/${{ env.RELEASE_TAG }}.md
          generate_release_notes: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-rc') }}
          files: |
            artifacts/hew-v*-*.tar.gz
            artifacts/hew-v*-*.zip
            artifacts/hew_*.deb
            artifacts/hew-*.rpm
            artifacts/hew-bin-*.pkg.tar.zst
            artifacts/hew-v*-checksums.txt

  # ─────────────────────────────────────────────────────────────────────────
  # Docker — multi-arch image pushed to ghcr.io/hew-lang/hew
  # ─────────────────────────────────────────────────────────────────────────
  docker:
    # Do not publish a container when the canonical release failed to assemble.
    # This also makes the image a post-release artifact rather than a parallel
    # public side effect of a partial tag run.
    needs: release
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    # 180: the arm64 leg compiles the workspace under QEMU emulation —
    # three 60-minute attempts timed out at exactly the wall. Native local
    # builds + a manifest push are the faster path when iterating.
    timeout-minutes: 180
    permissions:
      packages: write # push multi-arch image to ghcr.io
      contents: read # checkout for Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          {
            echo "version=${VERSION}"
            echo "tags<<EOF"
            echo "ghcr.io/hew-lang/hew:${VERSION}"
            # A candidate is installable by its exact tag but must never move
            # the stable Docker channel.
            if [[ "${RELEASE_TAG}" != *-* ]]; then
              echo "ghcr.io/hew-lang/hew:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: installers/docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.version.outputs.tags }}

  # ─────────────────────────────────────────────────────────────────────────
  # Homebrew — trigger formula update in hew-lang/homebrew-hew
  # ─────────────────────────────────────────────────────────────────────────
  homebrew:
    needs: release
    runs-on: ubuntu-24.04
    # Triggers every tag: Formula/hew.rb tracks the newest release including
    # release candidates, Formula/hew@stable.rb tracks final releases only —
    # update-formula.yml in homebrew-hew decides which formula(e) to touch.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    timeout-minutes: 5

    steps:
      - name: Trigger homebrew-hew formula update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret not set — skipping homebrew update"
            exit 0
          fi
          VERSION="${RELEASE_TAG#v}"
          gh workflow run update-formula.yml \
            -R hew-lang/homebrew-hew \
            -f version="${VERSION}"

  # ─────────────────────────────────────────────────────────────────────────
  # Playground — assert the immutable prepublished release image
  # ─────────────────────────────────────────────────────────────────────────
  # The job's contract is the release image itself: for this tag, an image
  # exists in the registry and its exact operator-recorded digest binds this
  # release commit and linux/amd64. Publishing happens before the tag from a
  # pinned clean playground checkout; this workflow never follows or dispatches
  # mutable playground state.
  playground:
    needs: release
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Resolve release commit identity
        id: release-commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          HEW_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')
          if ! [[ "${HEW_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::${RELEASE_TAG} did not resolve to an exact lowercase 40-character commit SHA"
            exit 1
          fi
          echo "hew_sha=${HEW_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Validate immutable playground image handoff
        id: image-lock
        shell: bash
        env:
          PLAYGROUND_RELEASE_IMAGE_LOCK: ${{ vars.PLAYGROUND_RELEASE_IMAGE_LOCK }}
        run: |
          set -euo pipefail

          JOB_TIMEOUT_MINUTES=15
          FINALIZATION_RESERVE_MINUTES=2
          ASSERTION_BUDGET_MINUTES=$((JOB_TIMEOUT_MINUTES - FINALIZATION_RESERVE_MINUTES))
          ASSERTION_DEADLINE_EPOCH=$(($(date +%s) + ASSERTION_BUDGET_MINUTES * 60))

          if ! [[ "${PLAYGROUND_RELEASE_IMAGE_LOCK:-}" =~ ^v[0-9A-Za-z.-]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::vars.PLAYGROUND_RELEASE_IMAGE_LOCK must be <release-tag>@sha256:<64 lowercase hex digits>"
            exit 1
          fi
          LOCK_TAG="${PLAYGROUND_RELEASE_IMAGE_LOCK%%@*}"
          IMAGE_DIGEST="${PLAYGROUND_RELEASE_IMAGE_LOCK#*@}"
          if [[ "${LOCK_TAG}" != "${RELEASE_TAG}" ]]; then
            echo "::error::playground image lock is for ${LOCK_TAG}, not ${RELEASE_TAG}"
            exit 1
          fi
          {
            echo "image_digest=${IMAGE_DIGEST}"
            echo "assert_deadline_epoch=${ASSERTION_DEADLINE_EPOCH}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout release machinery
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          path: release-machinery

      - name: Report immutable prepublished playground image
        shell: bash
        env:
          HEW_EXAMPLES_REF: ${{ steps.release-commit.outputs.hew_sha }}
          EXPECTED_DIGEST: ${{ steps.image-lock.outputs.image_digest }}
        run: |
          set -euo pipefail

          if ! [[ "${HEW_EXAMPLES_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release commit identity is not an exact lowercase 40-character commit SHA"
            exit 1
          fi
          PLAYGROUND_RELEASE_IMAGE="ghcr.io/hew-lang/playground"
          EXPECTED_RELEASE_IMAGE="${PLAYGROUND_RELEASE_IMAGE}:${RELEASE_TAG}"
          echo "Asserting immutable pre-tag image ${EXPECTED_RELEASE_IMAGE}@${EXPECTED_DIGEST} for linux/amd64 and ${HEW_EXAMPLES_REF}."

      - name: Assert immutable release image identity
        shell: bash
        env:
          IMAGE_REPOSITORY: hew-lang/playground
          IMAGE_TAG: ${{ env.RELEASE_TAG }}
          EXPECTED_DIGEST: ${{ steps.image-lock.outputs.image_digest }}
          EXPECTED_PLATFORM: linux/amd64
          EXPECTED_REVISION: ${{ steps.release-commit.outputs.hew_sha }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
          DEADLINE_EPOCH: ${{ steps.image-lock.outputs.assert_deadline_epoch }}
        run: release-machinery/scripts/assert-playground-release-image.sh

  # ─────────────────────────────────────────────────────────────────────────
  # VS Code Extension — package + publish with bundled hew-lsp per platform
  # ─────────────────────────────────────────────────────────────────────────
  vscode-extension:
    # The extension is a public release artifact; do not package or publish it
    # until the canonical archive release has succeeded.
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    timeout-minutes: 15

    # Map hew release targets to VS Code platform identifiers
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            vscode_target: linux-x64
            binary: hew-lsp
          - target: linux-aarch64
            vscode_target: linux-arm64
            binary: hew-lsp
          - target: darwin-aarch64
            vscode_target: darwin-arm64
            binary: hew-lsp
          - target: darwin-x86_64
            vscode_target: darwin-x64
            binary: hew-lsp
          - target: windows-x86_64
            vscode_target: win32-x64
            binary: hew-lsp.exe

    steps:
      - name: Download hew-lsp binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hew-lsp-${{ matrix.target }}
          path: lsp-binary/
        continue-on-error: true
        id: download

      - name: Clone vscode-hew
        if: steps.download.outcome == 'success'
        run: |
          git clone --depth 1 https://github.com/hew-lang/vscode-hew.git extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        if: steps.download.outcome == 'success'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        if: steps.download.outcome == 'success'
        run: cd extension && npm ci

      - name: Bundle LSP binary
        if: steps.download.outcome == 'success'
        run: |
          mkdir -p extension/server
          cp "lsp-binary/${{ matrix.binary }}" "extension/server/${{ matrix.binary }}"
          chmod +x "extension/server/${{ matrix.binary }}"

      - name: Package extension
        if: steps.download.outcome == 'success'
        run: |
          cd extension
          npx vsce package --target ${{ matrix.vscode_target }}

      - name: Upload .vsix artifact
        if: steps.download.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix-${{ matrix.vscode_target }}
          path: extension/*.vsix

  # Publish all platform-specific .vsix packages in a single job
  vscode-publish:
    needs: vscode-extension
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.vscode-extension.result == 'success' }}
    timeout-minutes: 10

    steps:
      - name: Download all .vsix packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "vsix-*"
          path: vsix/
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          shopt -s nullglob
          vsix_files=(vsix/*.vsix)
          if [ ${#vsix_files[@]} -eq 0 ]; then
            echo "::warning::No .vsix files found — skipping marketplace publish"
            exit 0
          fi
          if [ -z "${VSCE_PAT}" ]; then
            echo "::warning::VSCE_PAT secret not set — skipping marketplace publish"
            echo "Built .vsix files:"
            ls -lh "${vsix_files[@]}"
            exit 0
          fi
          # --skip-duplicate avoids failure when a version is already published
          vsce publish --skip-duplicate --packagePath "${vsix_files[@]}"
