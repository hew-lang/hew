[[case]]
id = "std_panic_wrapper_regex_new_invalid"
intent = "`regex.new` on an invalid pattern reports a typed UserPanic naming the pattern, and the process exits 1."
source = "../vertical-slice/accept/std_panic_wrapper_regex_new_invalid.hew"
suites = ["acceptance"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "4"

[case.expected]
stdout = ""
stderr = "hew: failure: UserPanic (212): regex.new: invalid pattern: [\n"
exit = 1
