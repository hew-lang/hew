[[case]]
id = "actor-interceptor-turn"
intent = "Actor interceptors run before and after handlers, retain task provenance and refuse owned requests without crashing the actor."
source = "cases/actor-interceptor-turn.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "1"

[case.expected]
stdout = "task\necho\nbefore\nafter\nhello\ntask\nblocked\nrefused\ntask\ncount\nbefore\nafter\n"
exit = 0
