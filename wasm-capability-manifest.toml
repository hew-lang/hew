[[feature]]
id = "directory-resources"
label = "Host-supplied directory resources"
checker = "pass"
runtime = "host-dependent"
runtime_status = "WASI preview1 uses explicitly preopened host directories with existing directional owners and synchronous regular-file operations; the browser VM has no real directory adapter yet"
reason = "the host must explicitly supply a directory preopen; no ambient directory is granted by default, and a synchronous host syscall cannot be interrupted after entry"
generate = "refuse"
generate_functions = ["std.fs.open_read_dir", "std.fs.open_write_dir"]
generate_endpoints = ["hew_dir_open_read", "hew_dir_open_write"]
categories = ["stdlib", "filesystem"]

