[package]
name = "hew-std"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hew standard library — Rust-backed FFI for every std module in one staticlib"
readme = "README.md"
repository = "https://github.com/hew-lang/hew"
keywords = ["hew", "stdlib"]
categories = ["compilers"]

[lib]
crate-type = ["staticlib", "lib"]

[features]
# Exposes the crate-private configuration the cargo-fuzz targets in `fuzz/`
# must share with production code. Never enabled by a shipped build.
fuzzing = []

# Wasm + native deps. Every native-only crate (ring, socket2, reqwest, …) lives
# in the cfg(not(wasm)) block below.

[dependencies]
hew-codec = { path = "../hew-codec" }
hew-calendar = { path = "../hew-calendar" }
regex = "1.12.4"
# Shared ABI + runtime (path deps).
hew-cabi = { path = "../hew-cabi" }
hew-runtime = { path = "../hew-runtime", default-features = false }

# Wire-codec + pure-module deps (wasm-safe).
base64.workspace = true
flate2 = "1"
libc.workspace = true
pulldown-cmark = "0.13.5"
quick-xml = "0.42.0"
rmp-serde.workspace = true
serde_json.workspace = true
toml.workspace = true
url = "2"

# Host + WASI deps (excluded only on bare wasm32-unknown-unknown where getrandom
# requires a custom JS/host entropy backend).
[target.'cfg(any(not(target_family = "wasm"), target_os = "wasi"))'.dependencies]
uuid = { version = "1.23.3", features = ["v4", "v7"] }

# Native-only module deps (union of the former per-module crates). Gated off the
# wasm build, where their crates do not compile.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
argon2 = "0.6"
ed25519-dalek = { version = "3", default-features = false, features = [
  "digest",
  "fast",
  "hazmat",
  "pkcs8",
  "zeroize",
] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = [
  "aws_lc_rs",
] }
lettre = { version = "0.11.24", default-features = false, features = [
  "builder",
  "smtp-transport",
  "rustls-tls",
] }
parking_lot = "0.12"
quinn = "0.11"
rcgen = "0.14.8"
ring = "0.17"
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
tiny_http = "0.12"
tokio = { version = "1", default-features = false, features = [
  "rt",
  "rt-multi-thread",
  "time",
  "net",
  "sync",
  "macros",
] }
tungstenite = { version = "0.30", features = ["__rustls-tls"] }
reqwest.workspace = true
webpki-roots = "1.0.10"
zeroize = { version = "1.9.0", features = ["zeroize_derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Networking_WinSock"] }

[lints]
workspace = true
