[toolchain]
channel = "1.96.0"
components = ["clippy", "rustfmt"]
# Both Darwin slices. The cross_target_e2e Darwin cross-arch proof builds
# hew-lib for the OPPOSITE arch of its host, so an x86_64 host needs
# aarch64-apple-darwin and an aarch64 host needs x86_64-apple-darwin. Listing
# one direction made the gate host-asymmetric: green on aarch64, "can't find
# crate for `core`" on x86_64.
targets = [
  "wasm32-unknown-unknown",
  "wasm32-wasip1",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
