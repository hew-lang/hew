[[case]]
id = "actor-notification-hooks-suspend"
intent = "EXIT and DOWN hooks that sleep and ask another actor resume with their notification intact, and the actor serves later calls after each hook completes."
source = "cases/actor-notification-hooks-suspend.hew"
