  # 1-arg — `link(target)` / `monitor(target)` — and
  # `hew-mir/src/lower/actor.rs` synthesizes `hew_actor_self()` as arg0 for
  # every call it emits, matching Erlang/OTP `link(Pid)`. Withdrawing the raw
  # symbols therefore makes the destination structurally the CALLING actor:
  # user code can only cause its own actor to receive the signal it just asked
  # for. `link_monitor_subject_is_always_the_self_handle` asserts the
