[[case]]
id = "mailbox_drop_new_visible"
intent = "A discarded submission reports the loss to its sender as the submission's own outcome: a policy chose to lose the message, so it is a described delivery, not a failure. The sender spells `.DropNewest` over an actor that already declares `drop_new`."
source = "../vertical-slice/accept/mailbox_drop_new_visible.hew"
suites = ["acceptance"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "1"

[case.expected]
stdout = "LOSS_VISIBLE\n"
exit = 42
