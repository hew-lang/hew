# Each case is a supported native program with an exact observable outcome.
# The runner executes every selected case at both optimization levels; matching
# failures are failures, not a differential pass.

[[case]]
id = "owned-call-return"
intent = "A by-value ordinary call preserves the caller value and returns an independent logical value."
source = "cases/owned-call-return.hew"
suites = ["acceptance", "safety"]
host_capabilities = ["native"]
timeout_seconds = 15

[case.expected]
stdout = "source=CORE;returned=CORE\n"
exit = 0

[[case]]
id = "bytes-copy-mutate"
intent = "Assignment copies bytes values, so mutating the copy does not change the source."
source = "cases/bytes-copy-mutate.hew"
suites = ["acceptance", "safety"]
host_capabilities = ["native"]
timeout_seconds = 15

[case.expected]
stdout = "original=65;copy=65,66\n"
exit = 0

[[case]]
id = "owned-branch-reassign"
intent = "A mutable owned binding remains valid after taken and untaken reassignment branches join."
source = "cases/owned-branch-reassign.hew"
suites = ["acceptance", "safety"]
host_capabilities = ["native"]
timeout_seconds = 15

[case.expected]
stdout = "HOT\n"
exit = 0

[[case]]
id = "owned-loop"
intent = "Loop-carried reassignment of an owned string preserves every iteration's result."
source = "cases/owned-loop.hew"
suites = ["acceptance", "safety"]
host_capabilities = ["native"]
timeout_seconds = 15

[case.expected]
stdout = "CORE!!!\n"
exit = 0

[[case]]
id = "owned-early-return"
intent = "An early owned return and a fallback return produce valid independent values."
source = "cases/owned-early-return.hew"
suites = ["acceptance", "safety"]
host_capabilities = ["native"]
timeout_seconds = 15

[case.expected]
stdout = "early=EARLY;fallback=FALLBACK\n"
exit = 0

[[case]]
id = "entry-return"
intent = "The native entry function's i64 result becomes the process exit status."
source = "cases/entry-return.hew"
suites = ["acceptance", "safety"]
host_capabilities = ["native"]
timeout_seconds = 15

[case.expected]
stdout = ""
exit = 23
