[[case]]
id = "if_else_all_panic_arms_nonscalar_return"
intent = "The panic is reported as Hew's own typed failure and the process exits 1."
source = "../vertical-slice/accept/if_else_all_panic_arms_nonscalar_return.hew"
suites = ["acceptance"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "4"

[case.expected]
stdout = ""
stderr = "hew: failure: UserPanic (212): one\n"
exit = 1
