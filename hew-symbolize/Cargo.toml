[package]
name = "hew-symbolize"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Map Hew failure frames to functions and source locations from executables and symbol files"
repository = "https://github.com/hew-lang/hew"
publish = false

[dependencies]
addr2line = { version = "0.26", default-features = false, features = ["std"] }
gimli = { version = "0.33", default-features = false, features = [
  "std",
  "read",
  "endian-reader",
] }
object = { version = "0.40", default-features = false, features = [
  "std",
  "read",
  "compression",
] }
pdb = "0.8"
rustc-demangle = "0.1"
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[dev-dependencies]
gimli = { version = "0.33", default-features = false, features = [
  "std",
  "write",
] }
object = { version = "0.40", default-features = false, features = [
  "std",
  "write",
] }
serde_json.workspace = true
tempfile.workspace = true
