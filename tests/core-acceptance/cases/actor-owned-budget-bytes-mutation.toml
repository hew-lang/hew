[[case]]
id = "actor-owned-budget-bytes-mutation"
intent = "Bytes growth and slice detach reserve actual capacity before mutation."
source = "cases/actor-owned-budget-bytes-mutation.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "2"

[case.expected]
stdout = "32\n1\nbytes limit\n"
stderr = "hew: failure: HeapExceeded (200)\nhew: actor crash in Small.mutate (actor 2): HeapExceeded\n"
exit = 1
