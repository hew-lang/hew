[package]
name = "hew-compile"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Frontend compilation pipeline for the Hew language"
readme = "../README.md"
repository = "https://github.com/hew-lang/hew"
keywords = ["hew", "compiler", "frontend"]
categories = ["compilers"]

[dependencies]
hew-lexer = { path = "../hew-lexer" }
hew-hir = { path = "../hew-hir" }
hew-mir = { path = "../hew-mir" }
hew-sir = { path = "../hew-sir" }
hew-codegen-rs = { path = "../hew-codegen-rs" }
hew-parser = { path = "../hew-parser" }
hew-types = { path = "../hew-types" }
serde.workspace = true
toml.workspace = true

[dev-dependencies]
hew-types = { path = "../hew-types", features = ["test"] }
tempfile.workspace = true

[lints]
workspace = true
