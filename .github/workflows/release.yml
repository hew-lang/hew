name: Diagnose hosted Ubuntu DNS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dns:
    name: Hosted resolver (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Compare configured and independent resolver answers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          printf 'probe,exit_status\n' > diagnostics/status.csv
          probe() {
            local label="$1"
            shift
            local status=0
            timeout 15 "$@" > "diagnostics/${label}.log" 2>&1 || status=$?
            printf '%s,%s\n' "$label" "$status" | tee -a diagnostics/status.csv
            cat "diagnostics/${label}.log"
          }

          probe host-resolver cat /etc/resolv.conf
          probe configured-resolver cat /run/systemd/resolve/resolv.conf
          probe host-resolved resolvectl status
          probe host-nss cat /etc/nsswitch.conf
          probe control-github getent ahostsv4 github.com
          probe control-registry getent ahostsv4 registry-1.docker.io
          probe control-resolved resolvectl query github.com
          provider=$(awk '$1 == "nameserver" { print $2; exit }' /run/systemd/resolve/resolv.conf)
          printf 'Configured provider: %s\n' "$provider"

          for host in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com ports.ubuntu.com; do
            label="${host//./-}"
            probe "host-${label}" getent ahostsv4 "$host"
            probe "resolved-${label}" resolvectl query --type=A "${host}."
            probe "provider-${label}" dig +tries=1 +time=3 "@$provider" "$host" A
            probe "independent-${label}" dig +tries=1 +time=3 @1.1.1.1 "$host" A
            probe "doh-${label}" curl --fail --silent --show-error \
              --connect-timeout 3 --max-time 8 \
              --resolve cloudflare-dns.com:443:1.1.1.1 \
              --header 'accept: application/dns-json' \
              "https://cloudflare-dns.com/dns-query?name=${host}&type=A"
          done
          cat diagnostics/status.csv

      - name: Retain every resolver result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-resolver-${{ matrix.arch }}
          path: diagnostics/
          if-no-files-found: error
