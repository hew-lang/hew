[[case]]
id = "user-codec-socket"
intent = "Ordinary cloned socket sinks share one native writer; framed clones retain and release one affine codec after the last endpoint."
source = "cases/user-codec-socket.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.env]
HEW_IO_LEAK_CHECK = "1"

[case.expected]
stdout = "cloned socket codecs\n"
exit = 0
