# Diagnostic ref only. This workflow does not qualify a release.
name: Windows runtime diagnostics
run-name: "Diagnostic only — Windows ${{ inputs.mode || 'grants' }} (${{ github.sha }})"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Focused diagnostic to run
        type: choice
        options: [grants, process, grant-load]
        default: grants

permissions:
  contents: read
  actions: read

jobs:
  windows-grant-diagnostic:
    name: Diagnostic only — Windows ${{ inputs.mode || 'grants' }}
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      DIAGNOSTIC_MODE: ${{ inputs.mode || 'grants' }}
      RUSTUP_TOOLCHAIN: "1.96.0"
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: "2"
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Verify SDK provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'grant-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $json = gh api repos/hew-lang/hew/actions/artifacts/12261137490
          if ($LASTEXITCODE -ne 0) { throw 'Could not read SDK artifact provenance' }
          $artifact = $json | ConvertFrom-Json
          if ($artifact.name -ne 'hew-v0.6.2-windows-x86_64' -or
              $artifact.expired -or
              $artifact.workflow_run.id -ne 39412485562 -or
              $artifact.workflow_run.head_sha -ne '24720d0d7d28b56fb53854309682f35796751606' -or
              $artifact.digest -ne 'sha256:43edcb312c2dca70ca0ca1fc5522012d9a3e44ca99fee974dc23346b8f077084') {
            throw 'SDK artifact does not match the selected release build'
          }
          $json | Set-Content (Join-Path $evidence 'sdk-artifact.json')
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: "12261137490"
          run-id: "39412485562"
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/grant-sdk-download
          merge-multiple: true
      - name: Verify retained grant binary provenance
        if: env.DIAGNOSTIC_MODE == 'grant-load'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $json = gh api repos/hew-lang/hew/actions/artifacts/12276228125
          if ($LASTEXITCODE -ne 0) { throw 'Could not read retained binary provenance' }
          $artifact = $json | ConvertFrom-Json
          if ($artifact.expired -or $artifact.workflow_run.id -ne 39446557642 -or
              $artifact.workflow_run.head_sha -ne '51623202d03c8d2f5363c15b0732f685acc50fe2' -or
              $artifact.digest -ne 'sha256:52ea41629c3919b1eac42c340648b8ff6489b9d113b8abe0d29a150df8027bb9') {
            throw 'Retained binaries differ from the observed runtime run'
          }
          $json | Set-Content (Join-Path $env:RUNNER_TEMP 'grant-evidence/replay-artifact.json')
      - if: env.DIAGNOSTIC_MODE == 'grant-load'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: "12276228125"
          run-id: "39446557642"
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/grant-replay
          merge-multiple: true
      - uses: ./.github/actions/setup-msvc
      - uses: ./.github/actions/setup-llvm
        with:
          version: "22.1.5"
      - name: Set up Python for focused SDK diagnostics
        if: env.DIAGNOSTIC_MODE != 'grants'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - if: env.DIAGNOSTIC_MODE == 'grants'
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-03-27
        with:
          toolchain: "1.96.0"
      - name: Install GNU Make
        shell: pwsh
        run: choco install make --no-progress -y
      - name: Run selected Windows diagnostic
        shell: pwsh
        run: ./scripts/windows-grant-diagnostic.ps1 -Mode $env:DIAGNOSTIC_MODE
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-service-grant-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/grant-evidence
          if-no-files-found: error
      - name: Preserve selected diagnostic binaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-service-grant-binaries-${{ github.sha }}
          path: |
            ${{ runner.temp }}/process-fixtures/**/*.exe
            ${{ runner.temp }}/grant-sdk-debug/lib/hew.lib
            ${{ runner.temp }}/grant-fixtures/**/dist_node.exe
            ${{ runner.temp }}/grant-fixtures/**/dist_node.pdb
            ${{ runner.temp }}/grant-harness-target/debug/deps/distributed_two_process_e2e-*.exe
          if-no-files-found: warn
          include-hidden-files: true
