[package]
name = "hew-lib"
version.workspace = true
edition = "2024"
description = "Combined Hew runtime + standard library — single staticlib for linking"
license.workspace = true
publish = false
build = "build.rs"

[lib]
name = "hew"
crate-type = ["staticlib"]

[dependencies]
hew-runtime = { path = "../hew-runtime" }
hew-std = { path = "../hew-std" }

[build-dependencies]
hew-build-identity = { path = "../hew-build-identity", features = ["scan"] }
