# Each case is a supported native program with an exact observable outcome.
# The runner executes every selected case at both optimization levels; matching
# failures are failures, not a differential pass.

[[case]]
id = "boolean-print"
intent = "Boolean values returned through the common callable ABI print their exact true and false forms."
source = "cases/boolean-print.hew"
suites = ["acceptance"]
timeout_seconds = 15

[case.expected]
stdout = "true\nfalse\n"
exit = 0

