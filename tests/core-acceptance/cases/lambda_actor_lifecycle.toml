[[case]]
id = "lambda_actor_lifecycle"
intent = "Lambda-actor creation, tell, ask, and scope-exit release."
source = "cases/lambda_actor_lifecycle.hew"
suites = ["acceptance"]
kind = "run"
timeout_seconds = 60
# The retired checked-mir harness ran every fixture with the actor-box
# balance check armed; keep it here so a leaked actor lands as exit 93.
env = { HEW_ACTOR_LEAK_CHECK = "1" }

[case.expected]
stdout = "42\n21\n"
exit = 0
