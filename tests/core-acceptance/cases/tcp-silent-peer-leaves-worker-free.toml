[[case]]
id = "tcp-silent-peer-leaves-worker-free"
intent = "A read waiting on a silent peer suspends its task only: on one scheduler worker another task's sleeps still complete."
source = "cases/tcp-silent-peer-leaves-worker-free.hew"
suites = ["acceptance"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "1"
HEW_IO_LEAK_CHECK = "1"

[case.expected]
stdout = "silent peer left the worker free\n"
exit = 0
