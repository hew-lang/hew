name: Coverage nightly

# Nightly coverage + full cross-platform matrix.
#
# Code coverage was the flakiest required per-PR check: cargo-llvm-cov
# instrumentation plus the duplicated target/llvm-cov-target/ tree on top of
# the LLVM install repeatedly exited 100 / ENOSPC on sound PRs (deglob,
# wasm32-gen, and others where "Build & test" was green and only coverage
# instrumentation/disk failed). Coverage no longer blocks the merge queue; it
# runs here nightly with the same command + report. This workflow also runs the
# FULL Windows / macOS workspace nextest that ci.yml dedups off the per-PR path
# (per-PR Windows/macOS run platform build + smoke unless they touch
# platform/toolchain/ABI code). Failures here are visible (run summary) but are
# not merge-blocking — they need a same-day owner per the L6 plan.

on:
  schedule:
    # Run daily at 07:00 UTC (offset from nightly-sanitizers at 06:00 to avoid
    # both heavy LLVM-install jobs contending for the same runner pool start).
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  # Pinned LLVM upstream release tag, used by hew-codegen-rs (inkwell ->
  # llvm-sys-221) build script. Must match ci.yml / setup-llvm action pins.
  LLVM_VERSION: "22.1.5"
  # Pinned wasmtime release tag for full-windows's WASI provisioning step,
  # matching ci.yml's single pin (see ci.yml's WASMTIME_VERSION comment for
  # why it is pinned rather than resolved as "latest").
  WASMTIME_VERSION: "v47.0.2"
  CARGO_TERM_COLOR: always

jobs:
  # Runtime FFI coverage is produced only by real compiled Hew programs. Keep
  # it separate from cargo-llvm-cov: their covmaps are not merge-compatible,
  # and fail if any curated program fails to build, run, or emit profile data.
  runtime-e2e-coverage:
    name: Runtime E2E coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-rust-build
        with:
          components: llvm-tools
          cache-shared-key: runtime-e2e-coverage

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          sudo rm -rf /usr/lib/jvm || true
          sudo rm -rf /usr/local/julia* || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Compile, run, and measure the runtime corpus
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
        run: timeout 2400 bash scripts/coverage-runtime-e2e.sh

      - name: Publish runtime coverage summary
        if: always()
        run: |
          if [[ -f coverage-out/runtime-e2e/runtime-summary.txt ]]; then
            cat coverage-out/runtime-e2e/runtime-summary.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload runtime coverage summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-e2e-coverage
          path: coverage-out/runtime-e2e/runtime-summary.txt
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────
  # Code coverage — Rust workspace tests instrumented with cargo-llvm-cov.
  # Moved verbatim off ci.yml's per-PR path: same LLVM setup, same disk purge,
  # same instrumented nextest expression, same lcov/HTML uploads.
  # ─────────────────────────────────────────────────────────────────────────
  coverage:
    name: Code coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # cargo-llvm-cov builds into target/llvm-cov-target/, so the `hew`
      # binary the e2e tests spawn sits one directory deeper than the normal
      # target/debug/ — its exe-relative std discovery (../../std) then misses
      # the repo std/. Pin std explicitly for the instrumented run; the normal
      # test job finds it relative to target/debug/ and needs no override.
      HEW_STD: ${{ github.workspace }}/std
      # One authoritative instrumented tree for the prebuilt shared-artifact
      # producer, nextest, and both report steps. cargo-llvm-cov normally
      # selects this directory internally; spelling all three variables keeps
      # ordinary Cargo/Make consumers on that exact same path too.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/llvm-cov-target
      CARGO_LLVM_COV_TARGET_DIR: ${{ github.workspace }}/target/llvm-cov-target
      CARGO_LLVM_COV_BUILD_DIR: ${{ github.workspace }}/target/llvm-cov-target
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-rust-build
        with:
          components: llvm-tools
          tools: nextest@0.9.120,cargo-llvm-cov@0.8.7
          cache-shared-key: coverage

      - name: Free runner disk
        # cargo-llvm-cov instruments the full workspace and writes a separate
        # target/llvm-cov-target/ tree on top of the normal target/. That
        # combination — LLVM 22.1.5 download/install plus the instrumented
        # build — has exhausted the runner disk at the LLVM install step
        # (System.IO.IOException: No space left on device). Mirror the same
        # preinstalled-toolchain purge the Linux build job carries (PR #1995).
        # jvm (~1.5 GB) and julia (~0.5 GB) are present on ubuntu-24.04 but were
        # missing from this step; adding them recovers ~2 GB before LLVM install.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          sudo rm -rf /usr/lib/jvm || true
          sudo rm -rf /usr/local/julia* || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h /

      # hew-codegen-rs depends on inkwell -> llvm-sys-221, whose build
      # script requires LLVM_SYS_221_PREFIX. `cargo llvm-cov nextest
      # --workspace` resolves and compiles the full workspace.
      - name: Install LLVM ${{ env.LLVM_VERSION }}
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Disk space before coverage build
        # Baseline snapshot before the instrumented build writes
        # target/llvm-cov-target/. Confirms whether disk was already marginal
        # entering the build, independently of the build itself.
        run: df -h /

      - name: Install WASI runner prerequisites
        # The instrumented run includes hew-cli's wasmtime-backed e2e tests
        # (e.g. sort_merge_authority_runs_under_wasmtime), whose support
        # bootstrap builds the wasm32-wasip1 runtime + stdlib archives at test
        # time and runs the output under wasmtime. Same wasmtime provisioning
        # as ci.yml's "Build & test (Linux)" job — the two environment
        # contracts must not drift (same class as the FreeBSD nightly wasmtime
        # omission). The heavyweight eval_wasm / wasi_run_e2e suites stay
        # excluded below; they gate per-PR in ci.yml.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rustup target add wasm32-wasip1
          WASMTIME_TAG="${WASMTIME_VERSION}"
          WASMTIME_DIR="wasmtime-${WASMTIME_TAG}-x86_64-linux"
          .github/scripts/retry-download.sh \
            gh release download "$WASMTIME_TAG" --repo bytecodealliance/wasmtime \
            --pattern "${WASMTIME_DIR}.tar.xz" --clobber
          tar -xJf "${WASMTIME_DIR}.tar.xz"
          echo "$PWD/${WASMTIME_DIR}" >> "$GITHUB_PATH"
          "./${WASMTIME_DIR}/wasmtime" --version

      - name: Run tests with coverage
        # Default features include "full" (encryption + profiler + quic),
        # so all QUIC transport tests are covered without an explicit flag.
        # The heavyweight wasi-runner e2e suites (eval_wasm_* and the
        # wasi_run_e2e binary) run and gate in the per-PR "Build & test
        # (Linux)" job, so they stay excluded from the instrumented run.
        # Their Rust-side coverage is marginal — they drive a wasmtime
        # subprocess. The remaining wasmtime-backed tests (e.g. hew-cli's
        # sort authority) run here against the wasmtime provisioned above;
        # their support bootstrap builds the wasm32-wasip1 archives with
        # instrumentation flags scrubbed (no profiler runtime on wasm).
        #
        # two_process_remote_ask / remote_ask_two_process tests are
        # intentionally NOT excluded here (x86_64 coverage is preserved).
        # These tests are already retried+serialised via profile.ci's
        # real-timing group (nextest.toml) and that profile is active for
        # this llvm-cov run. release-gate.yml excludes them only on aarch64
        # (arm64-runner helper-exit-101 quirk specific to that runner family).
        # Adding an x86_64 exclude would be a category error and would silently
        # remove coverage of a real cross-process path.
        #
        # line-tables-only: target/llvm-cov-target/ is the dominant disk cost
        # in this job. Full debug info (~3–4× larger) is not needed for coverage
        # reporting and is the same mitigation the Linux build job applies.
        # Without it, the instrumented target dir alone can exceed the runner's
        # remaining free space after the jvm/julia/LLVM purges.
        #
        # Diagnostics (observability, not a fix):
        #   - stdbuf -oL -eL: line-buffer stdout/stderr so per-test progress and
        #     SLOW warnings are flushed immediately; a silent hang still shows the
        #     last test that started, confirming/refuting a wedged-test hypothesis.
        #   - --status-level pass --final-status-level slow: emit each test result
        #     as it completes and mark slow tests at summary; a hang reveals the
        #     last test that ran before the process stalled.
        #   - timeout 1800: hard-kill at 30 min (comfortably above a healthy
        #     ~16-22 min run) so a hang fails fast with a clear marker rather than
        #     burning the full 6h job limit.
        #   - Periodic df-monitor: a background loop prints disk usage every 30 s;
        #     an ENOSPC becomes visible in the log instead of causing a silent kill.
        env:
          CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
        run: |
          # Export cargo-llvm-cov's instrumentation environment before cleaning
          # or building anything. The table-derived make target must be built
          # into the same instrumented target that nextest will consume.
          eval "$(cargo llvm-cov show-env --sh)"
          cargo llvm-cov clean --workspace

          # Start periodic disk monitor (every 30 s) before the build begins so
          # disk consumption during compilation is also captured.
          ( while true; do
              echo "[disk] $(date -u +%H:%M:%S) $(df -h / | tail -1)";
              sleep 30;
            done ) &
          DISK_MON_PID=$!

          make stdlib

          set +e
          timeout 1800 \
            stdbuf -oL -eL \
            cargo nextest run \
            --workspace --exclude hew-wasm \
            --profile ci \
            -E 'not test(eval_wasm) and not binary(wasi_run_e2e)' \
            --status-level pass \
            --final-status-level slow
          COV_EXIT=$?
          set -e

          kill "$DISK_MON_PID" 2>/dev/null || true
          wait "$DISK_MON_PID" 2>/dev/null || true

          echo "[disk] post-coverage $(date -u +%H:%M:%S) $(df -h / | tail -1)"

          if [ "$COV_EXIT" -eq 124 ]; then
            echo "ERROR: coverage timed out after 30 min (timeout exit 124)"
            df -h /
            exit 1
          fi
          if [ "$COV_EXIT" -ne 0 ]; then
            exit "$COV_EXIT"
          fi

          # `show-env` is cargo-llvm-cov's supported integration for external
          # runners. Generate the report only after ordinary nextest completes;
          # invoking the llvm-cov nextest subcommand inside this environment is
          # explicitly unsupported and can recursively wrap rustc.
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Generate HTML report
        run: >
          cargo llvm-cov report
          --html --output-dir coverage-html

      - name: Coverage summary
        run: cargo llvm-cov report | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info

      - name: Upload coverage (HTML)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: coverage-html/

  # ─────────────────────────────────────────────────────────────────────────
  # Full Windows workspace nextest — the cross-platform coverage that ci.yml
  # dedups off the per-PR path (per-PR Windows runs build + platform smoke
  # unless it touches platform/toolchain/ABI code). Same command ci.yml ran
  # unconditionally before L6.
  # ─────────────────────────────────────────────────────────────────────────
