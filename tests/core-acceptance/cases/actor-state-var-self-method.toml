[[case]]
id = "actor-state-var-self-method"
intent = "A `var self` method on an actor state field re-publishes the seat on return; when it panics it hands the receiver, as last written, back into the seat and teardown closes it once."
source = "cases/actor-state-var-self-method.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 15

[case.expected]
stdout = "first 12\nsecond 14\nclose 13\n"
stderr = "hew: failure: UserPanic (212): bump failed\nhew: actor crash in Holder.poke (actor 1): UserPanic\n"
exit = 1
