name: Nightly compiler and runtime checks

on:
  schedule:
    # Offset from nightly-sanitizers (06:00), coverage-nightly (07:00), and
    # nightly-ratchet-accounting (08:00) to spread daily runner demand.
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  runtime-unit:
    if: >-
      github.repository == 'hew-lang/hew' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    name: Runtime unit tests (minimal features)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ubuntu-dns

      - uses: ./.github/actions/setup-rust-build
        with:
          tools: nextest@0.9.120
          cache-shared-key: nightly-runtime-unit
      - run: make test-runtime-unit

  link-race:
    if: >-
      github.repository == 'hew-lang/hew' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    name: Native archive link race
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-ubuntu-dns
      - name: Install mold
        timeout-minutes: 5
        run: .github/scripts/install-ubuntu-packages.sh mold
      - uses: ./.github/actions/setup-llvm
      - uses: ./.github/actions/setup-rust-build
        with:
          cache-shared-key: nightly-link-race
      - run: make libhew-link-race-test

  linear-lowering:
    if: >-
      github.repository == 'hew-lang/hew' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    name: Linear physical lowering
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-ubuntu-dns
      - name: Install mold
        timeout-minutes: 5
        run: .github/scripts/install-ubuntu-packages.sh mold
      - uses: ./.github/actions/setup-llvm
      - uses: ./.github/actions/setup-rust-build
        with:
          cache-shared-key: nightly-linear-lowering
      - run: make perf-verify-linear
