[[case]]
id = "actor-linked-exit-plain"
intent = "A native actor without lifecycle hooks turns an unhandled linked EXIT into a checked actor failure, preserving the peer panic reason and releasing its owned state."
source = "cases/actor-linked-exit-plain.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 15

[case.expected]
stdout = "unhandled EXIT terminated linked actor\n"
exit = 1
