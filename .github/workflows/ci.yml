name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base. Restricting this to `main` meant a
  # stacked PR (based on another branch) received no checks at all, so its
  # merge gate could report READY with nothing having run. A stacked branch
  # is exactly where a break is easiest to miss.
  pull_request:
  workflow_dispatch:

# A push to a branch makes any run still going for that same ref obsolete:
# its verdict can no longer gate anything, because a newer commit exists.
# Those runs were still holding runners, so 15 open pull requests could
# starve the queue and nothing scheduled at all. Never cancel on main —
# a push there must complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  pull-requests: read

env:
  # Pinned LLVM upstream release tag, used by hew-codegen-rs (inkwell ->
  # llvm-sys-221) build script. Bumps must be reflected in
  # .github/actions/setup-llvm/action.yml (asset SHA256 pins) too.
  LLVM_VERSION: "22.1.5"
  # Pinned wasmtime release tag. Every job that provisions a WASI runner
  # downloads its per-platform asset from THIS tag. It is pinned, and pinned in
  # one place, for two reasons: resolving "latest" per job (as the Linux job
  # did) or taking whatever a package manager ships (as macOS did with brew)
  # let the three platforms straddle different wasmtime releases inside a
  # single run, so a WASI behaviour difference could be read as a platform
  # difference; and an unpinned runtime changes the tested surface without a
  # commit. Assets used: x86_64-linux.tar.xz, aarch64-macos.tar.xz,
  # x86_64-windows.zip.
  WASMTIME_VERSION: "v47.0.2"
  SHELLCHECK_VERSION: "0.11.0"
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Source lint and formatting. Keep the established required-check name.
  # Behaviour tests and compiler measurements have separate results below.
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: Clippy & format
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-rust-build
        with:
          components: "clippy, rustfmt"
          targets: wasm32-wasip1
          cache-shared-key: lint

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install ShellCheck
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: shellcheck@${{ env.SHELLCHECK_VERSION }}

      - name: Provision pinned ast-grep toolchain
        id: lint-tools
        uses: ./.github/actions/setup-ast-grep

      # Run each category even if another fails, once provisioning succeeds.
      # make lint combines these same targets for local use.
      - name: Rust lint and formatting
        if: ${{ !cancelled() && steps.lint-tools.outcome == 'success' }}
        run: make lint-rust

      - name: Source and ABI contracts
        if: ${{ !cancelled() && steps.lint-tools.outcome == 'success' }}
        run: make -k lint-source

      - name: Hew source formatting
        if: ${{ !cancelled() && steps.lint-tools.outcome == 'success' }}
        run: make hew-fmt-check

  tooling:
    name: Build tooling and checker tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install ShellCheck
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: shellcheck@${{ env.SHELLCHECK_VERSION }}

      - name: Install C header checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format gcc

      - name: Verify build tooling and checker behaviour
        run: make -k test-tooling compile-determinism-selftest test-obligation-site-diff

  # Advisories, yanked crates, licences and sources are checked on every PR so
  # a bad lock entry fails here rather than at release time.
  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-rust-build
        with:
          cache-shared-key: dependency-policy
          tools: cargo-deny@0.19.6

      - name: Check licences, advisories and sources
        run: make dependency-policy

  # ─────────────────────────────────────────────────────────────────────────
  # Browser/playground smoke — repo-local browser tooling coverage only.
  # Runs analysis and source-to-VM tests, checks manifest freshness and builds
  # the browser WASM artifact. Native parity runs in Linux shard 3.
  # ─────────────────────────────────────────────────────────────────────────
  playground-wasm-build:
    name: Playground WASM build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-rust-build
        with:
          targets: wasm32-unknown-unknown
          cache-shared-key: playground-wasm

      - name: Install wasm-pack v0.13.1 and Binaryen 117
        uses: ./.github/actions/setup-wasm-pack

      - name: Set up Node.js for browser execution
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hew-sandbox-vm/package-lock.json

      - name: Check sandbox fixtures are current
        # The committed sandbox fixtures are generated from in-tree sources; a
        # stale fixture makes the parity gate assert against the wrong baseline.
        run: make sandbox-fixtures-check

      - name: Check repo-local playground browser/tooling smoke
        run: make playground-check

  # ─────────────────────────────────────────────────────────────────────────
  # Compiled-Hew artifact — one Linux build for the language-suite consumers
  # ─────────────────────────────────────────────────────────────────────────
  compiled-hew-linux:
    name: Build compiled Hew artifact (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev pkg-config mold zlib1g-dev libzstd-dev

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}

      - uses: ./.github/actions/setup-rust-build
        with:
          targets: wasm32-wasip1
          cache-shared-key: compiled-hew-linux

      - name: Build compiler, native archive and WASI runtime once
        run: |
          make hew-native wasm-runtime-debug
          mkdir -p compiled-hew/debug compiled-hew/wasm32-wasip1/debug
          cp target/debug/hew target/debug/libhew.a target/debug/libhew_runtime.a compiled-hew/debug/
          cp target/wasm32-wasip1/debug/libhew_runtime.a \
            target/wasm32-wasip1/debug/libhew_std.a compiled-hew/wasm32-wasip1/debug/
          # Relocated toolchain layout: the binary finds std at <exe_dir>/../std.
          cp -R std compiled-hew/std
          tar -czf compiled-hew-linux.tar.gz compiled-hew

      - name: Upload compiled Hew bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiled-hew-linux-${{ github.sha }}
          path: compiled-hew-linux.tar.gz
          retention-days: 1
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Compiled-Hew suites — four stable O0/O2 hash partitions
  # ─────────────────────────────────────────────────────────────────────────
  compiled-hew-shards:
    name: Compiled Hew suites (shard ${{ matrix.shard }}/4)
    needs: compiled-hew-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install link prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev pkg-config zlib1g-dev libzstd-dev

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Download compiled Hew bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiled-hew-linux-${{ github.sha }}
          path: ${{ runner.temp }}/compiled-hew-download

      - name: Unpack compiled Hew bundle
        run: |
          mkdir -p "${{ runner.temp }}/compiled-hew-artifact"
          tar -xzf "${{ runner.temp }}/compiled-hew-download/compiled-hew-linux.tar.gz" \
            -C "${{ runner.temp }}/compiled-hew-artifact"

      - name: Run O0 and O2 shard
        run: >-
          python3 scripts/compiled-hew-shards.py run
          --compiler "${{ runner.temp }}/compiled-hew-artifact/compiled-hew/debug/hew"
          --partition "hash:${{ matrix.shard }}/4"
          --output-dir target/hew-shards

      - name: Upload shard reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiled-hew-shard-${{ matrix.shard }}-${{ github.sha }}
          path: target/hew-shards/
          retention-days: 1
          if-no-files-found: error

  compiled-hew-aggregate:
    # This aggregate retains the established required-check name while the
    # Rust and compiled-Hew suites execute in parallel. GitHub reports a matrix
    # dependency as successful only when every leg succeeds, so one assertion
    # here covers all Rust shards and tooling tests. Compiled-Hew reporting
    # remains independent of failures in those other gate groups.
    name: Build & test (Linux)
    needs:
      [
        compiled-hew-linux,
        compiled-hew-shards,
        acceptance,
        nextest,
        corpus,
        tooling,
        dependency-policy,
      ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
        if: always()

      - name: Download compiled Hew bundle
        if: >-
          always() &&
          needs.compiled-hew-linux.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiled-hew-linux-${{ github.sha }}
          path: ${{ runner.temp }}/compiled-hew-download

      - name: Unpack compiled Hew bundle
        if: >-
          always() &&
          needs.compiled-hew-linux.result == 'success'
        run: |
          mkdir -p "${{ runner.temp }}/compiled-hew-artifact"
          tar -xzf "${{ runner.temp }}/compiled-hew-download/compiled-hew-linux.tar.gz" \
            -C "${{ runner.temp }}/compiled-hew-artifact"

      - name: Download every shard report
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: compiled-hew-shard-*-${{ github.sha }}
          path: ${{ runner.temp }}/compiled-hew-reports
          merge-multiple: true

      - name: Report compiled Hew shard failures
        if: always()
        run: >-
          python3 scripts/compiled-hew-shards.py report
          --reports-dir "${{ runner.temp }}/compiled-hew-reports"
          --shard-count 4

      - name: Require every shard to complete
        id: require-every-shard
        if: always()
        env:
          BUILD_RESULT: ${{ needs.compiled-hew-linux.result }}
          SHARD_RESULT: ${{ needs.compiled-hew-shards.result }}
          DEPENDENCY_POLICY_RESULT: ${{ needs.dependency-policy.result }}
        run: |
          set -euo pipefail
          for leg in BUILD_RESULT SHARD_RESULT DEPENDENCY_POLICY_RESULT; do
            result="${!leg}"
            if [ "$result" = success ]; then
              continue
            fi
            echo "::error::$leg is '$result' (expected success)"
            exit 1
          done

      - name: List the independent full suite inventory
        id: full-inventory
        run: |
          "${{ runner.temp }}/compiled-hew-artifact/compiled-hew/debug/hew" \
            test tests/hew --list > "${{ runner.temp }}/compiled-hew-full.txt"

      - name: Assert shard union and Hew ratchet
        id: hew-ratchet
        if: >-
          always() &&
          steps.require-every-shard.outcome == 'success' &&
          steps.full-inventory.outcome == 'success'
        run: >-
          make test-hew-ratchet
          HEW_SHARD_REPORT_DIR="${{ runner.temp }}/compiled-hew-reports"
          HEW_FULL_INVENTORY="${{ runner.temp }}/compiled-hew-full.txt"
          HEW_SHARD_COUNT=4

      - name: Assert shard union and O2 differential
        id: o2-differential
        if: >-
          always() &&
          steps.require-every-shard.outcome == 'success' &&
          steps.full-inventory.outcome == 'success'
        run: >-
          make test-o2-differential
          HEW_SHARD_REPORT_DIR="${{ runner.temp }}/compiled-hew-reports"
          HEW_FULL_INVENTORY="${{ runner.temp }}/compiled-hew-full.txt"
          HEW_SHARD_COUNT=4

      - name: Finalize compiled Hew JUnit reports
        if: always()
        run: >-
          python3 scripts/compiled-hew-shards.py finalize
          --reports-dir "${{ runner.temp }}/compiled-hew-reports"
          --output-dir "${{ runner.temp }}/compiled-hew-published"
          --full-inventory "${{ runner.temp }}/compiled-hew-full.txt"
          --prerequisites-succeeded "${{ steps.hew-ratchet.outcome == 'success' && steps.o2-differential.outcome == 'success' }}"

      - name: Upload compiled Hew test reports
        if: always()
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
        with:
          report_paths: "${{ runner.temp }}/compiled-hew-published/*.xml"
          check_name: Compiled Hew Test Results

      # Unrelated gate failures must block the required result without hiding
      # the compiled-Hew inventory, ratchet or differential diagnostics above.
      - name: Require Linux gates and tooling checks
        if: always()
        env:
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
          NEXTEST_RESULT: ${{ needs.nextest.result }}
          CORPUS_RESULT: ${{ needs.corpus.result }}
          TOOLING_RESULT: ${{ needs.tooling.result }}
        run: |
          status=0
          for leg in ACCEPTANCE_RESULT NEXTEST_RESULT CORPUS_RESULT TOOLING_RESULT; do
            result="${!leg}"
            if [ "$result" != success ]; then
              echo "::error::$leg is '$result' (expected success)"
              status=1
            fi
          done
          exit "$status"

  # The remaining pull-request gates consume the same compiler and static
  # archives. Make's -o flag marks the already-installed artefacts as current;
  # each source gate still runs its normal recipe and checks actual behaviour.
  acceptance:
    name: Core acceptance and integrations (${{ matrix.shard }}/3)
    needs: compiled-hew-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install native link prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev pkg-config zlib1g-dev libzstd-dev
      - name: Install MQTT clients
        if: matrix.shard == 2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto-clients
      - uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}
      - uses: ./.github/actions/setup-rust-build
        with:
          tools: ${{ matrix.shard == 2 && 'nextest@0.9.120' || '' }}
          cache-shared-key: acceptance-${{ matrix.shard }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiled-hew-linux-${{ github.sha }}
          path: ${{ runner.temp }}/compiled-hew-download
      - name: Install compiled Hew artefacts
        run: bash scripts/ci-install-compiled-hew.sh "${{ runner.temp }}/compiled-hew-download/compiled-hew-linux.tar.gz"
      - name: Run core acceptance partition
        run: make -o hew-native core-acceptance CORE_ACCEPTANCE_ARGS="--partition ${{ matrix.shard }}/3"
      - name: Run documentation examples
        if: matrix.shard == 0
        run: make -o hew-native test-doc-examples
      - name: Run package integration
        if: matrix.shard == 0
        run: make -o hew-native observe-functional-test test-pkg-import test-package-install
      - name: Run C extern and host client integrations
        if: matrix.shard == 1
        run: >-
          make -o hew-native compile-determinism-verify
          stdlib-user-build-clean stdlib-errno-gate
          test-extern-bytes test-host-client
      - name: Run migration and MQTT integrations
        if: matrix.shard == 2
        run: make -o hew-native test-leak-oracle-selftest test-migrate-corpus mqtt-broker-e2e

  nextest:
    name: Workspace nextest (${{ matrix.shard }}/2)
    needs: compiled-hew-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          sudo docker system prune -af >/dev/null 2>&1 || true
      - name: Install native link prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb libssl-dev pkg-config zlib1g-dev libzstd-dev
      - uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}
      - uses: ./.github/actions/setup-rust-build
        with:
          targets: wasm32-wasip1
          tools: nextest@0.9.120
          cache-shared-key: nextest-${{ matrix.shard }}
      - name: Install wasmtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="wasmtime-${WASMTIME_VERSION}-x86_64-linux"
          .github/scripts/retry-download.sh \
            gh release download "$WASMTIME_VERSION" --repo bytecodealliance/wasmtime \
            --pattern "${dir}.tar.xz" --dir "${RUNNER_TEMP}" --clobber
          tar -xJf "${RUNNER_TEMP}/${dir}.tar.xz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/${dir}" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/${dir}/wasmtime" --version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiled-hew-linux-${{ github.sha }}
          path: ${{ runner.temp }}/compiled-hew-download
      - name: Install compiled Hew artefacts
        run: bash scripts/ci-install-compiled-hew.sh "${{ runner.temp }}/compiled-hew-download/compiled-hew-linux.tar.gz"
      - name: Run workspace test partition with ratchet accounting
        run: make -o test-artifacts test NEXTEST_PARTITION="${{ matrix.shard }}/2"
      - name: Run C ABI crate tests
        if: matrix.shard == 1
        run: make test-cabi
      - name: Upload test reports
        if: always()
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
        with:
          report_paths: "{target/nextest/ci/ratchet.xml,target/nextest/ci-cabi/junit.xml}"
          check_name: Test Results (Linux nextest ${{ matrix.shard }}/2)
          fail_on_failure: true
          fail_on_parse_error: true
          require_tests: true

  corpus:
    name: Source corpus and sandbox parity
    needs: compiled-hew-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install native link prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev pkg-config zlib1g-dev libzstd-dev
      - uses: ./.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}
      - uses: ./.github/actions/setup-rust-build
        with:
          targets: wasm32-wasip1
          cache-shared-key: corpus
      - uses: ./.github/actions/setup-wasm-pack
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hew-sandbox-vm/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiled-hew-linux-${{ github.sha }}
          path: ${{ runner.temp }}/compiled-hew-download
      - name: Install compiled Hew artefacts
        run: bash scripts/ci-install-compiled-hew.sh "${{ runner.temp }}/compiled-hew-download/compiled-hew-linux.tar.gz"
      - name: Check source corpus and sandbox parity
        run: make -o hew-native -o wasm-runtime grammar-parity sandbox-parity hew-check-all
