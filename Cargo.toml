[workspace]
members = [
  "hew-cabi",
  "hew-codec",
  "hew-debug-abi",
  "hew-calendar",
  "hew-expand",
  "hew-std",
  "std/text/template",
  "hew-cli",
  "hew-pkg",
  "hew-lexer",
  "hew-lib",
  "hew-live",
  "hew-lsp",
  "hew-parser",
  "hew-runtime",
  "hew-runtime-testkit",
  "hew-types",
  "hew-observe",
  "hew-observe-protocol",
  "hew-symbolize",
  "hew-wasm",
  "hew-analysis",
  "hew-compile",
  "hew-hir",
  "hew-sir",
  "hew-mir",
  "hew-codegen-rs",
  "hew-capability-gen",
  "hew-testutil",
  "hew-parity-gen",
  "xtask",
]
exclude = [
  "hew-parser/fuzz",
  "hew-runtime/fuzz",
  "hew-std/fuzz",
  "hew-codec/fuzz",
  "vendor/pulldown-cmark",
]
resolver = "2"

[workspace.package]
version = "0.11.0-rc3"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Stephen Olesen <slepp@slepp.ca>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` reads every number back to the f64 it was printed from;
# the default fast path can land one unit in the last place away.
serde_json = { version = "1", features = ["float_roundtrip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
toml = "1"
libc = "0.2"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
base64 = "0.22"
rmp-serde = "1"
stacker = "0.1"
finl_unicode = "1"
sha2 = "0.11"
indexmap = "2"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
# Remaining duplicates (bitflags, fallible-iterator, getrandom, hashbrown,
# rand_core, tower, winnow) are transitive — latest upstream versions still
# pull conflicting majors and we cannot resolve them.
multiple_crate_versions = "allow"
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
# Panic tests assert rejection without pinning diagnostic wording.
should_panic_without_expect = "allow"
# Rust 1.94 lints — allow until next sweep
ref_as_ptr = "allow"
decimal_bitwise_operands = "allow"

[profile.dev]
panic = "unwind"
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Keep debugger fixtures independent of cached split-DWARF files.
[profile.debugger]
inherits = "dev"
debug = "full"
split-debuginfo = "off"

# The shipped compiler keeps line tables for the workspace's own crates so a
# compiler crash symbolizes; third-party crates carry none. Packaging splits
# them out of the binary into the per-target debug assets (`hew.debug` under
# `.build-id/`, `hew.dSYM`, `hew.pdb`).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = "line-tables-only"
strip = "none"
panic = "unwind"

# `strip = "none"` keeps cargo from defaulting to `strip = "debuginfo"` for
# crates without debug info: on macOS that strip leaves proc-macro dylibs that
# rustc cannot load (E0463). Only linked artefacts are affected, and the
# binaries that ship are workspace members.
[profile.release.package."*"]
debug = 0
strip = "none"

# Profile for the SHIPPED `libhew.a` (and other consumer-facing staticlibs).
# Fat LTO folds prebuilt libstd into the archive's merged codegen unit, which
# breaks the byte-identical-libstd dedupe contract with external Rust
# staticlibs (`--link-lib` packages): their verbatim `std-*` member then
# collides on `rust_eh_personality` / std-internal exports. Building the
# archive without LTO keeps the prebuilt libstd members verbatim, so a package
# built with the same pinned rustc dedupes naturally at link time (see
# hew-cli/src/native_link.rs module docs). Binaries keep the LTO'd `release`.
#
# Debug info in the archive is the runtime's line tables and nothing else, so a
# crashing program shows `hew-runtime` frames at file:line without carrying
# DWARF for libstd, the C crypto dependencies or the other Rust crates.
# `scripts/release-lib.py` builds this profile with frame pointers and remapped
# toolchain paths, then strips debug sections from every archive member but
# `hew-runtime`'s (the other workspace crates keep line tables for the
# compiler binary this profile also builds; prebuilt libstd and
# compiler_builtins carry their own).
[profile.release-lib]
inherits = "release"
lto = "off"

[profile.release-lib.package."*"]
debug = 0
strip = "none"

[patch.crates-io]
pulldown-cmark = { path = "vendor/pulldown-cmark" }
