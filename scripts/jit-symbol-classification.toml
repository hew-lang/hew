  # `hew_mailbox_has_user_messages` is its user-lane-only `stable` half.
  # `hew_mailbox_try_recv` dequeues the SYSTEM queue first and returns the raw
  # node with its provenance stripped — strictly more powerful than
  # `hew_mailbox_try_recv_sys`, and it breaks the same single-consumer contract.
  # `hew_mailbox_free` drains and frees the system queue, silently discarding
  # every pending lifecycle signal. Destruction is not separable from the
  # object, so unlike the has-messages query it cannot be split.
  # `hew_mailbox_new*` construct the lane. They move with the destructor
