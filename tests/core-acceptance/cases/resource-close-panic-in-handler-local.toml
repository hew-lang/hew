[[case]]
id = "resource-close-panic-in-handler-local"
intent = "A failing close on a resource local to an actor handler crashes that actor with the panic's code and message while main continues, with no leak and no double free."
source = "cases/resource-close-panic-in-handler-local.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 30

[case.expected]
stdout = "close 2\nmain continues\n"
stderr = "hew: failure: UserPanic (212): close failed\nhew: actor crash in Pool.drain (actor 1): UserPanic\n"
exit = 1
