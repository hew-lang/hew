[[case]]
id = "resource-close-erased-owners"
intent = "Outer resource fields, trait objects and unused or shared callable captures close through peer actor calls on one worker."
source = "cases/resource-close-erased-owners.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 20

[case.env]
HEW_WORKERS = "1"

[case.expected]
stdout = "parcel body\nclosed 1\nerased 2\nclosed 2\nclosed 3\nclosed 4\nerased owners complete\n"
stderr = ""
exit = 0
