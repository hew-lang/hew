  # SYSTEM-LANE PROVENANCE BOUNDARY (every `hew_mailbox_*` entry below). The
  # system queue is a runtime-private lane: the only legitimate producers are
  # runtime paths that derive the signal from authenticated actor state (a real
  # terminal transition, a real link/monitor death, a real supervisor decision),
  # and the only legitimate consumer is `scheduler::activate_actor`. The
  # boundary is not `may not MINT a system node` — it is `may not PRODUCE,
  # INSTALL, MUTATE, OBSERVE, or DESTROY system-lane state`. Observation and
  # destruction are ingress too: a caller that can tell an empty mailbox from
  # one holding a queued `Exit` has read privileged state, and a caller that can
