[[case]]
id = "resource-close-actor-generator"
intent = "Lazy, suspended and early-break generators close their captured resource through the owning actor's peer call on one worker."
source = "cases/resource-close-actor-generator.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 20

[case.env]
HEW_WORKERS = "1"

[case.expected]
stdout = "closed 1\n2\nclosed 2\n3\nclosed 3\ngenerators closed\n"
stderr = ""
exit = 0
