[[case]]
id = "loaned-payload-projection"
intent = "Nested field reads through a borrowed record element carrying a resource are dependent borrows of the same region: the record stays whole, both a direct and a `let`-bound scrutinee project through it, and the owning drain releases each resource exactly once."
source = "cases/loaned-payload-projection.hew"
suites = ["acceptance", "safety"]
timeout_seconds = 15

[case.expected]
stdout = "one\nfirst\n1\nshow t1\ntwo t2\nlen=2\nclose t1\nclose t2\ndrained\n"
exit = 0
stderr = ""
