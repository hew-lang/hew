name: Setup Rust build environment
description: >
  Install the stable Rust toolchain, optional cargo tools (via
  taiki-e/install-action), Swatinem/rust-cache for the registry/deps
  layer, and mozilla-actions/sccache-action for the workspace-crate
  compilation cache (GitHub Actions cache backend, content-addressed,
  disk-safe).  Extracts the repeated setup sequence that every Rust job
  in ci.yml and release-gate.yml otherwise duplicates.

inputs:
  components:
    description: >
      Comma-separated toolchain components to pass to dtolnay/rust-toolchain
      (e.g. 'clippy, rustfmt' for lint; 'llvm-tools' for coverage).
      Omit or leave empty to install no extra components.
    required: false
    default: ''
  targets:
    description: >
      Comma-separated target triples to pass to dtolnay/rust-toolchain
      (e.g. 'aarch64-apple-darwin, x86_64-apple-darwin' for macOS cross).
      Omit or leave empty to add no extra targets.
    required: false
    default: ''
  gates:
    description: >
      Comma-separated xtask gate names. The gate metadata derives all external
      tools and Rust targets; callers must not maintain a parallel tool list.
    required: false
    default: 'build'
  cache-shared-key:
    description: >
      Swatinem/rust-cache shared-key that scopes the cache to the calling
      job class (e.g. 'lint', 'build-test-linux', 'coverage').
    required: true
  cache-prefix-key:
    description: >
      Swatinem/rust-cache prefix-key.  Bump to invalidate on toolchain or
      LLVM version changes.
    required: false
    default: 'v2-deps-llvm22'

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # master 2026-03-27
      with:
        toolchain: stable
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Derive provisioning from selected gates
      id: plan
      shell: bash
      run: |
        set -euo pipefail
        tools=$(cargo xtask tools --gates '${{ inputs.gates }}' --field install-action-tools)
        go_tools=$(cargo xtask tools --gates '${{ inputs.gates }}' --field go-tools)
        targets=$(cargo xtask tools --gates '${{ inputs.gates }}' --field targets)
        ast_grep=$(cargo xtask tools --gates '${{ inputs.gates }}' --field ast-grep)
        {
          echo "tools=${tools}"
          echo "go_tools=${go_tools}"
          echo "targets=${targets}"
          echo "ast_grep=${ast_grep}"
        } >> "$GITHUB_OUTPUT"

    - name: Install gate Rust targets
      if: steps.plan.outputs.targets != ''
      shell: bash
      run: rustup target add ${{ steps.plan.outputs.targets }}

    - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026  # v2.85.11
      if: steps.plan.outputs.tools != ''
      with:
        tool: ${{ steps.plan.outputs.tools }}
        fallback: none

    - name: Install pinned Go tools
      if: steps.plan.outputs.go_tools != ''
      shell: bash
      run: |
        set -euo pipefail
        IFS=',' read -ra tools <<< '${{ steps.plan.outputs.go_tools }}'
        for tool in "${tools[@]}"; do
          GOBIN="${CARGO_HOME:-${HOME}/.cargo}/bin" go install "${tool}"
        done

    - name: Provision pinned ast-grep toolchain
      if: steps.plan.outputs.ast_grep == 'true'
      uses: ./.github/actions/setup-ast-grep

    - name: Verify gate toolchain
      shell: bash
      run: cargo xtask tools --verify '${{ inputs.gates }}'

    # ── sccache: workspace-crate compilation cache ─────────────────────────
    # Promotes the .cargo/config.toml opt-in annotation to CI reality.
    # Uses the GitHub Actions cache backend (content-addressed, no blob
    # expansion — the ENOSPC cause that led to dropping target/ caching in
    # e9f65f19 was blob size, not sccache).  Swatinem/rust-cache below
    # continues to handle the registry/deps layer; sccache handles workspace
    # crate compilation.  The two compose: sccache caches compiler
    # invocations; Swatinem caches the registry.  SCCACHE_CACHE_SIZE bounds
    # the on-disk buffer; the GHA cache has its own 10 GB/repo ceiling.
    - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696  # v0.0.10
      if: env.ACT != 'true'
      with:
        # Always pull the latest released sccache binary unless we need to
        # pin for a specific fix.  The action itself is SHA-pinned above.
        version: "v0.10.0"

    - name: Export sccache environment variables
      if: env.ACT != 'true'
      shell: bash
      run: |
        {
          echo "SCCACHE_GHA_ENABLED=true"
          echo "RUSTC_WRAPPER=sccache"
          echo "SCCACHE_CACHE_SIZE=2G"
        } >> "$GITHUB_ENV"

    - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      if: env.ACT != 'true'
      with:
        prefix-key: ${{ inputs.cache-prefix-key }}
        shared-key: ${{ inputs.cache-shared-key }}
        # Keep the dependency layer stable across ordinary source and
        # workspace-manifest edits. Cargo's fingerprints still reject an
        # incompatible restored artifact, while a lock/toolchain/config change
        # rotates the exact cache key. The action removes workspace crates
        # before saving, so this stores third-party compilation rather than a
        # second copy of the source-sensitive sccache layer above.
        add-rust-environment-hash-key: "false"
        key: deps-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
        cache-targets: "true"
        cache-all-crates: "false"
        cache-workspace-crates: "false"
        cache-bin: "false"
