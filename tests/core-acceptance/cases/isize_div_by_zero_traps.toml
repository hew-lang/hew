[[case]]
id = "isize_div_by_zero_traps"
intent = "The guard traps: the fixture reports DivideByZero and exits 1 under the one exit rule."
source = "../vertical-slice/accept/isize_div_by_zero_traps.hew"
suites = ["acceptance"]
timeout_seconds = 30

[case.env]
HEW_WORKERS = "4"

[case.expected]
stdout = ""
stderr = "hew: failure: DivideByZero (202)\n"
exit = 1
