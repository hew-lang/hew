# Feature disposition table (32 rows; mirror of the markdown table).
# Row order matches docs/wasm-capability-matrix.md top-to-bottom.
# ---------------------------------------------------------------------------

[[feature]]
id = "basic-actors"
label = "Basic actors (`spawn`, `send`, `receive`, `ask/await`)"
checker = "pass"
runtime = "implemented"
runtime_status = "Implemented"
categories = ["runtime", "actors"]

[[feature]]
id = "actor-crash-containment"
label = "Actor-local panic/trap containment and restart"
checker = "todo"
runtime = "unavailable"
runtime_status = "Unsupported on the production wasm32-wasip1 panic=abort artifact; a handler panic or canonical trap terminates the module instead of restarting one actor"
categories = ["runtime", "actors", "failure"]
tracking = "WASM-TODO"
tracking_label = "WASM-TODO(actor-crash-containment):"
note = "Tier 2 basic actor dispatch remains supported, but panic/trap containment is a separate capability. Host-side native parity tests may unwind to exercise bookkeeping; they are not evidence that the production WASI artifact can recover."

[[feature]]
id = "generators"
label = "Generators (`gen fn`)"
checker = "pass"
runtime = "implemented"
runtime_status = "Scalar-parameter and fn-typed-parameter `gen fn` forms execute and tear down correctly on Tier 2 via the unified `llvm.coro` switched-resume substrate (identical IR to native)"
categories = ["runtime", "generators"]
checker_detail = "Pass (not checker-gated — Tier 2 has no dedicated `WasmUnsupportedFeature` guard)"
tracking_label = "Note below"
note = "`gen fn` lowers onto the unified `llvm.coro` switched-resume continuation substrate (`hew-runtime/src/cont.rs`), which emits identical IR on native and wasm32. The wasm32 backend synthesizes its own `hew_gen_coro_destroy` routing coro-frame teardown through `llvm.coro.destroy`, so construction, `.next()` consumption, and scope-exit teardown each release exactly one frame — verified end-to-end under wasmtime (`hew-codegen-rs/tests/exec/wasm_generator_exec.rs`). Generator forms not yet implemented on any target are tracked in HEW-FUTURE.md §1.6. Generators that depend on blocking I/O (e.g. a generator that calls `stream.next()` internally) encounter the Streams reject at the point of the stream call."

